name: Deploy site

# Builds site/ (Astro) from models/*/model.yaml + ratchet.yaml and the docs (the Observatory's data is regenerated
# first, from the full history), copies each model's interactive lab, and publishes to GitHub Pages. Pages must be enabled (Settings → Pages → Source:
# GitHub Actions); on a private repository that needs a paid plan, so the deploy is skipped there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Observatory's growth charts read the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Observatory data from the repository as deployed (mlratchet/observatory.py)
        run: python -m mlratchet.observatory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
