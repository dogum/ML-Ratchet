id: reservoirpilot
name: ReservoirPilot
version: "1.0.1"
status: released
released: 2026-11-18
order: 26
domain: Hydrology
platform: water
tags: [hydrology, reservoirs, dam operations, control, differentiable simulation, policy optimisation, ResOpsUS]
accent: "#a61e4d"
tagline: A daily dam release policy learned in a simulator, graded on 244 real US reservoirs
question: How much water should this dam release today, knowing only what its operator knows today?
question_short: "Today's release from one dam, from what its operator knows"
disclaimer: >-
  Research benchmark, not an operating tool. J, WaterData's cost, charges for shortage against a calibrated demand
  and for releases above a safe channel capacity, and nothing else: not for stored water, evaporation, environmental
  flows, hydropower value or dam safety. The policy exploits that: it holds reservoirs lower than SOP does.
summary: >-
  ReservoirPilot picks each day's release for one reservoir from what an operator knows that day: storage, capacity,
  today's inflow, recent inflow, the demand calendar, the safe channel capacity Qmax and the calibration-period inflow
  normal. It never sees future inflow. A 5,314-weight network learned it only in simulation, by back-propagating
  WaterData's cost J through the reservoir mass balance on WaterSim inflows with simulated historical operators. It
  was graded once on WaterData's frozen exam. On 27 Nov 2026 every arm was re-scored on the causal version of that
  task (capacity from the dam's metadata and the calibration half only; the numbers below): on 244 real ResOpsUS dams
  its median J is 0.0154 (90 % interval 0.0099-0.0203), against 0.0289 for a classical flood-pool and hedging rule
  tuned on the same simulator, 0.109 for SOP and 0.183 for the real operators; it beats the tuned rule on 62 % of
  dams (95 % interval 56-68 %). Perfect-foresight DP, a bound, reaches 0.0061. The caveat belongs beside the
  headline: J charges nothing for stored water, so the pilot keeps a median 38 % of capacity full where SOP keeps
  59 %.

reads: "Daily, for one reservoir: storage S (hm³), capacity (hm³), today's inflow I (m³/s, as recorded, which for ResOpsUS is usually back-calculated from storage changes), and the task WaterData builds from the calibration half of the record: the demand calendar D(doy) (median release by day of year, 31-day smoothed), Qmax (99th-percentile release) and the inflow climatology by day of year. Fifteen features: S/cap, asinh(I/Qmax), 5-, 20- and 60-day inflow means, D and the next-30-day mean demand over Qmax, log capacity in days of Qmax, headroom, SOP spill pressure, storage in days of demand, the next 30- and 90-day inflow normal and two expected-overflow terms. Never future inflow, future storage or the observed release."
returns:
  - "Today's release (m³/s), applied through WaterData's mass balance: capped by the water stored, anything above capacity spills and counts as release"
  - "The two decisions behind it: h, the share of demand released (h < 1 hedges, rationing now to keep water for later), and e, an extra release toward 1.25 × (Qmax − D) that makes flood space"
  - "No error bars: it is a policy, scored by WaterData's cost J = mean daily (shortage / demand)² + 10 (excess over Qmax / Qmax)²"

physics:
  summary: >-
    Reservoir water balance, WaterData's exam benchmark unchanged: S(t+1) = S(t) + (I − R)·K with K = 0.0864 hm³ per
    m³/s·day, release capped by the water stored, spill above capacity counted as release, no evaporation. The training
    inflows come from WaterSim, the Watershed simulator: generated basins run through HBV, GR4J, SAC-SMA or VIC-lite with
    degree-day or energy-balance snow and channel routing. A simulated historical operator runs each dam's first decade,
    and the task (demand, Qmax, climatologies, start storage) is then built from that record exactly as WaterData builds
    it from a real one.
  simulator:
    - "WaterSim v1 (shared/water/watersim): half the basins from the CAMELS prior with a donor basin's real ERA5-Land forcing from non-exam years (Caravan), half from the default prior with the stochastic weather generator; one of four runoff models and two snow routines; half the inflows get extra channel attenuation"
    - "Dam: capacity log-normal, median 0.8 years of mean inflow (0.005 to 40 years); a random simulated operator (follow-inflow, rule curve, SOP or Hanasaki 2006, with AR(1) release noise) runs the first 10 years; the next 10 are scored"
    - "Generator rungs, ranges from the 15 dev dams and the aux dams (never exam): g2 back-calculated inflow noise; g3 upstream regulation (30 % of tasks) and gross data spikes (10 %); g4 a non-stationary scored decade, inflow × exp(N(0, 0.3)) (dev scored/calibration inflow ratio median 0.81, 29 aux dams 1.17; a stationary simulator gives about 1)"
    - "Banks: 3,000 training tasks, 300 frozen and 200 selection tasks per generator version (training/bank.py, selset.py; seeds 1000+, 9000+, 7000+)"
  checks:
    - "WaterSim (shared/water/checks): GR4J vs airGR 1.7.9 to 1.0e-7 mm (NSE 0.79882 vs the published 0.7988); HBV vs TUWmodel 1.1-1 identical to ≤ 1e-12 mm; water balance closes in 121/121 runs, worst 1.4e-15 relative; replaying observed inflow and release on the 15 dev dams ends within a median 5 % of capacity (reservoir_dev.json)"
    - "Task reproduction: WaterData's own functions (doy_curve, cost, simulate, dp) are imported, not copied; dev baselines match WaterData's per-dam table to 1.6e-9 and the exam medians exactly (one historical value differs by 3e-5; status doc, not in a shipped file). Re-checked on import: the shipped baseline medians equal shared/water/data/proc/baselines/reservoir_scores.parquet (SOP 0.108372, rule 0.142997, historical 0.183264, DP 0.006254)"
    - "Policy equivalence (training/checks_equiv.json, check_js.json): numpy policy vs WaterData's operating loop 8.3e-17 in J; vs the torch training rollout 1.4e-8 in J; the shipped page's JavaScript vs Python 5.0e-15 (release / Qmax) on 5 dev dams, 1,100 days. The site instrument (TypeScript) vs the Python module: 1.5e-14 on 30 cases, WaterData's DP included"
    - "Causal re-score (27 Nov 2026, seen; training/rescore_exam.py with RESERVOIRPILOT_TASK=causal): every arm on the causal task; the re-scored baselines match the table WaterData's run_baselines_reservoir.py --causal wrote (SOP, rule curve, DP exactly on 244 dams; historical on one dam by 1.9e-4); CDEC unchanged"
    - "Reproduction re-score (18 Nov 2026, seen; training/rescore_exam.py): on the rebuilt ResOpsUS / CDEC data (build.py --only verify passed, splits sha256 33f88ca0...), the released weights through the shipped exam path reproduce every median, win fraction and bootstrap interval of the shipped exam log to < 1e-5; re-scored baselines match WaterData's shipped per-dam table on 244 dams (SOP and rule curve to 1e-12; historical on one dam by 3.1e-5, DP on one dam by 1.2e-4) and the CDEC table on 15 reservoirs"
    - "Generator vs reality: on g4's frozen set SOP and DP have median J 0.105 and 0.0069; on the real exam 0.108 and 0.0063 (known from the brief, not tuned to). The status doc's g4 rule-curve median 0.165 (exam 0.143) is not in a shipped file"
    - "Twin test (dev dams, training/twin_r1_dpo_hd_g1_g1.json; weights of rung r3): replacing each dev dam's inflow with its 5-day mean moved the pilot's median J only from 0.0361 to 0.0359 (SOP 0.0964 to 0.0683), so gauge noise was not the main sim-to-real gap; that pointed at non-stationary decades and led to g4"

noise: >-
  Simulated, with ranges set on real dams: back-calculated inflow noise I_obs = I + (e_t − e_t−1)/K, e ~ N(0, σ·cap),
  which gives negative-inflow days as in ResOpsUS (dev and aux dams: median 2 % of days, up to 35 %); an upstream
  regulating reservoir on 30 % of tasks and gross data spikes on 10 %; a non-stationary scored decade (× exp(N(0, 0.3)));
  and the simulated operator's AR(1) release noise, which shapes demand and Qmax as real operators' records do.
network: >-
  MLP 15 → 64 → 64 → 2, tanh, 5,314 weights (plus 30 feature-scaling numbers). Two sigmoid outputs h and e give the
  requested release R = h·D + 1.25·e·max(Qmax − D, 0); output biases start near SOP (4.5, −5.5). Trained by direct
  policy optimisation: torch back-propagation through WaterData's mass balance and cost over 270- to 1,000-day windows,
  then a 365-day SOP tail so leftover storage is valued by what it does next; loss mean log(J + 0.03); Adam, gradient
  clip 1, cosine learning rate, 96 windows per batch; checkpoints chosen on the simulated selection set. numpy inference,
  about 0.15 s per 10-year dam.
approach:
  real_backdrop: "Half the simulated inflows are WaterSim basins driven by real ERA5-Land forcing of CAMELS donor basins in non-exam years (via Caravan); the other half use the stochastic weather generator"
  physics_inputs: "Mass-balance features: headroom (cap − S), SOP spill pressure (S + I·K − D·K − cap), storage in days of demand, and expected overflow from the calibration-half inflow normal over the next 30 and 90 days"
  physics_anchor: "SOP: the head R = h·D + 1.25·e·(Qmax − D)+ starts at release-the-demand (h ≈ 1, e ≈ 0), and every release passes through WaterData's mass balance, which caps it by the water stored and spills above capacity; training differentiates J through that balance"
  real_data_roles: [backdrop, calibration, gate, exam]

data:
  - name: "ResOpsUS v2: daily storage, inflow and release of US reservoirs (Steyaert, Condon, Turner & Voisin 2022, Scientific Data 9:34)"
    url: https://doi.org/10.5281/zenodo.6612040
    licence: CC BY 4.0
    role: "dev (15 dev dams: generator ranges, the dev gate, the twin test), physics (aux dams, never scored: 6 complete records and inflow ratios on 29 set the g2-g4 ranges), exam (244 scored dams; examples/exam_dams.json holds six of them)"
  - name: "GRanD dam attributes: capacity, main use (Lehner et al. 2011, Front. Ecol. Environ. 9:494), via ResOpsUS+CARS v1.0 (Casado-Rodriguez et al.)"
    url: https://doi.org/10.5281/zenodo.15978041
    licence: CC BY 4.0
    role: "dev, exam (capacity, raised to the highest storage in the calibration half where larger; v1.0's exam also counted the scored half; main-use strata of the split)"
  - name: "California Data Exchange Center (CDEC), California Department of Water Resources: daily storage, inflow and outflow"
    url: https://cdec.water.ca.gov
    licence: "Public data from California DWR; no explicit licence text (credit DWR). Not share-alike."
    role: "exam (recent exam: 15 California reservoirs, WY2021-2025)"
  - name: "Caravan v1.6 (Kratzert et al. 2023, Scientific Data 10:61) with CAMELS-US (Newman et al. 2015; Addor et al. 2017) attributes and ERA5-Land forcing (Muñoz-Sabater et al. 2021)"
    url: https://doi.org/10.5281/zenodo.15529786
    licence: "CC BY 4.0 (Caravan, CAMELS); ERA5-Land under the Copernicus licence (free, attribution)"
    role: "physics (donor-basin forcing for half the simulated inflows, non-exam years only; the camels prior of WaterSim's basin generator)"
  - name: "WaterSim v1 (Watershed Phase 1): HBV, GR4J, SAC-SMA, VIC-lite, degree-day and energy-balance snow, routing; Hanasaki et al. (2006) for one simulated operator type"
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/watersim
    licence: MIT (code in this repository)
    role: physics (training inflows)
  - name: "WaterData reservoir exam (Watershed Phase 1): task definition, cost J, frozen split and baselines (SOP, rule curve, historical, perfect-foresight DP)"
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/waterdata
    licence: "Code MIT; scores derived from ResOpsUS / GRanD (CC BY 4.0) and CDEC"
    role: "exam (baselines: shared/water/data/proc/baselines/reservoir_scores.parquet, reservoir_recent_scores.parquet)"

split:
  dev: "WaterData's frozen split (shared/water/data/proc/splits.json, seed 20261118, frozen 18 Nov 2026): 15 ResOpsUS dev dams, one or more per main use (flood control, irrigation, hydropower, supply, other) × capacity above / below the median; free to use whole. 413 aux dams with incomplete records: calibration of single processes only, never scored"
  exam: "The other 250 core dams (at least 10 years of simultaneous storage, inflow and release, known capacity); 244 have a scorable second half. Per dam: the first half of the record from 1980 calibrates demand, Qmax, capacity (with GRanD) and the climatologies; the second half (longest gap-free block, at most 10 years) is scored from the observed start storage with the observed inflow. Causal version (re-score of 27 Nov 2026, the numbers on this card): the record is split before gaps are interpolated, the split day is in the scored half only, and the scored half no longer raises capacity (37 of the 244 dams change capacity, 169 change Qmax slightly, 3 change start day). Recent exam: 15 CDEC reservoirs, WY2021-2025, demand and Qmax from their ResOpsUS record 1980-2020. Mass-balance-consistent subset: the 151 exam dams whose record closes the daily balance (correlation ≥ 0.9)"

exam:
  short: "244 real ResOpsUS dams + 15 CDEC reservoirs, once"
  summary: >-
    WaterData's frozen reservoir exam, run once after the ratchet was closed (training/final_exam.py,
    training/exam_results.json). Medians over dams of the cost J and of each of its components. Baselines on the same
    dams and decades: the classical flood-pool and hedging rule grid-tuned on the simulator (on g4, rung c2: the fairest
    baseline; and on g1, rung c1), WaterData's storage-target rule curve, the real operators' record, SOP and the
    perfect-foresight DP bound. Intervals: the 90 % bootstrap interval of the median J as shipped (dams resampled); the
    exact (Clopper-Pearson) 95 % interval of the paired win fractions (ties count against the pilot). Per-dam scores of
    the re-score are in training/rescore_per_dam.csv, the intervals in training/rescore_exam.json. J charges nothing for storage: the storage
    rows sit right after the headline. On 18 Nov 2026 the release was re-scored on the rebuilt data (a reproduction:
    every shipped median reproduces) and two things were added, both on the already-seen exam: the same classical rule
    tuned on the 15 dev dams (dev-tuned rule), and paired bootstrap intervals over dams (10,000 resamples, seed
    20261118) of the difference in median between the pilot and each baseline; a verdict is win or loss only if that
    95 % interval excludes zero. The Clopper-Pearson intervals stay as a cross-check. On 27 Nov 2026 every arm (the
    pilot, both sim-tuned rules, the dev-tuned rule, WaterData's four baselines) was re-scored once more on the causal
    version of the task (owner-approved; a dated supplementary exam on a seen exam, nothing chosen):
    training/rescore_exam_causal.json, training/rescore_per_dam_causal.csv. The rows below are that re-score; the
    exam-definition values are in the NOTEBOOK beside them. CDEC is unchanged (its task was already causal).
  results:
    - metric: "ResOpsUS exam (244 dams): median cost J"
      better: lower
      model: 0.0154
      baselines:
        - { name: "Flood-pool + hedging rule tuned on the simulator, g4 (rung c2)", kind: classical, value: 0.0289 }
        - { name: "Same rule tuned on the simulator, g1 (rung c1)", kind: classical, value: 0.0294 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.0322 }
        - { name: "WaterData rule curve (storage target from the calibration half)", kind: classical, value: 0.144 }
        - { name: "Historical operations (the record)", kind: classical, value: 0.183 }
        - { name: "SOP: release the demand when the water is there", kind: dumb, value: 0.109 }
      verdict: win
      note: "Causal task, re-scored 27 Nov 2026 (exam definition: pilot 0.01543, g4 rule 0.0285, SOP 0.108, rule curve 0.143). Paired bootstrap, median(pilot) − median(baseline), 95 % interval over 244 dams: g4 rule −0.0134 (−0.0211 to −0.0074), g1 rule −0.0140 (−0.0256 to −0.0069), dev-tuned rule −0.0168 (−0.0260 to −0.0112), SOP −0.094 (−0.123 to −0.072), rule curve −0.129 (−0.144 to −0.108), historical −0.168 (−0.191 to −0.149): every interval excludes zero. Cross-check, pilot better on (exact 95 % interval): g4 rule 62.3 % (55.9-68.4), g1 rule 59.8 % (53.4-66.0), dev-tuned rule 58.6 % (52.1-64.9), SOP 85.2 % (80.2-89.4), historical 94.7 % (91.1-97.1), rule curve 94.7 % (91.1-97.1). 90 % interval of the median: pilot 0.0099-0.0203. It loses to SOP on 35 dams (14 %; 37 under the exam definition). The dev-tuned rule (tuned after the exam was seen) scores worse than the sim-tuned one but keeps far more water (mean storage 0.62). J charges nothing for storage: see the next two rows. DP, a bound, 0.0063 (own row)."
    - metric: "ResOpsUS exam (244 dams): median mean storage, share of capacity (not charged by J)"
      better: higher
      model: 0.38
      baselines:
        - { name: "Flood-pool + hedging rule, g4", kind: classical, value: 0.40 }
        - { name: "Flood-pool + hedging rule, g1", kind: classical, value: 0.49 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.62 }
        - { name: "WaterData rule curve", kind: classical, value: 0.51 }
        - { name: "Historical operations", kind: classical, value: 0.44 }
        - { name: "SOP", kind: dumb, value: 0.59 }
        - { name: "Perfect-foresight DP (bound)", kind: classical, value: 0.68 }
      verdict: info
      note: "Not graded, because J does not value stored water; reported because the pilot uses that. It keeps the reservoir lower than every comparator, and lower storage is part of how it wins J. Median lowest storage 1.2 % of capacity (SOP 0 %, historical 13.9 %). Paired bootstrap of the difference in median (95 %, causal task): vs SOP −0.20 (−0.31 to −0.16), dev-tuned rule −0.24 (−0.26 to −0.20), DP −0.30 (−0.34 to −0.26), g1 rule −0.11 (−0.15 to −0.08), rule curve −0.13 (−0.17 to −0.08), real operators −0.06 (−0.13 to −0.005); level with the g4 rule (−0.02, −0.04 to +0.01). Under the exam definition the real operators were level (−0.06, −0.12 to +0.00)."
    - metric: "ResOpsUS exam (244 dams): median end − start storage, share of capacity (not charged by J)"
      better: higher
      model: -0.003
      baselines:
        - { name: "Flood-pool + hedging rule, g4", kind: classical, value: 0.007 }
        - { name: "Flood-pool + hedging rule, g1", kind: classical, value: 0.111 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.172 }
        - { name: "WaterData rule curve", kind: classical, value: 0.028 }
        - { name: "Historical operations", kind: classical, value: 0.002 }
        - { name: "SOP", kind: dumb, value: 0.296 }
        - { name: "Perfect-foresight DP (bound; required to end at least as full)", kind: classical, value: 0.296 }
      verdict: info
      note: "Not graded. Causal task (27 Nov 2026; exam definition: pilot +0.008, SOP +0.300). The pilot ends at least 20 % of capacity lower than it started on 34.4 % of dams (SOP 20.9 %, g4 rule 33.6 %, dev-tuned rule 18.4 %, historical 6.1 %, DP 0.8 %), confirming the shipped card. Paired bootstrap (95 %): vs SOP −0.30 (−0.38 to −0.23), dev-tuned rule −0.17 (−0.23 to −0.13), g1 rule −0.11 (−0.17 to −0.06); level with the g4 rule (−0.010, −0.062 to +0.024), the rule curve and the real operators. Mass-balance subset −0.031 (SOP +0.261); CDEC −0.098 (SOP +0.223)."
    - metric: "ResOpsUS exam (244 dams): median shortage ratio (water short of demand ÷ demand)"
      better: lower
      model: 0.066
      baselines:
        - { name: "Flood-pool + hedging rule, g4", kind: classical, value: 0.038 }
        - { name: "Flood-pool + hedging rule, g1", kind: classical, value: 0.019 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.065 }
        - { name: "WaterData rule curve", kind: classical, value: 0.186 }
        - { name: "Historical operations", kind: classical, value: 0.285 }
        - { name: "SOP", kind: dumb, value: 0.010 }
      verdict: loss
      note: "The pilot hedges: it releases less than 0.999 × demand on a median 67 % of days (g4 rule 5 %, SOP 1 %, DP 14 %, historical 55 %), small cuts that J's squared shortage term charges little for. J's shortage part: pilot 0.0094, g4 rule 0.0152, g1 rule 0.0084, SOP 0.0045, rule curve 0.122, historical 0.168, DP 0.0057. Paired bootstrap (95 %, causal task): worse than SOP +0.056 (+0.043 to +0.070), the g4 rule +0.028 (+0.018 to +0.041) and the g1 rule +0.047 (+0.034 to +0.055); level with the dev-tuned rule (+0.000, −0.019 to +0.018); better than the rule curve and the record."
    - metric: "ResOpsUS exam (244 dams): median days per year above Qmax"
      better: lower
      model: 2.9
      unit: "days/yr"
      baselines:
        - { name: "Flood-pool + hedging rule, g4", kind: classical, value: 0.0 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.0 }
        - { name: "WaterData rule curve", kind: classical, value: 0.0 }
        - { name: "Historical operations", kind: classical, value: 1.9 }
        - { name: "SOP", kind: dumb, value: 2.2 }
      verdict: loss
      note: "It goes above the safe channel capacity on more days than any comparator, but by far less (next row): many small floods instead of a few large ones, which J's squared penalty prefers; downstream it might not. J's flood part: pilot 0.00004, the tuned rules and the rule curve 0, SOP 0.0109, historical 0.0012. Paired bootstrap (95 %, causal task): vs SOP +0.60 days/yr (+0.05 to +1.23), historical +1.0 (+0.2 to +1.6), every tuned rule +2.9 (+2.1 to +3.6)."
    - metric: "ResOpsUS exam (244 dams): median worst release above Qmax, ÷ Qmax"
      better: lower
      model: 0.042
      baselines:
        - { name: "Flood-pool + hedging rule, g4", kind: classical, value: 0.0 }
        - { name: "WaterData rule curve", kind: classical, value: 0.0 }
        - { name: "Historical operations", kind: classical, value: 0.268 }
        - { name: "SOP", kind: dumb, value: 0.971 }
      verdict: mixed
      note: "Far below SOP (97 % of Qmax) and the real operators (27 %), above the tuned rule and the rule curve, which never exceed Qmax at the median. Days near empty (storage < 1 % of capacity), median: pilot 0, SOP 1.6 %; days full: pilot 0, SOP 10.3 %, DP 6.7 % (causal task; exam definition: worst excess 0.040, SOP 0.958). The dev-tuned rule never exceeds Qmax at the median either. No interval (not one of the bootstrapped components)."
    - metric: "Mass-balance-consistent subset (151 exam dams, record closes the daily balance): median J"
      better: lower
      model: 0.0162
      baselines:
        - { name: "Flood-pool + hedging rule tuned on the simulator, g4", kind: classical, value: 0.0304 }
        - { name: "Same rule, g1", kind: classical, value: 0.0357 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.0376 }
        - { name: "WaterData rule curve", kind: classical, value: 0.151 }
        - { name: "Historical operations", kind: classical, value: 0.200 }
        - { name: "SOP", kind: dumb, value: 0.0992 }
      verdict: win
      note: "Causal task (27 Nov 2026; exam definition: g4 rule 0.0300, g1 rule 0.0354). Paired bootstrap, median(pilot) − median(baseline), 95 % over 151 dams: g4 rule −0.0142 (−0.0256 to −0.0086), g1 rule −0.0195 (−0.0319 to −0.0084), dev-tuned rule −0.0214 (−0.0316 to −0.0116), SOP −0.083 (−0.115 to −0.061), rule curve −0.135, historical −0.184: all exclude zero. Days above Qmax vs SOP: +0.37 (−0.20 to +0.90), level. 90 % bootstrap interval of the median: pilot 0.0131-0.0255, g4 rule 0.0248-0.0460, SOP 0.0848-0.1236. Cross-check: dev-tuned rule 60.3 % (52.0-68.1); pilot better on 64.9 % of dams than the g4 rule (exact 95 % interval 56.7-72.5 %, n = 151), 60.9 % than the g1 rule (52.7-68.8), 82.8 % than SOP (75.8-88.4), 97.4 % than historical (93.4-99.3), 96.0 % than the rule curve (91.6-98.5). Mean storage 0.37 (SOP 0.54, g4 rule 0.35); end − start −0.033 (SOP +0.261, g4 rule −0.031). DP 0.0071."
    - metric: "CDEC recent exam (15 California reservoirs, WY2021-2025): median J"
      better: lower
      model: 0.0193
      baselines:
        - { name: "Flood-pool + hedging rule tuned on the simulator, g4", kind: classical, value: 0.0354 }
        - { name: "Same rule, g1", kind: classical, value: 0.0354 }
        - { name: "Dev-tuned rule (added on import, seen exam): same rule tuned on the 15 dev dams, f 0.75, tau 3 d, H 90 d", kind: classical, value: 0.0291 }
        - { name: "WaterData rule curve", kind: classical, value: 0.240 }
        - { name: "Historical operations", kind: classical, value: 0.108 }
