id: flowcast
name: FlowCast
version: "1.0"
status: released
released: 2026-11-18
order: 23
domain: Hydrology
platform: water
tags: [hydrology, streamflow, ungauged basins, rainfall-runoff, LSTM, CAMELS, Caravan, ERA5-Land, nowcast, uncertainty]
accent: "#1864ab"
tagline: Daily streamflow for rivers without a gauge, from weather and basin attributes
question: How much water flows in this river each day, if nobody has ever measured it?
question_short: "Daily flow of a river with no gauge"
summary: >-
  FlowCast predicts daily streamflow (mm/day and m³/s) with 5-95 % quantiles for a basin that has no gauge, from
  basin-average ERA5-Land weather and 11 static attributes. It is a 64-unit LSTM (24,710 weights) trained only on
  12,000 WaterSim simulations of random basins driven by real ERA5-Land forcing from non-exam years; it never reads
  streamflow from the basin it predicts. Graded once on 619 real CAMELS-US exam rivers (WY1990-99) and 603 of them
  again on WY2016-23, it does not beat classical ungauged regionalisation: median NSE 0.341 against 0.372 (and 0.378
  against 0.433 on the recent exam). It ties or beats it in arid, regulated and large basins and loses in snowy and
  humid ones. An optional gauged nowcast mode, fine-tuned to also read the river's own observed flow up to 1-7 days
  earlier, beats persistence at every lead but not NOAA's National Water Model.
disclaimer: >-
  Every score here uses ERA5-Land forcing (through Caravan), which under-catches mountain and Pacific Northwest
  precipitation and drifts about 6 % between decades; that caps every method on the page, and published
  Daymet/NLDAS-driven LSTM scores (NSE about 0.69-0.76) are not comparable. Research model: not for flood warning.

reads: "Basin-average daily forcing (Caravan / ERA5-Land conventions, UTC days): P (mm/d), PET (mm/d, FAO-56 Penman-Monteith), T_mean, T_min, T_max (°C), SRAD (W/m², net shortwave), vp (Pa), wind (m/s), from 365 days before the first predicted day to one day after the last; 11 static attributes: area (km²), mean/min/max elevation (m), slope (m/km or degrees), forest fraction, soil porosity, soil conductivity (cm/h or mm/h), carbonate fraction, reservoir storage / mean annual flow, irrigated fraction, urban fraction. Seven climate indices are computed from the forcing of the window itself. Nowcast mode also reads the observed daily flow (mm/day) up to `lead` days before each day."
returns:
  - "Daily mean flow Q (mm/day; Q_m3s in m³/s when the area is given), trained with an NSE-type loss"
  - "5 / 25 / 50 / 75 / 95 % quantiles (pinball loss), widened about the median by dev-fitted factors: 50 % band × 1.00, 90 % band × 1.08 (raw quantiles in the nowcast mode)"

physics:
  summary: >-
    WaterSim, the shared water platform's simulator (shared/water/watersim): four lumped rainfall-runoff models
    (HBV, GR4J, SAC-SMA, VIC-lite), degree-day or energy-balance snow on elevation bands, unit-hydrograph or
    Muskingum-Cunge routing, reservoirs and irrigation, driven by real ERA5-Land forcing. FlowCast wraps it, without
    editing it, in five versioned physics files (training/phys/p0-p4.json); the released rung uses p1, which adds a
    dev-measured water-yield correction: a simulated basin's true precipitation is ERA5-Land × m with
    log m = −0.088 + 0.058 elev_km + 0.153 snow share + 0.397 log(P/3 mm) + N(0, 0.146), while the network still
    reads ERA5-Land.
  simulator:
    - "Bank: 12,000 runs per physics version plus 800 frozen validation runs. Each run: a random basin (50 % jittered dev-basin attributes, 50 % WaterSim's parametric prior), random parameters with per-parameter scatter, one of four runoff models × two snow routines, 25 % Muskingum-Cunge routing; 5 years of real ERA5-Land forcing from a random CAMELS basin in a non-exam window (1951-1988 or 1999-2015; 1 year spin-up, 4 stored)"
    - "Noise: the network reads forcing after WaterSim's forcing-error model (P bias and daily scatter, snow undercatch, T error); the target is gauge-like flow (AR(1) rating error, revisions, low-flow error)"
    - "p1 water yield (training/src/calib_water.py, results/calib_water.json): on each of the 52 dev basins the attribute-prior simulator was run with ERA5-Land P × m on a grid of m and m* read where the simulated mean flow matched the observed (median of 4 models); fit β = (−0.0884, 0.0583, 0.1535, 0.3971), residual sd 0.146, median m 0.997. m runs from 0.53 (Texas and North Dakota plains) to 1.71 (Olympic Peninsula)"
    - "Tried and not kept: p2 flashier runoff (the full dev prior shift instead of WaterSim's half: simulated Richards-Baker flashiness 0.62× → 1.00× of observed on dev; calib_flash_summary.json); p3 larger forcing error (daily P cv 0.4, bias sd 0.10, 30 % timing jitter: a calibrated GR4J twin under the default noise matched its clean run at NSE 0.88 while reality allows 0.56; with p3 0.72; calib_noise.json); p4 = p3 + p2"
  checks:
    - "WaterSim GR4J vs airGR 1.7.9 (CRAN, compiled in an isolated R), help example L0123001: max |ΔQ| 1.0e-7 mm (airGR's single-precision output); NSE 1990-99 0.79882 vs the published 0.7988 (shared/water/checks/reference_models.json)"
    - "WaterSim HBV vs TUWmodel 1.1-1, lumped Vils 1976-2008: snow, soil moisture, ET, rain and melt identical to ≤ 1e-12 mm; runoff NSE 0.9990 (no routing), 0.9998 (MAXBAS 10)"
    - "Water balance, 121 runs over every model × snow × routing and real dev basins: worst closure 1.4e-15 relative, worst daily residual 8.3e-12 mm (balance.json)"
    - "Twin test (r1b, 52 dev basins, twin.py): median NSE of the same prediction against the real record 0.425, against each basin's calibrated twin 0.595, against its prior twin 0.380; flashiness ratio (prediction / target) 0.79 real vs 0.75 calibrated twin: the network reads real and calibrated twin alike. Mixing in the next UTC day gained nothing (no time-zone offset). For r0 the flashiness ratio was 0.54 real vs 0.51 twin, which led to the loss fix and to p2"
    - "numpy release == torch to 1.7e-7 relative on 4 dev basins × 2 years (export_check.json); the site instrument (TypeScript, float16 weights) == numpy on the same weights to 5.3e-8 on 54 cases"

noise: "WaterSim's forcing-error model on the network's input (precipitation bias and daily lognormal scatter cv 0.25, snow undercatch, temperature error) and gauge-like error on the target (AR(1) rating error, revisions, low-flow error). No real recordings are laid into the training signals: the forcing itself is real ERA5-Land from non-exam windows of CAMELS basins (exam basins' free-window forcing included, as the platform brief allows)."
network: "One LSTM layer, 64 units, over 11 daily weather features (P/10, log1p P, PET, three temperatures, net shortwave, vapour pressure, wind, day-of-year sine and cosine) plus 18 static features repeated at every step (11 attributes and 7 climate indices computed from the window's forcing: mean P and PET, aridity, snow share of P, high- and low-precipitation day frequencies, mean T). A linear head gives the mean (softplus) and five monotone quantiles (cumulative softplus), all in units of the basin's mean precipitation. 24,710 weights (25,478 for the nowcast copy, which adds three inputs: the observed flow `lead` days earlier, an availability flag and lead/7). Loss: NSE-type on the mean, scaled per sample by the Fu runoff ratio of the forcing (an input-only quantity; r0b), plus pinball loss on the quantiles. 3,000 steps × 32 windows of 730 days (365 scored), Adam lr 2e-3, dropout 0.1, CPU. Inference runs 365-day blocks, each with its own 365-day warm-up."

approach:
  real_backdrop: "Real ERA5-Land daily forcing of CAMELS basins from non-exam windows (1951-1988, 1999-2015) drives every simulated basin"
  physics_inputs: "Seven climate indices computed from the forcing (mean P and PET, aridity, snow share, high/low-precipitation frequencies, mean temperature), and the output is expressed in units of the basin's mean precipitation"
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: "Caravan v1.6 (Kratzert et al. 2023, Scientific Data 10:61): CAMELS-US basins, ERA5-Land forcing, streamflow, HydroATLAS attributes"
    url: https://zenodo.org/records/14673536
    licence: "CC BY 4.0 (cite Caravan and each source dataset)"
    role: "physics (forcing for every simulated basin, from non-exam windows), dev (52 basins: water-yield fit, dev gate, band widening), exam (forcing and flow of 619 basins, WY1990-99 and WY2016-23); examples/ excerpts"
  - name: "CAMELS-US (Newman et al. 2015, HESS 19:209; Addor et al. 2017, HESS 21:5293), through Caravan"
    url: https://gdex.ucar.edu/dataset/camels.html
    licence: "Free use with citation (NCAR/UCAR); redistributed in Caravan under CC BY 4.0"
    role: "dev, exam (basin set, attributes, the CAMELS-531 subset)"
  - name: "ERA5-Land (Muñoz-Sabater et al. 2021, ESSD 13:4349), Copernicus Climate Change Service, through Caravan"
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
    licence: "Copernicus licence (free, attribution; not share-alike)"
    role: "physics, dev, exam (all forcing)"
  - name: "HydroATLAS / BasinATLAS (Linke et al. 2019, Scientific Data 6:283), through Caravan"
    url: https://www.hydrosheds.org/hydroatlas
    licence: CC BY 4.0
    role: "dev, exam (static attributes)"
  - name: "USGS NWIS daily values and annual peak flows"
    url: https://waterdata.usgs.gov/nwis
    licence: Public domain (U.S. Government)
    role: "exam (recent-period flow WY2016-23 and the instantaneous flood peaks), dev"
  - name: "NOAA National Water Model v3.0 retrospective (CONUS), at the CAMELS gauges"
    url: https://registry.opendata.aws/nwm-archive/
    licence: Public domain (U.S. Government)
    role: "exam (operational baseline), dev reference"
  - name: "WaterData baselines (shared/water/waterdata): regionalisation U-dev and U-k12, GR4J + snow calibrated per gauge, climatology, persistence"
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water
    licence: "MIT (code); scores derived from the CC BY 4.0 / public-domain data above"
    role: "exam (baselines), dev reference"

split:
  dev: "WaterData's frozen split (shared/water/data/proc/splits.json): 52 CAMELS-US dev basins, WY2001-2014 with a 365-day warm-up from 1999-10-01 (entirely non-exam), Caravan flow, ungauged protocol. Used to fit the p1 water-yield coefficients, to gate every rung and to fit the two band factors"
  exam: "Every other CAMELS-US basin in the split: 619 basins on WY1990-99 (main; 600 with NWM) and 603 on WY2016-23 (recent, NWIS flow). Scored once, after r1b was chosen. Three examples (one snowy, one arid, one humid) drawn by seed 20261118 within strata (webdata.py), WY1995-96"

exam:
  short: "619 real CAMELS-US rivers, WY1990-99 and 2016-23"
  summary: >-
    Every exam basin, ungauged: FlowCast never reads the basin's flow. Medians over basins of daily NSE, KGE and
    flow-duration biases (training/results/exam_r1b_exam_cal.json), against WaterData's baselines on the same basins
    and days. On 18 Nov 2026 the released weights were re-scored on both exam windows (main WY1990-99 from Caravan,
    recent WY2016-23 and the instantaneous flood peaks from NWIS; seen: the exam was already open) and reproduced
    every claimed median. Every row now carries a paired bootstrap interval on the difference in medians against each
    baseline (10,000 resamples over basins, seed 20261118; training/results/rescore_*_2026-11-18.json), win or loss
    only if it excludes 0; the exact (Clopper-Pearson) binomial intervals on the shipped win fractions are kept in
    the notes as a cross-check. Gauged GR4J and NWM read information an ungauged model does not have; they are listed
    with persistence on their own rows. All forcing is ERA5-Land: see the disclaimer.
  results:
    - metric: "Main exam WY1990-99 (619 basins), ungauged, median daily NSE"
      better: higher
      model: 0.341
      baselines:
        - { name: "NN regionalisation, 12-fold donors (U-k12)", kind: classical, value: 0.385 }
        - { name: "NN regionalisation, dev donors (U-dev)", kind: classical, value: 0.372 }
        - { name: "Climatology (day-of-year mean)", kind: dumb, value: 0.065 }
      verdict: loss
      note: "Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median (0.3412 vs 0.3412; all 619 basins of splits.json camels_us exam). Difference in medians, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs U-dev −0.031 (95 % CI −0.056 to −0.014), vs U-k12 −0.044 (−0.067 to −0.028): loss; vs climatology +0.276 (+0.251 to +0.294). Cross-check (exact binomial on the share of basins where FlowCast's NSE is higher): U-dev 211/619 = 34.1 % (30.4-38.0 %), U-k12 32.6 % (28.9-36.5 %), climatology 80.6 % (77.3-83.7 %). NSE < 0 at 14.2 % of basins (U-dev 14.4 %, U-k12 14.1 %)."
    - metric: "Main exam WY1990-99, against gauged and operational references, median daily NSE"
      better: higher
      model: 0.341
      baselines:
        - { name: "NOAA National Water Model v3.0 (operational; calibrated on many of these gauges; 600 basins)", kind: published, value: 0.550 }
        - { name: "Persistence, 1 day (reads yesterday's observed flow)", kind: dumb, value: 0.475 }
        - { name: "GR4J + snow calibrated per basin on its own gauge", kind: classical, value: 0.473 }
      verdict: loss
      note: "Different protocols, listed as accepted losses. Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median. Difference in medians on the basins both have, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs NWM −0.205 (−0.235 to −0.182; 600 basins, FlowCast 0.345 there), vs persistence −0.134 (−0.182 to −0.087), vs GR4J −0.132 (−0.157 to −0.109). Cross-check (exact binomial, share of basins better): NWM 21.3 % (18.1-24.8 %), GR4J 19.5 % (16.5-22.9 %), persistence 44.4 % (40.5-48.4 %)."
    - metric: "Recent exam WY2016-23 (603 basins), ungauged, median daily NSE"
      better: higher
      model: 0.378
      baselines:
        - { name: "NN regionalisation, 12-fold donors (U-k12)", kind: classical, value: 0.443 }
        - { name: "NN regionalisation, dev donors (U-dev)", kind: classical, value: 0.433 }
        - { name: "Climatology", kind: dumb, value: 0.053 }
      verdict: loss
      note: "Seen reproduction re-score with NWIS flow (18 Nov 2026, training/results/rescore_recent_summary_2026-11-18.json): the released weights reproduce the claimed median (0.37816 vs 0.37816; 603 basins with at least 365 NWIS days, all in splits.json camels_us exam). Difference in medians, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs U-dev −0.054 (95 % CI −0.068 to −0.034), vs U-k12 −0.064 (−0.094 to −0.046): loss; vs climatology +0.325 (+0.307 to +0.341). Cross-check (exact binomial on the share of basins better, identical counts on re-score): U-dev 205/603 = 34.0 % (30.2-37.9 %), U-k12 34.2 % (30.4-38.1 %), climatology 82.6 % (79.3-85.5 %). NSE < 0 at 12.3 % (U-dev 11.4 %)."
    - metric: "Recent exam WY2016-23, against gauged and operational references, median daily NSE"
      better: higher
      model: 0.378
      baselines:
        - { name: "NOAA National Water Model v3.0 (600 basins)", kind: published, value: 0.687 }
        - { name: "GR4J + snow calibrated per basin", kind: classical, value: 0.517 }
        - { name: "Persistence, 1 day", kind: dumb, value: 0.480 }
      verdict: loss
      note: "Different protocols, listed as accepted losses. Seen reproduction re-score with NWIS flow (18 Nov 2026, training/results/rescore_recent_summary_2026-11-18.json): the released weights reproduce the claimed median. Difference in medians on the basins both have, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs NWM −0.309 (−0.329 to −0.287; 600 basins, FlowCast 0.378 there), vs GR4J −0.139 (−0.159 to −0.120), vs persistence −0.101 (−0.146 to −0.055): loss against all three. Cross-check (exact binomial, share of basins better): NWM 15.5 % (12.7-18.6 %), GR4J 20.1 % (16.9-23.5 %), persistence 47.9 % (43.9-52.0 %; a tie on that count, a loss on the paired median)."
    - metric: "Main exam, median KGE"
      better: higher
      model: 0.367
      baselines:
        - { name: "U-k12", kind: classical, value: 0.462 }
        - { name: "U-dev", kind: classical, value: 0.433 }
        - { name: "Climatology", kind: dumb, value: -0.054 }
      verdict: loss
      note: "Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median (0.3666). Difference in medians, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs U-dev −0.067 (−0.087 to −0.039), vs U-k12 −0.095 (−0.118 to −0.069): loss. Gauged GR4J 0.602 (−0.235, −0.259 to −0.204), NWM 0.596, persistence 0.738. Recent exam (re-scored, reproduces 0.397): vs U-dev (0.469) −0.073 (−0.089 to −0.046), vs U-k12 (0.469) −0.072 (−0.097 to −0.046): loss; GR4J 0.604, NWM 0.802."
    - metric: "Main exam, high-flow volume bias FHV (top 2 % of flows), median"
      better: closer
      model: -30.9
      unit: "%"
      baselines:
        - { name: "U-k12", kind: classical, value: -21.0 }
        - { name: "U-dev", kind: classical, value: -27.3 }
        - { name: "Climatology", kind: dumb, value: -80.7 }
      verdict: loss
      note: "Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median (−30.9 %). Interval on the median ABSOLUTE FHV (closer to 0 is better), paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: FlowCast 39.1 % against U-dev 34.3 % (+4.8 points, +2.9 to +7.8) and U-k12 31.3 % (+7.7, +5.6 to +11.6): loss against both (the release-time note called U-dev alone a tie from the signed medians). GR4J −18.0 %, NWM −13.0 %. Recent (re-scored, reproduces −32.9 %): median |FHV| 40.1 % against U-dev 35.3 % (+4.8, +2.8 to +7.5) and U-k12 31.8 % (+8.3, +5.7 to +10.8): loss; signed medians U-dev −29.1 %, U-k12 −24.7 %. Low-flow bias FLV +59 % against U-dev +34 % (recent +59 % vs +36 %)."
    - metric: "Main exam, annual daily peaks, median absolute error"
      better: lower
      model: 52.2
      unit: "%"
      baselines:
        - { name: "U-k12", kind: classical, value: 45.5 }
        - { name: "U-dev", kind: classical, value: 47.3 }
        - { name: "Climatology", kind: dumb, value: 84.5 }
      verdict: loss
      note: "Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median (52.2 %). Difference in medians, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs U-dev +4.9 points (+2.7 to +6.9), vs U-k12 +6.7 (+4.4 to +9.2): loss. GR4J 38.0 %, NWM 37.4 %. Peak timing (median days off): 0.85 against 0.82 for both U variants, +0.03 (−0.03 to +0.06 vs U-dev; 0.00 to +0.06 vs U-k12): tie. Recent (re-scored, reproduces 52.7 %): vs U-dev (47.7 %) +5.0 (+2.6 to +7.4), vs U-k12 (45.8 %) +6.8 (+4.9 to +9.7): loss; timing 0.74 days, tie with both."
    - metric: "Flood peaks (USGS annual instantaneous; annual max daily × 1.38), main exam, median absolute error"
      better: lower
      model: 59.8
      unit: "%"
      baselines:
        - { name: "Own-record median annual peak (gauged, calibration half)", kind: dumb, value: 42.2 }
        - { name: "NWM v3.0 daily × 1.38", kind: published, value: 42.4 }
        - { name: "GR4J calibrated × 1.38", kind: classical, value: 46.5 }
      verdict: loss
      note: "Seen reproduction re-score from the NWIS peak file (18 Nov 2026, rescore_recent_summary_2026-11-18.json; exam_report.py's protocol: codes 5/6/7/C, partial dates and missing values dropped; annual max daily × 1.384, WaterData's dev ratio from 447 samples; per basin the median |% error|, then the median over basins). It reproduces the claim exactly: 6,048 peaks at 607 basins, 59.75 % median absolute error, −45.8 % median bias. Difference in medians of the per-basin absolute error, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs own-record median (gauged, 42.2 %) +17.6 points (+14.2 to +20.2), vs GR4J × 1.38 (46.5 %) +13.2 (+10.2 to +15.1), vs NWM daily × 1.38 (42.4 %, 588 basins) +17.2 (+13.3 to +20.4): loss. FlowCast's 95 % quantile as the peak estimate: 63.9 % error, +31.4 % bias as shipped, which is the RAW pinball q95 (evalreal.py stored unwidened quantiles); the released, widened q95 gives 65.7 % and +38.1 %. No regionalisation baseline was scored on instantaneous peaks. Recent (4,513 peaks, 580 basins, reproduces 59.7 %, bias −48.5 %): vs own-record (43.5 %) +16.2 (+13.2 to +19.4), GR4J (47.8 %) +11.9 (+9.2 to +14.3), NWM daily (34.1 %) +25.7 (+22.6 to +27.9), NWM hourly (30.6 %, bias −2 %) +29.1 (+26.0 to +31.8): loss; raw q95 60.9 % / +28.2 % (released q95 63.3 % / +35.3 %)."
    - metric: "CAMELS-531 subset, main exam, median daily NSE"
      better: higher
      model: 0.357
      baselines:
        - { name: "U-dev", kind: classical, value: 0.402 }
        - { name: "U-k12", kind: classical, value: 0.401 }
        - { name: "Climatology", kind: dumb, value: 0.062 }
      verdict: loss
      note: "The subset most published CAMELS studies use; 487 of its basins are exam basins. Seen reproduction re-score (18 Nov 2026, training/results/rescore_main_summary_2026-11-18.json): the released weights reproduce the claimed median (0.3571). Difference in medians, paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118: vs U-dev −0.045 (−0.063 to −0.017), vs U-k12 −0.044 (−0.068 to −0.023): loss. GR4J 0.478, NWM 0.566. Recent (re-scored, reproduces 0.393; 475 exam basins): vs U-dev (0.448) −0.056 (−0.073 to −0.039), vs U-k12 (0.475) −0.082 (−0.102 to −0.056): loss."
    - metric: "Error bars: share of exam days inside the 90 % band (main, median basin)"
      better: closer
      model: 97.3
      unit: "%"
      baselines: []
      verdict: info
      note: "Nominal 90 %. Reproduced on 18 Nov (97.3 %). Averaged over basins 95.0 %; the 50 % band holds 55.5 %. Recent: 97.5 %, 95.1 %, 55.8 %. Median band width (90 %) is 2.9 × the mean flow: the bands are too wide in most basins and too narrow in some dry ones. Widen-only factors (×1.00, ×1.08 fitted on dev) cannot narrow them."
    - metric: "Snowy basins (snow share > 0.3, 118), main exam, median NSE"
      better: higher
      model: 0.40
      baselines:
        - { name: "U-dev", kind: classical, value: 0.56 }
        - { name: "GR4J calibrated (gauged)", kind: classical, value: 0.67 }
        - { name: "NWM v3.0", kind: published, value: 0.57 }
      verdict: info
      note: "Breakdown, not graded. Re-scored 18 Nov, paired vs U-dev (paired bootstrap over basins of the difference in medians, 10,000 resamples, seed 20261118): −0.154 (−0.210 to −0.067), the largest gap. Recent (115, re-scored, reproduces 0.409): vs U-dev (0.559) −0.150 (−0.193 to −0.067); NWM 0.70, GR4J 0.70. Only 10 of the 52 dev basins are snowy, and no snow rung was tried."
    - metric: "Arid basins (aridity > 1, 174), main exam, median NSE"
      better: higher
      model: 0.21
      baselines:
        - { name: "U-dev", kind: classical, value: 0.20 }
        - { name: "GR4J calibrated (gauged)", kind: classical, value: 0.30 }
        - { name: "NWM v3.0", kind: published, value: 0.32 }
      verdict: info
      note: "Breakdown, not graded. Re-scored 18 Nov, paired vs U-dev: +0.009 (−0.040 to +0.033), level. Recent (171, re-scored, reproduces 0.193): vs U-dev (0.201) −0.008 (−0.052 to +0.058), level; NWM 0.48, GR4J 0.29."
    - metric: "Humid basins (aridity < 0.6, 128), main exam, median NSE"
      better: higher
      model: 0.49
      baselines:
        - { name: "U-dev", kind: classical, value: 0.62 }
        - { name: "GR4J calibrated (gauged)", kind: classical, value: 0.66 }
