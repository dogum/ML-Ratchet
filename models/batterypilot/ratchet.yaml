# The ratchet ladders, normalised. Raw logs: training/ratchet.json (v1.0, GridSim physics 1.0: every rung, its dev scores
# by node-year, and the re-scores), training/ratchet_v1_1.json (v1.1, GridSim physics 1.1: the leak fix of 14 Nov 2026),
# training/ratchet_v1_2.json (the v1.2 attempt) and training/ratchet_v1_3.json (v1.3, GridSim physics 1.2).
model: batterypilot
ladders:
  - name: v1.0 — GridSim physics 1.0 (as released)
    objective: "Capture = net revenue / perfect-foresight net revenue (net of wear), summed over the 1, 2 and 4 h batteries of each simulated path-year and averaged over the path-years of the frozen simulated set (each path-year counts the same)"
    rule: "Keep a rung if its frozen capture beats the incumbent's by more than 0.01 AND its capture on the 10 real dev node-years (ERCOT 2019 and 2021 at 4 hubs, CAISO Aug-Dec 2023 at NP15 and SP15; all 3 durations) is not more than 0.01 below the incumbent's. When the simulator changed, a new frozen set was built and every logged rung re-scored and re-decided in order."
    margin: 0.01
    dev_gate: "Dev capture (10 real dev node-years) may not fall more than 0.01 below the incumbent's"
    frozen_sets: [v1_frozen, v2_frozen, v3_frozen]
    scored_on: v3_frozen
    note: "v1 = GridSim merit-order prices only; v2 = + dev-calibrated ORDC scarcity, cold outages, gas-turbine derate, RT noise and DA expectation (24 ERCOT path-years); v3 = v2 + 9 CAISO-like path-years on the real CISO fleet. Each rung's sim score is on the set it was judged on. A comparison network trained on real ERCOT 2018/2020/2022 prices breaks the physics-only rule; it was never a rung and is reported only in the exam table."
    columns_source: Frozen capture on each version of the frozen set (re-scores from training/ratchet.json) and dev capture on the real dev node-years
    columns: ["v1 frozen", "v2 frozen", "v3 frozen", "Dev capture"]
    rungs:
      - { id: R0, change: "Classical rolling-horizon LP on day-ahead prices (re-plans at 14:00, follows the plan)", sim: 0.1018, decision: kept, why: "Starting incumbent.", metrics: [0.1018, 0.4894, 0.4472, 0.5927] }
      - { id: R1, change: "MLP value-curve policy trained by policy search on sim v1 (GridSim merit-order prices, no scarcity curve, no outage weather, no RT noise); 45 path-years", sim: 0.5926, decision: rejected, why: "Frozen +0.491 but the dev gate failed: dev capture 0.483 vs the incumbent's 0.593 (−0.110). The v1 prices have no scarcity, so the policy cycles on small spreads and is empty when spikes come. Still rejected on v2 (+0.043 frozen, dev −0.110) and v3.", metrics: [0.5926, 0.5326, 0.5696, 0.4828] }
      - { id: R2, change: "Same network and policy search, trained on sim v2 (80 ERCOT path-years from 2018/2020/2022 inputs with dev-calibrated scarcity)", sim: 0.7671, decision: kept, why: "Frozen 0.767 vs R0 0.489 on v2 (+0.278); dev 0.598 vs 0.593 → new incumbent. Re-scored on v3: 0.7465 vs R0 0.4472, still kept.", metrics: ["—", 0.7671, 0.7465, 0.5979] }
      - { id: R3, change: "Train on all 120 ERCOT path-years + 45 CAISO-like path-years (CISO fleet, duck-curve solar, carbon price, $1,000-2,000 caps), 2,500 steps", sim: 0.7489, decision: rejected, why: "Frozen 0.7489 vs R2 0.7465 on v3 (+0.0024, below the 0.01 margin), although dev improved (0.623 vs 0.598).", metrics: ["—", "—", 0.7489, 0.6228] }
      - { id: R4, change: "Fine-tune R3 on the same 165 path-years with longer windows (21 days), batch 64, lower learning rate (900 steps)", sim: 0.758, decision: kept, why: "Frozen 0.7580 vs R2 0.7465 on v3 (+0.0115 > 0.01); dev 0.637 vs 0.598. Released as v1.0 (weights kept as batterypilot_weights_v1_0.npz). Its simulator used GridSim physics 1.0, whose outage defaults leaked exam-period data; replaced by v1.1 (next ladder).", metrics: ["—", "—", 0.758, 0.6372] }
  - name: v1.1 — GridSim physics 1.1 (leak fix, 14 Nov 2026)
    objective: "As v1.0: capture = net revenue / perfect-foresight net revenue (net of wear), summed over the 1, 2 and 4 h batteries of each simulated path-year and averaged over the path-years of the frozen simulated set"
    rule: "Unchanged from v1.0: keep a rung if its frozen capture beats the incumbent's by more than 0.01 AND its capture on the 10 real dev node-years is not more than 0.01 below the incumbent's. Every v1.0 decision re-taken in order, every network retrained."
    margin: 0.01
    dev_gate: "Dev capture (10 real dev node-years: ERCOT 2019 and 2021 at 4 hubs, CAISO Aug-Dec 2023 at NP15 and SP15; all 3 durations) may not fall more than 0.01 below the incumbent's"
    frozen_sets: [v4_frozen]
    scored_on: v4_frozen
    note: "GridSim physics 1.0 took its coal, CC, CT and gas-steam forced and planned outage shares from Texas RE's 2024/2025 assessments (exam-period data). Physics 1.1 uses pre-2023 sources (PJM 2017-2021 class EFORd; Texas RE 2017) and a coal offer adder re-fitted on dev 2019 (-5.73 $/MWh, was -6.62). Everything downstream was redone on 1.1: the scarcity calibration on dev 2019, 2021 and Uri (ORDC mu -4,000 -> 0 MW, sigma 5,000 MW, cold-outage f_max 0.55 -> 0.40), the training banks (120 ERCOT + 45 CAISO-like + 45 sim-v1 path-years) and the frozen set v4 (24 ERCOT + 9 CAISO-like). For reference (not a rung), the v1.0 network scores 0.7778 frozen on v4 and 0.6373 dev. R4 missed the margin by 0.0002 and is rejected as the rule says; R2 is released as v1.1."
    columns_source: Frozen capture on v4_frozen and dev capture on the real dev node-years (training/ratchet_v1_1.json)
    columns: ["v4 frozen", "Dev capture"]
    rungs:
      - { id: R0, change: "Classical rolling-horizon LP on day-ahead prices (re-plans at 14:00, follows the plan)", sim: 0.5042, decision: kept, why: "Starting incumbent.", metrics: [0.5042, 0.5927] }
      - { id: R1, change: "MLP value-curve policy trained by policy search on sim v1 (GridSim merit-order prices only); 45 path-years, 1,500 steps", sim: 0.6074, decision: rejected, why: "Frozen +0.103 but the dev gate failed: dev 0.489 vs 0.593 (−0.104).", metrics: [0.6074, 0.4888] }
      - { id: R2, change: "Same network, trained on sim v2 with the v1.1 dev calibration: 80 ERCOT path-years, 1,500 steps", sim: 0.7792, decision: released, why: "Frozen 0.7792 vs R0 0.5042 (+0.275); dev 0.638 vs 0.593 → kept. No later rung beat it by the margin: released as v1.1.", metrics: [0.7792, 0.6382] }
      - { id: R3, change: "Train on all 120 ERCOT path-years + 45 CAISO-like path-years, 2,500 steps", sim: 0.7877, decision: rejected, why: "Frozen +0.0085 over R2, below the 0.01 margin (dev 0.644 vs 0.638).", metrics: [0.7877, 0.6437] }
      - { id: R4, change: "Fine-tune R3 on the same 165 path-years with 21-day windows, batch 64, learning rate 5e-4 (900 steps)", sim: 0.789, decision: rejected, why: "Frozen 0.7890 vs R2 0.7792 (+0.0098, 0.0002 short of the 0.01 margin), although dev rose to 0.653 vs 0.638. Rejected as the rule is written.", metrics: [0.789, 0.653] }
  - name: v1.2 attempt — day-ahead value-curve backbone + learned residual (15 Nov 2026, not released)
    objective: "As v1.1: capture = net revenue / perfect-foresight net revenue (net of wear), summed over the 1, 2 and 4 h batteries of each simulated path-year and averaged over the path-years of the frozen simulated set"
    rule: "Unchanged: keep a rung if its frozen capture beats the incumbent's by more than 0.01 AND its dev capture is not more than 0.01 below the incumbent's. Incumbent: v1.1 (R2)."
    margin: 0.01
    dev_gate: "Dev capture (10 real dev node-years: ERCOT 2019 and 2021 at 4 hubs, CAISO Aug-Dec 2023 at NP15 and SP15; all 3 durations) may not fall more than 0.01 below the incumbent's"
    frozen_sets: [v4_frozen]
    scored_on: v4_frozen
    note: "The backbone (training/backbone.py) is the rolling day-ahead LP's plan written as a value curve: a backward dynamic programme over the known DA horizon (re-planned at 14:00 local, as the LP) gives the marginal value of stored energy at every SOC, and the offer rule trades it against the RT price. Hybrid rungs read the v1.1 features plus that curve and output a residual on it. R5 is a classical reference, not a candidate. No rung beat v1.1 by the rule: nothing released, no exam run. R6 (closest to the backbone) is the best policy on real dev and the worst on the frozen set: the simulator rewards DA-predictable spikes more than real prices do (the twin-test gap). Log: training/ratchet_v1_2.json (training/ladder_v1_2.py)."
    columns_source: Frozen capture on v4_frozen and dev capture on the real dev node-years (training/ratchet_v1_2.json)
    columns: ["v4 frozen", "Dev capture"]
    rungs:
      - { id: R2, change: "v1.1 as released: MLP value curve, 80 ERCOT path-years, 1,500 steps", sim: 0.7792, decision: kept, why: "Incumbent (v1.1).", metrics: [0.7792, 0.6382] }
      - { id: R5, change: "Reference, not a candidate: the day-ahead value-curve backbone alone, executed by the offer rule (no network)", sim: 0.6836, decision: rejected, why: "A classical reference. Dev 0.630 (LP 0.593): gains in 2021 (0.51-0.52 vs LP 0.28-0.32), loses in 2019 (0.67 vs 0.78-0.79) and with 1 h ERCOT batteries (0.35 vs 0.49).", metrics: [0.6836, 0.6295] }
      - { id: R6, change: "Hybrid: the network reads the backbone curve too and outputs a residual on it (kept non-increasing by a running minimum; zero at the start); 80 ERCOT path-years, 1,500 steps", sim: 0.7024, decision: rejected, why: "Frozen 0.7024 vs 0.7792 (-0.077); dev 0.661 vs 0.638 (+0.023). Best on dev, worst on the frozen set. Flat pieces of the curve made the offer rule's gradient blow up; training capture fell from 0.33 to 0.26.", metrics: [0.7024, 0.6614] }
      - { id: R7, change: "R6 on 120 ERCOT + 45 CAISO-like path-years, 2,500 steps", decision: rejected, why: "Stopped at step 775: training capture 0.21 vs 0.37 for R3 on the same windows (the R6 flaw). Not scored.", metrics: ["—", "—"] }
      - { id: R8, change: "R6 with a strictly decreasing curve (each knot at least 0.01 below the last, the v1.1 floor); 80 ERCOT path-years, 1,500 steps", sim: 0.7769, decision: rejected, why: "Frozen 0.7769 vs 0.7792 (-0.002); dev 0.615 vs 0.638 (-0.023, gate failed).", metrics: [0.7769, 0.615] }
      - { id: R9, change: "R8 on 120 ERCOT + 45 CAISO-like path-years, 2,500 steps", sim: 0.7869, decision: rejected, why: "Frozen 0.7869 vs 0.7792 (+0.0077, below the 0.01 margin); dev 0.633 vs 0.638 (-0.006). About R3's frozen score (0.7877) with a lower dev score (R3 0.644).", metrics: [0.7869, 0.6327] }
  - name: v1.3 — GridSim physics 1.2 (real-time scarcity the day-ahead market cannot see, 15 Nov 2026)
    objective: "As v1.1: capture = net revenue / perfect-foresight net revenue (net of wear), summed over the 1, 2 and 4 h batteries of each simulated path-year and averaged over the path-years of the frozen simulated set"
    rule: "Unchanged: keep a rung if its frozen capture beats the incumbent's by more than 0.01 AND its dev capture is not more than 0.01 below the incumbent's. A physics change re-takes the ladder: every v1.1 and v1.2-attempt decision re-taken in order from R0, then new rungs. Release (fixed before the ladder): the last incumbent ships only if its dev capture is above v1.1's (0.6382) and it beats v1.1 re-scored on the new frozen set by the same rule."
    margin: 0.01
    dev_gate: "Dev capture (10 real dev node-years: ERCOT 2019 and 2021 at 4 hubs, CAISO Aug-Dec 2023 at NP15 and SP15; all 3 durations) may not fall more than 0.01 below the incumbent's"
    frozen_sets: [v5_frozen, v6_frozen]
    scored_on: v6_frozen
    note: "GridSim physics 1.2 adds gridsim.market: unforecast RT scarcity events fitted on ERCOT 2018/2020/2022 prices (start rate by the DA price's rank and level, month and demand-forecast miss; size grows with the DA level). The dev calibration was re-fitted with it (ORDC mu -1,000 MW, sigma 3,500 MW, a grid edge; it also matches the share of RT spike value the DA sees) and the banks and frozen set rebuilt with the v4 seeds. v5_frozen was built on GridSim's first fit (clock-hour profile); the dev twin test sent that fit back, so the v5 scores are probes (training/ratchet_v1_3.json, probes_v5) and the ladder is decided on v6. ERCOT only: the CAISO-like family is unchanged (no CAISO fit). R8 cleared the margin by 0.007: seeds 0-2 give frozen 0.772 / 0.772 / 0.767 (sd 0.003) and dev 0.660 / 0.667 / 0.644 (sd 0.012). v1.1 re-scored on v6: 0.7346 frozen, 0.6382 dev. Log: training/ratchet_v1_3.json (training/ladder_v1_3.py)."
    columns_source: Frozen capture on v6_frozen and dev capture on the real dev node-years (training/ratchet_v1_3.json)
    columns: ["v6 frozen", "Dev capture"]
    rungs:
      - { id: R0, change: "Classical rolling-horizon LP on day-ahead prices (re-plans at 14:00, follows the plan)", sim: 0.3843, decision: kept, why: "Starting incumbent.", metrics: [0.3843, 0.5927] }
      - { id: R1, change: "MLP trained on sim v1 (GridSim merit-order prices only); its bank is unchanged by physics 1.2, so the v1.1 network is re-scored", sim: 0.6173, decision: rejected, why: "Frozen +0.233 but the dev gate failed: 0.489 vs 0.593 (−0.104).", metrics: [0.6173, 0.4888] }
      - { id: R2, change: "MLP value curve on sim v2 with physics 1.2 and the v1.3 calibration: 80 ERCOT path-years, 1,500 steps", sim: 0.7546, decision: kept, why: "Frozen 0.7546 vs R0 0.3843 (+0.370); dev 0.628 vs 0.593 → kept.", metrics: [0.7546, 0.6277] }
      - { id: R3, change: "All 120 ERCOT + 45 CAISO-like path-years, 2,500 steps", sim: 0.7685, decision: rejected, why: "Frozen +0.0139 over R2 but the dev gate failed: 0.596 vs 0.628 (−0.032).", metrics: [0.7685, 0.5961] }
      - { id: R4, change: "Fine-tune R3 with 21-day windows, batch 64, learning rate 5e-4 (900 steps)", sim: 0.7755, decision: rejected, why: "Frozen +0.0209 over R2 but the dev gate failed: 0.599 vs 0.628 (−0.029).", metrics: [0.7755, 0.599] }
      - { id: R5, change: "Reference, not a candidate: the day-ahead value-curve backbone alone, executed by the offer rule", sim: 0.6729, decision: rejected, why: "A classical reference (dev 0.630).", metrics: [0.6729, 0.6295] }
      - { id: R6, change: "Hybrid: backbone curve + learned residual, kept non-increasing by a running minimum; 80 ERCOT path-years, 1,500 steps", sim: 0.7321, decision: rejected, why: "Frozen −0.023 vs R2; dev 0.581 vs 0.628 (gate failed).", metrics: [0.7321, 0.5809] }
      - { id: R8, change: "Hybrid with a strictly decreasing curve (each knot at least 0.01 below the last); 80 ERCOT path-years, 1,500 steps", sim: 0.7719, decision: released, why: "Frozen 0.7719 vs R2 0.7546 (+0.0173); dev 0.660 vs 0.628 → kept. Seeds 0-2: frozen sd 0.003, all three clear R2 by more than 0.01. No later rung beat it by the margin; it beats v1.1 re-scored on v6 (0.7346, dev 0.638): released as v1.3.", metrics: [0.7719, 0.6601] }
      - { id: R9, change: "R8 on all 120 ERCOT + 45 CAISO-like path-years, 2,500 steps", sim: 0.7779, decision: rejected, why: "Frozen 0.7779 vs R8 0.7719 (+0.0060, below the 0.01 margin), although dev rose to 0.685 (the best dev score so far).", metrics: [0.7779, 0.6854] }
      - { id: R10, change: "The R3 recipe trained on the superseded v5 banks (GridSim's first fit); put on the ladder after its dev score (0.658) was seen among the v5 probes", sim: 0.7693, decision: rejected, why: "Frozen 0.7693 vs R8 0.7719 (−0.003).", metrics: [0.7693, 0.6579] }
      - { id: R11, change: "R9 fine-tuned with the R4 recipe (21-day windows, batch 64, learning rate 5e-4, 900 steps)", sim: 0.7803, decision: rejected, why: "Frozen 0.7803 vs R8 0.7719 (+0.0084, below the margin); dev 0.681. No further rung was tried.", metrics: [0.7803, 0.6811] }
