id: loadcast
name: LoadCast
version: "1.0.1"
status: released
released: 2026-11-17
order: 18
domain: Buildings
platform: building
tags: [buildings, energy forecasting, building meters, electricity, chilled water, steam, district energy, ASHRAE Guideline 14, uncertainty]
accent: "#1971c2"
tagline: Hourly energy per building meter from weather, calendar and metadata, with 90 % bands
question: How much electricity, chilled water, steam, hot water or gas will this building use each hour next year?
question_short: "A building's hourly energy per meter for next year"
summary: >-
  LoadCast forecasts a non-residential building's hourly energy on one meter (electricity, chilled water, steam, hot
  water or gas) for any span of hours, from weather, the local calendar and what is known about the building, with a
  90 % band for every hour. Cold mode reads metadata only (use, floor area, which meters exist, climate); warm mode
  also reads 2 weeks, 8 weeks or a year of the meter's own history and corrects a time-of-week-and-temperature (TOWT)
  model fitted on it. It learned only from 1,600 BuildingSim buildings simulated under the real 2016-17 weather of the
  19 BDG2 sites, with real dev-meter residuals added as noise. It was examined once on 1,502 real BDG2 exam
  building-meters, forecasting local 2017 from 2016.

reads: "Hourly UTC weather (T_out °C, dewpoint °C, GHI W/m², wind m/s) over the forecast window, the history window and 7 days before each; time zone and latitude (holidays for the US, Canada, UK and Ireland); use type (10 classes), floor area (m²), optional year built, the meter type and which meters the building has, optional HVAC class and operating hours; optionally the meter's own hourly kWh history (warm mode)."
returns:
  - Hourly mean load (kW) on the chosen meter for any span of hours
  - "A 90 % band (lo90, hi90) and sigma for every hour, widened by one dev-fitted factor per mode, history length and meter type (×1.0 to ×7.75; ×30, the cap, for 2-week chilled water and gas); raw bands with calibrated=False"

physics:
  summary: >-
    The shared BuildingSim simulator (ML Ratchet building platform, Phase 1): an ISO 13790 5R1C single-zone heat
    balance with multinode walls, solar gains (pvlib), infiltration, ventilation and moisture; DX, heat-pump, chiller
    (DOE-2 EIR), boiler and district plants; VAV and unitary air sides; domestic hot water; driven by real weather.
    LoadCast's wrappers (training/lcsim.py, no edit to the shared package) add country holiday calendars, a BDG2-style
    spec maker (the meters a building has decide its plant), operating knobs and a per-meter calibration
    y = a·sim + b·A fitted on the dev buildings.
  simulator:
    - "Generator: BuildingSim specs from ComStock / CBECS priors; use mix like BDG2; meter sets drawn from the dev buildings (80 %) or a fixed list; half the floor areas from the dev log-area distribution"
    - "1,600 buildings at the 19 BDG2 sites under their real 2016-2017 hourly weather; each building draws its knobs and a, b from a dev donor (60 % same use), jittered ×exp(N(0, 0.2))"
    - "Knobs: HVAC for electricity-only buildings, operating hours (default / extended / 24-7), outdoor air ×1 or ×2.5, VAV minimum flow 0.3 or 0.8 with 12.8 °C supply air"
    - "Dev calibration on 52 BDG2 dev buildings (2016 only): best knobs 24-7 in 22 of 52, extended hours in 9, outdoor air ×2.5 in 37; median electricity a = 0.43 with b = 6.3 W/m² (real campus electricity is flatter than simulated)"
    - "Simulated annual energy / real, generic twins → best knobs (dev medians): electricity 0.97 → 0.96, chilled water 0.29 → 0.47, steam 0.29 → 0.87, hot water 0.18 → 0.57, gas 0.14 → 0.14; hourly CV(RMSE) after the a, b fit (in sample, 2016): electricity 62 → 24 %, chilled water 93 → 53 %, steam 113 → 62 %, hot water 171 → 79 %"
  checks:
    - "BuildingSim Phase 1: steady conduction vs closed form to 1.8e-9; RC step response within 0.0035 K; degree-day ratio 0.999996; ISO 13786 wall amplitude −1.6 %, lag −0.01 h; every energy ledger closes to 1e-8"
    - "BESTEST: 29 of 34 values inside the published ranges, all 20 annual heating and cooling values in (ranges transcribed from the literature, not the official ASHRAE 140 tables)"
    - "Twins: ResStock homes (126) site energy median 1.10× (IQR 0.98-1.26), daily r 0.92; ComStock buildings (45) 0.86× (aggregate 0.97), daily r 0.89"
    - "Real BDG2 dev twins from metadata alone (median annual sim/real): electricity 0.98 (daily r 0.34), chilled water 0.28, steam 0.29, hot water 0.15 — the campus district-energy gap LoadCast's calibration only partly closes"
    - "What the network adds (dev twin test, 17 Nov 2026): cold, against the dev-calibrated twin from metadata, median CV electricity 53.4 → 62.5 %, chilled water 71.1 → 101.0 %, heating meters 96.0 → 103.2 % (corrections correlate with truth − twin at r = 0.73, 0.70, 0.18 hourly, but shift the level the wrong way); warm, against its own ridge TOWT, 22.3 → 22.3, 48.1 → 43.2, 65.9 → 64.5 % (r = 0.15, 0.50, 0.32)"
    - "Reproduction (17 Nov 2026): the dev calibration re-run on this platform matches calib_summary.json to 1e-9; the released weights reproduce all 635 statistics of the exam log to 5e-6, the dev gate to 1e-5 and the widening factors exactly"
    - "Twin test (dev, R3): median cold CV(RMSE) real vs twin: electricity 62.5 vs 51.8 % (per-building r 0.86), chilled water 101 vs 99 % (r 0.96), steam 104 vs 108 % (r 0.95); warm 22.3 vs 17.8, 43.2 vs 41.7, 61.7 vs 59.9 % (r ≈ 0)"
    - "numpy == torch to 1.5e-6 on real dev rows; the lab page's JavaScript port == Python to 3e-4 (weather stored at 0.01 °C); the site instrument == numpy to 4e-6 on 25 reference weeks"
noise: "Real noise from 85 BDG2 dev building-meters with good data in both years: the hourly residual of an in-sample regression (TOWT + 24 h mean temperature + dewpoint + solar), divided by the year mean — occupancy, campus breaks, events, meter quirks. One residual series is added to each simulated meter on the same local calendar dates, with a real 2017/2016 level change (whole year or a step), occasional quantisation and the real gap pattern. The bank holds the dev buildings' 2017 residuals too."
network: "Two MLPs, cold (64 inputs) and warm (83 inputs): 3 hidden layers of 192 SiLU units, dropout 0.1, Gaussian head (mean, log sigma); 177,604 parameters (cold 86,978, warm 90,626). Inputs per hour: 38 metadata, 10 weather and 16 calendar features; warm adds 19 history features (TOWT and change-point predictions from the history, time-of-week profile, history level and shape statistics). Cold predicts kW / (A × I_ref), warm kW / history mean. Loss: weighted MSE on the mean (weight 1 / ybar², floored) + 0.1 × Gaussian NLL for sigma; AdamW, cosine schedule, 30 epochs of fresh random hours, per-row metadata jitter (log area ±0.1, year ±6, climate ±0.5 K / ±8 %)."

approach:
  real_backdrop: "Real hourly residuals of 85 BDG2 dev building-meters, added to every simulated meter on the same calendar dates with real level changes and gaps; the simulated buildings run on the 19 BDG2 sites' real 2016-17 weather"
  physics_inputs: false
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: Building Data Genome 2 (BDG2), Miller et al. 2020, Scientific Data 7:368 (cleaned by BuildingData)
    url: https://github.com/buds-lab/building-data-genome-project-2
    licence: CC BY-SA 4.0 (share-alike; examples/bdg2/, lab/ and the instrument data are BDG2-derived)
    role: dev (52 buildings for calibration, the dev gate and the widening), noise (85 dev building-meters' residuals), exam (1,502 building-meters), physics (site weather and locations)
  - name: NOAA Integrated Surface Database station weather, as shipped with BDG2
    url: https://www.ncei.noaa.gov/products/land-based-station/integrated-surface-database
    licence: Public domain (U.S. Government); redistributed within BDG2 under CC BY-SA 4.0
    role: physics (simulator weather), dev, exam (forecast inputs)
  - name: Iowa Environmental Mesonet ASOS archive (weather gap fill, by BuildingData)
    url: https://mesonet.agron.iastate.edu/request/download.phtml
    licence: Free use with credit (Iowa State University)
    role: physics, dev, exam (gap fill)
  - name: NASA POWER hourly irradiance (by BuildingData)
    url: https://power.larc.nasa.gov
    licence: Free use with credit (NASA Langley Research Center POWER Project)
    role: physics, dev, exam (GHI)
  - name: NREL ResStock and ComStock (OEDI)
    url: https://data.openei.org
    licence: CC BY 4.0 ("Data includes information from the ResStock™ / ComStock™ datasets developed by the National Renewable Energy Laboratory")
    role: physics (BuildingSim generator priors; twin checks)
  - name: EIA Commercial Buildings Energy Consumption Survey (CBECS) 2018
    url: https://www.eia.gov/consumption/commercial/
    licence: Public domain (U.S. Government)
    role: physics (BuildingSim generator priors)

split:
  dev: "BuildingData's frozen split (shared/building/data/proc/splits.json, seed 20261116): 52 BDG2 dev buildings. 2016 for calibration; 85 dev building-meters' 2016 and 2017 residuals in the noise bank; 84 dev building-meters forecasting 2017 from 2016 for the dev gate and the widening factors (only 5 hot water and 2 gas meters)"
  exam: "Every other BDG2 building-meter with good data in both years (q_ok): 1,502 (856 electricity, 323 chilled water, 225 steam, 72 hot water, 26 gas), forecasting local 2017 with the actual 2017 weather from 2016 history"

exam:
  short: "1,502 real BDG2 meters, 2017 from 2016"
  summary: >-
    Every BDG2 exam building-meter, forecast for local 2017 with the actual 2017 weather from 2016. Taken once
    after R3 was chosen; re-scored on 17 Nov 2026 with the released weights (seen: it reproduces to 5e-6, and nothing
    was chosen from it). Each row is a meter type and a history length; daily and monthly rows score daily and
    monthly totals. Baselines on the same meters: TOWT and a G14 change-point model fitted on 2016 (BuildingData),
    LoadCast's own ridge TOWT on the same history, the BuildingSim twin calibrated on the 52 dev buildings and run from
    each exam building's metadata, and two dev-fitted guesses. Median CV(RMSE) (ASHRAE Guideline 14), all with
    p = 0 (BuildingData's n − p converted). Verdict from a 95 % paired bootstrap interval over building-meters
    (2,000 resamples) on LoadCast minus the best baseline: 6 wins, 16 ties, 18 losses. v1.0.1 (27 Nov 2026) adds the
    electricity meter to a meter list that lacks one; re-scored on the seen exam it changes 19 chilled-water, steam and
    gas building-meters (15 buildings), moves the chilled-water and steam medians 0.1-3.3 points down and changes no
    verdict (still 6, 16, 18).
  results:
    - metric: "Electricity, a year of history (856 meters), median hourly CV(RMSE)"
      better: lower
      model: 18.8
      unit: "%"
      baselines:
        - { name: "Change-point model fitted on 2016 (BuildingData)", kind: classical, value: 19.1 }
        - { name: "Ridge TOWT fitted on 2016 (LoadCast's anchor)", kind: classical, value: 19.5 }
        - { name: "TOWT fitted on 2016 (BuildingData)", kind: classical, value: 19.5 }
      verdict: tie
      note: "Seen re-score (17 Nov 2026). -0.3 points against change-point model fitted on 2016 (BuildingData), 95 % CI [-0.8, +0.1] (paired bootstrap over 856 building-meters). Median NMBE -0.5 %; G14 pass 70 % vs 71 %; 90 % band covers 92 % of hours. Nowcasts (read the real 2017 meter): persistence 1 h 9.6, 24 h 18.6, same hour last week 19.5. v1.0 verdict: win."
    - metric: "Electricity, 8 weeks of history (856 meters), median hourly CV(RMSE)"
      better: lower
      model: 23.8
      unit: "%"
      baselines:
        - { name: "Ridge TOWT fitted on the same 8 weeks", kind: classical, value: 26.2 }
        - { name: "BuildingSim twin calibrated on dev, by use type", kind: classical, value: 52.4 }
        - { name: "BuildingSim twin calibrated on dev (median knobs, a, b)", kind: classical, value: 53.5 }
        - { name: "Median guess per use and meter, fitted on dev", kind: dumb, value: 53.8 }
        - { name: "Dev median intensity × dev TOWT shape", kind: dumb, value: 53.8 }
      verdict: win
      note: "Seen re-score (17 Nov 2026). -2.4 points against ridge TOWT fitted on the same 8 weeks, 95 % CI [-3.3, -1.6] (paired bootstrap over 856 building-meters). Median NMBE +1.5 %; G14 pass 53 % vs 48 %; 90 % band covers 90 % of hours. Not a verdict row in v1.0."
