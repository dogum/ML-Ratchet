        - { name: "BuildingSim twin calibrated on dev, by use type", kind: classical, value: 52.4 }
        - { name: "BuildingSim twin calibrated on dev (median knobs, a, b)", kind: classical, value: 53.5 }
        - { name: "Median guess per use and meter, fitted on dev", kind: dumb, value: 53.8 }
