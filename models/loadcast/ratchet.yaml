# The ratchet ladder, normalised. Raw log: training/ratchet.json (written by training/rung.py; every rung re-scored
# and re-decided in order each time the objective definition changed).
model: loadcast
ladders:
  - name: "LoadCast v1.0 (BuildingSim, 17 Nov 2026)"
    objective: "Mean over meter types (n >= 5) of (cold skill + warm skill) / 2 on the frozen simulated set v1_val (300 BuildingSim buildings of the v1 calibrated physics, seed 99, real dev noise seed 12345; 666 building-meters scored). Cold skill = 1 − median CV(RMSE) / median CV of the set's own median-intensity × median-shape guess; warm skill = 1 − median CV / median CV of TOWT on the same 2016 history."
    rule: "Keep if the objective beats the incumbent by more than 0.01 AND the dev score (mean of cold and warm median CV(RMSE) over 84 dev building-meters, 2016 → 2017) is no more than 2 % (relative) worse than the incumbent's."
    margin: 0.01
    dev_gate: "Dev score (mean of cold and warm median CV over 84 dev building-meters) may not rise by more than 2 % relative"
    frozen_sets: [v1_val]
    scored_on: v1_val
    note: >-
      Rule note (from the build handoff; no exam result chose anything): the frozen-set objective changed twice before
      R3 — floored pooled skills, then unfloored pooled skills, then per meter type (pooled medians mixed meter types and
      could rank a model that is better on every meter as worse) — and every rung was re-scored and re-decided in order
      each time; the values here are the final definition (training/ratchet.json keeps the pooled values as
      frozen_history; the floored values were overwritten). R0-R2 are kept under the last two definitions; their
      decisions under the first are not recorded. The real-noise bank holds the
      dev buildings' 2017 residuals. Measured on 17 Nov 2026 (training/optimism.py, optimism_r3.json): retraining the
      R3 recipe on a rebuilt bank with each dev series' 2017 residuals replaced by its 2016 ones moved the dev score by
      −0.1 points (95 % CI −2.7 to +2.7) and the seen exam by −0.9; two training seeds of the unchanged recipe differ by
      1.8 points on dev and 2.7 on the exam. So that leak is below the noise. The larger optimism is selection: R3's
      dev score 49.2 against 53.8 and 52.0 for two retrains of its recipe, while its exam score (52.8) sits between
      theirs (53.8, 51.2). The two retrains also differ by 0.020 in the frozen objective (margin 0.01), and the
      rebuilt frozen set v1_val scores the released R3 at 0.004 (0.014 logged; banks are not bit-reproducible because
      the generator hands out specs in process order). Later rungs should be scored over several training seeds. The card
      gives the frozen set as 650 building-meters; ratchet.json scores 666.
    columns_source: "Skills on the frozen set v1_val, then dev (84 dev building-meters, 2016 → 2017): median cold and warm CV(RMSE) %, the dev score and its ratio to the incumbent's"
    columns: ["Cold skill", "Warm skill", "Dev cold CV", "Dev warm CV", "Dev score", "Dev vs incumbent"]
    rungs:
      - { id: r0, change: "Generic Phase 1 BuildingSim physics (v0 bank, 800 buildings), real dev noise, two MLPs 3 × 192, 30 epochs", sim: -0.1736, decision: kept, why: "First rung.", metrics: [-0.253, -0.094, 88.6, 31.2, 59.9, "–"] }
      - { id: r1, change: "Dev-calibrated physics (v1 bank: knobs and meter a, b drawn from the 52 dev fits), 800 buildings, otherwise as R0", sim: -0.1184, decision: kept, why: "Frozen objective −0.118 vs −0.174; dev score 54.9 vs 59.9.", metrics: [-0.187, -0.049, 79.3, 30.5, 54.9, "−8%"] }
      - { id: r2, change: "R1 + anti-memorisation: per-row jitter of the area, year and climate metadata, dropout 0.1, weight decay 1e-3", sim: -0.0178, decision: kept, why: "Frozen objective −0.018 vs −0.118; dev score 51.9 vs 54.9.", metrics: [-0.071, 0.035, 73.8, 30.0, 51.9, "−6%"] }
      - { id: obj-unfloored, change: "Re-definition before R3: pooled cold and warm skills no longer floored at 0 (rung.py --redecide); every rung re-decided in order", decision: kept, why: "Definition change, not a model. Re-decided, R0-R2 are kept (pooled objective −0.215, −0.155, −0.067). The floored values and the decisions under them were overwritten and are not in the log.", metrics: ["–", "–", "–", "–", "–", "–"] }
      - { id: obj-per-meter, change: "Re-definition after R2: skills computed per meter type and averaged (pooled medians mixed meter types); every rung re-scored on v1_val in order (rung.py --rescore)", decision: kept, why: "Definition change, not a model. R0-R2 stayed kept; the values above are re-scores under this definition.", metrics: ["–", "–", "–", "–", "–", "–"] }
      - { id: r3, change: "R2 on the full calibrated bank (1,600 buildings instead of 800)", sim: 0.0135, decision: released, why: "Frozen objective 0.014 vs −0.018; dev score 49.2 vs 51.9. Released as v1.0 (R4 and R5 were rejected).", metrics: [-0.016, 0.043, 70.6, 27.9, 49.2, "−5%"] }
      - { id: r4, change: "Cold loss weight 1 / ybar^0.5 instead of 1 / ybar² (aims the unknown magnitude at the median, not about half of it); warm net = R3's", sim: -0.0263, decision: rejected, why: "Frozen objective −0.026 vs 0.014 (needs +0.01); dev score 52.2 vs 49.2 (dev gate failed).", metrics: [-0.095, 0.043, 76.6, 27.9, 52.2, "+6%"] }
      - { id: r5, change: "Real noise matched by use type (75 % of residual series from a dev building of the same use: campus calendars by use); cold loss weight as R3", sim: 0.0063, decision: rejected, why: "Frozen objective 0.006 vs 0.014 (needs +0.01); dev score 51.7 vs 49.2 (dev gate failed).", metrics: [-0.022, 0.035, 74.5, 28.8, 51.7, "+5%"] }
      - { id: widen, change: "Error bars: one widen-only factor per mode, history length and meter type: the smallest factor (1.0 to 30, the cap) at which the dev building-meters' mean coverage of the 90 % band, forecasting 2017 from 2016, reaches 90 % (training/exam.py fit_widen; widen_r3.json)", decision: kept, why: "Cold ×2.0 electricity, ×2.9 chilled water, ×7.75 steam, ×1.0 hot water, ×1.5 gas; warm (a year) ×1.0-1.2; 8 weeks ×1.0-1.65; 2 weeks ×1.25-4.0, and ×30 (the cap) for chilled water and gas. No effect on the forecasts.", metrics: ["–", "–", "–", "–", "–", "–"] }
  - name: "LoadCast round 2 (frozen v2_val, 3-seed means, 17 Nov 2026)"
    objective: "As v1.0 (mean over meter types of (cold skill + warm skill) / 2), on the rebuilt frozen set v2_val: 300 BuildingSim buildings (seed 99, real noise seed 12345, 666 building-meters) with a deterministic spec per building (bank.py phys v1d), built once; v2_val_p11 is the same buildings at BuildingSim physics 1.1, for r6. Each rung is the mean over training seeds 0, 1, 2."
    rule: "Keep if the 3-seed mean objective beats the incumbent (the released R3 weights re-scored on the same frozen set) by more than 0.01 AND the 3-seed mean dev score is no more than 2 % (relative) worse than R3's 49.2."
    margin: 0.01
    dev_gate: "3-seed mean dev score (mean of cold and warm median CV over 84 dev building-meters) no more than 2 % worse than 49.2"
    frozen_sets: [v2_val, v2_val_p11]
    scored_on: v2_val
    note: >-
      Plan and results in NOTEBOOK.md (2026-11-17, round 2); per-seed scores in training/r2_ladder.json. Reference
      rows, not candidates: the R3 recipe retrained on v2_train with seeds 0-2 scores -0.0076 (seeds +0.0035, -0.0151,
      -0.0113; spread 0.019) and dev 53.3, so the released R3's dev 49.2 is a selected seed and the dev gate (50.2) sits
      about 3 points below what its own recipe reaches. The dev-calibrated BuildingSim twin alone, as the no-history
      forecast, has cold skill +0.002 on v2_val (R3 -0.018) and dev no-history median CV 65.4 % (R3 70.6, control
      77.2). No rung was kept, so nothing was combined and v1.0 stays released.
    columns_source: "3-seed means: skills on the frozen set of the rung's physics, then dev (84 dev building-meters, 2016 → 2017): median cold and warm CV(RMSE) %, the dev score and its ratio to R3's"
    columns: ["Cold skill", "Warm skill", "Dev cold CV", "Dev warm CV", "Dev score", "Dev vs incumbent"]
    rungs:
      - { id: r3-v2, change: "Incumbent: the released v1.0 (R3) weights re-scored on the rebuilt frozen set v2_val (−0.0152 on v2_val_p11)", sim: -0.0081, decision: kept, why: "Not a new model: the reference every round-2 rung is judged against. Dev score unchanged (49.2).", metrics: [-0.018, 0.002, 70.6, 27.9, 49.2, "–"] }
      - { id: r6, change: "Physics 1.1 (BuildingSim district plants): dev calibration re-run at 1.1, bank v2_train_p11 and frozen set v2_val_p11, same network recipe", sim: -0.0042, decision: rejected, why: "On v2_val_p11: −0.0042 (seeds −0.0077, −0.0028, −0.0021) vs R3 −0.0152, +0.011 (passes); dev score 52.8 vs 49.2 (+7 %, dev gate failed). On v2_val: −0.024.", metrics: [-0.034, 0.026, 75.9, 29.6, 52.8, "+7%"] }
      - { id: r7, change: "No-history magnitude head: forecast = M × shape, M from an MLP on the metadata trained on log annual mean (aims at the median), shape = the cold MLP on load / its own annual mean; warm networks = the control's", sim: -0.0276, decision: rejected, why: "−0.0276 (seeds −0.0305, −0.0290, −0.0235) vs R3 −0.0081 (needs +0.01); dev score 50.4 vs 49.2 (+2.4 %, dev gate failed by 0.2). Dev no-history CV 71.4 vs control 77.2; electricity NMBE −4 to +16 % vs +38 %.", metrics: [-0.065, 0.010, 71.4, 29.5, 50.4, "+2.4%"] }
      - { id: r8, change: "No-history mode anchored on the dev-calibrated twin (metadata-only BuildingSim twin, dev plurality knobs, dev median a, b): the cold network predicts a correction to the twin's hourly reading; warm networks = the control's", sim: -0.0047, decision: rejected, why: "−0.0047 (seeds +0.0072, −0.0132, −0.0082) vs R3 −0.0081 (needs +0.01); dev score 53.9 vs 49.2 (+9 %, dev gate failed). Dev no-history CV 78.2 against 65.4 for the twin it corrects: the CV²-weighted loss pulls the level down again (chilled water NMBE +66 % vs +2 % for the twin).", metrics: [-0.019, 0.010, 78.2, 29.5, 53.9, "+9%"] }
