model: bridgesense
ladders:
- name: v1.0 — released 2026-11-24, superseded by v1.1 (feature bugs; checkpoints
    chosen on val3)
  objective: 'Composite skill in [0, 1] on frozen simulated bridge episodes: 0.35*AUC
    + 0.35*dK_skill + 0.15*env_skill + 0.15*cold_extrap_specificity'
  rule: Keep if frozen-set composite skill beats the incumbent by more than +0.01
    AND on KW51 dev (10 blocks, seed 20261124) AUC drops <= 0.02, Brier rises <= max(15%,
    +0.015), and 10-block dK/K MAE rises <= max(15%, +0.05 pp).
  margin: 0.01
  scored_on: val3
  rungs:
  - id: r1
    change: Textbook linear thermoelastic 2-D modal FEM + synthetic Gaussian OMA noise
      (physics p1, train1)
    sim: 0.30237
    dev:
      dev_auc: 1.0
      dev_brier: 0.2386
      dev_dk_mae: 0.104
    decision: kept
    why: First rung.
    metrics:
    - 0.767
    - 2.64
    - 0.056
    - 1.0
    - 0.2386
    - 0.104
  - id: r2
    change: Add 1-D Fourier deck heat diffusion, asphalt/ballast freezing phase transition,
      axial bearing restraint, warm-to-cold extrapolation (physics p2, train2)
    sim: 0.80631
    dev:
      dev_auc: 1.0
      dev_brier: 0.0
      dev_dk_mae: 0.043
    decision: kept
    why: +0.504 on the frozen set; dev gate passed.
    metrics:
    - 0.948
    - 0.66
    - 0.662
    - 1.0
    - 0.0
    - 0.043
  - id: r2_no_xattn
    change: 'Architecture ablation on p2: remove baseline-to-query thermal cross-attention'
    sim: 0.80179
    dev:
      dev_auc: 1.0
      dev_brier: 0.0603
      dev_dk_mae: 0.086
    decision: rejected
    why: -0.005 on val3, needs more than +0.01.
    metrics:
    - 0.94
    - 0.68
    - 0.674
    - 1.0
    - 0.0603
    - 0.086
  - id: r3
    change: Inject real healthy KW51 autumn OMA noise + 44% correlated mode dropouts
      + dev-calibrated slow seasonal drift + mass-loaded retrofits (physics p3, train3)
    sim: 0.86478
    dev:
      dev_auc: 1.0
      dev_brier: 0.0
      dev_dk_mae: 0.255
    decision: rejected
    why: '+0.058 on the frozen set; dev gate: dev_dk_mae 0.255% > 0.093%.'
    metrics:
    - 0.969
    - 0.56
    - 0.893
    - 1.0
    - 0.0
    - 0.255
  - id: r4_mix
    change: Mixed bank (p2 + p3, 24k episodes) with linear-OLS physics anchor
    sim: 0.87321
    dev:
      dev_auc: 1.0
      dev_brier: 0.0
      dev_dk_mae: 0.134
    decision: rejected
    why: '+0.067 on the frozen set; dev gate: dev_dk_mae 0.134% > 0.093%.'
    metrics:
    - 0.97
    - 0.56
    - 0.946
    - 1.0
    - 0.0
    - 0.134
  - id: r5_no_anchor
    change: 'Anchor ablation on p3: predict dK/K directly without the OLS output anchor'
    sim: 0.87944
    dev:
      dev_auc: 1.0
      dev_brier: 0.0001
      dev_dk_mae: 0.465
    decision: rejected
    why: '+0.073 on the frozen set; dev gate: dev_dk_mae 0.465% > 0.093%.'
    metrics:
    - 0.971
    - 0.5
    - 0.934
    - 1.0
    - 0.0001
    - 0.465
  - id: r6_mix_no_anchor
    change: Mixed bank (p2 + p3, 24k episodes) without the OLS output anchor
    sim: 0.88078
    dev:
      dev_auc: 1.0
      dev_brier: 0.0
      dev_dk_mae: 0.071
    decision: released
    why: +0.074 on the frozen set; dev gate passed.
    metrics:
    - 0.976
    - 0.5
    - 0.92
    - 1.0
    - 0.0
    - 0.071
  - id: r7_ens3
    change: ensemble of r4_mix (OLS-anchored) and two r6 seed runs, r6_s2 and r6_s3
      (training/ratchet.py; the r6 seed runs themselves are not logged as rungs)
    sim: 0.87642
    dev:
      dev_auc: 1.0
      dev_brier: 0.0
      dev_dk_mae: 0.095
    decision: rejected
    why: -0.004 on val3, needs more than +0.01.
    metrics:
    - 0.973
    - 0.52
    - 0.912
    - 1.0
    - 0.0
    - 0.095
  dev_gate: KW51 dev AUC drops <= 0.02; Brier rises <= max(15%, +0.015); 10-block
    dK/K MAE rises <= max(15%, +0.05 pp)
  frozen_sets:
  - val1
  - val2
  - val3
  columns_source: Frozen set (val3) and KW51 dev (10 blocks); real exams never used
    to choose
  columns:
  - Sim AUC
  - Sim dK MAE (%)
  - Sim cold spec
  - Dev AUC
  - Dev Brier
  - Dev dK MAE (%)
