id: sundoctor
name: SunDoctor
version: "2.0"
status: released
released: 2026-10-30
order: 2
domain: Energy
tags: [solar PV, fault diagnosis, loss attribution, time series, uncertainty]
accent: "#e8a10c"
tagline: A day-by-day doctor for solar farms, trained on sunlight physics alone.
question: Why did this solar array make less power today, and how much did each cause cost?
summary: >-
  SunDoctor reads two weeks of a PV system's power (with or without an irradiance sensor) and diagnoses it
  day by day: dead strings with their failure and repair days, shading, clipping, outages, soiling, snow and
  stuck trackers, plus the kWh lost to each. It learned only from a physics simulator and was examined on two
  real utility-scale farms.

reads: 14 days of 15-minute AC power, optionally plane-of-array irradiance and temperature, plus the array's location and layout.
returns:
  - Dead-string count per day, with failure and repair days
  - Daily loss share for outage, clipping, shading, soiling, snow, stuck trackers and dead strings (± error bars)
  - kWh lost to each cause

physics:
  summary: >-
    Sun position and clear-sky irradiance, plane-of-array transposition for fixed and single-axis tracker
    mounts (with and without backtracking), row-to-row shading, module temperature, inverter clipping, and a
    library of faults injected on top.
  simulator:
    - Fixed and single-axis tracker mounts; true-tracking rows shade each other
    - Snow that falls on cold overcast days and slides off; stuck and stowed tracker rows
    - Soiling, shading, clipping, outages, dead strings, CdTe thin film
    - Sensor misalignment, dew dropouts, and 40% of fortnights with no sensor at all
    - Weather fronts (rung 8) — cold fronts on overcast days
  checks:
    - "Every block checked against pvlib 0.16 — transposition within 0.003%, tracker rotation to 3e-13°"
    - "Row shading matches pvlib shaded_fraction1d to 1e-15"
noise: Simulated weather and sensor faults (no instrument archive noise injection; this predates the real-noise recipe)
network: 2-D CNN over 14 days × 96 solar-time steps, 12 input channels, Gaussian error bars on every output (591k weights)

data:
  - name: NREL PVDAQ via OEDI (systems 2107 and 9068)
    url: https://data.openei.org/submissions/4568
    licence: CC BY 4.0
    role: exam

split:
  dev: None separate — the frozen simulated set decided every rung; Colorado was partly seen (see limits)
  exam: "PVDAQ 2107 (Arbuckle, California; 24 sibling inverters as the answer key) and PVDAQ 9068 (Kersey, Colorado; 4.7 MW, 224 trackers)"

exam:
  summary: Two real farms, graded against independent answer keys (sibling inverters, the plant's own instruments).
  results:
    - metric: String failures caught within a day (California)
      better: higher
      model: "55 / 56"
      baselines:
        - { name: "SunDoctor v1, power only", kind: classical, value: "1 / 56" }
      verdict: win
    - metric: Dead strings counted right, all inverter-days
      better: higher
      model: 95.9
      unit: "%"
      baselines: []
      verdict: info
    - metric: Inverters offline caught
      better: higher
      model: "44 / 49"
      baselines:
        - { name: "SunDoctor v1", kind: classical, value: "0 / 49" }
      verdict: win
    - metric: Snow AUC (Colorado)
      better: higher
      model: 0.98
      baselines: []
      verdict: win
    - metric: Big tracker-loss days (> 10%) flagged
      better: higher
      model: 77
      unit: "%"
      baselines:
        - { name: "SunDoctor v1", kind: classical, value: 0 }
      verdict: win
    - metric: Small tracker losses (2–5%) ranked, AUC
      better: higher
      model: 0.50
      baselines:
        - { name: "Coin flip", kind: dumb, value: 0.50 }
      verdict: tie
  coverage: []

wins:
  - Catches 55 of 56 real string failures within a day, with the irradiance sensor; 47 of 56 from power alone.
  - Snow and outage AUC 0.98 on a snowy tracker farm it never trained on.
losses:
  - Small tracker losses (2–5%) can't be ranked (AUC 0.50).
  - Power-only mode over-reports tracker losses (4.7% vs 1.1%) and dust.
limits:
  - A panel buried in snow all day looks like a tripped inverter; it sometimes calls that an outage.
  - Colorado is not fully blind for rung 8 — the fronts change was prompted by rung 6's snow misses there.
  - Two farms tested, both utility scale. Rooftops, microinverters, bifacial and satellite irradiance are untested.
next:
  - Weather context (snowfall, precipitation) to separate buried days from trips.
  - A better soiling signal from longer windows plus rain data.
  - A real rooftop dataset.
  - A money view — dollars lost per cause.

usage:
  install: pip install numpy pandas
  demo: python demo.py
  python: |
    import sundoctor
    doc = sundoctor.SunDoctor()
    r = doc.diagnose_csv("examples/pvdaq2107_inverter11_2019H2.csv", lat=38.996, lon=-122.134,
                         tilt=25, azimuth=180, dc_kw=37.2, tz="US/Pacific", n_strings=6)
    print(r["summary"]["loss_pct_of_possible"])

files:
  inference: [sundoctor.py]
  weights: [sundoctor_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 15
