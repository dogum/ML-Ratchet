# The ratchet ladder, normalised. Raw log: training/ratchet.json (written by training/src/ratchet.py from
# training/rungs.json, after every rung was re-scored on every frozen set); widening: training/results/widen.json.
model: firesize
ladders:
  - name: "FireSize v1.0 (FireSim physics v0/v1 × suppression fits, 19 Nov 2026)"
    objective: "Ranked probability skill score (RPSS over the 12 FPA-FOD size classes, against the frozen set's own importance-weighted class climatology) of the network's distribution against each simulated ignition's soft label (its reported-size distribution over 24 suppression draws), on the frozen simulated validation ignitions (304 frozen windows). One frozen set per physics × suppression version: v0|lit, v0|v0acc (743 ignitions each), v1|v1acc, v1|v1reg, v1|v1rep, v1|v1rep2 (1,175 each). Decisions use the latest, v1|v1rep2."
    rule: "Keep if the sim RPSS on the latest frozen set beats the incumbent's on that same set by more than 0.01 AND the dev-gate escape AUC is at least the incumbent's − 0.01 AND the dev-gate size MAE (log10) is at most 1.05 × the incumbent's. Every rung was re-scored on every frozen set and the decisions re-taken in order on v1|v1rep2."
    margin: 0.01
    dev_gate: "The gate half of the 8,913 dev ignitions (4,429, seeded hash of the FOD_ID; never used for calibration): escape AUC no more than 0.01 below the incumbent's, size MAE no more than 5 % above"
    frozen_sets: ["v0|lit", "v0|v0acc", "v1|v1acc", "v1|v1reg", "v1|v1rep", "v1|v1rep2"]
    scored_on: "v1|v1rep2"
    note: >-
      Each rung is a 3-member ensemble (retrain.sh, final_rungs.sh). r0-r5 were trained on the first 4,800 ignitions
      of their bank, r6 and r7 on the full v1 bank, which had stopped at 85 chunks (8,500 ignitions) when the sandbox
      session was interrupted and was not resumed. The suppression fits (training/results/calibration/calib_*.json)
      use the other dev half (calib, 911 twins: dev ignitions simulated 4 times each in their own real landscape and
      weather), so the gate half is out of sample for every fit; the widen-only temperature was also fitted on the
      calib half. Sim scores on a rung's own frozen set are not comparable across sets: r0 scores 0.220 on v0|lit and
      −0.256 on v1|v1rep2. Rule notes: r7 passed the gate AUC test by 0.0004 (0.7561 against a threshold of 0.7557);
      no interval was computed for any rung difference. In the final suppression fit (calib_v1rep2) 10 of 31 bounded
      parameters sit within 0.5 % of a bound: response time 0.1 h (mu_resp), the federal response offset −1.5, the
      response spread 1.5, the line-rate multiplier 30×, its spread 1.2, the ROS spread 0.3 (exactly on the bound;
      its raw value is −Infinity in the JSON), the natural-cause response offset −1.0, the SW reporting floor 0, the
      federal line-rate term e^−3 and the confine-only share 0.5. Nothing was re-run on import.
    columns_source: "training/ratchet.json: the rung's own frozen version and its sim RPSS there, the sim RPSS and escape AUC on v1|v1rep2, then the dev gate half (4,429 ignitions): escape AUC, AP, Brier, size MAE (log10, median of the T = 1 distribution), Spearman ρ and mean P(escape) (real rate 0.029). The widen row's gate scores are from results/widen.json."
    columns: ["Own frozen set", "Sim RPSS own set", "Sim RPSS v1|v1rep2", "Sim escape AUC v1|v1rep2", "Gate escape AUC", "Gate AP", "Gate Brier", "Gate size MAE log10", "Gate size ρ", "Gate mean P(escape)"]
    rungs:
      - { id: r0, change: "Baseline: FireSim as shipped (physics v0: LANDFIRE agriculture 93 and urban never burn), literature suppression race (IA arrival about 1 h after discovery, handbook line rates by fuel group, escalation doubling in 4 h); 4,800 simulated ignitions; an ensemble of 3 MLPs (71 → 128 → 128 → 12) without the Rothermel inputs", sim: -0.256, decision: kept, why: "First rung. On its own frozen set (v0|lit) sim RPSS 0.220; re-scored on v1|v1rep2 −0.256. Dev gate escape AUC 0.697, mean P(escape) 0.066 against a real 0.029. Log: base.", metrics: ["v0|lit", 0.22, -0.256, 0.836, 0.697, 0.076, 0.0377, 0.725, 0.234, 0.066] }
      - { id: r1, change: "Suppression and reporting parameters fitted on 911 dev twins (v0 physics): response time, line rate, escalation, perimeter share, ROS centre, access and slope terms (calib_v0acc)", sim: -0.292, decision: rejected, why: "Sim RPSS −0.292 vs r0 −0.256 on v1|v1rep2 (needs > −0.246); gate AUC 0.675 vs 0.697 (needs ≥ 0.687): both failed. Gate MAE improved 0.725 → 0.694. Log: sim RPSS -0.036 vs r0; gate AUC fails; below margin.", metrics: ["v0|v0acc", 0.199, -0.292, 0.834, 0.675, 0.071, 0.0283, 0.694, 0.26, 0.026] }
      - { id: r2, change: "Physics v1: agriculture (93) burns as GR1, and an ignition on a non-burnable cell moves to the nearest burnable cell within 180 m; suppression recalibrated on the twins (calib_v1acc)", sim: -0.124, decision: kept, why: "Sim RPSS −0.124 vs r0 −0.256 (+0.131); gate AUC 0.757 vs 0.697; gate MAE 0.744 vs 0.725 (+2.6 %, inside 5 %). Twin NLL v1 3.356 vs v0 3.378. The biggest single physical fix: ignitions on non-burnable cells never grew. Log: sim RPSS +0.131 vs r0.", metrics: ["v1|v1acc", 0.267, -0.124, 0.843, 0.757, 0.081, 0.0281, 0.744, 0.139, 0.031] }
      - { id: r3, change: "Regional initial-attack response offsets plus per-fuel-group ROS centres, fitted on the dev twins (calib_v1reg)", sim: 0.038, decision: rejected, why: "Sim RPSS +0.163 vs r2, but gate AUC 0.655 vs 0.757 failed. Twin NLL fell to 2.86: the regional offsets fit dev sizes but soak up variance the landscape and weather should explain. Log: sim RPSS +0.163 vs r2; gate AUC fails.", metrics: ["v1|v1reg", 0.294, 0.038, 0.846, 0.655, 0.052, 0.0281, 0.651, 0.262, 0.02] }
      - { id: r3b, change: "Regional reporting floors (share of fires booked at ≥ 1 acre) instead of regional response offsets, and an escape term in the dev fit (calib_v1rep)", sim: 0.213, decision: rejected, why: "Sim RPSS +0.337 vs r2, but gate AUC 0.634 vs 0.757 failed. Log: sim RPSS +0.337 vs r2; gate AUC fails.", metrics: ["v1|v1rep", 0.308, 0.213, 0.84, 0.634, 0.047, 0.0284, 0.633, 0.279, 0.022] }
      - { id: r4, change: "r2 + physics inputs: log1p Rothermel head ROS of the LANDFIRE fuels around the point under the afternoon weather (point, 5 × 5, 13 × 13, and the point the day before)", sim: -0.139, decision: rejected, why: "Sim RPSS −0.139 vs r2 −0.124 (−0.015): below the margin. Gate AUC 0.760 and AP 0.087 were the best so far. Log: sim RPSS -0.015 vs r2; below margin.", metrics: ["v1|v1acc", 0.266, -0.139, 0.848, 0.76, 0.087, 0.0284, 0.73, 0.153, 0.033] }
      - { id: r5, change: "Two-mode initial attack (a share of fires only confined or monitored, at 2 % of the line rate), a federal line-rate term and reporting floors, recalibrated (calib_v1rep2)", sim: 0.265, decision: kept, why: "Sim RPSS +0.389 vs r2 (0.265 vs −0.124); gate AUC 0.766 vs 0.757; gate MAE 0.618 vs 0.744. Twin NLL 2.64 (literature values 3.60). Log: sim RPSS +0.389 vs r2.", metrics: ["v1|v1rep2", 0.265, 0.265, 0.872, 0.766, 0.085, 0.0273, 0.618, 0.298, 0.024] }
      - { id: r6, change: "r5 trained on the full v1 bank (8,500 simulated ignitions instead of 4,800)", sim: 0.278, decision: rejected, why: "Sim RPSS +0.014 vs r5 passed; gate AUC 0.746 vs 0.766 (needs ≥ 0.756) failed. Log: sim RPSS +0.014 vs r5; gate AUC fails.", metrics: ["v1|v1rep2", 0.278, 0.278, 0.864, 0.746, 0.079, 0.0275, 0.626, 0.299, 0.024] }
      - { id: r7, change: "r6 + the Rothermel ROS inputs (75 features)", sim: 0.28, decision: released, why: "Sim RPSS +0.015 vs r5 (0.280 vs 0.265); gate AUC 0.756 vs 0.766 (−0.0096, inside the 0.01 tolerance); gate MAE 0.627 vs 0.618 (+1.4 %). Kept; with the widen-only temperature below it is v1.0. Log: sim RPSS +0.015 vs r5.", metrics: ["v1|v1rep2", 0.28, 0.28, 0.874, 0.756, 0.082, 0.0274, 0.627, 0.308, 0.025] }
      - { id: widen, change: "Widen-only temperature on r7’s logits, fitted on the dev calib half by size-class log-likelihood (widen.py, results/widen.json); probabilities and the 80 % range use it, the point median uses T = 1 (decided on dev before the exam)", decision: kept, why: "T = 1.459. Calib half: size-class NLL 1.881 → 1.827, 80 % coverage 0.830 → 0.900; gate half 1.876 → 1.822, coverage 0.835 → 0.899. The cost was visible on dev before the exam: gate Brier 0.0274 → 0.0285 and gate mean P(escape) 0.025 → 0.054 against a real 0.029. Gate MAE here uses the widened median (0.648); the release's point estimate is the T = 1 median (0.627).", metrics: ["–", "–", "–", "–", 0.759, 0.083, 0.0285, 0.648, 0.291, 0.054] }
