      kind: dumb
      value: 23.053
    - name: Published O'Brien–McPherron
      kind: classical
      value: 18.368
    - name: Dev-tuned O'Brien–McPherron
      kind: classical
      value: 17.899
    - name: Dev-tuned two-state
      kind: classical
      value: 18.152
    verdict: tie
    note: 57 issue hours in 5 whole blocks. Model minus best baseline -0.136, paired 95% interval [-2.077, +2.045].
  - metric: Extreme (≤ −150 nT) · MAE
