id: stormnet
name: StormNet
version: 1.0.1
status: released
released: 2026-11-17
order: 22
domain: Space weather
tags:
- geomagnetism
- solar wind
- state-space model
- storm forecast
- uncertainty
accent: '#39a88b'
tagline: Three hours ahead, from the solar wind to the ring current.
question: How low will the geomagnetic Dst index fall in the next three hours?
question_short: How low will Dst fall in the next three hours?
summary: StormNet reads 36 completed hours of solar wind and the last hourly Dst and forecasts the lowest Dst of
  the next three hours. On 76,507 real forecasts across solar minimum and maximum, including the May 2024 superstorm,
  it beats persistence by a wide margin (storm-strength targets 10.7 against 14.2 nT at solar maximum) but only
  ties ring-current physics tuned on the same dev storms (10.7 against 10.6 nT), and loses on the most extreme hours
  and on quiet false alarms. Its 68% bars, now widened by how deep the storm already is, cover 60% of storm-strength
  targets.
reads: 36 hourly values of GSM Bz (nT), bulk speed (km/s) and dynamic pressure (nPa), plus the last completed hourly
  Dst (nT).
returns:
- Lowest hourly Dst in the following three complete hours (nT) and its nominal 68% half-width (nT)
physics:
  summary: Pressure-corrected current injection from southward solar wind with fast and slow exponential recovery.
  simulator:
  - O’Brien–McPherron convection threshold and electric-field-dependent decay time
  - Two effective current reservoirs, variable injection and lifetimes, pressure response and correlated unresolved
    disturbances
  - Real historical OMNI wind trajectories with instrument gaps and a 48-hour synthetic warm-up
  checks:
  - '96-hour drive, shutoff and pressure jump versus independent DOP853 integration: maximum absolute error 8.53e-13
    nT (training/physics_check.json)'
  - Closed-form 32-hour step within 8.53e-14 nT. Quiet 2 to 8 nPa pressure step adds 10.267 nT.
  - 744 final hourly Kyoto Dst values in March 2011 match NASA OMNI word 41 exactly (training/index_check.json)
noise: Actual unlabelled training-era wind supplies joint Bz, speed, pressure and measurement gaps. Synthetic autoregressive
  disturbance and parameter variation supply index scatter. Real Dst is used for dev calibration, gates and evaluation,
  and as the last observed scalar at inference.
network: Two recurrent physical states plus a simulation-trained nonlinear residual and log-error scale. 15 causal
  features, 48 fixed random tanh units, 128 fitted output coefficients, 926 stored scalars including normalization.
  Standalone NumPy inference.
approach:
  real_backdrop: NASA OMNI2 hourly solar-wind driving trajectories, 1998–2004 (2005 reserved for frozen simulated
    validation)
  physics_inputs: Southward motional electric field, square-root pressure, rolling wind means and fast/slow current
    estimates
  physics_anchor: Dev-tuned two-state forecast conditioned on the last completed Dst
  real_data_roles:
  - backdrop
  - calibration
  - gate
  - error_bars
  - exam
data:
- name: NASA SPDF OMNIWeb hourly solar-wind magnetic field and plasma
  url: https://omniweb.gsfc.nasa.gov/html/ow_data.html
  licence: NASA SPDF public scientific data. Credit OMNIWeb, the contributing teams and King & Papitashvili (2005).
  role: Training and frozen wind, dev and primary forecast inputs
- name: World Data Center for Geomagnetism, Kyoto and contributing observatories, hourly Dst
  url: https://doi.org/10.17593/14515-74000
  licence: Scientific use with acknowledgement and DOI. Kyoto prohibits commercial application of the indices.
  role: Dev simulator tuning, dev gates, uncertainty and primary exam. Historical index at inference.
split:
  dev: 34 whole storm or quiet blocks, 2,408 issues in 2008, 2011 and 2014. Frozen seed 1729, each year gated separately.
  exam: 2016–2020, all 43,439 eligible issue hours in 629 blocks. The later 2022–2025 reserve is sealed.
