wins:
- 'Beats persistence on every storm row of both exams: at solar maximum 10.69 against 14.20 nT on storm-strength
  targets and 23.65 against 30.21 nT on intense ones.'
- Beats published O'Brien–McPherron physics on every storm row of exam 2 (storm-strength 10.69 against 11.68 nT,
  intense 23.65 against 26.75 nT).
losses:
- Ties dev-tuned ring-current physics everywhere it can be measured; the network adds nothing over its own physics
  anchor on real storms. Two v1.1 physics candidates and a larger readout reading the window's observed Dst (r5)
  were tried on dev and rejected.
- Loses on the extreme (≤ −150 nT) hours of exam 2 (36.16 against 34.99 nT, 8 storm blocks, interval [+0.07, +2.16])
  and on quiet false alarms in both exams (0.62% against 0.38% at solar maximum).
limits:
- '68% bars still under-cover storm hours: 59.9% of storm-strength, 52.9% of intense and 50.9% of extreme targets
  in exam 2 with v1.0.1 (v1.0: 51.5, 41.9 and 41.7%).'
- Retrospective Earth-arrival-aligned wind and the last completed historical Dst. Real telemetry latency and index
  revisions matter in operational use; 2022–2025 Dst in OMNI is Kyoto's provisional or quicklook index.
- The two-state fit reaches the lower pressure-coefficient bound. Simulated dev minima are typically 8–14 nT deeper
  than their real twins. Re-running the physics with the actual next three hours of wind barely helps (dev 4.36
  → 4.21 nT), so the remaining error is the physics and the index's hourly noise, not the unknown wind.
- "Freshness (audit, 25 Nov 2026): a one-hour-stale Dst raised gallery MAE from 8.97 to 11.21 nT (extremes 39.12 to 46.85 nT). The calibration file's bin labels now match the code: Dst < -50, -50 to < -30, >= -30 nT."
next:
- 'Teach the simulator something the anchor lacks, so the network has real structure to learn: a substorm or By-dependent
  injection term, or a ring-current asymmetry term fitted on SYM-H, each shown failing on dev first.'
- 'Extreme-storm bars: widen by the observed rate of fall as well as the level, validated on whole dev storms.'
- Check forecasts on archived as-received L1 telemetry and quicklook Dst with explicit ingestion timestamps.
