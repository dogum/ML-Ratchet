id: hybridpilot
name: HybridPilot
version: "2.2"
status: released
released: 2026-11-15
order: 12
domain: Transportation
platform: vehicle
tags: [hybrid vehicles, energy management, control, imitation learning, dynamic programming, plug-in hybrids]
accent: "#3949ab"
tagline: A learned hybrid controller, raced against the dynamic-programming optimum.
question: Second by second, should a hybrid run its engine, and how hard — to use the least fuel the physics allows?
question_short: "How should a hybrid run its engine, second by second? *(graded in simulation)*"
summary: >-
  HybridPilot is a learned, causal energy-management policy for hybrids: every second it decides engine on/off and
  engine power, holding charge in hybrids and depleting-then-sustaining in plug-ins. It learned by imitating the
  dynamic-programming (DP) optimum inside the RoadSim simulator. Version 2.1 runs on RoadSim physics v3.1 (chosen on
  dev: closer engine starts and fuel on the dev twins), with a dead band on its SOC feedback and a fixed equivalence
  factor for buses and mild hybrids. Version 2.2 adds a charge-sustaining rule for plug-ins at their CS level and a
  weak SOC feedback for buses. It was examined on 432 trips — real VED routes driven by calibrated twins of the
  exam cars, bus legs and cycles — against rule-based control, ECMS, adaptive ECMS and MPC.
disclaimer: >-
  Graded inside the simulator. With HybridPilot driving the calibrated twins, simulated hybrid fuel is within 3.5 % of
  VED's logged fuel (exam trip median), but plug-ins read 20–31 % low, and the strategies differ by only 0.5–1.5 %, so
  the ranking holds only inside RoadSim's physics.

reads: The vehicle's parameters and, each second, the state (SOC, coolant temperature, timers, power limits), current demand (speed, acceleration, grade, wheel power), trip history and optionally a navigation preview.
returns:
  - Engine on/off and engine power (series, power-split) or torque share (P2) every second
  - "The resulting fuel, battery use and engine starts over the trip, compared against DP and the classical strategies"

physics:
  summary: >-
    The shared RoadSim simulator (shared/vehicle), physics v3.1 pinned (roadsim-physics-v3.1; v2.0 used v2): EPA ALPHA
    engine and motor maps, Thevenin battery, eCVT / P2 (with torque converter and start energy) / series (with direct
    drive) powertrains, two-node cabin HVAC, tyre model, production hybrid rules (8 s / 3 s minimum on/off, Toyota-type
    engine-on speed, warm-up holds, 2 s engine run-on into braking, plug-in charge-depleting rules), the v3 generator
    hybrid hardware, an energy ledger checked on every run. Teacher: DP over engine on/off
    × 121 SOC points; reference: DP with the same 8 s / 3 s on/off timers.
  simulator:
    - "400 generated hybrids in 18 class × architecture combinations (v2 donor model: hybrid bodies from real hybrid records), cars to series buses and Class-8 P2 trucks; the network was trained on physics-v2 banks (a re-teach on v3.1 banks did not pass the ratchet)"
    - VED cars as RoadSim's calibrated twins (road load and engine level matched to each car's fueleconomy.gov city / highway values; CR-Z-type cars as mild P1 hybrids)
    - Routes from 835 real VED trips (real speed, lidar grade, airport weather), the full ZTBus set (by-month split), EPA/HD cycles and synthetic drives
    - DP teacher labels (engine on/off and the costate s*) plus a DAgger round on the learned policy's own trips
  checks:
    - "Numpy inference module == training policy: identical fuel and final SOC on 44 frozen and dev trips incl. 22 plug-in and 8 bus trips (v2.2 rule); numpy == torch to 5e-6"
    - "Physics v2 → v3.1 decided on dev: HybridPilot v2.0 driving the dev twins, power-split fuel −4.6 → −2.4 % of the logs, engine-on gap −9.3 → −4.4 points, starts 3.67 → 2.66 per km (real 2.32)"
    - "Simulator vs logged fuel with HybridPilot v2.2 driving the calibrated twins (OBD label model, exam trip median): power-split HEV +2.2 %, mild +2.3 %, P2 +3.4 % (5 trips); plug-in power-split −20 %, plug-in series −31 %"
    - "Grading re-solves DP to each strategy's own final SOC (matched SOC); ledger closes to < 0.5 % on every run"
noise: Real routes, grades and weather; random start SOC, temperatures from −20 to 36 °C, warm and cold starts
network: MLP 66 → 96 → 96 → 2 (15,938 parameters) predicting the equivalence factor s (buses and mild hybrids use a fixed s of 2.6–2.8 instead; plug-ins at their CS level use at least the HEV costate, 2.42 power-split / 2.70 series); the decision minimises fuel + s × battery power among RoadSim's candidate controls, with A-ECMS-style SOC feedback (Kp 12 beyond a ±0.03 dead band, Ki 0.02; plug-ins below CS Kp 24 without the band; buses Kp 3, no integral)

approach:
  real_backdrop: "Real VED and ZTBus routes, grades and weather"
  physics_inputs: "Wheel power demand from RoadSim's road-load model"
  physics_anchor: "Its output, the equivalence factor s, sets an ECMS cost over candidate controls scored by the powertrain model"
  real_data_roles: [backdrop, calibration, gate, exam]

data:
  - name: Vehicle Energy Dataset (VED) — Oh, LeBlanc, Peng, IEEE T-ITS 2020
    url: https://github.com/gsoh/VED
    licence: Apache-2.0
    role: noise (routes), dev, exam (routes)
  - name: ZTBus — Widmer, Ritter, Onder, Scientific Data 10 (2023), ETH Zurich
    url: https://doi.org/10.3929/ethz-b-000626723
    licence: CC BY 4.0
    role: dev, exam (bus routes)
  - name: US EPA drive cycles and test-car lists; fueleconomy.gov; 40 CFR 1037 heavy-duty cycles; USGS 3DEP lidar; IEM ASOS weather
    url: https://www.epa.gov/vehicle-and-fuel-emissions-testing/dynamometer-drive-schedules
    licence: Public domain / free use with credit
    role: physics, exam (cycles)

split:
  dev: 76 trips — routes of the VED dev cars (calibrated twins of the 7 dev hybrids + 18 dev generated vehicles) and full-ZTBus dev legs (by-month split)
  exam: 432 trips — 216 real VED exam routes driven by calibrated twins of the 108 exam hybrids, 216 by 54 held-out generated hybrids, full-ZTBus exam legs and HD cycles

exam:
  short: "432 real routes, simulated twins"
  summary: 432 exam trips (430 trip ids, since two routes were drawn twice for the same generated vehicle), graded as % of the DP optimum (DP with the same 8 s / 3 s on/off timers) at matched final charge, on RoadSim physics v3.1. Real routes, simulated cars. Every baseline, v2.1 and v2.0 were re-scored on the same physics. v2.2 was run once, after its release choice was committed (48e9985). Earlier versions' numbers are in the notes.
  results:
    - metric: All 432 trips, % of DP optimum
      better: higher
      model: 98.69
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.20 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.31 }
        - { name: "MPC, 15 s of the future", kind: classical, value: 98.67 }
        - { name: "Rule-based", kind: classical, value: 97.00 }
      verdict: tie
      note: "Beats every causal baseline: +0.49 points over A-ECMS, 95% CI [−0.07, +0.98] (bootstrap by vehicle); +0.38 [+0.13, +0.64] over constant-s ECMS, which holds charge on only 75% of trips. Level with MPC, which sees 15 s of the future: 98.686 vs 98.665, +0.02 [−0.58, +0.54], so a tie, not a win. Holds charge on 93% of trips (A-ECMS 97%). Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 98.66 on 430, verdict mixed with MPC 0.01 higher). v2.1: 98.58 (published 98.57); v2.0 on physics v2 98.86 (published 98.84), a win; v2.0 re-scored on v3.1: 98.45."
    - metric: Power-split hybrids (148 trips), % of DP
      better: higher
      model: 97.64
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.05 }
        - { name: "ECMS (constant s)", kind: classical, value: 97.44 }
        - { name: "Rule-based", kind: classical, value: 97.44 }
      verdict: win
      note: "+0.59 points [+0.42, +0.78] over A-ECMS, +0.20 [−0.02, +0.42] over constant-s ECMS. Holds charge on 93% (A-ECMS 97%, rule 93%, ECMS 72%). Same as v2.1 (v2.2 changes only plug-ins and buses). v2.0: 98.41 on physics v2."
    - metric: P2 and series hybrids (64 trips), % of DP
      better: higher
      model: 99.64
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.44 }
        - { name: "ECMS (constant s)", kind: classical, value: 99.29 }
        - { name: "Rule-based", kind: classical, value: 95.35 }
      verdict: win
      note: "P2 +1.39 [+0.31, +3.29], series +0.88 [+0.57, +1.18] over A-ECMS. Holds charge on 94% (A-ECMS 92%; constant-s ECMS 59%). Same as v2.1. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 99.63 on 63 trips, A-ECMS 98.42). v2.0: 99.85 on physics v2 (published 99.84)."
    - metric: Mild P1 hybrids, CR-Z-type twins (56 trips), % of DP
      better: higher
      model: 98.36
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.28 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.57 }
        - { name: "Rule-based", kind: classical, value: 93.45 }
      verdict: mixed
      note: "+1.08 [+0.79, +1.51] over A-ECMS, but holds charge on only 79% of trips (A-ECMS 96%; v2.0 re-scored on v3.1: 91%). Constant-s ECMS scores 0.21 higher (CI of the difference [−0.53, +0.10]) and holds charge on 34%. Unchanged from v2.1: a mild rule without the dead band was rejected on dev (R20). v2.0: 98.10 on physics v2 (holds 95%)."
    - metric: Plug-in hybrids (104 trips), % of DP
      better: higher
      model: 99.29
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 100.13 }
        - { name: "Charge-depleting then sustaining", kind: classical, value: 99.35 }
      verdict: loss
      note: "Power-split plug-ins −0.91 [−4.51, +2.16], series plug-ins −0.73 [−1.78, −0.07] against A-ECMS; the charge-depleting rule 99.35. The v2.2 CS rule raised plug-in charge holding from 98 to 102 of 104 trips, not their fuel score. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 99.22 on 103 trips, A-ECMS 100.17). v2.1: 99.26 (published 99.25); v2.0: 99.33 on physics v2 (published 99.27; A-ECMS 99.56, published 99.59)."
    - metric: Hybrid buses (24 trips), % of DP
      better: higher
      model: 99.51
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.01 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.89 }
        - { name: "Rule-based", kind: classical, value: 96.07 }
      verdict: win
      note: "Against constant-s ECMS: series buses 99.36 vs 98.30 (+1.06 [+0.86, +1.23]), P2 buses 99.66 vs 99.48 (+0.18 [−0.02, +0.42]). Against A-ECMS: series +3.87 [+2.00, +7.04], P2 +1.13 [+0.62, +1.47]. The cost: series buses hold charge on 9 of 12 trips (v2.1 12, ECMS 11); P2 buses 12 of 12. v2.1: 97.66, a loss to ECMS; v2.0: 97.50 on physics v2."
    - metric: Charge held within its window (all trips)
      better: higher
      model: 93
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97 }
      verdict: loss
      note: "401 of 432 trips (A-ECMS 420). v2.1: 400 (93%): v2.2 gains 4 plug-in trips and loses 3 series-bus trips; mild hybrids still 79%. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 399 of 430; A-ECMS 418). v2.0 on physics v2: 95% (A-ECMS 96%); v2.0 re-scored on v3.1: 96%."
    - metric: Engine starts per km (all trips)
      better: lower
      model: 3.0
      unit: "/km"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 3.2 }
      verdict: win
      note: "v2.1: 3.0. v2.0: 4.0 vs 4.5 on physics v2 (v3.1's 2 s run-on into braking lowers starts for every strategy)."
    - metric: Against v2.1 re-scored on the same exam, % of DP
      better: higher
      model: 98.69
      unit: "%"
      baselines:
        - { name: "HybridPilot v2.1", kind: published, value: 98.58 }
      verdict: win
      note: "+0.11 points [+0.01, +0.24] (series buses +2.88, P2 buses +0.83, plug-ins about +0.04; every other trip identical). Charge held on 401 vs 400 trips. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 98.66 vs 98.55; the gap between v2.1's published 98.57 and that re-score came from the same bug, not from RoadSim)."
    - metric: Against v2.0 re-scored on the same exam (v2.0 network and settings on physics v3.1), % of DP
      better: higher
      model: 98.69
      unit: "%"
      baselines:
        - { name: "HybridPilot v2.0", kind: published, value: 98.45 }
      verdict: mixed
      note: "+0.23 points [+0.09, +0.41] (mild +0.44, buses +1.6 to +3.2), but holds charge on 93% of trips against v2.0's 96%. v2.1: +0.14. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 98.66 vs 98.43)."
    - metric: Against the v1 release re-scored on the same exam (v1 network and settings on physics v3.1), % of DP
      better: higher
      model: 98.69
      unit: "%"
      baselines:
        - { name: "HybridPilot v1", kind: published, value: 98.56 }
      verdict: tie
      note: "+0.12 points [−0.02, +0.31]; v1 holds charge on 91% of trips (v2.2 93%). v2.1: +0.03. v2.0 on physics v2: 98.86 vs 99.02 (published 98.84 vs 99.00), a loss. Corrected 15 Nov 2026: two duplicate trip ids were graded against each other's baselines; now all 432 trips are scored (was 98.66 vs 98.54)."
    - metric: Simulated vs logged fuel, calibrated twins driven by HybridPilot (exam, trip median)
      better: closer
      model: "+2.2% HEV, −20% / −31% plug-ins"
      baselines: []
      verdict: info
      note: "v2.2, the same as v2.1 on these cars: power-split HEVs +2.2% (168 trips, 56 cars), mild +2.3%, P2 +3.4% (5 trips); plug-in power-split −20.1%, plug-in series −30.9% (fuel + battery energy). Engine starts on power-splits 2.42 per km vs 1.94 real (v2.0 on physics v2: 3.65). Under the 8% target for hybrids, not for plug-ins."
  coverage: []

wins:
  - "Beats every causal baseline on all 432 exam trips: 98.69% of the DP optimum against 98.20% for adaptive ECMS (+0.49 points, CI [−0.07, +0.98]), 98.31% for constant-s ECMS and 97.00% for rule-based control, and level with MPC, which sees 15 s of the future (98.67%)."
  - "Buses (v2.2): 99.51% of DP against 98.89% for constant-s ECMS and 97.01% for A-ECMS; series buses +1.06 points over ECMS."
  - "Clear gains against A-ECMS on power-split hybrids (+0.59 points), P2 (+1.42), series hybrids (+0.88), mild hybrids (+1.08), series buses (+3.87) and P2 buses (+1.13)."
  - "Fewer engine starts than A-ECMS (3.0 vs 3.2 per km)."
  - "With HybridPilot driving them, the calibrated twins' fuel is within 3.5% of logged fuel for exam hybrids (trip median), and their engine starts are much closer to the real cars' than on physics v2 (2.4 vs 1.9 per km real; was 3.7)."
losses:
  - "No clear margin over MPC, which sees 15 s of the future: 98.69% vs 98.67% overall, +0.02 [−0.58, +0.54]."
  - "Plug-ins: −0.91 points (power-split) and −0.73 (series) against A-ECMS."
  - "Holds charge on 93% of trips against A-ECMS's 97% (v2.0 on the same exam: 96%); mild hybrids only 79%, series buses 75% (v2.2's weak bus feedback)."
  - "Mild hybrids: constant-s ECMS scores 98.57% against 98.36%, though it holds charge on only 34% of those trips."
limits:
  - "Graded in simulation; plug-ins on real roads read 20–31% low in RoadSim, and simulated power-split hybrids still start their engine more often than the real cars (2.4 vs 1.9 starts per km)."
  - "For buses and mild hybrids the network's s is not used: a fixed s (series bus 2.8, P2 bus 2.6, mild 2.8, fitted on 30 training-distribution simulations) with SOC feedback, which makes it an adaptive ECMS there (for buses a weak one, Kp 3)."
  - "RoadSim never runs the engine of a P2 or P1 hybrid at a stop, so on long stops the auxiliaries drain a mild hybrid's 0.6 kWh pack below its window whatever the controller does (a dev mild trip falls from 0.64 to 0.11–0.16)."
  - "The policy outputs no uncertainty; intervals are cluster-bootstrap intervals of paired differences."
  - "DP ignores RoadSim's forced-on production rules (Toyota-type engine-on above 45 km/h, warm-up holds), so causal strategies cannot reach 100% on those cars."
  - "Preview, a timed-DP teacher, a start penalty, a distance-to-go plug-in plan, a larger network, a re-teach on physics v3.1, a mild rule without the dead band and a stronger HEV feedback did not pass the ratchet."
next:
  - "Mild charge holding: a frozen mild stratum (the frozen set has none, so no mild rung can pass) and RoadSim engine-at-stop charging for P1/P2 hybrids; then a mild rule judged on it."
  - "Charge holding on HEVs: Kp 18 reaches A-ECMS's frozen holding (96%) but costs 0.022 of frozen skill; a terminal term using the known trip length (nav) is untried."
  - "A plug-in teacher conditioned on the trip-length uncertainty (nav known or not), and a dedicated plug-in frozen stratum."

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    from pipeline import compare, load_example     # needs RoadSim: found in shared/vehicle automatically
    spec, trip = load_example("VED_428_465")
    for r in compare(spec, trip, init_soc=None, warm=True):
        print(r["strategy"], r["fuel_g"], r["batt_kWh_out"])

files:
  inference: [hybridpilot.py, pipeline.py]
  weights: [weights/hybridpilot_v2.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 5
