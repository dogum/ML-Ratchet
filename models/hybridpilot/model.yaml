id: hybridpilot
name: HybridPilot
version: "2.1"
status: released
released: 2026-11-15
order: 12
domain: Transportation
platform: vehicle
tags: [hybrid vehicles, energy management, control, imitation learning, dynamic programming, plug-in hybrids]
accent: "#3949ab"
tagline: A learned hybrid controller, raced against the dynamic-programming optimum.
question: Second by second, should a hybrid run its engine, and how hard — to use the least fuel the physics allows?
question_short: "How should a hybrid run its engine, second by second? *(graded in simulation)*"
summary: >-
  HybridPilot is a learned, causal energy-management policy for hybrids: every second it decides engine on/off and
  engine power, holding charge in hybrids and depleting-then-sustaining in plug-ins. It learned by imitating the
  dynamic-programming (DP) optimum inside the RoadSim simulator. Version 2.1 runs on RoadSim physics v3.1 (chosen on
  dev: closer engine starts and fuel on the dev twins), with a dead band on its SOC feedback and a fixed equivalence
  factor for buses and mild hybrids. It was examined on 430 trips — real VED routes driven by calibrated twins of the
  exam cars, bus legs and cycles — against rule-based control, ECMS, adaptive ECMS and MPC.
disclaimer: >-
  Graded inside the simulator. With HybridPilot driving the calibrated twins, simulated hybrid fuel is within 3.5 % of
  VED's logged fuel (exam trip median), but plug-ins read 20–31 % low, and the strategies differ by only 0.5–1.5 %, so
  the ranking holds only inside RoadSim's physics.

reads: The vehicle's parameters and, each second, the state (SOC, coolant temperature, timers, power limits), current demand (speed, acceleration, grade, wheel power), trip history and optionally a navigation preview.
returns:
  - Engine on/off and engine power (series, power-split) or torque share (P2) every second
  - "The resulting fuel, battery use and engine starts over the trip, compared against DP and the classical strategies"

physics:
  summary: >-
    The shared RoadSim simulator (shared/vehicle), physics v3.1 pinned (roadsim-physics-v3.1; v2.0 used v2): EPA ALPHA
    engine and motor maps, Thevenin battery, eCVT / P2 (with torque converter and start energy) / series (with direct
    drive) powertrains, two-node cabin HVAC, tyre model, production hybrid rules (8 s / 3 s minimum on/off, Toyota-type
    engine-on speed, warm-up holds, 2 s engine run-on into braking, plug-in charge-depleting rules), the v3 generator
    hybrid hardware, an energy ledger checked on every run. Teacher: DP over engine on/off
    × 121 SOC points; reference: DP with the same 8 s / 3 s on/off timers.
  simulator:
    - "400 generated hybrids in 18 class × architecture combinations (v2 donor model: hybrid bodies from real hybrid records), cars to series buses and Class-8 P2 trucks; the network was trained on physics-v2 banks (a re-teach on v3.1 banks did not pass the ratchet)"
    - VED cars as RoadSim's calibrated twins (road load and engine level matched to each car's fueleconomy.gov city / highway values; CR-Z-type cars as mild P1 hybrids)
    - Routes from 835 real VED trips (real speed, lidar grade, airport weather), the full ZTBus set (by-month split), EPA/HD cycles and synthetic drives
    - DP teacher labels (engine on/off and the costate s*) plus a DAgger round on the learned policy's own trips
  checks:
    - "Numpy inference module == training policy: identical fuel and final SOC on 24 frozen and dev trips (v2.1 rule); numpy == torch to 5e-6"
    - "Physics v2 → v3.1 decided on dev: HybridPilot v2.0 driving the dev twins, power-split fuel −4.6 → −2.4 % of the logs, engine-on gap −9.3 → −4.4 points, starts 3.67 → 2.66 per km (real 2.32)"
    - "Simulator vs logged fuel with HybridPilot v2.1 driving the calibrated twins (OBD label model, exam trip median): power-split HEV +2.2 %, mild +2.3 %, P2 +3.4 % (5 trips); plug-in power-split −20 %, plug-in series −31 %"
    - "Grading re-solves DP to each strategy's own final SOC (matched SOC); ledger closes to < 0.5 % on every run"
noise: Real routes, grades and weather; random start SOC, temperatures from −20 to 36 °C, warm and cold starts
network: MLP 66 → 96 → 96 → 2 (15,938 parameters) predicting the equivalence factor s (buses and mild hybrids use a fixed s of 2.6–2.8 instead); the decision minimises fuel + s × battery power among RoadSim's candidate controls, with A-ECMS-style SOC feedback (Kp 12 beyond a ±0.03 dead band, Ki 0.02)

approach:
  real_backdrop: "Real VED and ZTBus routes, grades and weather"
  physics_inputs: "Wheel power demand from RoadSim's road-load model"
  physics_anchor: "Its output, the equivalence factor s, sets an ECMS cost over candidate controls scored by the powertrain model"
  real_data_roles: [backdrop, calibration, gate, exam]

data:
  - name: Vehicle Energy Dataset (VED) — Oh, LeBlanc, Peng, IEEE T-ITS 2020
    url: https://github.com/gsoh/VED
    licence: Apache-2.0
    role: noise (routes), dev, exam (routes)
  - name: ZTBus — Widmer, Ritter, Onder, Scientific Data 10 (2023), ETH Zurich
    url: https://doi.org/10.3929/ethz-b-000626723
    licence: CC BY 4.0
    role: dev, exam (bus routes)
  - name: US EPA drive cycles and test-car lists; fueleconomy.gov; 40 CFR 1037 heavy-duty cycles; USGS 3DEP lidar; IEM ASOS weather
    url: https://www.epa.gov/vehicle-and-fuel-emissions-testing/dynamometer-drive-schedules
    licence: Public domain / free use with credit
    role: physics, exam (cycles)

split:
  dev: 76 trips — routes of the VED dev cars (calibrated twins of the 7 dev hybrids + 18 dev generated vehicles) and full-ZTBus dev legs (by-month split)
  exam: 430 trips — 216 real VED exam routes driven by calibrated twins of the 108 exam hybrids, 214 by 54 held-out generated hybrids, full-ZTBus exam legs and HD cycles

exam:
  short: "430 real routes, simulated twins"
  summary: 430 exam trips, graded as % of the DP optimum (DP with the same 8 s / 3 s on/off timers) at matched final charge, on RoadSim physics v3.1. Real routes, simulated cars. Every baseline and v2.0 were re-scored on the same physics. Run once, after the release choice was committed. v2.0's numbers (physics v2) are in the notes.
  results:
    - metric: All 430 trips, % of DP optimum
      better: higher
      model: 98.57
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.20 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.31 }
        - { name: "MPC, 15 s of the future", kind: classical, value: 98.67 }
        - { name: "Rule-based", kind: classical, value: 97.00 }
      verdict: mixed
      note: "Beats every causal baseline: +0.37 points over A-ECMS, 95% CI [−0.18, +0.84] (bootstrap by vehicle); +0.26 [+0.01, +0.52] over constant-s ECMS, which holds charge on only 75% of trips. MPC, which sees 15 s of the future, scores 0.10 higher. Holds charge on 93% of trips (A-ECMS 97%). v2.0: 98.84 on physics v2, a win (MPC 98.80); v2.0 re-scored on v3.1: 98.43."
    - metric: Power-split hybrids (148 trips), % of DP
      better: higher
      model: 97.64
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.05 }
        - { name: "ECMS (constant s)", kind: classical, value: 97.44 }
        - { name: "Rule-based", kind: classical, value: 97.44 }
      verdict: win
      note: "+0.59 points [+0.42, +0.78] over A-ECMS, +0.20 [−0.02, +0.42] over constant-s ECMS. Holds charge on 93% (A-ECMS 97%, rule 93%, ECMS 72%). v2.0: 98.41 on physics v2."
    - metric: P2 and series hybrids (63 trips), % of DP
      better: higher
      model: 99.63
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.42 }
        - { name: "ECMS (constant s)", kind: classical, value: 99.29 }
        - { name: "Rule-based", kind: classical, value: 95.35 }
      verdict: win
      note: "P2 +1.42 [+0.31, +3.38], series +0.88 [+0.57, +1.18] over A-ECMS. Holds charge on 94% (A-ECMS 92%; constant-s ECMS 59%). v2.0: 99.84 on physics v2."
    - metric: Mild P1 hybrids, CR-Z-type twins (56 trips), % of DP
      better: higher
      model: 98.36
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.28 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.57 }
        - { name: "Rule-based", kind: classical, value: 93.45 }
      verdict: mixed
      note: "+1.08 [+0.79, +1.51] over A-ECMS, but holds charge on only 79% of trips (A-ECMS 96%; v2.0 re-scored on v3.1: 91%): the fixed mild s of 2.8 lets the CR-Z twins drift. Constant-s ECMS scores 0.21 higher (CI of the difference [−0.53, +0.10]) and holds charge on 34%. v2.0: 98.10 on physics v2 (holds 95%)."
    - metric: Plug-in hybrids (103 trips), % of DP
      better: higher
      model: 99.25
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 100.17 }
        - { name: "Charge-depleting then sustaining", kind: classical, value: 99.34 }
      verdict: loss
      note: "Power-split plug-ins −1.08 [−4.66, +2.05], series plug-ins −0.72 [−1.78, −0.01] against A-ECMS. v2.0: 99.27 on physics v2 (A-ECMS 99.59)."
    - metric: Hybrid buses (24 trips), % of DP
      better: higher
      model: 97.66
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.01 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.89 }
        - { name: "Rule-based", kind: classical, value: 96.07 }
      verdict: loss
      note: "Constant-s ECMS beats it on series buses (98.30 vs 96.48, −1.82 [−4.51, −0.04]) and P2 buses (99.48 vs 98.83, −0.64 [−1.17, −0.36]). The fixed bus s gained 0.52 points over v2.0 on the same exam (97.14). Against A-ECMS: series +0.99 [+0.79, +1.30], P2 +0.30 [+0.14, +0.48]. Charge held on every bus trip. v2.0: 97.50 on physics v2."
    - metric: Charge held within its window (all trips)
      better: higher
      model: 93
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97 }
      verdict: loss
      note: "v2.0: 95% (A-ECMS 96%) on physics v2; v2.0 re-scored on v3.1: 96%. The dead band and the mild s cost 3 points."
    - metric: Engine starts per km (all trips)
      better: lower
      model: 3.0
      unit: "/km"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 3.2 }
      verdict: win
      note: "v2.0: 4.0 vs 4.5 on physics v2 (v3.1's 2 s run-on into braking lowers starts for every strategy)."
    - metric: Against v2.0 re-scored on the same exam (v2.0 network and settings on physics v3.1), % of DP
      better: higher
      model: 98.57
      unit: "%"
      baselines:
        - { name: "HybridPilot v2.0", kind: published, value: 98.43 }
      verdict: mixed
      note: "+0.14 points [+0.06, +0.22] (mild +0.44, P2 buses +0.75), but holds charge on 93% of trips against v2.0's 96%."
    - metric: Against the v1 release re-scored on the same exam (v1 network and settings on physics v3.1), % of DP
      better: higher
      model: 98.57
      unit: "%"
      baselines:
        - { name: "HybridPilot v1", kind: published, value: 98.54 }
      verdict: tie
      note: "+0.03 points [−0.12, +0.22]; v1 holds charge on 91% of trips (v2.1 93%). v2.0 on physics v2: 98.84 vs 99.00, a loss."
    - metric: Simulated vs logged fuel, calibrated twins driven by HybridPilot (exam, trip median)
      better: closer
      model: "+2.2% HEV, −20% / −31% plug-ins"
      baselines: []
      verdict: info
      note: "Power-split HEVs +2.2% (168 trips, 56 cars), mild +2.3%, P2 +3.4% (5 trips); plug-in power-split −20.1%, plug-in series −30.9% (fuel + battery energy). Engine starts on power-splits 2.42 per km vs 1.94 real (v2.0 on physics v2: 3.65). Under the 8% target for hybrids, not for plug-ins."
  coverage: []

wins:
  - "Beats every causal baseline on all 430 exam trips: 98.57% of the DP optimum against 98.20% for adaptive ECMS (+0.37 points, CI [−0.18, +0.84]), 98.31% for constant-s ECMS and 97.00% for rule-based control."
  - "Clear gains against A-ECMS on power-split hybrids (+0.59 points), P2 (+1.42), series hybrids (+0.88), mild hybrids (+1.08), series buses (+0.99) and P2 buses (+0.30)."
  - "Fewer engine starts than A-ECMS (3.0 vs 3.2 per km)."
  - "With HybridPilot driving them, the calibrated twins' fuel is within 3.5% of logged fuel for exam hybrids (trip median), and their engine starts are much closer to the real cars' than on physics v2 (2.4 vs 1.9 per km real; was 3.7)."
losses:
  - "MPC, which sees 15 s of the future, scores 98.67% against 98.57% overall (v2.0 beat it on physics v2)."
  - "Plug-ins: −1.08 points (power-split) and −0.72 (series) against A-ECMS."
  - "Buses: constant-s ECMS reaches 98.89% of DP against 97.66%, despite the new fixed bus equivalence factor."
  - "Holds charge on 93% of trips against A-ECMS's 97% (v2.0 on the same exam: 96%); mild hybrids only 79%."
  - "Mild hybrids: constant-s ECMS scores 98.57% against 98.36%, though it holds charge on only 34% of those trips."
limits:
  - "Graded in simulation; plug-ins on real roads read 20–31% low in RoadSim, and simulated power-split hybrids still start their engine more often than the real cars (2.4 vs 1.9 starts per km)."
  - "For buses and mild hybrids the network's s is not used: a fixed s (series bus 2.8, P2 bus 2.6, mild 2.8, fitted on 30 training-distribution simulations) with SOC feedback, which makes it an adaptive ECMS there."
  - "The policy outputs no uncertainty; intervals are cluster-bootstrap intervals of paired differences."
  - "DP ignores RoadSim's forced-on production rules (Toyota-type engine-on above 45 km/h, warm-up holds), so causal strategies cannot reach 100% on those cars."
  - "Preview, a timed-DP teacher, a start penalty, a distance-to-go plug-in plan, a larger network and a re-teach on physics v3.1 did not pass the ratchet."
next:
  - "Charge holding: the dead band leaves end-of-trip drift less corrected (exam 93% vs 96% for v2.0); an end-of-trip or window-edge term tested on dev, and a mild s chosen with charge holding in the objective."
  - "Buses: constant-s ECMS still wins; a bus-specific teacher (long legs, door-stop cycles) instead of a fixed s."
  - "A plug-in teacher conditioned on the trip-length uncertainty (nav known or not), and a dedicated plug-in frozen stratum."

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    from pipeline import compare, load_example     # needs RoadSim: found in shared/vehicle automatically
    spec, trip = load_example("VED_428_465")
    for r in compare(spec, trip, init_soc=None, warm=True):
        print(r["strategy"], r["fuel_g"], r["batt_kWh_out"])

files:
  inference: [hybridpilot.py, pipeline.py]
  weights: [weights/hybridpilot_v2.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 5
