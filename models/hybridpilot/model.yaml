id: hybridpilot
name: HybridPilot
version: "1.0"
status: released
released: 2026-11-12
order: 12
domain: Transportation
platform: vehicle
tags: [hybrid vehicles, energy management, control, imitation learning, dynamic programming, plug-in hybrids]
accent: "#3949ab"
tagline: A learned hybrid controller, raced against the dynamic-programming optimum.
question: Second by second, should a hybrid run its engine, and how hard — to use the least fuel the physics allows?
summary: >-
  HybridPilot is a learned, causal energy-management policy for hybrids: every second it decides engine on/off and
  engine power, holding charge in hybrids and depleting-then-sustaining in plug-ins. It learned by imitating the
  dynamic-programming (DP) optimum inside the RoadSim simulator, and was examined on 430 trips — real VED routes and
  bus legs driven by simulated twins — against rule-based control, ECMS, adaptive ECMS and MPC.
disclaimer: Graded inside the simulator. RoadSim burns about 20% less fuel than real hybrids, a gap far larger than the 1–3% between strategies, so the ranking holds only inside RoadSim's physics.

reads: The vehicle's parameters and, each second, the state (SOC, coolant temperature, timers, power limits), current demand (speed, acceleration, grade, wheel power), trip history and optionally a navigation preview.
returns:
  - Engine on/off and engine power (series, power-split) or torque share (P2) every second
  - "The resulting fuel, battery use and engine starts over the trip, compared against DP and the classical strategies"

physics:
  summary: >-
    The shared RoadSim simulator (shared/vehicle): EPA ALPHA engine and motor maps, Thevenin battery, eCVT / P2 /
    series powertrains, HVAC, an energy ledger checked on every run; DP over engine on/off × 121 SOC points as the teacher.
  simulator:
    - 400 generated hybrids in 18 class × architecture combinations, from cars to series buses and Class-8 P2 trucks
    - Routes from 835 real VED trips (real speed, lidar grade, airport weather), EPA/HD cycles and synthetic drives
    - DP teacher labels (engine on/off and the costate s*) plus a DAgger round on the learned policy's own trips
  checks:
    - "RoadSim power-split HEV cycles −2.3% vs EPA; ledger closes to < 0.5% on every run; numpy == torch to 5e-6"
    - "Grading re-solves DP to each strategy's own final SOC (matched SOC), which fixes the old factor's over-credit (ECMS 105.2% → 99.6%)"
noise: Real routes, grades and weather; random start SOC, temperatures from −20 to 36 °C, warm and cold starts
network: MLP 66 → 96 → 96 → 2 (15,938 parameters) predicting the equivalence factor s; the decision minimises fuel + s × battery power among RoadSim's candidate controls

data:
  - name: Vehicle Energy Dataset (VED) — Oh, LeBlanc, Peng, IEEE T-ITS 2020
    url: https://github.com/gsoh/VED
    licence: Apache-2.0
    role: noise (routes), dev, exam (routes)
  - name: ZTBus — Widmer et al., ETH Zurich
    url: https://www.research-collection.ethz.ch/handle/20.500.11850/626734
    licence: CC BY 4.0
    role: dev, exam (bus routes)
  - name: US EPA drive cycles; 40 CFR 1037 heavy-duty cycles; USGS 3DEP lidar; IEM ASOS weather
    url: https://www.epa.gov/vehicle-and-fuel-emissions-testing/dynamometer-drive-schedules
    licence: Public domain / free use with credit
    role: physics, exam (cycles)

split:
  dev: 76 trips — routes of the 16 VED dev cars (twins of 7 dev hybrids + 18 dev generated vehicles) and ZTBus dev legs
  exam: 430 trips — 216 real VED exam routes driven by twins of those cars, 214 by 54 held-out generated hybrids, ZTBus exam legs and HD cycles

exam:
  summary: 430 exam trips, graded as % of the DP optimum at matched final charge. Real routes, simulated cars.
  results:
    - metric: All 430 trips, % of DP optimum
      better: higher
      model: 99.49
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 99.35 }
        - { name: "Rule-based", kind: classical, value: 98.28 }
      verdict: tie
      note: "+0.13 points over A-ECMS, 95% CI [−0.06, +0.29] (bootstrap by vehicle): too small to call."
    - metric: Power-split hybrids (204 trips), % of DP
      better: higher
      model: 99.31
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.90 }
        - { name: "Rule-based", kind: classical, value: 98.59 }
      verdict: win
      note: "+0.41 points [+0.29, +0.55]."
    - metric: Series hybrid buses (12 trips), % of DP
      better: higher
      model: 99.78
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 99.12 }
        - { name: "Rule-based", kind: classical, value: 95.31 }
      verdict: win
    - metric: Series plug-ins (46 trips), % of DP
      better: higher
      model: 100.00
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 100.93 }
        - { name: "Rule-based", kind: classical, value: 100.23 }
      verdict: loss
      note: "−0.93 points [−2.43, −0.09]; DP is not a tight reference here."
    - metric: Charge held within its window (all trips)
      better: higher
      model: 97
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 99 }
      verdict: loss
    - metric: Simulator fuel vs real logged fuel (exam power-split hybrids, 252 trips)
      better: closer
      model: "0.80×"
      baselines: []
      verdict: info
      note: The simulator–reality gap (~20%) dwarfs the 1–3% between strategies.
  coverage: []

wins:
  - "Reaches 99.49% of the DP optimum against 99.35% for adaptive ECMS and 98.28% for rule-based control."
  - "Clear gains on Prius-type power-split hybrids (+0.41 points) and series hybrid buses (+0.66)."
  - Fewer engine starts per km than A-ECMS (3.8 vs 4.1).
losses:
  - Series plug-ins (−0.93 points against A-ECMS).
  - Holds charge on 97% of trips against A-ECMS's 99%.
  - The overall margin over A-ECMS is inside its confidence interval.
limits:
  - Graded in simulation; RoadSim's fuel on real hybrid trips is ~20% low and plug-in engine use too high, so the ranking holds only inside its physics.
  - The policy outputs no uncertainty; intervals are cluster-bootstrap intervals of paired differences.
  - Preview did not pass the ratchet; the on/off head is unused.
  - DP assumes a warm engine and no catalyst rule (values above 100% mean DP was not tight).
  - "Built before the 13 Nov RoadData fixes (VED cars 136 kg heavy in the twins)."
next:
  - Rebuild after RoadSim's twin fixes (Toyota engine-on above ~72 km/h, electric cabin heat in plug-ins, engine-start penalty).
  - A plug-in teacher using distance-to-go; RL fine-tuning on matched-SOC fuel.
  - A drivability score (starts/km, on/off chatter) in the objective.

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    from pipeline import compare, load_example     # needs RoadSim: found in shared/vehicle automatically
    spec, trip = load_example("VED_428_465")
    for r in compare(spec, trip, init_soc=None, warm=True):
        print(r["strategy"], r["fuel_g"], r["batt_kWh_out"])

files:
  inference: [hybridpilot.py, pipeline.py]
  weights: [weights/hybridpilot_v1.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  notebook: NOTEBOOK.md
demo_seconds: 11
