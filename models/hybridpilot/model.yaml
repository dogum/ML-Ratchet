id: hybridpilot
name: HybridPilot
version: "2.0"
status: released
released: 2026-11-14
order: 12
domain: Transportation
platform: vehicle
tags: [hybrid vehicles, energy management, control, imitation learning, dynamic programming, plug-in hybrids]
accent: "#3949ab"
tagline: A learned hybrid controller, raced against the dynamic-programming optimum.
question: Second by second, should a hybrid run its engine, and how hard — to use the least fuel the physics allows?
summary: >-
  HybridPilot is a learned, causal energy-management policy for hybrids: every second it decides engine on/off and
  engine power, holding charge in hybrids and depleting-then-sustaining in plug-ins. It learned by imitating the
  dynamic-programming (DP) optimum inside the RoadSim simulator. Version 2 was rebuilt on RoadSim physics v2 (calibrated
  on real dev data) and examined on 430 trips — real VED routes driven by calibrated twins of the exam cars, bus legs
  and cycles — against rule-based control, ECMS, adaptive ECMS and MPC.
disclaimer: >-
  Graded inside the simulator. With HybridPilot driving the calibrated twins, simulated hybrid fuel is within 3 % of VED's
  logged fuel (exam trip median), but plug-ins read 22–31 % low, and the strategies differ by only 0.5–1.5 %, so the
  ranking holds only inside RoadSim's physics.

reads: The vehicle's parameters and, each second, the state (SOC, coolant temperature, timers, power limits), current demand (speed, acceleration, grade, wheel power), trip history and optionally a navigation preview.
returns:
  - Engine on/off and engine power (series, power-split) or torque share (P2) every second
  - "The resulting fuel, battery use and engine starts over the trip, compared against DP and the classical strategies"

physics:
  summary: >-
    The shared RoadSim simulator (shared/vehicle), physics v2 pinned (roadsim-physics-v2): EPA ALPHA engine and motor
    maps, Thevenin battery, eCVT / P2 (with torque converter and start energy) / series (with direct drive) powertrains,
    two-node cabin HVAC, tyre model, production hybrid rules (8 s / 3 s minimum on/off, Toyota-type engine-on speed,
    warm-up holds, plug-in charge-depleting rules), an energy ledger checked on every run. Teacher: DP over engine on/off
    × 121 SOC points; reference: DP with the same 8 s / 3 s on/off timers.
  simulator:
    - "400 generated hybrids in 18 class × architecture combinations (v2 donor model: hybrid bodies from real hybrid records), cars to series buses and Class-8 P2 trucks"
    - VED cars as RoadSim's calibrated twins (road load and engine level matched to each car's fueleconomy.gov city / highway values; CR-Z-type cars as mild P1 hybrids)
    - Routes from 835 real VED trips (real speed, lidar grade, airport weather), the full ZTBus set (by-month split), EPA/HD cycles and synthetic drives
    - DP teacher labels (engine on/off and the costate s*) plus a DAgger round on the learned policy's own trips
  checks:
    - "Numpy inference module == training policy: identical fuel on 23 frozen and dev trips; numpy == torch to 5e-6"
    - "Simulator vs logged fuel with HybridPilot driving the calibrated twins (OBD label model, exam trip median): power-split HEV +2.2 %, mild +0.3 %, P2 +1.6 % (5 trips); plug-in power-split −22 %, plug-in series −31 %"
    - "Grading re-solves DP to each strategy's own final SOC (matched SOC); ledger closes to < 0.5 % on every run"
noise: Real routes, grades and weather; random start SOC, temperatures from −20 to 36 °C, warm and cold starts
network: MLP 66 → 96 → 96 → 2 (15,938 parameters) predicting the equivalence factor s; the decision minimises fuel + s × battery power among RoadSim's candidate controls, with A-ECMS-style SOC feedback (Kp 12, Ki 0.02)

approach:
  real_backdrop: "Real VED and ZTBus routes, grades and weather"
  physics_inputs: "Wheel power demand from RoadSim's road-load model"
  physics_anchor: "Its output, the equivalence factor s, sets an ECMS cost over candidate controls scored by the powertrain model"
  real_data_roles: [backdrop, calibration, gate, exam]

data:
  - name: Vehicle Energy Dataset (VED) — Oh, LeBlanc, Peng, IEEE T-ITS 2020
    url: https://github.com/gsoh/VED
    licence: Apache-2.0
    role: noise (routes), dev, exam (routes)
  - name: ZTBus — Widmer, Ritter, Onder, Scientific Data 10 (2023), ETH Zurich
    url: https://www.research-collection.ethz.ch/handle/20.500.11850/626723
    licence: CC BY 4.0
    role: dev, exam (bus routes)
  - name: US EPA drive cycles and test-car lists; fueleconomy.gov; 40 CFR 1037 heavy-duty cycles; USGS 3DEP lidar; IEM ASOS weather
    url: https://www.epa.gov/vehicle-and-fuel-emissions-testing/dynamometer-drive-schedules
    licence: Public domain / free use with credit
    role: physics, exam (cycles)

split:
  dev: 76 trips — routes of the VED dev cars (calibrated twins of the 7 dev hybrids + 18 dev generated vehicles) and full-ZTBus dev legs (by-month split)
  exam: 430 trips — 216 real VED exam routes driven by calibrated twins of the 108 exam hybrids, 214 by 54 held-out generated hybrids, full-ZTBus exam legs and HD cycles

exam:
  summary: 430 exam trips, graded as % of the DP optimum (DP with the same 8 s / 3 s on/off timers) at matched final charge. Real routes, simulated cars. Run once, after the release choice was committed.
  results:
    - metric: All 430 trips, % of DP optimum
      better: higher
      model: 98.84
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.32 }
        - { name: "ECMS (constant s)", kind: classical, value: 98.53 }
        - { name: "MPC, 15 s of the future", kind: classical, value: 98.80 }
        - { name: "Rule-based", kind: classical, value: 97.39 }
      verdict: win
      note: "+0.53 points over A-ECMS, 95% CI [+0.20, +0.82] (bootstrap by vehicle). ECMS holds charge on only 74% of trips; MPC sees the future."
    - metric: Power-split hybrids (148 trips), % of DP
      better: higher
      model: 98.41
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.52 }
        - { name: "Rule-based", kind: classical, value: 97.92 }
      verdict: win
      note: "+0.89 points [+0.75, +1.04]."
    - metric: P2 and series hybrids (63 trips), % of DP
      better: higher
      model: 99.84
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 98.63 }
        - { name: "Rule-based", kind: classical, value: 95.84 }
      verdict: win
      note: "P2 +1.32 [+0.37, +2.85]; series +1.04 [+0.68, +1.39]."
    - metric: Mild P1 hybrids, CR-Z-type twins (56 trips), % of DP
      better: higher
      model: 98.10
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.51 }
        - { name: "Rule-based", kind: classical, value: 94.02 }
      verdict: win
      note: "+0.60 [+0.29, +0.83]."
    - metric: Plug-in hybrids (103 trips), % of DP
      better: higher
      model: 99.27
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 99.59 }
        - { name: "Charge-depleting then sustaining", kind: classical, value: 99.43 }
      verdict: loss
      note: "Power-split plug-ins −0.29 [−2.31, +1.53], series plug-ins −0.35 [−1.09, +0.12]."
    - metric: Hybrid buses (24 trips), % of DP
      better: higher
      model: 97.50
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 97.39 }
        - { name: "Rule-based", kind: classical, value: 96.60 }
      verdict: mixed
      note: "Series buses +0.70 [+0.21, +1.29]; P2 buses −0.48 [−0.63, −0.40]."
    - metric: Charge held within its window (all trips)
      better: higher
      model: 95
      unit: "%"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 96 }
      verdict: loss
    - metric: Engine starts per km (all trips)
      better: lower
      model: 4.0
      unit: "/km"
      baselines:
        - { name: "Adaptive ECMS", kind: classical, value: 4.5 }
      verdict: win
    - metric: Against the v1 release re-scored on the same exam (v1 network and settings on physics v2), % of DP
      better: higher
      model: 98.84
      unit: "%"
      baselines:
        - { name: "HybridPilot v1", kind: published, value: 99.00 }
      verdict: loss
      note: "−0.16 points [−0.26, −0.06], but v1 holds charge on only 89% of trips (v2: 95%); v1's settings failed the v2 dev charge-holding gate."
    - metric: Simulated vs logged fuel, calibrated twins driven by HybridPilot (exam, trip median)
      better: closer
      model: "+2.2% HEV, −22% / −31% plug-ins"
      baselines: []
      verdict: info
      note: "Power-split HEVs +2.2% (168 trips, 56 cars), mild +0.3%, P2 +1.6%; plug-in power-split −22.4%, plug-in series −30.9% (fuel + battery energy). Under the 8% target for hybrids, not for plug-ins."
  coverage: []

wins:
  - "Reaches 98.84% of the DP optimum on 430 exam trips against 98.32% for adaptive ECMS (+0.53 points, CI [+0.20, +0.82]), 97.39% for rule-based control and 98.80% for MPC, which sees 15 s of the future."
  - "Clear gains on power-split hybrids (+0.89 points), P2 (+1.32), series hybrids (+1.04), mild hybrids (+0.60) and series buses (+0.70)."
  - "Fewer engine starts than A-ECMS (4.0 vs 4.5 per km)."
  - "With HybridPilot driving them, the calibrated twins' fuel is within 3% of logged fuel for exam hybrids (trip median)."
losses:
  - "Plug-ins: −0.29 points (power-split) and −0.35 (series) against A-ECMS, inside wide intervals."
  - "P2 buses: −0.48 points."
  - "The v1 release, re-scored on v2, burns 0.16 points less fuel, but fails to hold charge on 11% of trips."
  - "Holds charge on 95% of trips against A-ECMS's 96%."
limits:
  - "Graded in simulation; plug-ins on real roads read 22–31% low in RoadSim, and simulated hybrids start their engine about twice as often as the real cars (3.7 vs 1.9 starts per km on exam power-splits)."
  - "The policy outputs no uncertainty; intervals are cluster-bootstrap intervals of paired differences."
  - "DP ignores RoadSim's forced-on production rules (Toyota-type engine-on above 45 km/h, warm-up holds), so causal strategies cannot reach 100% on those cars."
  - "Preview, a timed-DP teacher, a start penalty, a distance-to-go plug-in plan and a larger network did not pass the ratchet."
next:
  - "A charge-holding term in the teacher, so the network's own s holds charge without the strong A-ECMS feedback (R3-R7 lost 0.6 points of skill to charge holding)."
  - "A plug-in teacher conditioned on the trip-length uncertainty (nav known or not), and a dedicated plug-in frozen stratum."
  - "Learn the real cars' engine-start behaviour from VED dev logs (simulated starts are twice the real rate)."

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    from pipeline import compare, load_example     # needs RoadSim: found in shared/vehicle automatically
    spec, trip = load_example("VED_428_465")
    for r in compare(spec, trip, init_soc=None, warm=True):
        print(r["strategy"], r["fuel_g"], r["batt_kWh_out"])

files:
  inference: [hybridpilot.py, pipeline.py]
  weights: [weights/hybridpilot_v2.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 5
