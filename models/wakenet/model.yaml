  summary: >-
    Mean absolute error in each waked turbine's power (as a share of the unwaked front row's power) and
    in farm-wide wake loss, on exam 2: years no version has seen. The strongest baseline is the same
    FLORIS physics with the three settings WakeNet's simulator took from 2019 dev (meandering 0.25 ×
    vane spread, hill speedup 0.18, terrain-follow 0.80). Every row gives WakeNet minus the best baseline
    with a 95% interval from a bootstrap over days; win or loss only when the interval excludes zero.
    Each note also gives the re-scored exam 1 result.
