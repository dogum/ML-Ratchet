id: snowsense
name: SnowSense
version: "1.0"
status: released
released: 2026-11-18
order: 24
domain: Hydrology
platform: water
tags: [hydrology, snow, snow water equivalent, SNOTEL, snowmelt, recurrent network, uncertainty]
accent: "#5f3dc4"
tagline: Daily snow water equivalent at a snow pillow, from the station's own weather
question: How much water is stored as snow at this mountain station today, and when will it peak and melt out?
question_short: "Daily snow at a mountain station, from its gauge and thermometer"
summary: >-
  SnowSense estimates daily snow water equivalent (SWE) at a SNOTEL snow-pillow station from that station's own daily
  precipitation and air temperature, with 68 % and 90 % bands, plus each winter's peak SWE, peak date and melt-out
  date. It never reads a snow measurement. It learned only from WaterSim snow simulations (degree-day and energy
  balance) driven by real dev-station weather up to 2010. On 621 SNOTEL exam stations (water years 2011-2025) it
  scores median NSE 0.888 against 0.853 for WaterSim's energy balance with default parameters, and it has the higher
  NSE at 75 % of stations (95 % interval 71-78 %). A degree-day model calibrated on ten years of each station's own
  snow still does better (0.925; SnowSense ahead at 34 % of stations). The fairest weather-only baseline, the energy
  balance with the dev-calibrated parameters, has not been run on the exam yet.

reads: "Daily precipitation P (mm, the gauge total for the local day), T_mean, T_min and T_max (deg C) from the station itself, plus its latitude and elevation. Each water year is read from 1 August of the previous year to 1 October (427 days). Gaps are allowed: missing P counts as 0, missing T is interpolated, and both are flagged to the network. Never any SWE or snow depth."
returns:
  - "Daily SWE median (mm, end of day) with 68 % and 90 % bands (exam coverage of snow days 78 % and 96 %)"
  - "Per water year: peak SWE (mm) with 68 % / 90 % intervals (exam coverage 76 % / 93 %)"
  - "Per water year: peak date, and melt-out date (first day after the peak below 5 mm) with 68 % / 90 % intervals (exam coverage 86 % / 95 %)"

physics:
  summary: >-
    Point snowpack mass and energy balance. WaterSim's two snow routines run snow-only at the station (one band, no
    runoff model): the HBV-light degree-day routine (rain/snow partition over TT +- TTI/2, snowfall correction, melt
    CFMAX (T - TT), refreeze, liquid water holding) and a daily single-layer energy balance after Walter et al. (2005)
    and the Utah Energy Balance model (net shortwave with an ageing albedo, Brutsaert long-wave with a cloud correction,
    bulk-transfer sensible and latent heat with a stability reduction, ground and rain heat, cold content, refreeze,
    sublimation). Radiation comes from the daily temperature range (Hargreaves-Samani).
  simulator:
    - "WaterSim v1 (shared/water/watersim), model='none', one band at the station; each simulated station-winter uses one routine, 50/50"
    - "Weather: real daily P and T of the dev SNOTEL stations, water years up to 2010 only; six dev stations held out for the frozen simulated sets. Climate shifts P x e^N(0, 0.3), T + N(0, 1.5) deg C with elevation moved by the lapse rate, latitude +- 1 deg"
    - "Snow parameters (p3, p4): a multivariate normal fitted to per-station calibrations of both routines on 36 dev stations' own SWE, water years up to 2010 (training/prior_p4.json; means TT 0.99 C, CFMAX 3.6 mm/C/d, SFCF 1.01 for degree-day; TT 0.91 C, ALB_DECAY 2.4 d, TURB 0.17, GHEAT 0.32 MJ/m2/d for energy balance)"
    - "Plausibility filter: simulated windows with more than 5 mm of SWE on 1 August are dropped (cold-shifted runs grew perennial packs)"
  checks:
    - "Degree-day routine against a 5-day hand calculation: 0.0 mm; identical to TUWmodel 1.1-1 to <= 1e-12 mm (shared/water/checks/analytic.json, reference_models.json)"
    - "Energy-balance terms exact against hand arithmetic; mass closes to 6e-15 mm (shared/water/checks/analytic.json)"
    - "Against SNOTEL pillows at 33 dev stations, WY2011-2025 (shared/water/checks/snotel.json): degree-day NSE 0.700 with default parameters and 0.892 calibrated per station; energy balance 0.824 default and 0.930 calibrated"
    - "Twin test, 38 dev stations, WY2011-2025 (training/twin_r6.json): each station's calibrated energy-balance twin scores NSE 0.917 against its pillow; the released network reads the twin at 0.914 and the pillow at 0.888"

noise: >-
  Real weather, not synthetic: the simulated snowpacks are driven by the dev stations' own recorded P and T. From rung
  R2 on, the snowpack feels a 'true' weather that differs from the gauge record the network reads: wet-day P x
  lognormal(sd 0.25), 15 % of wet days slip part of their total to the next or previous day, temperature error AR(1)
  0.6 deg C plus a station bias N(0, 0.5) deg C, and injected data gaps in the network input (P set to 0, T
  interpolated, both flagged).
network: >-
  Input layer 10 -> 64 (tanh), a 2-layer GRU with 64 hidden units, and a head 64 -> 5 giving five monotone quantiles
  (5, 16, 50, 84, 95 %) of z = sqrt(SWE)/10, trained with a pinball loss on the water-year days; 50,949 parameters.
  Input channels per day: log1p(P)/2, T_mean/10, T_min/10, T_max/10, sin and cos of day of year, P-gap and T-gap
  flags, (elevation - 2200)/800, (latitude - 43)/8. Released rung R6: 48,000 simulated station-winters (two physics-p4
  banks), fine-tuned R1 -> R6, AdamW one-cycle, batch 128, one CPU thread. numpy-only inference, about 0.05 s per
  station-year.
approach:
  real_backdrop: "Real daily precipitation and temperature records of the dev SNOTEL stations (water years up to 2010) drive every simulated snowpack, shifted to other climates"
  physics_inputs: false
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: USDA NRCS SNOTEL daily SWE, precipitation and air temperature
    url: https://wcc.sc.egov.usda.gov/reportGenerator/
    licence: US public domain (USDA NRCS National Water and Climate Center)
    role: "noise and physics (dev stations' weather up to WY2010 drives the simulations), dev (36 dev stations' SWE up to WY2010 for the parameter prior; 38 dev stations WY2011-2025 for the gate, the twin test and the widen factors), exam (621 exam stations WY2011-2025; examples/ holds three of them, WY2016-2025)"
  - name: WaterData snow baselines (climatology and per-station calibrated degree-day, Watershed Phase 1)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/waterdata
    licence: Derived from US public-domain SNOTEL data; code MIT
    role: exam (baselines, data/proc/baselines/snow_scores.parquet)
  - name: WaterSim v1 snow routines (HBV-light after Bergstrom 1976 and Seibert & Vis 2012; energy balance after Walter et al. 2005 and Tarboton & Luce 1996; Hargreaves & Samani 1985; Brutsaert 1975)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/watersim
    licence: MIT (code in this repository)
    role: physics (simulator and the uncalibrated exam baselines)

split:
  dev: "WaterData's frozen SNOTEL split (shared/water/data/proc/splits.json, seed 20261118): 39 dev stations, drawn per state, systematically by elevation, only where the HUC8 holds no exam CAMELS gauge. Training weather: dev stations up to WY2010, six of them (1059_CO, 461_UT, 510_MT, 560_WY, 573_NV, 647_OR) held out for the frozen simulated sets. Parameter prior: dev SWE up to WY2010. Dev gate, widen factors and twin test: the 38 dev stations with at least 5 complete water years in 2011-2025."
  exam: "The 621 of 772 exam stations that WaterData scored (at least 5 complete calibration and scoring years), water years 2011-2025, end-of-day SWE against the pillow's next-morning reading (WaterData's protocol). Scored once, after the ratchet had chosen the release on simulated and dev data only."

exam:
  short: "621 SNOTEL stations · WY2011-2025 · daily SWE"
  summary: >-
    Medians over 621 exam stations of each station's 2011-2025 scores, against WaterSim's two snow routines with
    default parameters (weather only, like SnowSense), a climatology and a degree-day model calibrated per station
    (both read the station's own 2001-2010 SWE). Intervals: exact binomial (Clopper-Pearson) 95 % intervals on the
    shipped station win fractions (n = 621) where they exist; otherwise none, because per-station model scores were
    not shipped and the SNOTEL series are not on disk. The fairest weather-only baseline, the energy balance with the
    dev-calibrated parameters, was never run on the exam.
  results:
    - metric: "Daily SWE, median NSE, against weather-only physics and climatology"
      better: higher
      model: 0.888
      baselines:
        - { name: "Energy balance, WaterSim defaults (weather only)", kind: classical, value: 0.853 }
        - { name: "Degree-day, WaterSim defaults (weather only)", kind: classical, value: 0.691 }
        - { name: "Climatology, station's own WY2001-2010 SWE (WaterData)", kind: dumb, value: 0.701 }
      verdict: win
      note: "Higher NSE than the default energy balance at 463 of 621 stations (74.6 %, Clopper-Pearson 95 % interval 70.9-77.9 %, entirely above 50 %) and than climatology at 523 (84.2 %, 81.1-87.0 %). Against the default degree-day no win fraction was shipped; the median gap (0.888 vs 0.691) is large. Open: the energy balance with the dev-calibrated parameters (prior_p4.json means TURB 0.17, ALB_DECAY 2.4 d, GHEAT 0.32) is the fairer baseline and was never run on the exam (it needs the SNOTEL series: mlratchet data water). On dev the per-station calibrated EB twin reaches 0.917, so as with WakeNet and StormNet this win may become a tie."
    - metric: "Daily SWE, median NSE, against the gauged ceiling (degree-day calibrated on each station's own SWE)"
      better: higher
      model: 0.888
      baselines:
        - { name: "Degree-day calibrated per station on WY2001-2010 SWE (WaterData; reads the station's snow)", kind: classical, value: 0.925 }
      verdict: loss
      note: "Different protocol: the baseline reads ten years of the station's own SWE, SnowSense none. SnowSense has the higher NSE at 210 of 621 stations (33.8 %, Clopper-Pearson 95 % interval 30.1-37.7 %, entirely below 50 %)."
    - metric: "Daily SWE, median RMSE, against weather-only physics and climatology"
      better: lower
      model: 51.7
      unit: mm
      baselines:
        - { name: "Energy balance, WaterSim defaults (weather only)", kind: classical, value: 57.2 }
        - { name: "Degree-day, WaterSim defaults (weather only)", kind: classical, value: 80.0 }
        - { name: "Climatology, station's own WY2001-2010 SWE (WaterData)", kind: dumb, value: 84.6 }
      verdict: win
      note: "At one station both methods are scored on the same observed days, so lower RMSE is the same event as higher NSE: the NSE win fractions carry over (default energy balance 74.6 %, 95 % interval 70.9-77.9 %; climatology 84.2 %, 81.1-87.0 %). Same open item: dev-tuned energy balance not run."
    - metric: "Daily SWE, median RMSE, against the gauged ceiling"
      better: lower
      model: 51.7
      unit: mm
      baselines:
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: 41.2 }
      verdict: loss
      note: "Same station win fraction as NSE: SnowSense lower at 33.8 % of stations (95 % interval 30.1-37.7 %)."
    - metric: "Peak SWE, median absolute error, against weather-only physics and climatology"
      better: lower
      model: 17.5
      unit: "%"
      baselines:
        - { name: "Energy balance, WaterSim defaults", kind: classical, value: 23.7 }
        - { name: "Degree-day, WaterSim defaults", kind: classical, value: 28.5 }
        - { name: "Climatology, station's own WY2001-2010 SWE", kind: dumb, value: 28.2 }
      verdict: win
      note: "No interval: per-unit scores not shipped; needs the data rebuild (mlratchet data water). Verdict from the medians: 6.2 points (26 %) below the best baseline, and the default energy balance's peaks are biased -20 % against SnowSense's -9 %."
    - metric: "Peak SWE, median absolute error, against the gauged ceiling"
      better: lower
      model: 17.5
      unit: "%"
      baselines:
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: 12.5 }
      verdict: loss
      note: "No interval: per-unit scores not shipped; needs the data rebuild (mlratchet data water). Gap 5.0 points (40 % larger error)."
    - metric: "Peak SWE, median bias"
      better: closer
      model: -9.0
      unit: "%"
      baselines:
        - { name: "Energy balance, WaterSim defaults", kind: classical, value: -20.0 }
        - { name: "Degree-day, WaterSim defaults", kind: classical, value: -26.4 }
        - { name: "Climatology, station's own WY2001-2010 SWE", kind: dumb, value: 2.1 }
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: -3.6 }
      verdict: loss
      note: "No interval: per-unit scores not shipped. Climatology and the calibrated degree-day, both reading the station's own SWE, are closer to zero. Against the weather-only physics the low bias is halved. Peaks low by 9 % are the main miss: about half is the network averaging over unknown snow parameters (twin: -4 % vs the calibrated twin), the rest snow the physics does not make (drift, gauge under-catch)."
    - metric: "Melt-out date, median absolute error, against weather-only physics and climatology"
      better: lower
      model: 8.3
      unit: days
      baselines:
        - { name: "Energy balance, WaterSim defaults", kind: classical, value: 9.1 }
        - { name: "Degree-day, WaterSim defaults", kind: classical, value: 21.9 }
        - { name: "Climatology, station's own WY2001-2010 SWE", kind: dumb, value: 11.4 }
      verdict: tie
      note: "No interval: per-unit scores not shipped; needs the data rebuild (mlratchet data water). 0.8 days better than the default energy balance is too small to call from medians alone; clearly better than the default degree-day and climatology."
    - metric: "Melt-out date, median absolute error, against the gauged ceiling"
      better: lower
      model: 8.3
      unit: days
      baselines:
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: 6.1 }
      verdict: loss
      note: "No interval: per-unit scores not shipped. Gap 2.2 days (36 % larger error)."
    - metric: "Melt-out date, median bias"
      better: closer
      model: -2.8
      unit: days
      baselines:
        - { name: "Energy balance, WaterSim defaults", kind: classical, value: -4.7 }
        - { name: "Degree-day, WaterSim defaults", kind: classical, value: -21.5 }
        - { name: "Climatology, station's own WY2001-2010 SWE", kind: dumb, value: 3.5 }
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: -0.3 }
      verdict: loss
      note: "No interval: per-unit scores not shipped. Closest to zero among the weather-only methods; the calibrated degree-day is closer. R4, before the dev prior was narrowed, had -0.3 days on the exam (reported after the fact)."
    - metric: "Peak date, median absolute error (9,071 station-years)"
      better: lower
      model: 3
      unit: days
      baselines: []
      verdict: info
      note: "No baseline peak-date errors were shipped."
    - metric: "Share of stations with NSE below 0.5"
      better: lower
      model: 8.4
      unit: "%"
      baselines:
        - { name: "Energy balance, WaterSim defaults", kind: classical, value: 9.5 }
        - { name: "Climatology, station's own WY2001-2010 SWE (computed from WaterData's per-station table)", kind: dumb, value: 17.9 }
        - { name: "Degree-day calibrated per station (reads the station's snow)", kind: classical, value: 2.3 }
      verdict: loss
      note: "No paired interval. 52 vs 59 of 621 stations against the default energy balance is a tie; the calibrated degree-day fails at 14 stations."
    - { metric: "By region, median NSE: Central Rockies (233 stations)", better: higher, model: 0.910, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.859 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.939 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By region, median NSE: Northern Rockies (159)", better: higher, model: 0.921, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.908 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.943 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By region, median NSE: Pacific (153)", better: higher, model: 0.845, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.798 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.900 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By region, median NSE: Southwest (31)", better: higher, model: 0.776, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.704 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.811 }], verdict: info, note: "Breakdown, not graded. Weakest region: thin, intermittent packs. No interval." }
    - { metric: "By region, median NSE: Great Basin (24)", better: higher, model: 0.831, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.765 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.906 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By region, median NSE: Alaska (21)", better: higher, model: 0.871, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.808 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.857 }], verdict: info, note: "Breakdown, not graded. The only region where SnowSense's median is above the calibrated degree-day's; 21 stations, no interval." }
    - { metric: "By elevation, median NSE: below 1,500 m (104 stations)", better: higher, model: 0.787, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.761 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.884 }], verdict: info, note: "Breakdown, not graded. Weakest band: rain-on-snow and thin packs. No interval." }
    - { metric: "By elevation, median NSE: 1,500-2,200 m (174)", better: higher, model: 0.897, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.877 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.918 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By elevation, median NSE: 2,200-2,800 m (210)", better: higher, model: 0.902, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.857 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.936 }], verdict: info, note: "Breakdown, not graded. No interval." }
    - { metric: "By elevation, median NSE: above 2,800 m (133)", better: higher, model: 0.910, baselines: [{ name: "Energy balance, defaults", kind: classical, value: 0.867 }, { name: "Degree-day calibrated per station", kind: classical, value: 0.942 }], verdict: info, note: "Breakdown, not graded. No interval. The shipped median equals the Central Rockies median to 16 digits; both groups have an odd count, so each median is one station, plausibly the same one." }
    - metric: "90 % bands, exam coverage: daily SWE / peak SWE / melt-out"
      better: closer
      model: "95.6 / 93.3 / 94.6 %"
      baselines: []
      verdict: info
      note: "Nominal 90 %. Widen-only factors fitted on dev are all 1.0 (dev raw 68 % coverage: daily 72 %, peak 76 %, melt-out 88 %), so the bars are conservative."
  coverage:
    - { output: "Daily SWE, snow days", actual: 77.7 }
    - { output: "Peak SWE, station-years", actual: 76.3 }
    - { output: "Melt-out date, station-years", actual: 85.6 }

wins:
  - "Beats every weather-only baseline that was run: median NSE 0.888 against 0.853 for WaterSim's default energy balance (higher at 75 % of stations, 95 % interval 71-78 %) and 0.691 for the default degree-day; peak SWE error 17.5 % against 23.7 %."
  - "Beats climatology built from each station's own 2001-2010 snow, without reading any snow (higher NSE at 84 % of stations, interval 81-87 %)."
  - "Its error bars hold on the exam: the 68 % bars cover 78 % of snow days, 76 % of peaks and 86 % of melt-out dates."
losses:
  - "Loses to a degree-day model calibrated on ten years of each station's own SWE: median NSE 0.888 against 0.925, ahead at only 34 % of stations (interval 30-38 %); peak error 17.5 against 12.5 %; melt-out 8.3 against 6.1 days."
  - "Peaks are 9 % low (median); climatology (+2 %) and the calibrated degree-day (-4 %) are less biased."
  - "Melt-out MAE ties the default energy balance (8.3 against 9.1 days, no interval)."
limits:
  - "The fairest weather-only baseline was not run: WaterSim's energy balance with the dev-calibrated parameters (TURB 0.17, ALB_DECAY 2.4 d, GHEAT 0.32) needs the SNOTEL series, which are not in the repository. With WakeNet and StormNet such dev-tuned physics turned wins into ties; the energy-balance win here is a win over default physics until it runs."
  - "Weather data: SnowSense reads the station's own gauge and thermometer, not ERA5-Land, so the ERA5-Land under-catch and decade drift that cap FlowCast and BasinDetective do not apply here; but gauge under-catch of windblown snow does, and is the likely cause of the -9 % peak bias. Gridded forcing (ERA5-Land, PRISM, Daymet) is untested, and SNOTEL temperature sensors changed network-wide in the 2000s (Oyler et al. 2015)."
  - "Low and warm stations are weakest: median NSE 0.787 below 1,500 m and 0.776 in the Southwest (rain-on-snow, thin intermittent packs)."
  - "Every water year starts on 1 August with no snow knowledge; perennial snow is outside the training data (simulated windows with snow on 1 August were dropped)."
  - "The dev prior was fitted on dev SWE up to WY2010 and the dev gate uses the same stations in WY2011-2025, so the gate is partly in-sample. The exam was untouched."
  - "No per-station exam scores were shipped, so only the station win fractions have intervals."
next:
  - "Run the dev-tuned energy balance (prior_p4.json means) on the 621 exam stations once the SNOTEL series are rebuilt, and pair it station by station with SnowSense (the decisive fair comparison)."
  - "Peak under-catch: a wind- or exposure-dependent snowfall-correction (SFCF) prior, or a drift term."
  - "Rain-on-snow and thin packs below 1,500 m: sub-daily melt-refreeze, or rain energy in the degree-day routine."
  - "A gridded ERA5-Land band mode so SnowSense can feed FlowCast (the SnowSense -> FlowCast test was not done)."
  - "An initial-snow input for stations that keep snow through summer; checks across the SNOTEL temperature-sensor change; more Alaska stations."
help_wanted:
  - "The SNOTEL daily series (data/proc/snotel) are not in the repository; rebuild them with `mlratchet data water` (shared/water/data/scripts/fetch_snotel.py, build_snotel.py) to re-score the exam per station and run the dev-tuned physics baseline."
usage:
  install: pip install numpy pandas
  demo: python demo.py
  python: |
    import pandas as pd
    from snowsense import SnowSense
    df = pd.read_csv("examples/349_MT_SNTL.csv", parse_dates=["date"]).set_index("date")
    out = SnowSense().predict(df, lat=46.414, elev_m=2185)
    print(out["annual"][["peak_swe_mm", "peak_lo68", "peak_hi68", "melt_out_date"]])
files:
  inference: [snowsense.py, pipeline.py]
  weights: [snowsense_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 3
