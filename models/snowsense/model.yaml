  summary: 'Medians over 621 exam stations of each station''s 2011-2025 scores, re-scored on 18 Nov 2026 on the rebuilt SNOTEL
    series (the released weights reproduce the shipped exam exactly). Baselines: WaterSim''s two snow routines with default
    parameters and with dev-tuned parameters (medians of the dev-station calibrations, frozen before scoring; added on import,
    seen exam), all reading only the weather like SnowSense; a climatology and a degree-day calibrated per station, both reading
    the station''s own 2001-2010 SWE. Intervals: paired bootstrap over stations (10,000 resamples, seed 20261118) of the difference
    in medians; win or loss only where the 95 % interval excludes zero.'
  results:
  - metric: Daily SWE, median NSE, against weather-only physics (default and dev-tuned) and climatology
    better: higher
    model: 0.888
    baselines:
    - name: Energy balance, WaterSim defaults (weather only)
      kind: classical
      value: 0.853
    - name: Degree-day, WaterSim defaults (weather only)
      kind: classical
      value: 0.691
    - name: Energy balance, dev-tuned (added on import, seen exam)
      kind: classical
      value: 0.895
    - name: Degree-day, dev-tuned (added on import, seen exam)
      kind: classical
      value: 0.864
    - name: Climatology, station's own WY2001-2010 SWE (WaterData)
      kind: dumb
      value: 0.701
    verdict: tie
    note: 'Re-scored 18 Nov 2026 (reproduces the shipped exam exactly). Paired bootstrap over the 621 stations (10,000 resamples,
      seed 20261118), 95 % interval of SnowSense minus baseline of medians: default EB +0.035 [+0.025, +0.047] (better); default
      DD +0.197 [+0.174, +0.228] (better); dev-tuned EB -0.007 [-0.018, +0.001] (tie); dev-tuned DD +0.024 [+0.012, +0.037]
      (better); climatology +0.187 [+0.166, +0.201] (better). Cross-check, share of stations where SnowSense has the higher
      NSE (equivalently the lower RMSE; Clopper-Pearson 95 %): default EB 74.6 % [70.9, 77.9]; default DD 87.3 % [84.4, 89.8];
      dev-tuned EB 45.2 % [41.3, 49.3]; dev-tuned DD 66.8 % [63.0, 70.5]; climatology 84.2 % [81.1, 87.0]. Against default
      physics this is the shipped win; the dev-tuned energy balance (parameters frozen in training/devtuned_params.json before
