id: snowsense
name: SnowSense
version: "1.0"
status: released
released: 2026-11-18
order: 24
domain: Hydrology
platform: water
tags: [hydrology, snow, snow water equivalent, SNOTEL, snowmelt, recurrent network, uncertainty]
accent: "#5f3dc4"
tagline: Daily snow water equivalent at a snow pillow, from the station's own weather
question: How much water is stored as snow at this mountain station today, and when will it peak and melt out?
question_short: "Daily snow at a mountain station, from its gauge and thermometer"
summary: >-
  SnowSense estimates daily snow water equivalent (SWE) at a SNOTEL snow-pillow station from that station's own daily
  precipitation and air temperature, with 68 % and 90 % bands, plus each winter's peak SWE, peak date and melt-out
  date. It never reads a snow measurement. It learned only from WaterSim snow simulations (degree-day and energy
  balance) driven by real dev-station weather up to 2010. On 621 SNOTEL exam stations (water years 2011-2025) it
  scores median NSE 0.888, clearly above WaterSim's energy balance with default parameters (0.853). But the same
  energy balance with parameters tuned on the dev stations, run on the exam after import, scores 0.895: a tie on NSE,
  RMSE and melt-out timing, and a loss on peak SWE. The network adds nothing over tuned physics on the median, though
  it fails less often and is better below 1,500 m. A degree-day model calibrated on ten years of each station's own
  snow is better still (0.925).
reads: "Daily precipitation P (mm, the gauge total for the local day), T_mean, T_min and T_max (deg C) from the station itself, plus its latitude and elevation. Each water year is read from 1 August of the previous year to 1 October (427 days). Gaps are allowed: missing P counts as 0, missing T is interpolated, and both are flagged to the network. Never any SWE or snow depth."
returns:
  - "Daily SWE median (mm, end of day) with 68 % and 90 % bands (exam coverage of snow days 78 % and 96 %)"
  - "Per water year: peak SWE (mm) with 68 % / 90 % intervals (exam coverage 76 % / 93 %)"
  - "Per water year: peak date, and melt-out date (first day after the peak below 5 mm) with 68 % / 90 % intervals (exam coverage 86 % / 95 %)"

physics:
  summary: >-
    Point snowpack mass and energy balance. WaterSim's two snow routines run snow-only at the station (one band, no
    runoff model): the HBV-light degree-day routine (rain/snow partition over TT +- TTI/2, snowfall correction, melt
    CFMAX (T - TT), refreeze, liquid water holding) and a daily single-layer energy balance after Walter et al. (2005)
    and the Utah Energy Balance model (net shortwave with an ageing albedo, Brutsaert long-wave with a cloud correction,
    bulk-transfer sensible and latent heat with a stability reduction, ground and rain heat, cold content, refreeze,
    sublimation). Radiation comes from the daily temperature range (Hargreaves-Samani).
  simulator:
    - "WaterSim v1 (shared/water/watersim), model='none', one band at the station; each simulated station-winter uses one routine, 50/50"
    - "Weather: real daily P and T of the dev SNOTEL stations, water years up to 2010 only; six dev stations held out for the frozen simulated sets. Climate shifts P x e^N(0, 0.3), T + N(0, 1.5) deg C with elevation moved by the lapse rate, latitude +- 1 deg"
    - "Snow parameters (p3, p4): a multivariate normal fitted to per-station calibrations of both routines on 36 dev stations' own SWE, water years up to 2010 (training/prior_p4.json; means TT 0.99 C, CFMAX 3.6 mm/C/d, SFCF 1.01 for degree-day; TT 0.91 C, ALB_DECAY 2.4 d, TURB 0.17, GHEAT 0.32 MJ/m2/d for energy balance)"
    - "Plausibility filter: simulated windows with more than 5 mm of SWE on 1 August are dropped (cold-shifted runs grew perennial packs)"
  checks:
    - "Degree-day routine against a 5-day hand calculation: 0.0 mm; identical to TUWmodel 1.1-1 to <= 1e-12 mm (shared/water/checks/analytic.json, reference_models.json)"
    - "Energy-balance terms exact against hand arithmetic; mass closes to 6e-15 mm (shared/water/checks/analytic.json)"
    - "Against SNOTEL pillows at 33 dev stations, WY2011-2025 (shared/water/checks/snotel.json): degree-day NSE 0.700 with default parameters and 0.892 calibrated per station; energy balance 0.824 default and 0.930 calibrated"
    - "Twin test, 38 dev stations, WY2011-2025 (training/twin_r6.json): each station's calibrated energy-balance twin scores NSE 0.917 against its pillow; the released network reads the twin at 0.914 and the pillow at 0.888"

noise: >-
  Real weather, not synthetic: the simulated snowpacks are driven by the dev stations' own recorded P and T. From rung
  R2 on, the snowpack feels a 'true' weather that differs from the gauge record the network reads: wet-day P x
  lognormal(sd 0.25), 15 % of wet days slip part of their total to the next or previous day, temperature error AR(1)
  0.6 deg C plus a station bias N(0, 0.5) deg C, and injected data gaps in the network input (P set to 0, T
  interpolated, both flagged).
network: >-
  Input layer 10 -> 64 (tanh), a 2-layer GRU with 64 hidden units, and a head 64 -> 5 giving five monotone quantiles
  (5, 16, 50, 84, 95 %) of z = sqrt(SWE)/10, trained with a pinball loss on the water-year days; 50,949 parameters.
  Input channels per day: log1p(P)/2, T_mean/10, T_min/10, T_max/10, sin and cos of day of year, P-gap and T-gap
  flags, (elevation - 2200)/800, (latitude - 43)/8. Released rung R6: 48,000 simulated station-winters (two physics-p4
  banks), fine-tuned R1 -> R6, AdamW one-cycle, batch 128, one CPU thread. numpy-only inference, about 0.05 s per
  station-year.
approach:
  real_backdrop: "Real daily precipitation and temperature records of the dev SNOTEL stations (water years up to 2010) drive every simulated snowpack, shifted to other climates"
  physics_inputs: false
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: USDA NRCS SNOTEL daily SWE, precipitation and air temperature
    url: https://wcc.sc.egov.usda.gov/reportGenerator/
    licence: US public domain (USDA NRCS National Water and Climate Center)
    role: "noise and physics (dev stations' weather up to WY2010 drives the simulations), dev (36 dev stations' SWE up to WY2010 for the parameter prior; 38 dev stations WY2011-2025 for the gate, the twin test and the widen factors), exam (621 exam stations WY2011-2025; examples/ holds three of them, WY2016-2025)"
  - name: WaterData snow baselines (climatology and per-station calibrated degree-day, Watershed Phase 1)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/waterdata
    licence: Derived from US public-domain SNOTEL data; code MIT
    role: exam (baselines, data/proc/baselines/snow_scores.parquet)
  - name: WaterSim v1 snow routines (HBV-light after Bergstrom 1976 and Seibert & Vis 2012; energy balance after Walter et al. 2005 and Tarboton & Luce 1996; Hargreaves & Samani 1985; Brutsaert 1975)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/watersim
    licence: MIT (code in this repository)
    role: physics (simulator and the uncalibrated exam baselines)

split:
  dev: "WaterData's frozen SNOTEL split (shared/water/data/proc/splits.json, seed 20261118): 39 dev stations, drawn per state, systematically by elevation, only where the HUC8 holds no exam CAMELS gauge. Training weather: dev stations up to WY2010, six of them (1059_CO, 461_UT, 510_MT, 560_WY, 573_NV, 647_OR) held out for the frozen simulated sets. Parameter prior: dev SWE up to WY2010. Dev gate, widen factors and twin test: the 38 dev stations with at least 5 complete water years in 2011-2025."
  exam: "The 621 of 772 exam stations that WaterData scored (at least 5 complete calibration and scoring years), water years 2011-2025, end-of-day SWE against the pillow's next-morning reading (WaterData's protocol). Scored once, after the ratchet had chosen the release on simulated and dev data only."

exam:
