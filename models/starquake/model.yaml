id: starquake
name: StarQuake
version: "1.1.1"
status: released
released: 2026-11-15
order: 9
domain: Astrophysics
tags: [asteroseismology, Kepler, red giants, spectra, uncertainty]
accent: "#d6409f"
tagline: Weighing stars by listening to them ring.
question: How massive and how big is this red giant, from the way its surface oscillates?
question_short: "How massive and how big is this red giant, from how it rings?"
summary: >-
  From a Kepler light curve, StarQuake decides whether a red giant's solar-like oscillations are present, then
  reads where the oscillation hump peaks (νmax) and the spacing of its comb of modes (Δν), each with an error bar.
  With a temperature, scaling relations turn those into mass and radius. It was trained only on simulated stars
  laid into real light curves of quiet dwarfs. Since v1.1 a classical SYD-style reading is blended in where the two
  agree, by a weight that grows with the observing length (fitted on simulations).

reads: A Kepler long-cadence light curve (any length from 27 days to 4 years), plus an effective temperature for mass and radius.
returns:
  - Oscillations detected (yes/no)
  - νmax and Δν (μHz), each with an error bar
  - Mass and radius (solar units) with error bars, via the scaling relations

physics:
  summary: >-
    Two super-Lorentzian granulation components, a Gaussian oscillation envelope, the universal red-giant
    mode pattern for l = 0–3 with dipole mixed modes, linewidths and stochastic excitation, generated by
    inverse FFT and added to real Kepler light curves of quiet dwarfs (which oscillate above Nyquist, so their
    light curves are pure real noise and real gaps).
  simulator:
    - Granulation from Kallinger et al. 2014; envelope width from Mosser et al. 2012; amplitudes from Yu et al. 2018
    - Universal pattern (Mosser 2011) with ε(Δν), δ01, δ02, δ03 and curvature; mixed modes from ΔΠ1 and q
    - χ² (2 dof) stochastic excitation and sinc² apodisation
    - "v2, calibrated on dev twins: humps 0.24 dex lower (Kjeldsen 2008 amplitude convention), width fitted on dev"
  checks:
    - "χ² statistics: mean 1.004, variance 1.001; Parseval ratio 0.988–0.990"
    - "A classical pipeline recovers 24 simulated stars' inputs to 1.4% (νmax) and 0.6% (Δν)"
    - "Reproduces Yu et al.'s 16,094 masses and radii (ratio 1.000)"
noise: Real Kepler light curves of 232 quiet dwarfs (training) and 42 (validation), after a variability screen
network: Two CNN branches, 412k parameters — 1-D on the log spectrum, 2-D on a comb map (autocorrelation in units of the expected Δν); v1.1 blends the network's νmax and Δν with a classical SYD-style reading by length-dependent weights fitted on simulations

approach:
  real_backdrop: "Kepler light curves of 232 quiet dwarf stars"
  physics_inputs: "A comb map: the autocorrelation in units of the expected Δν"
  physics_anchor: "v1.1: the classical SYD-style reading (background fit, smoothed excess, autocorrelation), blended with the network where they agree"
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: Kepler light curves (NASA, via MAST)
    url: https://archive.stsci.edu/missions-and-data/kepler
    licence: Public (NASA); cite Kepler and MAST
    role: noise, dev, exam
  - name: Yu et al. 2018, ApJS 236, 42 (16,094 red giants)
    url: https://doi.org/10.3847/1538-4365/aaaf74
    licence: Journal machine-readable tables; cite the paper
    role: truth
  - name: Gaia DR3 FLAME radii (ESA/Gaia/DPAC)
    url: https://www.cosmos.esa.int/web/gaia/dr3
    licence: CC BY-SA 3.0 IGO; acknowledge ESA/Gaia/DPAC
    role: exam

split:
  dev: 18 stars, 3 per νmax stratum
  exam: 420 stars, 70 in each of six νmax strata from 8 to 250 μHz (seed 2026), each read at 4 yr, 1 yr, 90, 54 and 27 days

exam:
  short: "420 Kepler giants × 5 lengths"
  summary: 420 red giants, each read from five lengths of its own light curve.
  results:
    - metric: νmax median error, 4-year light curves
      better: lower
      model: 0.99
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 0.89 }
        - { name: "Dev median guess", kind: dumb, value: 77 }
      verdict: loss
      note: "v1.1.1: record ends trimmed (dated re-score, 27 Nov 2026; v1.1 untrimmed: 1.01%). v1.1 (classical backbone): 95% of stars within 5% (classical 91%), but the median error still loses. v1.0: 1.49% (re-scored: 1.49%)."
    - metric: νmax median error, 1 year
      better: lower
      model: 1.41
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 1.67 }
      verdict: win
      note: "v1.0: 1.68% (re-scored: 1.67%), a tie. Not a dev target (on dev the network already led at 1 year); the gain comes with the long-length blend."
    - metric: νmax median error, 90 days
      better: lower
      model: 2.22
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 3.89 }
      verdict: win
      note: "v1.0: 2.17%."
    - metric: Δν median error, 27 days
      better: lower
      model: 4.37
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 26.8 }
      verdict: win
      note: "v1.1.1, record ends trimmed (v1.1: 4.29%; trimming shifts where the 27-day pieces fall in 22 stars). v1.0: 4.60%."
    - metric: Giants found from 27 days
      better: higher
      model: 100
      unit: "%"
      baselines:
        - { name: "Classical comb test", kind: classical, value: 39.5 }
      verdict: win
      note: "Detection is the network's alone; unchanged in v1.1."
    - metric: Radius vs Gaia DR3 (scatter)
      better: lower
      model: 8.1
      unit: "%"
      baselines:
        - { name: "Yu et al. radii", kind: published, value: 8.1 }
        - { name: "Classical pipeline", kind: classical, value: 8.7 }
      verdict: tie
      note: "v1.1.1 (trimmed ends): 8.12%. v1.1: 8.04% vs Yu's 8.06%, a difference far inside the noise: a tie, not a win (ratio to Gaia 1.063, as Yu's). Worse than v1.0 (7.1%, ratio 1.076), which won this row. Gaia FLAME radii of the same 222 exam stars as for v1.0 (kept in lab/index.html): the ESA Gaia archive could not be reached on 15 Nov 2026."
  coverage:
    - { output: "νmax (4 yr)", actual: 81 }
    - { output: "Δν (4 yr)", actual: 83 }
    - { output: "νmax (27 d)", actual: 58 }
    - { output: "Δν (27 d)", actual: 63 }
wins:
  - On light curves of 1 year and shorter it beats the classical pipeline (νmax 1.41 % vs 1.67 % at 1 year, 2.2 % vs 3.9 % at 90 days, 3.5 % vs 16.5 % at 27 days).
  - Finds 100% of giants from 27 days against 39.5% for the classical comb test.
losses:
  - On 4-year light curves the classical pipeline still wins on the median νmax error (0.89 % vs 0.99 %), though v1.1 blends it in — and the truth catalogue was made with a similar pipeline.
  - The radius scatter against Gaia rose from 7.1 % (v1.0) to 8.1 %, level with Yu et al.'s radii.
  - Δν from 27 days is within 2% for only 23% of stars (often off by one comb tooth).
limits:
  - "Error bars too narrow on short pieces (1σ coverage 58–63% at 27 days) and too wide on whole light curves (81–84%): one widening factor per output, fitted on 18 dev stars over all lengths."
  - "v1.1 runs the classical pipeline on every reading (up to a second on short pieces); the browser instrument shows the network stage only."
  - "The blend weights were fitted on simulations, where the classical νmax reads about 0.7% low; on real stars it agrees with the truth catalogue, which the weights cannot know."
  - 11–15% of unscreened dwarfs are falsely called oscillating.
  - The most luminous giants (νmax 8–15 μHz) read about 4% high; their twins show the same bias.
  - Kepler long cadence only; no TESS yet.
  - "False detections (audit, 25 Nov 2026): unstructured Gaussian noise on a real Kepler cadence mask triggers the detector on 5 of 10 draws at 500 ppm and 10 of 10 at 1,000 ppm, the RMS range of real giants. Measured 27 Nov 2026 on 999 pieces of the 18 held-out high-RMS dwarfs that the noise screen dropped (spots, rotation, eclipses): 16.9% are called oscillating, against 6.1% of quiet dwarfs. A rung trained with such stars in the noise bank cut that to 11.1% but failed the ratchet (val3 +0.007, needs +0.01; dev errors +22%). Cadences without good flux at either end of a record lower the duty cycle and change the FFT grid (90 flagged days moved KIC 2695975 from 1.677 to 1.777 solar masses); since v1.1.1 grid_lc trims them by default (36 of 858 archived light curves, 22 of 420 exam stars, start or end on a gap)."
next:
  - Per-length σ widening, fitted on dev.
  - Make the simulator's νmax the one a SYD-style pipeline measures on the noiseless spectrum, so the blend weights learn the real classical reading.
  - A TESS version on quiet-star noise, examined on TESS giants.
  - "Hard negatives without losing dev accuracy: r6 (27 Nov 2026) cut high-RMS false alarms from 16.9% to 11.1% but read the dev stars 22% worse. A warm start from the released network, or the hard bank as a fine-tuning stage, is the next rung."
usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    import numpy as np, pipeline as PL
    from starquake import StarQuake
    y = PL.load_kepler(np.load("examples/7353997.npz"))
    r = StarQuake().read_ppm(y, teff=4800, e_teff=100)
    print(r["numax"], r["dnu"], r["mass"], r["radius"])

files:
  inference: [starquake.py, pipeline.py, classical.py]
  weights: [starquake_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 10
