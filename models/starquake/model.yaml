id: starquake
name: StarQuake
version: "1.0"
status: released
released: 2026-11-06
order: 9
domain: Astrophysics
tags: [asteroseismology, Kepler, red giants, spectra, uncertainty]
accent: "#d6409f"
tagline: Weighing stars by listening to them ring.
question: How massive and how big is this red giant, from the way its surface oscillates?
summary: >-
  From a Kepler light curve, StarQuake decides whether a red giant's solar-like oscillations are present, then
  reads where the oscillation hump peaks (νmax) and the spacing of its comb of modes (Δν), each with an error bar.
  With a temperature, scaling relations turn those into mass and radius. It was trained only on simulated stars
  laid into real light curves of quiet dwarfs.

reads: A Kepler long-cadence light curve (any length from 27 days to 4 years), plus an effective temperature for mass and radius.
returns:
  - Oscillations detected (yes/no)
  - νmax and Δν (μHz), each with an error bar
  - Mass and radius (solar units) with error bars, via the scaling relations

physics:
  summary: >-
    Two super-Lorentzian granulation components, a Gaussian oscillation envelope, the universal red-giant
    mode pattern for l = 0–3 with dipole mixed modes, linewidths and stochastic excitation, generated by
    inverse FFT and added to real Kepler light curves of quiet dwarfs (which oscillate above Nyquist, so their
    light curves are pure real noise and real gaps).
  simulator:
    - Granulation from Kallinger et al. 2014; envelope width from Mosser et al. 2012; amplitudes from Yu et al. 2018
    - Universal pattern (Mosser 2011) with ε(Δν), δ01, δ02, δ03 and curvature; mixed modes from ΔΠ1 and q
    - χ² (2 dof) stochastic excitation and sinc² apodisation
    - "v2, calibrated on dev twins: humps 0.24 dex lower (Kjeldsen 2008 amplitude convention), width fitted on dev"
  checks:
    - "χ² statistics: mean 1.004, variance 1.001; Parseval ratio 0.988–0.990"
    - "A classical pipeline recovers 24 simulated stars' inputs to 1.4% (νmax) and 0.6% (Δν)"
    - "Reproduces Yu et al.'s 16,094 masses and radii (ratio 1.000)"
noise: Real Kepler light curves of 232 quiet dwarfs (training) and 42 (validation), after a variability screen
network: Two CNN branches, 412k parameters — 1-D on the log spectrum, 2-D on a comb map (autocorrelation in units of the expected Δν)

data:
  - name: Kepler light curves (NASA, via MAST)
    url: https://archive.stsci.edu/missions-and-data/kepler
    licence: Public (NASA); cite Kepler and MAST
    role: noise, dev, exam
  - name: Yu et al. 2018, ApJS 236, 42 (16,094 red giants)
    url: https://doi.org/10.3847/1538-4365/aaaf74
    licence: Journal machine-readable tables; cite the paper
    role: truth
  - name: Gaia DR3 FLAME radii (ESA/Gaia/DPAC)
    url: https://www.cosmos.esa.int/web/gaia/dr3
    licence: CC BY-SA 3.0 IGO; acknowledge ESA/Gaia/DPAC
    role: exam

split:
  dev: 18 stars, 3 per νmax stratum
  exam: 420 stars, 70 in each of six νmax strata from 8 to 250 μHz (seed 2026), each read at 4 yr, 1 yr, 90, 54 and 27 days

exam:
  summary: 420 red giants, each read from five lengths of its own light curve.
  results:
    - metric: νmax median error, 4-year light curves
      better: lower
      model: 1.49
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 0.89 }
        - { name: "Dev median guess", kind: dumb, value: 77 }
      verdict: loss
    - metric: νmax median error, 1 year
      better: lower
      model: 1.68
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 1.67 }
      verdict: tie
    - metric: νmax median error, 90 days
      better: lower
      model: 2.17
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 3.89 }
      verdict: win
    - metric: Δν median error, 27 days
      better: lower
      model: 4.60
      unit: "%"
      baselines:
        - { name: "SYD-style classical pipeline", kind: classical, value: 26.8 }
      verdict: win
    - metric: Giants found from 27 days
      better: higher
      model: 100
      unit: "%"
      baselines:
        - { name: "Classical comb test", kind: classical, value: 39.5 }
      verdict: win
    - metric: Radius vs Gaia DR3 (scatter)
      better: lower
      model: 7.1
      unit: "%"
      baselines:
        - { name: "Yu et al. radii", kind: published, value: 8.1 }
        - { name: "Classical pipeline", kind: classical, value: 8.7 }
      verdict: win
  coverage:
    - { output: "νmax (4 yr)", actual: 72 }
    - { output: "Δν (4 yr)", actual: 78 }
    - { output: "νmax (27 d)", actual: 54 }
    - { output: "Δν (27 d)", actual: 58 }

wins:
  - On short light curves (≤ 1 year) it beats the classical pipeline, by a lot at 27–90 days.
  - Finds 100% of giants from 27 days against 39.5% for the classical comb test.
losses:
  - On 4-year light curves the classical pipeline wins — and the truth catalogue was made with a similar pipeline.
  - Δν from 27 days is within 2% for only 23% of stars (often off by one comb tooth).
limits:
  - Error bars too narrow on short pieces (1σ coverage 54–58% at 27 days).
  - 11–15% of unscreened dwarfs are falsely called oscillating.
  - The most luminous giants (νmax 8–15 μHz) read about 4% high; their twins show the same bias.
  - Kepler long cadence only; no TESS yet.
next:
  - Per-length σ widening and a νmax-dependent bias correction.
  - A TESS version on quiet-star noise, examined on TESS giants.
  - More training and hard negatives (spotted and eclipsing dwarfs).

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    import numpy as np, pipeline as PL
    from starquake import StarQuake
    y = PL.load_kepler(np.load("examples/7353997.npz"))
    r = StarQuake().read_ppm(y, teff=4800, e_teff=100)
    print(r["numax"], r["dnu"], r["mass"], r["radius"])

files:
  inference: [starquake.py, pipeline.py]
  weights: [starquake_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 2
