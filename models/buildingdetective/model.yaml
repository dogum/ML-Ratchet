        - { name: "Dev-fitted line log10 A = 0.73 log10 kWh − 0.49 (no use given) (1,364)", kind: classical, value: 40.9 }
        - { name: "Dev median floor area", kind: dumb, value: 68.0 }
      verdict: loss
      note: "Seen (re-scored 17 Nov 2026). Minus the best baseline: +6.2 [+3.2, +9.5], 95 % bootstrap over buildings, on its 1,364 (Detective 47.1 there). Against Electricity ÷ dev median EUI of the TRUE use: −4.4 [−8.5, −0.4]; Electricity ÷ dev median EUI of all uses: −1.0 [−4.7, +2.0]. v1.0: tie. v1.0 reported 49.4 %: here 157 of 1,428 buildings get different monthly features, because the 12-point PRISM grid fit has exact ties that floating-point noise breaks (numpy 2.5); the hourly reading moves for 24 buildings (median unchanged), the annual for none. 62 % within ×2."
    - metric: "BDG2 floor area, annual input, median abs. % error (1,428 buildings; seen)"
