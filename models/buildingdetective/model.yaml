id: buildingdetective
name: BuildingDetective
version: "1.0"
status: released
released: 2026-11-17
order: 19
domain: Buildings
platform: building
tags: [buildings, energy audit, building energy, smart meters, PRISM, change-point, floor area, heating systems, uncertainty]
accent: "#8f5d00"
tagline: What kind of building is this, from its meters and the weather?
question: From a building's energy meters and the local weather, how big, how old, how leaky and how heavy is it, what heats and cools it, and what is it used for?
question_short: "From meters and weather: floor area, systems, envelope, use *(no real row beats dev-fitted baselines)*"
disclaimer: "Research model, not an energy audit. On real buildings it wins no exam row against the strongest classical baselines fitted on the same dev data: 21 losses and 7 ties (re-scored 17 Nov 2026 with 95 % intervals). It beats the simple meter rules for the heating system, but a logistic model fitted on the dev surveys does better; it loses on primary use (11 % right against 40 % for the majority class), has no skill on year built, and envelope UA and time constant have no real truth at all."
summary: >-
  BuildingDetective reads a building's meters (electricity, on-site fuel, district heat, district chilled water) and
  the outdoor weather at one of three resolutions: a year of hourly data, 12 monthly bills, or one annual total per
  fuel. It returns floor area, year built, envelope conductance UA (W/K and W/m²K), thermal time constant, heating and
  cooling balance points, heating and cooling energy per kelvin, non-HVAC share, weekday operating hours and weekend
  ratio, each with a 1-sigma bar, and probabilities for primary use (12 classes), heating system (heat pump,
  resistance, fuel, district, none) and cooling system (none, DX, chiller, district). It learned only from 12,000
  BuildingSim buildings on real 2016-17 weather with emulated meter faults, and was examined once on 1,428 real BDG2
  buildings, 7,401 RECS homes, 2,558 CBECS buildings and 24 HUE homes.

reads: "Hourly: up to a year (30 days minimum) of hourly mean kW per meter (elec, fuel, dheat, dcool; NaN for missing hours, hour-beginning), outdoor temperature (°C), global horizontal irradiance (W/m²), the local time of each hour and the latitude. Monthly: 12 monthly mean kW per meter plus monthly mean temperature and heating/cooling degree days per day (base 18.33 °C). Annual: kWh per year per fuel plus annual heating and cooling degree days (base 18.33 °C)."
returns:
  - "Floor area (m²) and year built, each with a 1-sigma bar widened on real dev buildings (hourly area ×3.0, monthly ×1.54, annual ×1.08)"
  - "Envelope UA (W/K and W/m²K), thermal time constant (h), heating and cooling balance points (°C), site heating and cooling energy per kelvin (W/K), non-HVAC share of site energy: 1-sigma bars widened on the simulated twins of the 52 BDG2 dev buildings (no real truth exists)"
  - "Weekday operating hours (h/day) and weekend/weekday ratio, commercial only (no real hourly truth)"
  - "Probabilities: primary use (12 classes, dev-fitted temperature 10 for hourly and monthly, 7.4 annual, which flattens them on purpose), heating system (5 classes) and cooling system (4 classes)"

physics:
  summary: >-
    BuildingSim, the collection's building simulator (shared building platform, Phase 1): an ISO 13790 5R1C single-zone
    heat balance with Perez solar gains, LBL infiltration, ventilation and moisture, and 13 HVAC systems built from
    capacity, COP and EIR curves with part load, defrost, fans, pumps and district plants. Labels come from the
    simulator itself: UA is the 5R1C network conductance (labels()['UA_network_W_K']), tau, balance points, end-use
    shares, schedules and system classes. Three wrappers calibrated on dev only (training/wrappers.py, upstream
    candidates for BuildingSim) set use-type intensities (W1), campus district service (W2) and always-on base loads
    found by the dev twin test (W3, physics v2).
  simulator:
    - "Bank: 12,000 generated buildings (30 % homes, 70 % commercial in 10 types) drawn from ResStock, ComStock and CBECS priors, on real 2016-17 weather of 18 BDG2 sites (Peacock left out: its weather does not match its location) and TMYx cities, at 1 h; frozen validation set = bank shards 900-904 (1,000 buildings)"
    - "W1 intensity: one factor per use type so generated site-energy medians match the RECS/CBECS prior and dev medians (e.g. lab 0.42, education 0.55, lodging 1.55)"
    - "W2 campus: district meters scaled by a distribution factor fitted on the 52 BDG2 dev twins (heat 0.18, chilled water 0.33; meter = delivered / factor); 30 % of commercial buildings on campus service"
    - "W3 always-on base loads (physics v2): a share of each district meter's annual energy moved into a flat base (heat 0.70, chilled water 0.50) plus a flat unmodelled electricity load"
    - "Meter emulation on every simulated meter: partial records, gaps, zero runs, spikes, level shifts, clock offsets, daily totals spread over 24 h, shared unmodelled loads, sub-meter scale errors and noise; bills get shifted billing windows (0-15 days) and missing months; annual surveys get unreported fuels"
  checks:
    - "BuildingSim Phase 1 (shared building platform checks): steady conduction to 1.8e-9, RC step within 0.0035 K, degree-day ratio 0.999996, ISO 13786 wall amplitude −1.6 % and lag −0.01 h, every energy ledger closes to 1e-8"
    - "BESTEST (ASHRAE 140): 29 of 34 values inside the published ranges, all 20 annual heating and cooling values in (ranges transcribed from the literature)"
    - "ResStock twins (126 homes): site energy median 1.10× (IQR 0.98-1.26), daily r 0.92; ComStock twins (45): 0.86× (aggregate 0.97), daily r 0.89"
    - "Dev twin test (52 BDG2 dev buildings vs simulated twins from their metadata, medians): district-heat heating slope real 0.81 vs twin 4.38 before W3 and 1.00 after; chilled-water night/day real 0.69 vs 0.31 before and 0.63 after; electricity night/day real 0.77 vs 0.66 before and 0.74 after (training/twintest.json)"
    - "The release's JS feature port (training/detective.js) matched Python to 2e-7 on real and simulated buildings; the site's live instrument matches the Python release to 1e-6 on 60 control settings of the 12 example units"
noise: "Synthetic meter faults modelled on the BDG2 quirks BuildingData documents (gaps, zero runs, spikes, level shifts, clock offsets, Gator-style daily-spread readings, shared loads, scale errors, AR(1) and day-level multiplicative noise; features.quirk_hourly / quirk_monthly / quirk_annual). No real meter residuals are added; the simulated buildings run in real hourly weather."
network: "Three MLPs, one per input resolution, each 2 × 256 GELU with a Gaussian head (mean and log-sigma) for 12 regression targets (missing labels masked) and three softmax heads; trained with heteroscedastic NLL plus cross-entropy on simulations only. Hourly: 1,199 engineered features (daily load in 19 temperature bins for weekdays and weekends, the 168-hour week profile, cold- and hot-day profiles, a PRISM 5-parameter change-point fit, correlations with exponentially smoothed temperature at 6 time constants, hourly lag correlations, robust statistics), 0.38 M parameters (384,557). Monthly: 112 features, 106,285 parameters. Annual: 12 features, 80,685 parameters."

approach:
  real_backdrop: "Real hourly 2016-17 weather of 18 BDG2 sites (and TMYx typical years) that every simulated building runs in"
  physics_inputs: "A PRISM 5-parameter change-point fit (base load, heating and cooling slopes, balance points), degree days and daily-temperature bins computed from the meters and the weather"
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: "Building Data Genome 2 (BDG2): hourly meters and metadata of 1,636 non-residential buildings, 2016-17 (Miller et al., Scientific Data 7, 368, 2020), cleaned by BuildingData"
    url: https://github.com/buds-lab/building-data-genome-project-2
    licence: "CC BY-SA 4.0 (share-alike): examples/bdg2/, lab/index.html and the instrument data carry the notice"
    role: "physics (site weather for the bank), calibration (W2 campus factors and W3 base loads from the 52 dev twins), dev gate, error bars (area, year), exam (1,428 buildings with electricity, 2017); examples/bdg2/ (3 exam buildings)"
  - name: EIA Residential Energy Consumption Survey (RECS) 2020 microdata
    url: https://www.eia.gov/consumption/residential/data/2020/
    licence: Public domain (U.S. Government)
    role: "physics (W1 intensity prior), dev gate and error bars (1,848 respondents), exam (7,401); examples/examples.json (4 respondents)"
  - name: EIA Commercial Buildings Energy Consumption Survey (CBECS) 2018 microdata
    url: https://www.eia.gov/consumption/commercial/data/2018/
    licence: Public domain (U.S. Government)
    role: "physics (generator prior, W1), dev gate and error bars (661 respondents), exam (2,558); examples/examples.json (4 respondents)"
  - name: "HUE: The Hourly Usage of Energy dataset for buildings in British Columbia (S. Makonin, Data in Brief 23, 2019)"
    url: https://doi.org/10.7910/DVN/N3HGRN
    licence: CC BY 4.0
    role: "exam only (24 homes, electric heat or not); examples/examples.* (1 home); 5 homes in lab/index.html"
  - name: "NREL ResStock 2025 R1 and ComStock 2025 R3 (End-Use Load Profiles, OEDI). \"Data includes information from the ResStock and ComStock datasets developed by the National Renewable Energy Laboratory (NREL; now National Laboratory of the Rockies) with funding from the U.S. DOE.\""
    url: https://data.openei.org/submissions/4520
    licence: CC BY 4.0
    role: "physics (BuildingSim generator priors); the simulator-vs-simulator check (58 ResStock homes, 90 ComStock buildings, EnergyPlus meters), report only, never for choosing"
  - name: TMYx typical-year weather (climate.onebuilding.org, 2011-2025)
    url: https://climate.onebuilding.org
    licence: "Cite Lawrie and Crawley, TMYx; the site says All Rights Reserved and states no reuse licence: used for simulation only, not redistributed"
    role: physics (weather for part of the bank)

split:
  dev: "BuildingData's frozen splits (data/proc/splits.json, seed 20261116): 52 BDG2 buildings, 1,848 RECS and 661 CBECS respondents. They were the only real labelled data used: W1/W2/W3 calibration, the twin test, the dev gate, the error-bar widening and the class temperatures. RECS (9,247) and CBECS (3,217) prior respondents set the generator and W1 priors."
  exam: "Everything else: 1,584 BDG2 exam buildings (1,428 with a usable 2017 electricity year), 7,401 RECS homes, 2,558 CBECS buildings and 24 HUE homes; run once, after all choices were frozen (training/exam.json). Exam features were computed before the exam with no metric looked at."

exam:
  short: "1,428 BDG2 buildings, 7,401 RECS homes, 2,558 CBECS buildings, 24 HUE homes"
  summary: >-
    Real truth only where it exists: floor area, use, year built and which meters exist for BDG2 (2017 meters), survey
    answers for RECS and CBECS (annual totals), the heating type of HUE homes. Baselines marked TRUE are given the true
    use type, which the Detective is not. Envelope UA, time constant and balance points have no real truth; their rows
    are simulator-only (held-out BuildingSim buildings, or EnergyPlus ResStock/ComStock meters graded against a
    BuildingSim twin) and are info. The real rows were re-scored on 17 Nov 2026 with the released weights (the exam
    is seen: nothing was chosen from it) against fair baselines fitted on dev only (the 52 BDG2, 1,848 RECS and 661
    CBECS dev units the simulator was tuned on): dev-fitted lines and logistic models on the same 12 annual numbers the
    network gets, a dev site prior, a dev week-profile centroid, and a PRISM change-point reading for HUE. Verdict: 95 %
    bootstrap interval on Detective minus the best baseline (2,000 resamples of buildings, homes or respondents, seed
    20261117): win if it excludes zero on the good side, loss on the bad side, tie if it spans zero. The best baseline
    is sometimes given the TRUE use or type; the note then gives the interval against the best one that is not.
    Simulator rows were not re-run (they need the 60-shard bank).
  results:
    - metric: "BDG2 floor area, hourly input, median abs. % error (1,428 buildings; seen)"
      better: lower
      model: 50.0
      unit: "%"
      baselines:
        - { name: "Electricity ÷ dev median EUI of the TRUE use (given the use; 1,364)", kind: classical, value: 51.5 }
        - { name: "Electricity ÷ dev median EUI of all uses (1,364)", kind: classical, value: 48.1 }
        - { name: "Dev-fitted line log10 A = 0.73 log10 kWh − 0.49 (no use given) (1,364)", kind: classical, value: 40.9 }
        - { name: "Dev median floor area", kind: dumb, value: 68.0 }
      verdict: loss
      note: "Seen (re-scored 17 Nov 2026). Minus the best baseline: +8.8 [+5.9, +11.3], 95 % bootstrap over buildings, on its 1,364 (Detective 49.7 there). Against Electricity ÷ dev median EUI of the TRUE use: −1.8 [−6.0, +2.0]; Electricity ÷ dev median EUI of all uses: +1.5 [−2.3, +4.7]. v1.0: tie. v1.0 called this a tie by eye against the TRUE-use rule; that interval spans zero. The dev line beats the TRUE-use rule itself: its slope 0.73 (52 dev buildings) shrinks extreme readings. BuildingData's 46.4 % for the TRUE-use rule is on its 1,133 quality-checked meters, a different set. 58 % within ×2."
    - metric: "BDG2 floor area, monthly input, median abs. % error (1,428 buildings; seen)"
      better: lower
      model: 49.6
      unit: "%"
      baselines:
        - { name: "Electricity ÷ dev median EUI of the TRUE use (given the use; 1,364)", kind: classical, value: 51.5 }
