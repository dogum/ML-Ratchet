# The ratchet ladders, normalised from training/ratchet.json (one ladder per input resolution; the three networks share
# one frozen set and one chained dev gate).
model: buildingdetective
ladders:
  - name: "BuildingDetective v1.0, hourly network"
    objective: "Skill on the frozen simulated validation set (bank shards 900-904: 1,000 BuildingSim buildings; hourly and annual read two meter-quirk draws per building (2,000), monthly one (1,000)): the mean of 12 regression R² (clipped at 0) and 3 class balanced accuracies rescaled so chance = 0"
    rule: "Keep a rung if its frozen-set skill beats the incumbent of the same network by more than 0.01 AND the real dev composite (all three networks together, the candidate in place of its incumbent) is no more than 0.02 below the composite of the last kept rung of any network. A physics change rebuilds the frozen set from the same shards and re-scores the incumbents."
    margin: 0.01
    dev_gate: "Real dev composite in [0, 1], mean of: BDG2 dev (52 buildings) floor-area score 1 − MdAPE/64.3 and use macro-F1 for each network; RECS dev (1,848) area score 1 − MdAPE/50, heat pump vs resistance 2·bal.acc − 1, fuel-vs-electric accuracy; CBECS dev (661) area score 1 − MdAPE/76, use macro-F1, heating-class accuracy. It may fall at most 0.02 per kept rung."
    frozen_sets: [v1, v2]
    scored_on: v2
    note: "Raw log: training/ratchet.json (training/ratchet.py). The dev gate is chained across the three networks: each rung is compared with the gate value of the last kept rung of any network, so it drifted from 0.331 (R4-hourly) to 0.306 (R9-annual) over the kept rungs, 0.025 in all, each step inside the 0.02 tolerance; the gate is small and noisy. R3c-hourly was kept by the rule and then withdrawn by hand for breaking the ~500k parameter cap (1.16 M); R2-hourly was reinstated. Label hygiene (base_share undefined for 3 training buildings with ~0 metered site energy, balance points clipped to −25..30 °C) is logged as a re-score of the incumbents on the same frozen set. The gate's area scores are normalised by BuildingData's quoted dumb-baseline errors (64.3 %, 76 %), which BuildingData computed on the exam split; they are fixed constants and no model's exam result was used to choose anything. 525k-parameter 3×288 nets (R3d, R6, R8) were treated as within the ~500k cap. Integrity pass, 17 Nov 2026 (NOTEBOOK.md): no rung was run. The exam, now seen, was re-scored with the released weights against classical baselines fitted on the same dev data (dev-fitted lines and logistic models on the 12 annual features, a dev site prior, a dev week-profile centroid): 0 wins, 21 losses, 7 ties on the real rows by 95 % bootstrap intervals. A smoke test ran the bank, featurize and training scripts here (one 20-building shard each for train and frozen set, 1 epoch)."
    columns_source: "Real dev composite of the rung, the floor it had to clear, and the network's parameter count (training/ratchet.json cfg)"
    columns: ["Dev composite", "Gate floor (incumbent − 0.02)", "Parameters"]
    rungs:
      - { id: R1, change: "MLP 2x256 GELU, hetero NLL + 3 softmax heads; bank v1 shards 0-11 (2,400 buildings), features f1 (W1+W2, quirks) (physics v1)", sim: 0.7034, decision: kept, why: "first rung for this mode", metrics: [0.1928, "–", 384557] }
      - { id: rebaseline-v2, change: "Physics v2 (W3 always-on base loads from the dev twin test): frozen set rebuilt from the same shards 900-904, incumbent R1-hourly re-scored", sim: 0.6628, decision: kept, why: "Re-score, not a new network: 0.7034 → 0.6628. The number to beat from here on.", metrics: ["–", "–", "–"] }
      - { id: R2, change: "physics v2: retrain on f2 (W3 always-on base loads in district heat, chilled water, electricity), shards 0-11", sim: 0.6934, decision: kept, why: "val skill 0.6934 vs incumbent 0.6628 (delta +0.0306, need > 0.01); dev gate 0.3197 vs 0.3256 (ok)", metrics: [0.3197, "0.3056", 384557] }
      - { id: R3a, change: "wider/deeper MLP 3x512, dropout 0.25, wd 1e-3 (lr 2e-3: training diverged at epoch ~15)", sim: 0.4091, decision: rejected, why: "val skill 0.4091 vs incumbent 0.6934 (delta -0.2843, need > 0.01); dev gate 0.3081 vs 0.3285 (FAIL)", metrics: [0.3081, "0.3085", 1162797] }
      - { id: R3b, change: "MLP 2x256 with dropout 0.3, wd 1e-3, 80 epochs", sim: 0.6836, decision: rejected, why: "val skill 0.6836 vs incumbent 0.6934 (delta -0.0098, need > 0.01); dev gate 0.3247 vs 0.3285 (ok)", metrics: [0.3247, "0.3085", 384557] }
      - { id: R3c, change: "MLP 3x512, dropout 0.2, wd 1e-3, lr 7e-4 (stable)", sim: 0.7047, decision: rejected, why: "Kept by the rule (val skill 0.7047 vs incumbent 0.6934 (delta +0.0112, need > 0.01); dev gate 0.3236 vs 0.3285 (ok)), then withdrawn by hand: 1.16 M parameters breaks the ~500k parameter cap of the shared-machine rules; R2-hourly reinstated.", metrics: [0.3236, "0.3085", 1162797] }
      - { id: R3d, change: "MLP 3x288 (525k params, within cap), dropout 0.2, wd 1e-3, lr 7e-4", sim: 0.6948, decision: rejected, why: "val skill 0.6948 vs incumbent 0.6934 (delta +0.0014, need > 0.01); dev gate 0.3198 vs 0.3285 (ok)", metrics: [0.3198, "0.3085", 525069] }
      - { id: hygiene, change: "Label hygiene: base_share set to NaN when |value| > 1 (3 training buildings had ~0 metered site energy, base_share −8e12), balance points clipped to −25..30 °C; same frozen set v2, incumbent R2-hourly re-scored", sim: 0.6934, decision: kept, why: "Re-score, not a new network: 0.6934 → 0.6934. The number to beat from here on.", metrics: ["–", "–", "–"] }
      - { id: R4, change: "label hygiene (clean_labels), MLP 2x256, f2 shards 0-11", sim: 0.7457, decision: kept, why: "val skill 0.7457 vs incumbent 0.6934 (delta +0.0523, need > 0.01); dev gate 0.3310 vs 0.3285 (ok)", metrics: [0.3310, "0.3085", 384557] }
      - { id: R5, change: "more data: f2 shards 0-22 (4,600 buildings), MLP 2x256", sim: 0.7834, decision: kept, why: "val skill 0.7834 vs incumbent 0.7457 (delta +0.0376, need > 0.01); dev gate 0.3264 vs 0.3272 (ok)", metrics: [0.3264, "0.3072", 384557] }
      - { id: R6, change: "MLP 3x288 (525k params), dropout 0.2, wd 1e-3, lr 7e-4, shards 0-22", sim: 0.7790, decision: rejected, why: "val skill 0.7790 vs incumbent 0.7834 (delta -0.0043, need > 0.01); dev gate 0.3295 vs 0.3192 (ok)", metrics: [0.3295, "0.2992", 525069] }
      - { id: R7, change: "more data: f2 shards 0-39 (8,000 buildings), MLP 2x256", sim: 0.8010, decision: kept, why: "val skill 0.8010 vs incumbent 0.7834 (delta +0.0177, need > 0.01); dev gate 0.3288 vs 0.3192 (ok)", metrics: [0.3288, "0.2992", 384557] }
      - { id: R8, change: "MLP 3x288 (525k params), dropout 0.2, wd 1e-3, lr 7e-4, shards 0-39", sim: 0.8025, decision: rejected, why: "val skill 0.8025 vs incumbent 0.8010 (delta +0.0015, need > 0.01); dev gate 0.3202 vs 0.3289 (ok)", metrics: [0.3202, "0.3089", 525069] }
      - { id: R9, change: "more data: f2 shards 0-59 (12,000 buildings, the full bank), MLP 2x256", sim: 0.8126, decision: released, why: "val skill 0.8126 vs incumbent 0.8010 (delta +0.0116, need > 0.01); dev gate 0.3166 vs 0.3289 (ok). Released as v1.0 (weights/hourly.npz); the exam was run once after this.", metrics: [0.3166, "0.3089", 384557] }
