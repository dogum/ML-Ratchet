model: lawfinder
ladders:
- name: LawFinder Long-term runoff ratio (WaterSim)
  objective: R^2 of runoff ratio Q/P on the frozen simulated set
  rule: Keep a rung if its frozen-set R^2 beats the incumbent by more than 0.01 AND its dev error is no more than 5% worse.
    Rungs = Pareto-front laws in order of complexity, then physics versions; after a physics change every rung is re-scored
    on the new frozen set and every decision re-taken.
  margin: 0.01
  dev_gate: Dev error may not get more than 5 % worse
  frozen_sets:
  - val_w1
  - val_w2
  scored_on: val_w2
  columns_source: Dev error (the gate), then the real exam metric reported after the fact (never used to choose)
  columns:
  - Dev error
  - Exam mean |error| of Q/P
  rungs:
