limits:
- '<b>Water:</b> FlowCast, the collection''s ungauged network, beats the law (MAE 0.112 vs 0.129 on 619 basins). The law beats
  Budyko-Fu (0.141-0.154). In snowy basins (f_s > 0.3, 88 basins) every method is poor (law 0.22). All rows share ERA5-Land
  forcing, which under-catches mountain precipitation: 50 basins carry more water out than ERA5 says falls in.'
- '<b>Fire:</b> FireSim''s own law over-predicts real next-day growth a median 36 times (bias +1.56 decades). The released
  law survives only because the dev gate cut it down to a saturating curve. Over all fire-days it loses to FireData''s yesterday''s-growth
  baseline (1.15 vs 0.67 mean |log₁₀|); on growth days it is the best row (0.69 vs FireCast 0.76). FireSim has no fire persistence
  (stalls, burnout), the platform''s known gap. Slope was not an input: real exam fires have no landscape.'
- <b>Grid inertia:</b> GridSim's raw GB fleets commit about 4.5 s of inertia per MW of demand where NESO's outturn shows about
  7, so the law is 33 % low (MdAPE) and loses to 7 s × demand (15.1 %) and to the dev median (24 %). Its ranking is the best
  of all rows (ρ 0.975).
- '<b>Grid nadir:</b> the loss labels are noisy (REMIT/FUELINST matches); 148 events. The dev gate had only 4 events, one
  of them (9 Aug 2019) a cascade. The 68 % bar (±0.31 Hz) is far too wide: it covers 100 % of exam events.'
- <b>Homes:</b> the law loses to the dumb dev median (MdAPE 39.3 % vs 33.4 %) and to a log-linear fit on dev (26.6 %). BuildingSim's
  homes are about 1.4 times too energy-intensive at physics 1.0; 1.4 fixes the median but not the spread. RECS energy is EIA's
  billing-based estimate, and home-to-home variation (occupants, setpoints) is not in the inputs.
- "<b>Road:</b> the law (v1.1, p1-c17) loses to EnergyNet everywhere and, on real VED trips, to RoadData's MOVES-like and window-label baselines (18.7 % against 11.8 % and 14.1 %; EnergyNet 10.1 %). It beats road-load on EPA petrol and hybrid tests (19.6 % and 15.8 % against 25.0 % and 19.6 %) and loses to it on electric cars (VED Leafs 33.7 %, read 32 % low; EPA BEVs 20.0 %, read 11 % high). RoadSim's own shorter law (p2-c10) beats it on VED petrol (14.0 % against 19.0 %) and on EPA (15.1 % against 19.4 %); the dev gate (14 dev cars, 1,178 EPA dev tests) picked the longer law. Real CdA and Crr are class defaults on VED (EPA: from the road-load coefficients); VED fuel is MAF-estimated for most cars. Exam run 1 mis-scaled EnergyNet's VED rows (units); they were re-computed from its stored predictions."
- <b>Method:</b> one search per physics version, time-boxed at 4-7 minutes on a shared core; another seed can give a different
  front. Dev sets are small (4 grid events, 40 fires, 52 basins), so the gate is coarse. The road law (RoadSim trip energy)
  was added on 22 Nov 2026, after the other four.
- "<b>Road, grade:</b> the released law (v1.1, p1-c17) does not read grade, so it gives the same energy on a climb as on the flat. RoadSim's battery energy on one BEV drive goes from 0.332 to 0.659 MJ/km between flat and +2 %. v1.0's law (p1-c23) read grade with the wrong sign for every electric car (0.408 to 0.324 MJ/km on the same drive); since 27 Nov 2026 a road law whose energy falls as net grade rises at any frozen-set row cannot be released. No law that reads grade with the right sign has been found yet (sign-checked search, rungs p2s-*)."
- "<b>Input ranges:</b> each law is fitted inside its bank's input ranges (var_info in lawfinder_laws.json) and extrapolates freely outside them. The homes law's heating slope turns negative for homes built after 2020 (+1.87 at 2020, -3.13 at 2025, kWh/m² per 1000 K·d). Chaining the two grid laws, 615 of 2,356 inertia predictions on a regular grid fall below the nadir law's 90 GVA·s floor. Since 27 Nov 2026 predict() warns outside the declared ranges (strict=True raises). One of the demo's real grid events is outside them (a loss above 2 GW)."
help_wanted:
- Daymet/NLDAS forcing would separate law skill from ERA5-Land bias (WaterData help_wanted)
next:
- 'Fire: add a persistence module to FireSim (stall and burnout probability by fuel and weather) and re-run the search; the
  law ladder shows exactly where FireSim''s growth departs from reality.'
- 'Grid inertia: rescale GridSim''s GB fleet to NESO''s inertia per MW (the GridPulse wrapper''s fix) as physics i2, and re-take
  the ladder; the shape term (1 − 0.85 s) should survive.'
- 'Water: a recession law −dQ/dt = a Q^b on the same banks, and a Daymet/NLDAS exam to separate law skill from ERA5-Land bias.'
- 'Road: give the law the car''s engine size or label fuel economy, cold start and trip length as inputs (RoadData has them), and widen the generator toward lighter cars.'
- 'Road: a law that reads grade with the right sign. Since v1.1 (27 Nov 2026) the sign gate keeps grade-inverting laws out, and the released p1-c17 ignores grade; the sign-checked search (rungs p2s-*) found no law that uses grade correctly. Next: a search seeded with a road-load grade term per powertrain, or a squared-log loss on a bank weighted toward real routes.'
- 'Homes: add heating fuel and system as inputs (a law per fuel) and occupants; RECS dev shows the fuel matters most.'
usage:
  install: pip install numpy
  demo: python demo.py
  python: 'from lawfinder import LawFinder

    lf = LawFinder()

    mu, sigma = lf["water"].predict(phi=0.8, fs=0.1, sync=-0.2, S=0.14)

    '
