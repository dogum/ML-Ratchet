id: lawfinder
name: LawFinder
version: '1.0'
status: released
released: '2026-11-22'
order: 33
domain: Method
tags:
- symbolic regression
- equations
- Pareto front
- textbook laws
- water balance
- fire growth
- grid inertia
- energy signature
accent: '#6741d9'
tagline: What does each simulator believe, in one line, and is it true?
question: What readable law does each shared simulator imply, and does that law hold on the platform's real exam?
question_short: One-line laws extracted from the simulators, graded on real exams
summary: 'LawFinder runs symbolic regression on simulated banks from WaterSim, FireSim, GridSim and BuildingSim and returns
  short equations with error bars: the long-term runoff ratio of a basin, the next-day growth of a wildfire, GB system inertia,
  the GB frequency nadir after a trip, and the annual energy intensity of a single-family home. Each law is a rung on a ratchet
  of complexity levels and physics versions, chosen on a frozen simulated set and a small real dev set, then examined once
  on the platform''s real exam beside the textbook law (its constant fitted on the same dev set), the collection''s network
  and a dumb baseline.'
reads: 'Per law: water - aridity PET/P, snow fraction, P-PET seasonal synchrony, soil storage index; fire - perimeter (km),
  daily 10 m wind (m/s), 100-h dead fuel moisture (%), fuel group; grid inertia - demand (GW), inverter-based share; grid
  nadir - MW lost, inertia (GVA s), demand; homes - HDD and CDD (base 18 C), floor area, year built.'
returns:
- 'Long-term runoff ratio: runoff ratio Q/P with a 68 % bar (frozen-set residual sd, dev-widened)'
- 'Daily fire growth: log10(new area km² + 1 cell) with a 68 % bar (frozen-set residual sd, dev-widened)'
- 'GB system inertia: system inertia E with a 68 % bar (frozen-set residual sd, dev-widened)'
- 'GB frequency nadir: frequency drop to the nadir f0 - f_min with a 68 % bar (frozen-set residual sd, dev-widened)'
- 'Home energy signature: site energy per floor area with a 68 % bar (frozen-set residual sd, dev-widened)'
physics:
  summary: 'No new physics: the collection''s shared simulators are used unchanged (WaterSim v1, FireSim v1, GridSim 1.1 via
    GridPulse''s GB state sampler, BuildingSim 1.0/1.4). Each law is a statement about what one simulator implies.'
  simulator:
  - 'WaterSim: 16,000 generated basins (two physics versions), 4 runoff models, 2 snow routines, real ERA5-Land forcing from
    free windows, 10-year runs; w2 adds FlowCast''s dev-fitted ERA5 water-yield multiplier'
  - 'FireSim: 1,680 multi-day fires on guarded real dev LANDFIRE windows or parametric landscapes, real dev HRRR weather;
    f2 uses the dev-calibrated ROS factors'
  - 'GridSim: generate_states GB fleets (inertia law); GridPulse''s GB sampler p0/p1 for trips, measured like GridData''s
    catalogue (1 s means, 10 s fall <= -0.15 Hz)'
  - 'BuildingSim: 2,600 single-family homes from the ResStock-bootstrapped generator, TMYx weather shifted by U(-3, 3) C;
    b2 = physics 1.4'
  checks:
  - lawsearch recovers a planted Budyko-Fu law with 1 % noise to the noise floor (MSE 1.0e-4 vs 1.0e-4)
  - Every simulator's own Phase 1 checks apply (shared/*/checks)
  - Release evaluator (numpy) equals the search engine to machine precision; the page's JS equals numpy (training/results/js_parity.json)
noise: 'Platform noise models as shipped: WaterSim forcing error on the inputs the law sees; FireSim runs on real HRRR; GridSim
  events measured as 1 s means; BuildingSim weather shifts. No real labels in training.'
network: 'No network: symbolic regression (lawsearch, numpy/scipy; PySR-style regularised evolution with Levenberg-Marquardt
  constants and a hall of fame per complexity). Operators + - * / ^ exp log sqrt inv sq; complexity = node count, up to 25.'
approach:
  real_backdrop: Real ERA5-Land forcing windows, real dev LANDFIRE/HRRR, NESO train-year operating points, TMYx weather
  physics_inputs: Every law input is a physical quantity (aridity, perimeter, inertia, degree days)
  physics_anchor: false
  real_data_roles:
  - backdrop
  - calibration
  - gate
  - error_bars
  - exam
