limits:
- '<b>Water:</b> FlowCast, the collection''s ungauged network, beats the law (MAE 0.112 vs 0.129 on 619 basins). The law beats
  Budyko-Fu (0.141-0.154). In snowy basins (f_s > 0.3, 88 basins) every method is poor (law 0.22). All rows share ERA5-Land
  forcing, which under-catches mountain precipitation: 50 basins carry more water out than ERA5 says falls in.'
- '<b>Fire:</b> FireSim''s own law over-predicts real next-day growth a median 36 times (bias +1.56 decades). The released
  law survives only because the dev gate cut it down to a saturating curve. Over all fire-days it loses to FireData''s yesterday''s-growth
  baseline (1.15 vs 0.67 mean |log₁₀|); on growth days it is the best row (0.69 vs FireCast 0.76). FireSim has no fire persistence
  (stalls, burnout), the platform''s known gap. Slope was not an input: real exam fires have no landscape.'
- <b>Grid inertia:</b> GridSim's raw GB fleets commit about 4.5 s of inertia per MW of demand where NESO's outturn shows about
  7, so the law is 33 % low (MdAPE) and loses to 7 s × demand (15.1 %) and to the dev median (24 %). Its ranking is the best
  of all rows (ρ 0.975).
- '<b>Grid nadir:</b> the loss labels are noisy (REMIT/FUELINST matches); 148 events. The dev gate had only 4 events, one
  of them (9 Aug 2019) a cascade. The 68 % bar (±0.31 Hz) is far too wide: it covers 100 % of exam events.'
- <b>Homes:</b> the law loses to the dumb dev median (MdAPE 39.3 % vs 33.4 %) and to a log-linear fit on dev (26.6 %). BuildingSim's
  homes are about 1.4 times too energy-intensive at physics 1.0; 1.4 fixes the median but not the spread. RECS energy is EIA's
  billing-based estimate, and home-to-home variation (occupants, setpoints) is not in the inputs.
- <b>Method:</b> one search per physics version, time-boxed at 4-7 minutes on a shared core; another seed can give a different
  front. Dev sets are small (4 grid events, 40 fires, 52 basins), so the gate is coarse. The road law (RoadSim trip energy)
  was not built in this batch.
help_wanted:
- RoadSim trip-energy law (VED/EPA exam) not built in this batch
- Daymet/NLDAS forcing would separate law skill from ERA5-Land bias (WaterData help_wanted)
next:
- 'Fire: add a persistence module to FireSim (stall and burnout probability by fuel and weather) and re-run the search; the
  law ladder shows exactly where FireSim''s growth departs from reality.'
- 'Grid inertia: rescale GridSim''s GB fleet to NESO''s inertia per MW (the GridPulse wrapper''s fix) as physics i2, and re-take
  the ladder; the shape term (1 − 0.85 s) should survive.'
- 'Water: a recession law −dQ/dt = a Q^b on the same banks, and a Daymet/NLDAS exam to separate law skill from ERA5-Land bias.'
- 'Road: RoadSim trip-energy law against road-load on the VED/EPA exam (the fifth platform, not built here).'
- 'Homes: add heating fuel and system as inputs (a law per fuel) and occupants; RECS dev shows the fuel matters most.'
