model: demandcast
ladders:
  - name: DemandCast
    objective: "Mean over demand, wind and solar of skill = 1 - error / physics-alone error on the frozen simulated validation set val_v3 (4,000 region-days)"
    rule: "Keep a rung if the objective beats the incumbent by more than 0.01 AND the dev gate's mean relative error gets no more than 2% worse"
    margin: 0.01
    dev_gate: "30 seeded real days per grid from 2019 and 2021 (each year described by the other year's fit); mean relative change of the demand, wind and solar errors <= +2%"
    frozen_sets: [val_v2, val_v3]
    scored_on: val_v3
    note: "The first rungs were scored on earlier frozen sets when taken (r4 scored 0.408 on val_v2); every rung was re-scored on val_v3 after the simulator changed, and those are the numbers here (training/ratchet.json). Dev calibration steps outside the network: per-grid building fits on 2019/2021, one wind and solar scale per grid, the CAISO and PJM 1 h solar shift, simulator v2 widths matched to dev, the v3 noise fix from the twin test."
    columns_source: "Dev gate errors (5,760 demand hours, 5,759 wind, 5,040 solar), never the exam"
    columns: ["Dev demand MAPE (%)", "Dev wind (%)", "Dev solar (%)", "Dev demand 68% coverage"]
    rungs:
      - { id: r1_base, change: "Three MLPs (256-256), 39k region-days, simulator v1 (first-guess drift and error widths)", sim: 0.3330, decision: kept, why: "First rung.", metrics: [2.06, 21.39, 15.82, 0.665] }
      - { id: r2_simv2, change: "Simulator v2: drift, residual noise and wind/solar error widths calibrated so simulated physics errors match dev; half the solar fleets report near full capacity", sim: 0.3385, decision: rejected, why: "Objective 0.3385 vs 0.3330 (needs +0.01); dev errors +10.1% (solar broke on real data: night-time negative EIA output against near-constant simulated features).", metrics: [1.98, 21.46, 21.14, 0.677] }
      - { id: r3_robust, change: "Rung 2 + robust inputs: negative night output clamped to 0, wind/solar input scales floored at 0.02", sim: 0.3393, decision: rejected, why: "Objective 0.3393 vs 0.3330, +0.006 (needs +0.01); dev errors -2.4%.", metrics: [1.98, 21.35, 15.28, 0.677] }
      - { id: r4_more, change: "Rung 3 inputs on both simulator banks (v2 + v1, 79k region-days), 384-384", sim: 0.3484, decision: kept, why: "Objective 0.3484 vs 0.3330; dev errors -2.3%.", metrics: [1.98, 21.36, 15.38, 0.737] }
      - { id: r5_simv3, change: "Simulator v3 (the twin test found residual noise missing in ~60% of simulated hours), 52k region-days, 384-384", sim: 0.3483, decision: rejected, why: "Objective 0.3483 vs 0.3484, no gain; dev errors +0.2%. Its v3 banks were kept for later rungs.", metrics: [1.99, 21.84, 15.01, 0.648] }
      - { id: r6_all, change: "All four banks (v3 ×2, v2, v1; 131k region-days), 384-384", sim: 0.3558, decision: rejected, why: "Objective 0.3558 vs 0.3484, +0.007 (needs +0.01); dev errors -0.1%.", metrics: [1.95, 21.45, 15.52, 0.691] }
      - { id: r7_hist, change: "Full 168 h history of real-vs-physics error as extra inputs, 102k v3 region-days, 384-384", sim: 0.3552, decision: rejected, why: "Objective 0.3552 vs 0.3484 (needs +0.01); dev errors +8.3% (gate +2%), demand 2.27% and its 68% coverage fell to 45%.", metrics: [2.27, 22.43, 16.17, 0.451] }
      - { id: r8_wide, change: "All six banks (v3 ×4, v2, v1; 180k region-days), base features, 512-512 (largest within the 500k-parameter budget)", sim: 0.3617, decision: released, why: "Objective 0.3617 vs 0.3484; dev errors +0.9% (inside the 2% gate). Released as v1.0.", metrics: [2.0, 21.44, 15.6, 0.651] }
  - name: "DemandCast v1.1 (15 Nov 2026)"
    objective: "Same objective on the frozen simulated set val_v4 (4,000 region-days, simulator v4, seed 404): v3 plus a solar reporting offset of -1 / 0 / +1 h (15 / 70 / 15 %) per region-year"
    rule: "Same rule: keep a rung if the objective beats the incumbent by more than 0.01 AND the dev gate's mean relative error gets no more than 2% worse"
    margin: 0.01
    dev_gate: "30 seeded real days per grid from 2019 and 2021, as before; mean relative change of the demand, wind and solar errors <= +2%"
    frozen_sets: [val_v4]
    scored_on: val_v4
    note: "The measurement model changed (EIA-930 solar timestamps move between years: in 2018-2022, outside the exam, 9 of 35 BA-years are 1 h off and CAISO moved from -1 h in the dev years to 0 in 2022), so a new frozen set was built. Only the release r8 could be re-scored on it: the r1-r7 checkpoints are not in the repository. Rungs scored from the shipped weights with training/solar_align.py; raw log training/ratchet.json."
    columns_source: "Dev gate errors (5,760 demand hours, 5,759 wind, 5,040 solar), never the exam"
    columns: ["Dev demand MAPE (%)", "Dev wind (%)", "Dev solar (%)", "Solar skill on val_v4"]
    rungs:
      - { id: r8_wide, change: "The release v1.0 re-scored on val_v4 (fixed dev-year solar shift; no offset read)", sim: 0.3329, decision: kept, why: "Incumbent. On val_v4 its solar error is 14.5% on regions reported on time and 36.2% / 31.8% on regions reported 1 h early / late.", metrics: [2.00, 21.44, 15.60, 0.386] }
      - { id: r9a, change: "r8 + the solar reporting offset read at issue from the 168 h history (least squares of the reported-minus-physics error on the physics profile and its slope; -1 / 0 / +1 h), history put back on the physics clock, forecast moved by the offset", sim: 0.3752, decision: rejected, why: "Objective 0.3752 vs 0.3329 and dev +1.1% (inside the gate), but on dev it moved 201 of 730 CAISO days by an hour: CAISO's dev-year profile reads +0.46 h from the physics clock. Replaced by its dev-calibrated form r9b before the release choice (same frozen-set score).", metrics: [2.00, 21.44, 16.11, 0.513] }
      - { id: r9b, change: "r9a with the offset counted from each grid's dev-year reference (median r_hat over 2019 and 2021: CAISO 0.46 h, the others 0.04-0.19 h)", sim: 0.3752, decision: released, why: "Objective 0.3752 vs 0.3329 (+0.042); dev errors +0.2% (solar 15.60 -> 15.68%). On val_v4 the offset is read right on 3,886 of 4,000 region-days. Released as v1.1; solar sigma scale re-fitted on dev (1.34 -> 1.37).", metrics: [2.00, 21.44, 15.68, 0.513] }
  - name: "DemandCast v1.2 (27 Nov 2026, audit repair)"
    objective: "Same objective on the frozen simulated set val_v5 (4,000 region-days, simulator v5, seed 505): v4 plus -2 to +2 h solar offsets, twilight output at dark edge hours, and 1-48 h gaps in the demand history"
    rule: "Same rule: keep a rung if the objective beats the incumbent by more than 0.01 AND the dev gate's mean relative error gets no more than 2% worse"
    margin: 0.01
    dev_gate: "30 seeded real days per grid from 2019 and 2021, as before; mean relative change of the demand, wind and solar errors <= +2%"
    frozen_sets: [val_v5]
    scored_on: val_v5
    note: "The audit (25 Nov 2026) found real inputs simulator v4 never produced: reported solar at hours the physics calls dark, 2 h solar offsets, and missing hours in the demand history (miss_frac had a simulated sd of ~0, so one missing hour reached |z| 286). So a new frozen set val_v5 was built before any training, and the incumbents re-scored on it. The incumbent is v1.1.1 (the r8 network with inputs clipped at |z| 8, the default since the dated re-score of 27 Nov 2026). One rung was trained, fixed before training. On val_v4 the three score 0.3752 (v1.1), 0.3751 (v1.1.1) and 0.3774 (r10). Log: training/ratchet.json (training/repair.py)."
    columns_source: "Dev gate errors (5,760 demand hours, 5,759 wind, 5,040 solar), never the exam; and the demand error on val_v5's 295 samples with a history gap"
    columns: ["Dev demand MAPE (%)", "Dev wind (%)", "Dev solar (%)", "val_v5 demand, gap samples (%)"]
    rungs:
      - { id: r9b, change: "v1.1 as released, re-scored on val_v5", sim: 0.3488, decision: kept, why: "Re-scored only. Demand 11.2% on val_v5 samples with a history gap (2.3% without); solar 33.7% / 32.8% on regions reported 2 h early / late. Replaced as incumbent by v1.1.1 without a ratchet decision: the clip changes no weights and was made the default after its dated re-score.", metrics: [2.00, 21.44, 15.68, 11.18] }
      - { id: r9b_zclip8, change: "v1.1.1: the r8 network with standardised inputs clipped at |z| 8", sim: 0.3908, decision: kept, why: "Incumbent. The clip takes the gap samples from 11.2% to 2.6% demand error; solar unchanged.", metrics: [1.98, 21.44, 15.67, 2.59] }
      - { id: r10_repair, change: "Simulator v5 banks (180,000 region-days, train_v5a-c); solar offsets read to ±2 h, history aligned and zeroed where the physics is dark (training and inference); count-like inputs floored at sd 0.05; inputs clipped at |z| 8; three 512-512 MLPs on base features, 40 epochs, as r8", sim: 0.4054, decision: released, why: "Objective 0.4054 vs 0.3908 (+0.015); dev errors -4.8% (solar 15.67 -> 13.11%, wind 21.44 -> 21.23%, demand 1.98 -> 2.05%, +3%). Released as v1.2; exam run once after the choice was committed (285eedd). The pooled gate let solar carry a demand loss, which the exam repeats.", metrics: [2.05, 21.23, 13.11, 2.36] }
  - name: "DemandCast v1.3 ladder (27 Nov 2026, per-output dev gate)"
    objective: "Same objective on the frozen simulated set val_v5 (4,000 region-days, simulator v5, seed 505)"
    rule: "Keep a rung if the objective beats the incumbent by more than 0.01 AND each output's dev-gate error (demand, wind, solar) is no more than 2% worse than the incumbent's, separately: a gain in one output cannot carry a regression in another"
    margin: 0.01
    dev_gate: "30 seeded real days per grid from 2019 and 2021, as before; relative change of each of the demand, wind and solar errors <= +2%"
    frozen_sets: [val_v5]
    scored_on: val_v5
    note: "An exam-informed rule change, adopted by the owner on 27 Nov 2026 after v1.2's exam: v1.2 improved solar (10.6% vs 16.1%) but made demand worse (2.49% vs 2.32% for v1.1.1), and the old pooled gate had already shown dev demand +3% (1.98 -> 2.05%) while passing the rung on the mean. The rule applies from this ladder on; v1.2 stays released under the rule it was judged by. Log: training/ratchet.json (training/repair.py add_per_output)."
    columns_source: "Dev gate errors (5,760 demand hours, 5,759 wind, 5,040 solar), never the exam; and the demand error on val_v5's 295 samples with a history gap"
    columns: ["Dev demand MAPE (%)", "Dev wind (%)", "Dev solar (%)", "val_v5 demand, gap samples (%)"]
    rungs:
      - { id: r10_repair, change: "v1.2 as released (incumbent)", sim: 0.4054, decision: kept, why: "Incumbent.", metrics: [2.05, 21.23, 13.11, 2.36] }
      - { id: r11_split, change: "v1.1.1's demand network (r8, inputs clipped at |z| 8) with r10's wind and solar networks and r10's solar input changes (±2 h offsets, dark mask); no training", sim: 0.3973, decision: rejected, why: "Objective 0.3973 vs 0.4054 (needs +0.01): on val_v5 r8's demand skill is 0.535 vs r10's 0.560 (simulated gap samples 2.59 vs 2.36%). Dev gate passed per output: demand 1.98 vs 2.05% (-3.0%), wind and solar unchanged. The frozen set and dev disagree on demand: v5's simulated gaps reward r10's demand network, real dev years do not. No exam run.", metrics: [1.98, 21.23, 13.11, 2.59] }
