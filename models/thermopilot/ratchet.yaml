# The ratchet ladder, normalised. Raw log: training/ratchet.json (written by training/scripts/ratchet.py).
model: thermopilot
ladders:
  - name: "ThermoPilot v1.0 (BuildingSim v1, 16-17 Nov 2026)"
    objective: "Skill on the frozen simulated val set (60 episodes): sum over episodes of the relative saving of J vs the fixed thermostat, divided by the same sum for perfect foresight (0 = fixed thermostat, 1 = perfect foresight); J = control-dependent bill (energy + demand + gas) + λ × kelvin-hours outside the occupant's band"
    rule: "Keep if val skill > incumbent + 0.01 AND the dev gate passes: dev skill > 0, dev skill ≥ incumbent dev skill − 0.03, and mean kelvin-hours per dev episode ≤ fixed thermostat + 1 K h."
    margin: 0.01
    dev_gate: "30 dev episodes (11 RECS dev respondents + 4 BDG2 dev buildings × January / July 2017): dev skill > 0 and ≥ incumbent − 0.03; dev K h per episode ≤ fixed + 1 (fixed: 0.08 K h)"
    frozen_sets: [val]
    scored_on: val
    note: >-
      The starting incumbent is the fixed thermostat (skill 0). Before R1 was scored, the oracle was upgraded to the
      two-pass demand-peak version (an oracle that only amortised demand charges was worse than a fixed thermostat on
      commercial demand tariffs) and skill was changed from a ratio of sums (dominated by large commercial bills) to
      relative savings per episode; every rung below is scored on the same frozen set. Reference: the classical MPC
      with forecast scores 0.83 on val and 0.83 on dev. Rule notes, said plainly: the RECS exam uses 4 of the 6
      respondents drawn per tariff slot, a cut made for compute before any exam result existed; and during the build
      the agent once ran `pkill -f` with its own script name to stop a job, which could have killed other processes —
      it matched only its own process. No exam result was used to choose anything. The R5 change text says 411
      episodes while the model card and R6 say 440 (the logged text is kept). The R6 text says 275k parameters; the
      shipped 298-384-384-36 network has 276,516.
      Re-scored on 17 Nov 2026 in this repository with the released R7 weights (NOTEBOOK.md): val skill 0.556
      (logged 0.562; MPC 0.859) and dev skill 0.482 (logged 0.360; MPC 0.815). The RECS respondent twins built here
      differ from the sandbox's (dev has 11 of them), so the logged rungs below cannot be re-scored like for like; R1-R6
      weights were not kept. The next rung (a residual on the cheap MPC, planned in NOTEBOOK.md) compares with R7 as
      re-scored here.
    columns_source: "training/ratchet.json: dev gate numbers (30 episodes), then the val set's fraction of episodes cheaper than fixed"
    columns: ["Dev skill", "Dev K h / episode", "Dev bill saving", "Val beats fixed"]
    rungs:
      - { id: r1, change: "Behaviour cloning of the perfect-foresight DP teacher (173 episodes, 127k hours), MLP 298-256-256-36, no shield", sim: 0.084, decision: rejected, why: "val skill 0.084 vs incumbent 0.000; dev skill −3.02, dev K h 5.0 vs fixed 0.1: dev gate failed (comfort)", metrics: [-3.022, 4.98, "1.4%", "73%"] }
      - { id: r2, change: "R1 weights + anticipatory comfort shield (stay within 1 K/h of every band edge in the next 4 h)", sim: 0.377, decision: rejected, why: "val skill 0.377 vs 0.000; dev skill −0.81, dev K h 1.5 vs fixed 0.1: dev gate failed", metrics: [-0.810, 1.51, "2.0%", "75%"] }
      - { id: r3, change: "R1 weights + 6 h comfort shield (heating 1 K/h, cooling 0.5 K/h recovery allowance)", sim: 0.419, decision: rejected, why: "val skill 0.419 vs 0.000; dev skill −0.19, dev K h 0.6 vs fixed 0.1: dev gate failed (dev skill ≤ 0)", metrics: [-0.191, 0.60, "2.0%", "78%"] }
      - { id: r4, change: "Retrain on the BC bank + DAgger round 1 (286 episodes, 210k hours; student = R1 + shield, beta 0.3), shield 4", sim: 0.517, decision: kept, why: "val skill 0.517 vs 0.000; dev skill 0.043, dev K h 0.3 vs fixed 0.1: kept", metrics: [0.043, 0.28, "2.0%", "78%"] }
      - { id: r5, change: "Retrain on BC + DAgger rounds 1-2 (411 episodes; round 2 student = R4, beta 0.2), shield 4", sim: 0.499, decision: rejected, why: "val skill 0.499 vs incumbent 0.517 (needs +0.01); dev skill −0.068 vs 0.043: rejected", metrics: [-0.068, 0.51, "2.4%", "77%"] }
      - { id: r6, change: "Wider network 298-384-384-36 (275k params), 24 epochs, same 440 episodes, shield 4", sim: 0.550, decision: kept, why: "val skill 0.550 vs 0.517; dev skill 0.200 vs 0.043, dev K h 0.4: kept", metrics: [0.200, 0.37, "1.3%", "78%"] }
      - { id: r7, change: "R6 architecture + DAgger round 3 (533 episodes, 391k hours; round 3 student = R6, beta 0.1), shield 4", sim: 0.562, decision: released, why: "val skill 0.562 vs 0.550; dev skill 0.360 vs 0.200, dev K h 0.3: kept, released as v1.0 (exam run once afterwards)", metrics: [0.360, 0.29, "2.5%", "73%"] }
  - name: "Round 2: residual on the card MPC (R8, BuildingSim 1.0, 17 Nov 2026; not released)"
    objective: "The same skill on the frozen simulated val set (60 episodes), frozen again on 17 Nov 2026 with stable RECS twins (tied ResStock matches ranked by bldg_id): 19 of its 28 RECS-twin episodes changed house"
    rule: "Keep if val skill > incumbent + 0.01 AND the dev gate passes (dev skill > 0, ≥ incumbent dev skill − 0.03, dev K h per episode ≤ fixed + 1) AND val skill > the anchor alone (card MPC behind the 6 h shield) + 0.01. Three seeds; the decision is on the 3-seed mean."
    margin: 0.01
    dev_gate: "30 dev episodes frozen again with stable twins (11 of the 12 RECS dev homes changed house): dev skill > 0 and ≥ incumbent − 0.03; dev K h per episode ≤ fixed + 1 (fixed: 0.001 K h)"
    frozen_sets: [val]
    scored_on: val
    note: >-
      Plan fixed in NOTEBOOK.md before anything was built. The incumbent is R7 (the v1.0 weights) re-scored on the
      rebuilt sets: val 0.561, dev 0.471. Reference rows, not candidates (training/ratchet_r8.json): classical MPC with
      forecast val 0.862, dev 0.765 (it reads the true wind and indoor humidity); card MPC alone without shield val
      0.573, dev 0.572 (dev K h 0.91: it loses 0.19 dev skill to the classical MPC); the anchor, card MPC behind the
      6 h shield (shield chosen on dev before training), val 0.700, dev 0.720, dev K h 0.00 (−0.045 dev skill against
      the classical MPC). R8 beats R7 on every seed but loses to the anchor alone on every seed (3-seed mean val 0.667
      vs 0.700), so it is rejected and v1.0 stays. Dev twin test of seed 0 (anchor drives): the teacher departs from
      the card MPC in 5.6 % of hours, the residual in 96.7 %; correlation with the teacher's departure 0.03 heating /
      0.13 cooling (0.13 / 0.46 where the teacher departs). The anchor alone would pass this ladder's rule against R7;
      it was a reference row, so it is not promoted here.
    columns_source: "training/ratchet_r8.json: dev gate numbers (30 episodes), then the val set's fraction of episodes cheaper than fixed"
    columns: ["Dev skill", "Dev K h / episode", "Dev bill saving", "Val beats fixed"]
    rungs:
      - { id: r7, change: "R7 = the v1.0 weights, re-scored on val and dev frozen again with stable RECS twins (the starting incumbent)", sim: 0.561, decision: kept, why: "Starting incumbent: val 0.561 (v1.0 build 0.562), dev 0.471 (v1.0 build 0.360), dev K h 0.09", metrics: [0.471, 0.09, "2.5%", "78%"] }
      - { id: r8-s0, change: "Residual MLP 334-384-384-36 on the card MPC's 36 action values (last layer zero-initialised; logits = −Q/(S·0.1) + MLP), 6 h shield; 507 new episode-months (card MPC acting, then DAgger β 0.3 / 0.2 / 0.1), 371,663 hours; seed 0", sim: 0.670, decision: rejected, why: "val 0.670 vs R7 0.561 and dev 0.718 pass the incumbent rule, but the anchor alone scores 0.700 on val: not beaten by 0.01 (3-seed mean 0.667)", metrics: [0.718, 0.06, "4.8%", "87%"] }
      - { id: r8-s1, change: "R8, seed 1 (same banks)", sim: 0.644, decision: rejected, why: "val 0.644, dev 0.673: passes the incumbent rule, loses to the anchor alone (0.700)", metrics: [0.673, 0.12, "4.2%", "83%"] }
      - { id: r8-s2, change: "R8, seed 2 (same banks)", sim: 0.686, decision: rejected, why: "val 0.686, dev 0.711: passes the incumbent rule, loses to the anchor alone (0.700)", metrics: [0.711, 0.00, "4.8%", "90%"] }
