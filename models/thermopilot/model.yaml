        - { name: "Pre-cool rule tuned on dev (4 h, 3 K)", kind: classical, value: 0.32 }
        - { name: "MPC with forecast (same nominal house)", kind: classical, value: 0.82 }
      verdict: loss
      note: "Seen, new RECS list. −0.12 against the MPC, 95% CI [−0.20, −0.01] (bootstrap by home, n = 48). v1.0 network 0.28 (−0.54 [−0.75, −0.37]); v1.1 − v1.0 +0.42 [+0.25, +0.64]."
    - metric: RECS exam twins, kelvin-hours outside the comfort band per episode
      better: lower
