      verdict: tie
      note: "Seen, new RECS list. −0.14 K h against the MPC, 95% CI [−0.32, +0.03] (bootstrap by home, n = 48). v1.0 network 1.55 K h; v1.1 − v1.0 −1.13 [−2.19, −0.33]. Perfect foresight 0.31 K h."
    - metric: BDG2 small commercial twins (16 buildings, 32 building-months, 4 demand tariffs), bill saving vs fixed thermostat
