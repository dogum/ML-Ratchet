id: thermopilot
name: ThermoPilot
version: "1.1"
status: released
released: 2026-11-17
order: 21
domain: Buildings
platform: building
tags: [buildings, thermostat, heat pumps, control, demand charges, model predictive control, dynamic programming, imitation learning]
accent: "#0b7285"
tagline: A thermostat MPC that pre-heats and pre-cools against real tariffs.
question: Every hour, which heating and cooling setpoints keep a home or small building comfortable for the lowest bill, planning 24 h ahead on a small model of the house?
question_short: "Which setpoints keep a building comfortable for the lowest bill? *(graded in simulation)*"
summary: >-
  ThermoPilot is a causal thermostat / heat-pump controller for homes and small commercial buildings. Every hour it
  picks a heating and a cooling setpoint from a menu of 36 pairs (off, the comfort-band edge, or pre-heat / pre-cool by
  up to 3 K) to minimise the bill plus a penalty of $3 per kelvin-hour outside the occupant's comfort band (per 150 m²
  of floor). Since v1.1 the default controller is classical, with no learned parameters: a 24 h dynamic programme
  ("card MPC") on a 12-number linear map of the house carried by its building card, behind a rule-based 6 h comfort
  shield. It replaced the v1.0 network (an MLP that imitated a perfect-foresight teacher in BuildingSim), which stays in
  the package as mode='network': on the rebuilt simulated val set the card MPC scores 0.700 skill against the
  network's 0.561, and a residual network on top of it (rung R8) did not beat it. On simulated twins of real exam units
  (seen re-score, 17 Nov 2026) v1.1 beats v1.0 on every set, beats the classical MPC on small commercial buildings with
  demand charges, and still loses to the classical MPC on homes.
disclaimer: >-
  Graded in simulation. There are no real thermostat logs (ecobee's Donate Your Data needs an application), so every
  exam number is BuildingSim with real weather, real tariffs and twin buildings, not a measured saving. v1.1's house
  map is fitted to the twin's own nominal BuildingSim model, so it plans on a near-copy of the house the simulator
  starts from (the simulated house is a perturbed copy); a real thermostat would have to identify those 12 numbers
  from its own data, which was not tested. On 37 real WPuQ heat-pump homes the simulator overstates the heating slope
  2.7× and puts heat-pump load at night.

reads: "Each hour: the indoor air temperature (°C), the HVAC's own heat output (W) and the meter's electricity (kW) last hour, a 24 h forecast of outdoor temperature (°C) and solar (W/m²), 24 h of energy prices ($/kWh), demand-charge windows, rates and the running monthly peak, the occupant's comfort band for the next 24 h, the expected other electricity load, and a building card: heating type, heat-pump / furnace / AC capacity and COP tables vs outdoor temperature, fan power, and (v1.1) a 12-number linear house map (air and mass temperature one hour ahead as linear functions of the mass temperature, HVAC heat, outdoor temperature, solar and the other load). The v1.0 network also reads the last 3 hours of indoor temperature and the card's UA (W/K), thermal capacitance (J/K) and floor area."
returns:
  - "A heating and a cooling setpoint (°C; ±100 means that side is off) for the hour, after a comfort shield that never lets the zone fall behind the band of the next 6 h (recovery 1 K/h heating, 0.5 K/h cooling)"
  - "v1.1 also returns the card MPC's expected cost ($) of each of the 36 setpoint pairs over the next 24 h"
  - "No uncertainty: the controller is deterministic; exam intervals are 95 % bootstrap intervals over units"

physics:
  summary: >-
    BuildingSim v1 (shared/building, BuildingData + BuildingSim): ISO 13790 5R1C zone with Perez solar, LBL
    infiltration and EnergyPlus-derived heat-pump (capacity and COP vs outdoor temperature, defrost, backup strips),
    DX, furnace and boiler curves with part load, run at 1 h steps through the step API with exact state rollback.
    Bills from real URDB tariffs (TOU, demand charges) and ERCOT real-time prices, gas at 2025 EIA averages. The
    teacher is a dynamic program over the mass temperature (0.25 K grid, 24 h horizon, hourly replanning) with the true
    house, the true weather and the true state; on demand tariffs it re-simulates the month with a monthly peak target
    (two-pass). The classical MPC and the teacher use BuildingSim's own one-step 5R1C maps. v1.1's card MPC uses the same
    dynamic programme on the card's 12-number linear house map instead (no wind, no indoor humidity), fitted to the
    nominal twin's hourly maps; on three dev episodes the map reproduces them to 0.08-0.19 K RMS.
  simulator:
    - "Generated homes and small commercial buildings (ResStock / ComStock / CBECS priors) and twins of RECS 2020 prior-split respondents (nearest ResStock dwelling by type, climate zone, heating system and fuel, cooling, area and vintage, with the respondent's own area, occupants and thermostat settings)"
    - "The simulated 'true' house is a perturbed copy of the card the controller is told: envelope U × LN(0, 0.12), air leakage × LN(0, 0.25), thermal-mass class, plug loads, sizing"
    - "Real 2016 BDG2 site weather (11 US sites) and TMYx typical years for 17 US cities; 13 residential and 5 commercial URDB tariffs, synthetic TOU / demand tariffs, ERCOT 2018 real-time prices + 10 c/kWh"
    - "Forecast error on outdoor temperature grows with lead time; comfort bands narrower when home, wider asleep / away"
    - "533 episode-months (391k hours) labelled with the teacher's value of all 36 actions"
  checks:
    - "BuildingSim (platform checks, checks/*.json): steady conduction to 1.8e-9, RC step within 0.0035 K, ISO 13786 wall amplitude −1.6 %; BESTEST 29 of 34 values in the published ranges; ResStock twins (126 homes) site energy median 1.10×, daily r 0.92"
    - "Numba DP sweep == numpy DP loop exactly (max difference 0)"
    - "v1.1: the numpy card MPC in thermopilot_core.py reproduces the training-side runs exactly (closed-loop J to the cent on dev); the numpy demo replays its closed-loop setpoints in 744 / 744 hours on each of 3 exam episodes; the browser port matches Python to 8.5e-15 on 40 parity cases (20 per mode)"
    - "v1.0 network: numpy inference == torch to 0 (float32); the JS port == Python on 2,232 / 2,232 demo hours"
    - "Reality check (report only): on 37 WPuQ heat-pump homes, generic twins' heating slope is a median 2.7× the real one (IQR 1.4–5.4); real January profiles are flat while twins peak at night (profile r = 0.21)"
noise: "Forecast error on outdoor temperature that grows with lead time; a perturbed 'true' house (envelope ±12 %, air leakage ±25 %, mass class, internal loads) that the controller never sees exactly; real weather years and real tariffs"
network: "v1.1 (default) has no network: a backward dynamic programme over the house's mass temperature (0.25 K grid, 24 h horizon, replanned every hour, 36 setpoint pairs; cost = energy + gas + demand-charge increments over the running monthly peak + λ × K h outside the band) on the card's 12-number linear house map, with a dead-beat observer of the mass temperature from the measured air temperature, then the 6 h comfort shield. v1.0 (mode='network'): MLP 298 → 384 → 384 → 36 (276,516 parameters) on 34 state / tariff / building-card features plus 11 × 24 h forecast rows, trained on soft targets from a perfect-foresight teacher's action values plus expected regret (behaviour cloning, then 3 DAgger rounds); argmax over the 36 pairs, then the same shield"

approach:
  real_backdrop: "Real weather years (BDG2 2016 site weather, TMYx cities) and real tariffs (URDB, ERCOT real-time prices) drive every simulated episode; v1.1 was chosen on the frozen simulated val set and the RECS / BDG2 dev gate"
  physics_inputs: "A building card from the physics model: a 12-number linear house map least-squares fitted to the nominal twin's hourly ISO 13790 5R1C maps, and heat-pump / furnace / AC capacity and COP tables on the 24 h temperature forecast"
  physics_anchor: "v1.1 is the physics: a dynamic programme on the card's house map, behind a comfort shield built on recovery rates (1 K/h heating, 0.5 K/h cooling); the v1.0 network, kept as an option, was trained to imitate a dynamic programme with the true house and weather"
  real_data_roles: [backdrop, gate, exam]

data:
  - name: Building Data Genome 2 (BDG2) — Miller et al., Scientific Data 7, 368 (2020)
    url: https://github.com/buds-lab/building-data-genome-project-2
    licence: CC BY-SA 4.0 (derived data share-alike; examples/bdg2/, lab/ and the instrument data are BDG2-derived)
    role: noise (2016 site weather for training), dev (4 BDG2 dev buildings), exam (16 small commercial buildings, 2017 weather for the RECS twins)
  - name: EIA Residential Energy Consumption Survey (RECS) 2020 microdata
    url: https://www.eia.gov/consumption/residential/data/2020/
    licence: Public domain (US government)
    role: truth (twins and comfort bands of prior-split respondents), dev (11 respondents), exam (48 respondents)
  - name: NREL ResStock 2025 R1 / ComStock 2025 R3 (OEDI)
    url: https://resstock.nrel.gov/
    licence: CC BY 4.0
    role: physics (generator priors, nearest-dwelling twin matching)
  - name: HUE, the Hourly Usage of Energy dataset for buildings in British Columbia — Makonin, Data in Brief (2019)
    url: https://doi.org/10.7910/DVN/N3HGRN
    licence: CC BY 4.0
    role: exam (17 homes, Vancouver 2017 weather)
  - name: WPuQ heat-pump and household data, Lower Saxony — Schlemminger et al., Scientific Data (2022)
    url: https://doi.org/10.5281/zenodo.5642902
    licence: CC BY 4.0
    role: exam (38 heat-pump homes, January 2019 weather), reality check (37 homes' real heat-pump electricity)
  - name: Utility Rate Database (URDB), OpenEI / NREL
    url: https://openei.org/wiki/Utility_Rate_Database
    licence: Open data, free use with credit
    role: physics (18 real tariffs for training and exam bills)
  - name: ERCOT real-time settlement point prices 2018 / 2019 (via GridData)
    url: https://www.ercot.com/mp/data-products
    licence: Public market data, free use with credit
    role: physics (real-time tariff, + 10 c/kWh)
  - name: TMYx typical weather years, climate.onebuilding.org
    url: https://climate.onebuilding.org/
    licence: "Cite Lawrie and Crawley, TMYx; the site says All Rights Reserved and states no reuse licence: used for simulation only, not redistributed"
    role: noise (17 US cities for training)
  - name: NASA POWER hourly irradiance; EIA natural gas prices (2025 averages)
    url: https://power.larc.nasa.gov/
    licence: Free use with credit / public domain (US government)
    role: physics (solar for the HUE homes; gas price $15.34 residential, $10.98 commercial per Mcf)

split:
  dev: "30 episodes: 11 RECS 2020 dev respondents and 4 BDG2 dev buildings, January and July 2017 (frozen splits, seed 20261116); frozen simulated val set: 60 episodes. Both frozen again on 17 Nov 2026 with stable RECS twins (tied ResStock matches ranked by bldg_id) from the same seeds; v1.1 was chosen there"
  exam: "RECS 2020 exam respondents: 48 homes × January + July 2017, 12 real tariffs in 9 states (4 of 6 drawn per tariff slot, fixed before the exam; the list was frozen again with stable twins on 17 Nov 2026, same respondents, 39 of 48 homes got a different twin); BDG2: 16 small offices / schools / shops × January + July 2017, 4 commercial tariffs; HUE: 17 BC homes, 21 episodes; WPuQ: 38 heat-pump homes, January 2019"

exam:
  short: "166 simulated twin episodes, real weather and tariffs (seen; HUE not scored for v1.1)"
  summary: >-
    All seen: v1.0 took these sets once at release, and on 17 Nov 2026 v1.1 and v1.0 were scored again after v1.1 was
    chosen on val and dev; nothing was chosen from them. The RECS list was frozen again with stable twins (same
    respondents, 39 of 48 homes got a different twin), so both versions were re-scored there; BDG2 and WPuQ are as
    frozen. Twins of real exam units (perturbed true house, noisy forecasts) under their real weather and real tariffs,
    against a fixed thermostat, the occupant's own setback schedule, standard setback, two pre-cool rules, the in-band
    pre-cool rule tuned on dev (4 h, 3 K), a classical MPC with the same nominal house and the same noisy forecast (it
    also reads the true wind and indoor humidity), and a perfect-foresight bound. Bill = energy + demand + gas for the
    month (fixed charges left out), summed over episodes. Skill = share of the perfect-foresight saving on cost + comfort
    (0 = fixed thermostat, 1 = perfect foresight). Every row gives v1.1 minus the best baseline with a 95 % bootstrap
    interval over units (homes / buildings; 2,000 resamples, seed 20261117); win or loss only when the interval
    excludes zero. On bill rows a baseline counts only if it keeps comfort within the ratchet's test (K h ≤ fixed + 1).
    Each note gives v1.0 (the network, mode='network') on the same episodes and v1.1 minus v1.0 with its interval. HUE
    was not run (NASA POWER irradiance not fetched): v1.0's point values are kept in one info row.
  results:
    - metric: RECS exam twins (48 homes, 96 home-months, 12 tariffs), bill saving vs fixed thermostat
      better: higher
      model: 2.77
      unit: "%"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback (occupant's own schedule; 2.5 K h, fails the comfort test)", kind: dumb, value: 2.28 }
        - { name: "Standard setback −4 / +4 K (841 K h, fails the comfort test)", kind: dumb, value: 8.74 }
        - { name: "In-band pre-cool rule", kind: classical, value: 2.54 }
        - { name: "Phase-1 pre-cool rule (69 K h, fails the comfort test)", kind: classical, value: 3.39 }
        - { name: "Pre-cool rule tuned on dev (4 h, 3 K)", kind: classical, value: 2.56 }
        - { name: "MPC with forecast (same nominal house)", kind: classical, value: 3.70 }
      verdict: loss
      note: "Seen, new RECS list. −0.93 points against the MPC, 95% CI [−1.30, −0.58] (bootstrap by home, n = 48). v1.0 network 2.34 % (−1.36 [−1.80, −0.95] against the MPC); v1.1 − v1.0 +0.43 [+0.24, +0.68]. v1.1 vs the occupant's setback: +0.49 [−0.28, +1.36], tie. v1.1 2.77 % [2.10, 3.49]; perfect foresight 3.91 %."
    - metric: RECS exam twins, skill on cost + comfort (0 = fixed, 1 = perfect foresight)
      better: higher
      model: 0.70
      baselines:
