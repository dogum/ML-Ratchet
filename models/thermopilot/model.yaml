id: thermopilot
name: ThermoPilot
version: "1.0"
status: released
released: 2026-11-17
order: 21
domain: Buildings
platform: building
tags: [buildings, thermostat, heat pumps, control, demand charges, imitation learning, dynamic programming, DAgger]
accent: "#0b7285"
tagline: A learned thermostat that pre-heats and pre-cools against real tariffs.
question: Every hour, which heating and cooling setpoints keep a home or small building comfortable for the lowest bill?
question_short: "Which setpoints keep a building comfortable for the lowest bill? *(graded in simulation)*"
summary: >-
  ThermoPilot is a learned, causal thermostat / heat-pump controller for homes and small commercial buildings. Every
  hour it picks a heating and a cooling setpoint from a menu of 36 pairs (off, the comfort-band edge, or pre-heat /
  pre-cool by up to 3 K) to minimise the bill plus a penalty of $3 per kelvin-hour outside the occupant's comfort band
  (per 150 m² of floor). It was trained only in BuildingSim, by imitating a perfect-foresight dynamic-programming
  teacher (behaviour cloning, then three DAgger rounds), with a 6 h comfort shield. It was graded once on simulated
  twins of real exam units (48 RECS 2020 homes, 16 BDG2 small commercial buildings, 17 HUE homes, 38 WPuQ heat-pump
  homes) under their real weather and real tariffs. It always beats a fixed thermostat, but the classical MPC with
  the same forecast beats it on every exam set, so every exam row is a loss.
disclaimer: >-
  Graded inside the simulator. There are no real thermostat logs (ecobee's Donate Your Data needs an application), so
  every exam number is BuildingSim with real weather, real tariffs and twin buildings, not a measured saving. On 37 real
  WPuQ heat-pump homes the simulator overstates the heating slope 2.7× and puts heat-pump load at night, and the
  ThermoPilot-vs-setback order flips in 18 of 37 homes between generic and calibrated twins.

reads: "Each hour: the indoor air temperature now and over the last 3 hours (°C), the HVAC's own heat output (W) and the meter's electricity (kW) last hour, a 24 h forecast of outdoor temperature (°C) and solar (W/m²), 24 h of energy prices ($/kWh), demand-charge windows, rates and the running monthly peak, the occupant's comfort band for the next 24 h, and a building card: UA (W/K), thermal capacitance (J/K), floor area (m²), heating type, and heat-pump / furnace / AC capacity and COP tables vs outdoor temperature."
returns:
  - "A heating and a cooling setpoint (°C; ±100 means that side is off) for the hour, after a comfort shield that never lets the zone fall behind the band of the next 6 h (recovery 1 K/h heating, 0.5 K/h cooling)"
  - "No uncertainty: the policy is deterministic; exam intervals are 90 % bootstrap intervals over units"

physics:
  summary: >-
    BuildingSim v1 (shared/building, BuildingData + BuildingSim): ISO 13790 5R1C zone with Perez solar, LBL
    infiltration and EnergyPlus-derived heat-pump (capacity and COP vs outdoor temperature, defrost, backup strips),
    DX, furnace and boiler curves with part load, run at 1 h steps through the step API with exact state rollback.
    Bills from real URDB tariffs (TOU, demand charges) and ERCOT real-time prices, gas at 2025 EIA averages. The
    teacher is a dynamic program over the mass temperature (0.25 K grid, 24 h horizon, hourly replanning) with the true
    house, the true weather and the true state; on demand tariffs it re-simulates the month with a monthly peak target
    (two-pass). The classical MPC and the teacher use BuildingSim's own one-step 5R1C maps.
  simulator:
    - "Generated homes and small commercial buildings (ResStock / ComStock / CBECS priors) and twins of RECS 2020 prior-split respondents (nearest ResStock dwelling by type, climate zone, heating system and fuel, cooling, area and vintage, with the respondent's own area, occupants and thermostat settings)"
    - "The simulated 'true' house is a perturbed copy of the card the controller is told: envelope U × LN(0, 0.12), air leakage × LN(0, 0.25), thermal-mass class, plug loads, sizing"
    - "Real 2016 BDG2 site weather (11 US sites) and TMYx typical years for 17 US cities; 13 residential and 5 commercial URDB tariffs, synthetic TOU / demand tariffs, ERCOT 2018 real-time prices + 10 c/kWh"
    - "Forecast error on outdoor temperature grows with lead time; comfort bands narrower when home, wider asleep / away"
    - "533 episode-months (391k hours) labelled with the teacher's value of all 36 actions"
  checks:
    - "BuildingSim (platform checks, checks/*.json): steady conduction to 1.8e-9, RC step within 0.0035 K, ISO 13786 wall amplitude −1.6 %; BESTEST 29 of 34 values in the published ranges; ResStock twins (126 homes) site energy median 1.10×, daily r 0.92"
    - "Numba DP sweep == numpy DP loop exactly (max difference 0)"
    - "numpy inference == torch to 0 (float32); the JS port == Python on 2,232 / 2,232 demo hours; the numpy demo replays the closed-loop setpoints in 744 / 744 hours on each of 3 exam episodes"
    - "Reality check (report only): on 37 WPuQ heat-pump homes, generic twins' heating slope is a median 2.7× the real one (IQR 1.4–5.4); real January profiles are flat while twins peak at night (profile r = 0.21)"
noise: "Forecast error on outdoor temperature that grows with lead time; a perturbed 'true' house (envelope ±12 %, air leakage ±25 %, mass class, internal loads) that the controller never sees exactly; real weather years and real tariffs"
network: "MLP 298 → 384 → 384 → 36 (276,516 parameters, 277k): 34 state / tariff / building-card features plus 11 × 24 h forecast rows; trained on soft targets softmax(−Q/τ) from the teacher's action values plus expected regret, behaviour cloning then 3 DAgger rounds; argmax over the 36 setpoint pairs, then the 6 h comfort shield"

approach:
  real_backdrop: "Real weather years (BDG2 2016 site weather, TMYx cities) and real tariffs (URDB, ERCOT real-time prices) drive every simulated training episode"
  physics_inputs: "A building card from the physics model: UA, thermal capacitance, heat-pump / furnace / AC capacity and COP tables evaluated on the 24 h temperature forecast"
  physics_anchor: "A comfort shield built on recovery rates (1 K/h heating, 0.5 K/h cooling) clips the network's setpoints so the zone can always reach the next 6 h of the band; the equipment model meets the setpoints within capacity"
  real_data_roles: [backdrop, gate, exam]

data:
  - name: Building Data Genome 2 (BDG2) — Miller et al., Scientific Data 7, 368 (2020)
    url: https://github.com/buds-lab/building-data-genome-project-2
    licence: CC BY-SA 4.0 (derived data share-alike; examples/bdg2/, lab/ and the instrument data are BDG2-derived)
    role: noise (2016 site weather for training), dev (4 BDG2 dev buildings), exam (16 small commercial buildings, 2017 weather for the RECS twins)
  - name: EIA Residential Energy Consumption Survey (RECS) 2020 microdata
    url: https://www.eia.gov/consumption/residential/data/2020/
    licence: Public domain (US government)
    role: truth (twins and comfort bands of prior-split respondents), dev (11 respondents), exam (48 respondents)
  - name: NREL ResStock 2025 R1 / ComStock 2025 R3 (OEDI)
    url: https://resstock.nrel.gov/
    licence: CC BY 4.0
    role: physics (generator priors, nearest-dwelling twin matching)
  - name: HUE, the Hourly Usage of Energy dataset for buildings in British Columbia — Makonin, Data in Brief (2019)
    url: https://doi.org/10.7910/DVN/N3HGRN
    licence: CC BY 4.0
    role: exam (17 homes, Vancouver 2017 weather)
  - name: WPuQ heat-pump and household data, Lower Saxony — Schlemminger et al., Scientific Data (2022)
    url: https://doi.org/10.5281/zenodo.5642902
    licence: CC BY 4.0
    role: exam (38 heat-pump homes, January 2019 weather), reality check (37 homes' real heat-pump electricity)
  - name: Utility Rate Database (URDB), OpenEI / NREL
    url: https://openei.org/wiki/Utility_Rate_Database
    licence: Open data, free use with credit
    role: physics (18 real tariffs for training and exam bills)
  - name: ERCOT real-time settlement point prices 2018 / 2019 (via GridData)
    url: https://www.ercot.com/mp/data-products
    licence: Public market data, free use with credit
    role: physics (real-time tariff, + 10 c/kWh)
  - name: TMYx typical weather years, climate.onebuilding.org
    url: https://climate.onebuilding.org/
    licence: "Cite Lawrie and Crawley, TMYx; the site says All Rights Reserved and states no reuse licence: used for simulation only, not redistributed"
    role: noise (17 US cities for training)
  - name: NASA POWER hourly irradiance; EIA natural gas prices (2025 averages)
    url: https://power.larc.nasa.gov/
    licence: Free use with credit / public domain (US government)
    role: physics (solar for the HUE homes; gas price $15.34 residential, $10.98 commercial per Mcf)

split:
  dev: "30 episodes: 11 RECS 2020 dev respondents and 4 BDG2 dev buildings, January and July 2017 (frozen splits, seed 20261116); frozen simulated val set: 60 episodes"
  exam: "RECS 2020 exam respondents: 48 homes × January + July 2017, 12 real tariffs in 9 states (4 of 6 drawn per tariff slot, fixed before the exam); BDG2: 16 small offices / schools / shops × January + July 2017, 4 commercial tariffs; HUE: 17 BC homes, 21 episodes; WPuQ: 38 heat-pump homes, January 2019"

exam:
  short: "187 simulated twin episodes, real weather and tariffs"
  summary: >-
    Run once with R7 (v1.0) after the release choice, never used for any choice. Twins of real exam units (perturbed
    true house, noisy forecasts) under their real weather and real tariffs, against a fixed thermostat, the occupant's
    own setback schedule, an in-band pre-cool rule, a classical MPC with the same noisy forecast, and a
    perfect-foresight bound. Bill = energy + demand + gas for the month (fixed charges left out). Savings are summed
    over episodes; 90 % bootstrap intervals over units. Skill = share of the perfect-foresight saving on cost + comfort
    (0 = fixed thermostat, 1 = perfect foresight). The classical MPC beats ThermoPilot on every set.
  results:
    - metric: RECS exam twins (96 home-months, 12 tariffs), bill saving vs fixed thermostat
      better: higher
      model: 2.2
      unit: "%"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback (occupant's own schedule)", kind: dumb, value: 2.2 }
        - { name: "In-band pre-cool rule", kind: classical, value: 2.4 }
        - { name: "MPC with forecast", kind: classical, value: 3.5 }
      verdict: loss
      note: "ThermoPilot 2.18 % [1.63, 2.78]; setback 2.24 % [1.45, 3.01], so ThermoPilot vs setback is −0.05 % [−0.67, +0.54], level; pre-cool rule 2.42 %; MPC 3.50 % [2.67, 4.35]; perfect foresight 3.63 % [2.89, 4.46]. Standard setback (−4 / +4 K) saves 9.2 % but leaves the band for 832 K h per episode. Setback raised the bill on 2 of 12 tariffs (Duke RT, Rocky Mountain Power TOU). ThermoPilot beats the best rule in 28 % of home-months (MPC 49 %)."
    - metric: RECS exam twins, skill on cost + comfort (0 = fixed, 1 = perfect foresight)
      better: higher
      model: 0.33
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback (occupant's own schedule)", kind: dumb, value: -0.55 }
        - { name: "In-band pre-cool rule", kind: classical, value: 0.15 }
        - { name: "MPC with forecast", kind: classical, value: 0.84 }
      verdict: loss
      note: "Beats the fixed thermostat and both rules on the objective it was trained for; the MPC captures 0.84 of the perfect-foresight saving, ThermoPilot 0.33."
    - metric: RECS exam twins, kelvin-hours outside the comfort band per episode
      better: lower
      model: 1.4
      unit: "K h"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.7 }
        - { name: "Setback (occupant's own schedule)", kind: dumb, value: 2.5 }
        - { name: "In-band pre-cool rule", kind: classical, value: 1.5 }
        - { name: "MPC with forecast", kind: classical, value: 0.9 }
      verdict: loss
      note: "ThermoPilot 1.43 K h (0.41 while home); better comfort than setback (2.52) and the pre-cool rule (1.47), worse than fixed (0.71) and MPC (0.89). Mean PPD while home 23.3 % (fixed 22.7 %, MPC 23.7 %)."
    - metric: BDG2 small commercial twins (32 building-months, 4 tariffs), bill saving vs fixed thermostat
      better: higher
      model: 2.8
      unit: "%"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback (operating schedule)", kind: dumb, value: 1.2 }
        - { name: "In-band pre-cool rule", kind: classical, value: -0.3 }
        - { name: "MPC with forecast", kind: classical, value: 3.1 }
      verdict: loss
      note: "ThermoPilot 2.77 % [1.37, 4.17], 0.05 K h per episode; setback 1.18 % [0.45, 2.06], so ThermoPilot beats setback by 1.60 % [0.59, 2.63]; MPC 3.05 % [1.89, 4.38], 0.21 K h; perfect foresight 7.24 %. Closest to the MPC here (demand tariffs: PG&E B-19, OUC GSD, Xcel A15, Pepco GT); skill 0.45 vs MPC 0.47. Setback raised the bill in January (−2.5 %)."
    - metric: HUE BC home twins (21 episodes), bill saving vs fixed thermostat
      better: higher
      model: 4.3
      unit: "%"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback (occupant's schedule)", kind: dumb, value: 5.9 }
        - { name: "In-band pre-cool rule", kind: classical, value: 5.7 }
        - { name: "MPC with forecast", kind: classical, value: 5.7 }
      verdict: loss
      note: "ThermoPilot 4.29 % [3.92, 4.66], 0.36 K h; setback 5.89 % [5.63, 6.21] but 3.07 K h, so ThermoPilot saves 1.70 % [1.53, 1.89] less than setback with better comfort; MPC 5.75 %, 0.17 K h; perfect foresight 5.78 %. Skill 0.54 vs MPC 0.95 and setback −0.54. Stand-in tariff PG&E E-TOU-C; 17 homes, January (+ July for the 4 with AC), Vancouver 2017."
    - metric: WPuQ heat-pump home twins (38 homes, January 2019), bill saving vs fixed thermostat
      better: higher
      model: 3.1
      unit: "%"
      baselines:
        - { name: "Fixed thermostat", kind: dumb, value: 0.0 }
        - { name: "Setback", kind: dumb, value: 5.6 }
        - { name: "In-band pre-cool rule", kind: classical, value: 5.6 }
        - { name: "MPC with forecast", kind: classical, value: 7.2 }
      verdict: loss
      note: "ThermoPilot 3.13 % [2.35, 3.89]; setback 5.58 % [4.46, 6.45] at 0.01 K h, so ThermoPilot saves 2.59 % [1.77, 3.26] less than setback; MPC 7.16 % [6.77, 7.53]; perfect foresight 7.50 %. Skill 0.35 vs setback 0.65 and MPC 0.95. Generic twins (no building metadata), stand-in tariff Xcel MN TOD."
    - metric: "WPuQ reality check (report only): controller order on generic vs envelope-scaled twins, median Kendall tau"
      better: higher
      model: 0.70
      baselines: []
      verdict: info
      note: "Simulator vs simulator on 37 homes. 'MPC > ThermoPilot > fixed' holds; ThermoPilot vs setback flips in 18 of 37 homes. Saving on cost + comfort vs fixed, generic → scaled twins: perfect foresight 7.0 → 5.3 %, MPC 6.7 → 4.7 %, ThermoPilot 2.5 → 1.0 %, setback 4.5 → −3.2 %."
  coverage: []

wins:
  - "Always beats the fixed thermostat on bill: 2.2 % (RECS homes), 2.8 % (BDG2 commercial), 4.3 % (HUE), 3.1 % (WPuQ heat pumps)."
  - "Better comfort than the occupant's setback schedule: 1.4 vs 2.5 K h per home-month on RECS twins, 0.4 vs 3.1 K h on HUE, for about the same bill on RECS (−0.05 % [−0.67, +0.54])."
  - "On commercial demand tariffs (BDG2) it is close to the classical MPC (2.8 % vs 3.1 %, skill 0.45 vs 0.47) and beats setback by 1.6 % [0.6, 2.6]."
losses:
  - "The classical MPC with the same noisy forecast beats it on every exam set: RECS 3.5 % vs 2.2 %, BDG2 3.1 % vs 2.8 %, HUE 5.7 % vs 4.3 %, WPuQ 7.2 % vs 3.1 %; it captures 0.33–0.54 of the perfect-foresight saving against the MPC's 0.47–0.95."
  - "On homes it saves no more than the setback schedule (RECS, level) or less (HUE −1.7 %, WPuQ −2.6 %)."
  - "Worse comfort than a fixed thermostat on RECS twins (1.4 vs 0.7 K h per episode)."
limits:
  - "Graded in simulation: there are no real thermostat logs (ecobee Donate Your Data needs an application; Pecan Street is paid). Every exam number is BuildingSim with real weather, real tariffs and twin buildings."
  - "WPuQ reality check (37 real heat-pump homes, report only): generic twins overstate the heating slope 2.7× (median; IQR 1.4–5.4) and peak at night while real heat pumps run flat (hourly-profile r = 0.21). The controller order MPC > ThermoPilot > fixed holds (Kendall tau 0.70), but ThermoPilot vs setback flips in 18 of 37 homes, so that comparison cannot be trusted from the simulator. Time-shifting savings are the least certain part."
  - "Hourly ideal thermostat: one zone, no short-cycling or minimum run times, no humidity control; on/off counts are hourly."
  - "Twins come from survey characteristics plus a ResStock match, not audits. HUE and WPuQ use stand-in US tariffs."
  - "Perfect foresight is a practical bound (a DP on a 0.25 K grid with the 36-pair menu, plus rules), not a proven optimum."
  - "Heat pumps are under-represented in training (most generated and RECS homes heat with gas furnaces)."
  - "The comfort weight (λ = $3 per K h per 150 m²) was fixed in training; the network sees it only through log(λ / (mean price × size))."
help_wanted:
  - "Real thermostat logs: ecobee Donate Your Data (research application) would give a real exam of setpoints, run times and time constants."
  - "UK heat-pump field trials (RHPP, Electrification of Heat): UK Data Service registration; they would test the heat-pump load shape the WPuQ check found wrong."
  - "Pecan Street Dataport (paid): US homes with circuit-level HVAC data."
  - "EnergyPlus as a reference engine: no PyPI wheel with an engine and GitHub was blocked in the build sandbox; install it outside and compare BuildingSim's zone response."
next:
  - "More DAgger rounds plus a heat-pump-heavy bank (val skill still rose with every round)."
  - "Make the student a residual on a cheap MPC, or distil the classical MPC's value function."
  - "Calibrate residential twins on RECS dev annual energy, then build a new frozen val set and re-score every rung."
  - "A real exam once ecobee access exists."

usage:
  install: pip install numpy
  demo: python demo.py
  python: |
    import numpy as np, thermopilot_core as tp
    W = tp.load('thermopilot_v1.npz')
    ctx = tp.make_ctx(local_hours, price, lo, hi, pref_lo, pref_hi, state, dperiod, drate, frate)   # pandas DatetimeIndex
    pilot = tp.ThermoPilot(W, card, ctx, lam=3.0 * max(1, area_m2 / 150), base_W=expected_other_load_W)
    for k in range(len(price)):
        sp = pilot.step(k, T_zone, q_hvac_prev_W, elec_prev_kW, forecast_T_out_24h, forecast_GHI_24h)
        # -> {'heat_sp': .., 'cool_sp': ..}  (°C; ±100 = that side off)

