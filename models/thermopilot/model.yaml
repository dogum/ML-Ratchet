  inference: [thermopilot_core.py, pipeline.py]
  weights: [thermopilot_v1.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 2
