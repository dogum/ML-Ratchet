  licence: GNU GPL v2 (stated in the data volumes)
  role: dev, exam
- name: UIUC Airfoil Coordinates Database
  url: https://m-selig.ae.illinois.edu/ads/coord_database.html
  licence: No explicit licence; compiled from many sources; cited
  role: physics (training shapes)
- name: mfoil (K. J. Fidkowski), via the pymfoil 0.1.0 PyPI package
  url: https://pypi.org/project/pymfoil/
  licence: MIT
  role: physics
- name: NeuralFoil 0.3.3 weights (P. Sharpe)
  url: https://pypi.org/project/neuralfoil/
  licence: MIT
  role: baseline
- name: XFOIL polars published on airfoiltools.com
  url: http://airfoiltools.com/
