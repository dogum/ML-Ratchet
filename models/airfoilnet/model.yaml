id: airfoilnet
name: AirfoilNet
version: '1.0'
status: released
released: '2026-11-22'
order: 34
domain: Aerodynamics
tags:
- airfoils
- wind tunnel
- polars
- XFOIL
- low Reynolds number
- MLP
- uncertainty
accent: '#1d4fb8'
tagline: 'The wind tunnel: an airfoil polar from its shape, graded on real tunnel data.'
question: What lift, drag and moment curves will this airfoil have, and where does it stall?
question_short: What polar will this airfoil have, and where does it stall?
summary: From an airfoil's coordinates and a Reynolds number (4e4-6e5), AirfoilNet predicts Cl, Cd and Cm against angle of
  attack, with 68% error bars, and from them Cl max and the stall angle. It learned only from 151 alpha sweeps of mfoil, an
  XFOIL-class viscous-inviscid solver, on airfoil shapes from the UIUC database with every tested airfoil removed. It was
  examined once on the clean wind-tunnel polars of 75 airfoils from 34 families in the UIUC Low-Speed Airfoil Tests. It beats
  NeuralFoil on maximum lift and stall angle and loses to it on lift before stall, drag and moment.
reads: Airfoil coordinates (any .dat, Selig or Lednicer; refitted with an 18-parameter CST), Reynolds number 4e4-6e5, angles
  of attack (deg). Incompressible, clean (free transition).
returns:
- Cl(alpha) +- 68% bar
- Cd(alpha) with a bar on ln Cd
- Cm about c/4 (alpha) +- 68% bar
- Cl max and stall angle from the predicted polar
physics:
  summary: 'XFOIL-class viscous-inviscid analysis: linear-vorticity panel method with transpiration, two-equation integral
    boundary layer (Drela closures), e^N transition (Ncrit 9), lag-entrainment turbulent shear, wake, all coupled in one global
    Newton solve (mfoil by K. Fidkowski).'
  simulator:
  - mfoil v2023-06-28 (MIT) with numba kernels (same arithmetic, 1e-13 agreement), sharp-trailing-edge and Newton limit-cycle
    fixes
  - 'Shapes: 1,283 UIUC database airfoils (tested airfoils and near-duplicates removed) plus blends, CST-smoothed, 120 panels'
  - Re log-uniform 4e4-6e5; alpha sweeps in 2-deg steps with warm starts; points flagged when only loosely converged
  - Physics p1c (dev-fitted drag-vs-Re correction) was tried and rejected by the ratchet
  checks:
  - 'Panel method vs exact Joukowski airfoil: Cl within 0.10-0.22%, Cp mean abs error 0.0012 (training/verify_physics.json)'
  - 'Thin-airfoil theory, NACA 2404: zero-lift angle -2.096 vs -2.077 deg; lift slope 1.031 x 2pi (thickness rule 1.031)'
  - 'Published XFOIL 6.99 polars (airfoiltools.com, Ncrit 9), NACA 0012/2412/4412, 42 points: Cl 0.0037, Cd median 0.5%, Cm
    0.0007'
  - 'NACA 2412 at Re 3e6: aL0 -2.21 deg, slope 0.111/deg, Clmax 1.75, Cdmin 0.0051 vs book values ~-2.0, ~0.105, ~1.6, ~0.006'
  - 'Numba port vs original mfoil: Cl, Cd, Cm within 4e-13 (training/verify_fast.json)'
noise: 'None injected: no public record of tunnel noise for these polars. Scatter comes from the solver itself (loose-convergence
  points, different panelings).'
network: 'MLP on polars: 50 shape/Re features + 3 alpha features -> 3 hidden layers of 128 (SiLU) -> Cl, ln Cd, Cm and their
  log-sigmas; beta-NLL; 3 seeds averaged (3 x 40,710 parameters)'
approach:
  real_backdrop: false
  physics_inputs: CST thickness and camber at 24 stations (a shape fit, not a solver output)
  physics_anchor: false
  real_data_roles:
  - calibration
  - gate
  - error_bars
  - exam
