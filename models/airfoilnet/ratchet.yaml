model: airfoilnet
ladders:
- name: AirfoilNet
  objective: Mean over Cl, ln Cd, Cm of (1 - MAE / MAE of a constant guess) on the frozen simulated set
  rule: Keep if the frozen-set skill beats the incumbent by more than 0.01 AND the dev error D = mean(Cl_pre/0.10, lnCd/0.20,
    Clmax/0.20, stall/3 deg) is at most 1.05 x the incumbent.
  margin: 0.01
  dev_gate: Dev error D (7 real dev airfoils) <= 1.05 x incumbent
  frozen_sets:
  - val1
  - val2
  scored_on: val2
  note: val1 = 50 sweeps of held-out database shapes with physics p1; val2 = the same sweeps with physics p1c labels. Every
    decision was re-taken on val2 in order; none changed. sim = val2 skill.
  columns_source: 'metrics: val1 skill, val2 skill, dev D, then dev Cl_pre, ln Cd, Cl max, stall angle (deg) — real dev airfoils,
    the gate input'
  columns:
  - val1
  - val2
  - dev D
  - dev Cl pre
  - dev lnCd
  - dev Clmax
  - dev stall
  rungs:
  - id: r1
    change: 'MLP on polars: shape sensors + log Re + alpha -> Cl, ln Cd, Cm with log-sigmas; 151 sweeps (snapshot A)'
    sim: 0.7506
    dev:
      cl_pre: 0.142
      lncd: 0.2714
      clmax: 0.1189
      a_stall: 2.2808
    decision: released
    why: First rung; never beaten.
    metrics:
    - 0.7646
    - 0.7506
    - 1.0329
    - 0.142
    - 0.2714
    - 0.1189
    - 2.2808
  - id: r2
    change: 'DeepONet (branch: shape + Re, trunk: alpha), same data'
    sim: 0.714
    dev:
      cl_pre: 0.1568
      lncd: 0.2849
      clmax: 0.1873
      a_stall: 2.7791
    decision: rejected
    why: 'val2: sim -0.037 not > +0.01; dev D 1.214 > 1.05 x 1.033. val1: sim -0.038 not > +0.01; dev D 1.214 > 1.05 x 1.033'
    metrics:
    - 0.7266
    - 0.714
    - 1.2137
    - 0.1568
    - 0.2849
    - 0.1873
    - 2.7791
  - id: r3
    change: DeepONet predicting corrections to thin-airfoil Cl and Cm
    sim: 0.6911
