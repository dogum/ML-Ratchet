# The ratchet ladder, normalised from training/ratchet.json (written by training/ratchet.py) and
# weights/basindetective_v1_sigma.json. Every rung was re-scored on each new physics version's frozen set.
model: basindetective
ladders:
  - name: "BasinDetective v1.0 (WaterSim physics v1-v4, 18 Nov 2026)"
    objective: "Sim skill: mean over the 11 regression outputs of max(R2, 0) and 2 AUC - 1 for 'regulated', on the frozen simulated set of the current physics version (bank shards 900-903, 1,000 basins each: val-v1 ... val-v4)"
    rule: "Keep if the sim skill beats the incumbent, re-scored on the same frozen set, by more than 0.01 AND the real dev composite (mean Spearman rho of the six changes on the dev basins, 1999-2008 -> 1980-89, and 2 AUC - 1 for regulation) is no more than 0.02 below the incumbent's."
    margin: 0.01
    dev_gate: "Dev composite may not drop by more than 0.02 (51 dev basins with a 1980s record; 5 regulated)"
    frozen_sets: [val-v1, val-v2, val-v3, val-v4]
    scored_on: val-v4
    note: >-
      Physics versions: v1 WaterSim generator with default gauge noise; v2 dev-fitted gauge records and precipitation
      prior (calib_gauge.py, calib_pbias.py); v3 decadal drift of the forcing precipitation (calib_drift.py); v4
      year-to-year precipitation error (calib_annual.py). A new frozen set was built per version and every earlier
      rung re-scored (columns val-v1 to val-v4; '–' = not scored on that set). Rule notes: the dev basins fitted the
      v2-v4 physics and also gate the rungs (partly in-sample; the decadal-drift mean is the clearest case). The
      status doc and the rule text say 52 dev basins; the dev scores are over the 51 with a usable 1980s record.
      The gate compares each rung with the current incumbent only, so the released R5 sits 0.027 below R1 on the
      dev composite, more than one tolerance. calib_annual.py as shipped writes the best grid value (0.12);
      annual_v4.json holds 0.101, interpolated between the 0.08 and 0.12 grid points (recorded in
      calib_annual.json), a step that is not in the script. Nothing was re-run on import.
    columns_source: "Sim skill on each frozen set (training/ratchet.json rungs and rescores), then the real dev gate: composite, Spearman rho of each change and the regulation AUC, on 51 dev basins (raw sigma, before the widen-only factors)"
    columns: ["val-v1", "val-v2", "val-v3", "val-v4", "Dev composite", "Dev ρ mean flow", "Dev ρ runoff ratio", "Dev ρ BFI", "Dev ρ Q5", "Dev ρ Q95", "Dev ρ half-flow date", "Dev AUC regulated"]
    rungs:
      - id: r1
        change: "MLP 2x256 GELU (dropout 0.1), Gaussian heads + regulated logit; ~150 features; bank v1 shards 0-39 (10,000 simulated basins)"
        sim: 0.5464
        dev: {"composite": 0.4786, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1246, "d_rr": 0.0451, "d_bfi": 0.0193, "d_logq5": 0.0947, "d_logq95": 0.1477, "d_hfd": 7.0179}, "cov68_raw": {"d_logq": 0.353, "d_rr": 0.275, "d_bfi": 0.431, "d_logq5": 0.627, "d_logq95": 0.353, "d_hfd": 0.392}, "sim_r2": {"reg_auc": 0.897, "d_logq": 0.819, "d_rr": 0.496, "d_bfi": 0.428, "d_logq5": 0.414, "d_logq95": 0.761, "d_hfd": 0.552, "log_kslow": 0.553, "gw_share": 0.631, "log_soilcap": 0.419, "log_pmult": 0.287, "log_dor": 0.403}}
        decision: kept
        why: "first rung"
        metrics: [0.5464, 0.4755, 0.4155, 0.4097, 0.4786, 0.635, 0.315, 0.225, 0.553, 0.594, 0.395, 0.817]
      - id: r1b
        change: "wider/deeper MLP 3x384 (dropout 0.15), same bank v1 0-39"
        sim: 0.5516
        dev: {"composite": 0.4133, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1426, "d_rr": 0.0455, "d_bfi": 0.0171, "d_logq5": 0.134, "d_logq95": 0.1707, "d_hfd": 9.2282}, "cov68_raw": {"d_logq": 0.255, "d_rr": 0.235, "d_bfi": 0.471, "d_logq5": 0.627, "d_logq95": 0.275, "d_hfd": 0.314}, "sim_r2": {"reg_auc": 0.898, "d_logq": 0.813, "d_rr": 0.496, "d_bfi": 0.439, "d_logq5": 0.426, "d_logq95": 0.746, "d_hfd": 0.54, "log_kslow": 0.569, "gw_share": 0.66, "log_soilcap": 0.455, "log_pmult": 0.294, "log_dor": 0.385}}
        decision: rejected
        why: "sim skill 0.5516 vs incumbent R1 0.5464 on val-v1 (delta +0.0052, need > 0.01); dev composite 0.4133 vs 0.4786 (FAIL)"
        metrics: [0.5516, 0.4985, 0.4411, 0.4228, 0.4133, 0.657, 0.273, 0.168, 0.424, 0.585, 0.382, 0.702]
      - id: r1e
        change: "5-seed ensemble of the R1 configuration (mean of means; variance = mean variance + spread of means)"
        sim: 0.5612
        dev: {"composite": 0.4612, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1341, "d_rr": 0.0477, "d_bfi": 0.0187, "d_logq5": 0.1207, "d_logq95": 0.1478, "d_hfd": 7.8028}, "cov68_raw": {"d_logq": 0.314, "d_rr": 0.294, "d_bfi": 0.471, "d_logq5": 0.706, "d_logq95": 0.294, "d_hfd": 0.431}, "sim_r2": {"reg_auc": 0.905, "d_logq": 0.821, "d_rr": 0.504, "d_bfi": 0.441, "d_logq5": 0.416, "d_logq95": 0.762, "d_hfd": 0.561, "log_kslow": 0.564, "gw_share": 0.641, "log_soilcap": 0.455, "log_pmult": 0.305, "log_dor": 0.454}}
        decision: kept
        why: "sim skill 0.5612 vs incumbent R1 0.5464 on val-v1 (delta +0.0147, need > 0.01); dev composite 0.4612 vs 0.4786 (ok). The dev composite fell 0.017, inside the 0.02 tolerance."
        metrics: [0.5612, 0.4966, 0.4342, 0.4199, 0.4612, 0.645, 0.283, 0.216, 0.473, 0.599, 0.439, 0.787]
      - id: r2
        change: "physics v2: dev-fitted gauge records (AR(1) rho 0.999, cv 0.02, 3 significant figures in cfs; calib_gauge.py) + dev-measured precipitation bias log m ~ N(-0.076 + 0.30 fsnow, 0.116) (calib_pbias.py); 5-seed ensemble, bank v2 0-39"
        sim: 0.5776
        dev: {"composite": 0.4564, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1282, "d_rr": 0.0472, "d_bfi": 0.0188, "d_logq5": 0.104, "d_logq95": 0.1742, "d_hfd": 8.6519}, "cov68_raw": {"d_logq": 0.314, "d_rr": 0.373, "d_bfi": 0.49, "d_logq5": 0.745, "d_logq95": 0.275, "d_hfd": 0.392}, "sim_r2": {"reg_auc": 0.914, "d_logq": 0.807, "d_rr": 0.46, "d_bfi": 0.442, "d_logq5": 0.388, "d_logq95": 0.741, "d_hfd": 0.561, "log_kslow": 0.572, "gw_share": 0.646, "log_soilcap": 0.445, "log_pmult": 0.601, "log_dor": 0.44}}
        decision: kept
        why: "sim skill 0.5776 vs incumbent R1e 0.4966 on val-v2 (delta +0.0810, need > 0.01); dev composite 0.4564 vs 0.4612 (ok)"
        metrics: ["–", 0.5776, 0.5263, 0.4936, 0.4564, 0.654, 0.231, 0.283, 0.47, 0.608, 0.408, 0.77]
      - id: r3
        change: "physics v3: decadal drift of the forcing precipitation measured by dev twins (TRUE target-decade P = SEEN / exp(delta), delta ~ N(0.029, 0.038); calib_drift.py); 5-seed ensemble, bank v3 0-39"
        sim: 0.5513
        dev: {"composite": 0.4613, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1193, "d_rr": 0.0473, "d_bfi": 0.0223, "d_logq5": 0.0926, "d_logq95": 0.1434, "d_hfd": 8.8355}, "cov68_raw": {"d_logq": 0.471, "d_rr": 0.49, "d_bfi": 0.569, "d_logq5": 0.843, "d_logq95": 0.49, "d_hfd": 0.353}, "sim_r2": {"reg_auc": 0.905, "d_logq": 0.727, "d_rr": 0.439, "d_bfi": 0.361, "d_logq5": 0.363, "d_logq95": 0.682, "d_hfd": 0.56, "log_kslow": 0.477, "gw_share": 0.659, "log_soilcap": 0.454, "log_pmult": 0.577, "log_dor": 0.508}}
        decision: kept
        why: "sim skill 0.5513 vs incumbent R2 0.5263 on val-v3 (delta +0.0251, need > 0.01); dev composite 0.4613 vs 0.4564 (ok). The drift mean behind v3 was fitted on the same dev basins that gate it (rule note)."
        metrics: ["–", "–", 0.5513, 0.5082, 0.4613, 0.58, 0.294, 0.271, 0.585, 0.528, 0.371, 0.8]
      - id: r4
        change: "physics v4: year-to-year forcing precipitation error, TRUE P x exp(e_y), e_y ~ N(0, 0.10) per water year, fitted on dev twins to the real annual flow-vs-P correlation (calib_annual.py); 5-seed ensemble, bank v4 0-39"
        sim: 0.5085
        dev: {"composite": 0.4612, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1033, "d_rr": 0.0482, "d_bfi": 0.02, "d_logq5": 0.0796, "d_logq95": 0.1413, "d_hfd": 7.5469}, "cov68_raw": {"d_logq": 0.608, "d_rr": 0.647, "d_bfi": 0.529, "d_logq5": 0.882, "d_logq95": 0.647, "d_hfd": 0.412}, "sim_r2": {"reg_auc": 0.884, "d_logq": 0.574, "d_rr": 0.28, "d_bfi": 0.357, "d_logq5": 0.362, "d_logq95": 0.543, "d_hfd": 0.66, "log_kslow": 0.467, "gw_share": 0.659, "log_soilcap": 0.475, "log_pmult": 0.561, "log_dor": 0.396}}
        decision: rejected
        why: "sim skill 0.5085 vs incumbent R3 0.5082 on val-v4 (delta +0.0003, need > 0.01); dev composite 0.4612 vs 0.4613 (ok). The v4 physics itself stayed: R5 trains on banks v3 + v4 and is scored on val-v4."
        metrics: ["–", "–", "–", 0.5085, 0.4612, 0.639, 0.271, 0.201, 0.608, 0.561, 0.366, 0.791]
      - id: r5
        change: "more data: banks v3 + v4 together (20,000 simulated basins), 60 epochs; 5-seed ensemble"
        sim: 0.5405
        dev: {"composite": 0.4515, "n_basins": 51, "n_regulated": 5, "median_abs_err": {"d_logq": 0.1257, "d_rr": 0.0415, "d_bfi": 0.0213, "d_logq5": 0.0923, "d_logq95": 0.1312, "d_hfd": 7.6346}, "cov68_raw": {"d_logq": 0.608, "d_rr": 0.647, "d_bfi": 0.569, "d_logq5": 0.824, "d_logq95": 0.706, "d_hfd": 0.431}, "sim_r2": {"reg_auc": 0.911, "d_logq": 0.587, "d_rr": 0.298, "d_bfi": 0.376, "d_logq5": 0.397, "d_logq95": 0.562, "d_hfd": 0.692, "log_kslow": 0.508, "gw_share": 0.682, "log_soilcap": 0.513, "log_pmult": 0.585, "log_dor": 0.465}}
        decision: released
        why: "sim skill 0.5405 vs incumbent R3 0.5082 on val-v4 (delta +0.0323, need > 0.01); dev composite 0.4515 vs 0.4613 (ok). Released as v1.0 with the widen-only factors below. Its dev composite is 0.027 below R1's: each gate compares with the current incumbent only."
        metrics: ["–", "–", "–", 0.5405, 0.4515, 0.609, 0.253, 0.268, 0.586, 0.51, 0.35, 0.791]
      - id: widen
        change: "Error bars: one widen-only factor per output, f = max(1, 68th percentile of |error| / sigma): the six changes on the real dev basins (1999-2008 -> 1980-89), the hidden properties on the 260 dev twins, log storage none (no dev truth); regulation temperature by dev log loss, kept >= 1 (calib_sigma.py)"
        decision: kept
        why: "Factors: d_logq ×1.15, d_rr ×1.05, d_bfi ×1.49, d_logq5 ×1.00, d_logq95 ×1.00, d_hfd ×1.73, log_kslow ×1.12, gw_share ×1.00, log_soilcap ×1.00, log_pmult ×1.00, log_dor ×1.00; regulation temperature 1.3. Dev 68 % coverage after widening 0.69 for the changes widened (Q5 0.82 and Q95 0.71 were already above 0.68). No effect on the means. The sigma JSON says dev real (52); the coverages are counts out of 51."
        metrics: ["–", "–", "–", "–", "–", "–", "–", "–", "–", "–", "–", "–"]
