id: basindetective
name: BasinDetective
version: "1.0"
status: released
released: 2026-11-18
order: 25
domain: Hydrology
platform: water
tags: [hydrology, streamflow, catchment, signatures, change detection, reservoirs, groundwater, CAMELS-US, ERA5-Land, WaterSim, uncertainty]
accent: "#2b8a3e"
tagline: How a river's flow changes in a decade it has not seen, from its own gauge record
question: Given nine years of a river basin's weather and flow, how do its flow signatures change in another decade, is a reservoir upstream, and what are its hidden stores?
question_short: "A river's flow in an unseen decade, from its own record"
disclaimer: >-
  Research model. On the change between decades it is level with a per-basin calibrated GR4J model on five of six
  signatures and behind it on mean flow; its reservoir detector is at chance on real basins (AUC 0.49), and its four
  hidden properties have no real truth (graded on simulated twins only).
summary: >-
  BasinDetective reads a river basin's daily precipitation, temperature and potential evaporation and its gauged
  streamflow for about nine years, plus the weather of another decade. It says how six flow signatures change in
  that other decade (mean flow, runoff ratio, baseflow index, low flow Q5, high flow Q95, half-flow date), whether a
  reservoir holding more than 10 % of the annual flow sits upstream, and four hidden properties (slow-store time
  constant, groundwater share, soil capacity, precipitation multiplier), each with an error bar. It was trained only
  on 20,000 WaterSim basins driven by real ERA5-Land weather from non-exam years, and examined once on 619 real
  CAMELS-US basins, predicting 1989-99 from 1999-2008. With paired intervals it ties calibrated GR4J on five of the
  six changes and loses on mean flow (rho 0.76 vs 0.79), needs no per-basin calibration, and its bars are too wide;
  regulation detection did not transfer.

reads: "Daily basin-average precipitation P (mm/day), mean temperature T_mean (°C) and potential evaporation PET (mm/day) for a gauged period of about 9 water years (trained on 9), the gauged streamflow Q (mm/day over the basin; NaN = missing) on the same days, and P, T_mean and PET for the target period (trained on 10 water years). Exam inputs: 1999-10..2008-09 forcing and Caravan Q, and 1989-10..1999-09 forcing."
returns:
  - "Change from the gauged to the target decade of six signatures, each mean ± 1 sigma: log ratio of mean flow, runoff ratio, baseflow index (Lyne-Hollick), log ratio of Q5, log ratio of Q95, half-flow date (days); plus the implied target-decade level with its 68 % range"
  - "p_regulated: probability that upstream reservoir storage exceeds 10 % of the mean annual flow (temperature 1.3, fitted on dev), and log10(storage / annual flow) ± sigma (sigma not calibrated)"
  - "Four hidden properties ± sigma, no real truth: slow-store recession time constant (days), groundwater share of flow, soil water capacity (mm), true / forcing precipitation in the gauged decade"
  - "Error bars are widened by one dev-fitted factor per output (×1.00-1.73; Detective.sig_scale); divide by it for the raw ensemble sigma"

physics:
  summary: >-
    WaterSim, the shared water platform's simulator (ML Ratchet water platform, Phase 1): four conceptual runoff
    models (HBV, GR4J, SAC-SMA, VIC-lite), degree-day and energy-balance snow on elevation bands, unit-hydrograph
    routing, reservoirs with operating policies (SOP, rule curve, Hanasaki) and irrigation, driven by real ERA5-Land
    forcing from non-exam years or by its stochastic weather generator. BasinDetective's bank generator
    (training/simbank.py, no edit to the shared package) separates the TRUE forcing that drives the simulator from
    the SEEN forcing the network reads, and adds a gauge model; physics v2-v4 calibrate both on the dev basins.
  simulator:
    - "Bank: 10,000 basins per physics version (shards 0-39) and a frozen set of 1,000 (shards 900-903). 40 % camels prior (dev-basin attributes, jittered) with the donor's own ERA5-Land forcing 1951-1988; 35 % default prior on a random CAMELS basin's 1951-1988 forcing; 25 % stochastic weather. Layout: 1 spin-up year, 10-year target decade (forcing only), 9 gauged years. Random model (4) and snow routine (2) per basin; target-decade climate perturbed in half the basins (P × U(0.88, 1.12), T + U(-1, 1) °C, PET × (1 + 0.025 dT))"
    - "SEEN vs TRUE forcing: persistent precipitation multiplier, daily error cv 0.25, snow undercatch U(0, 0.1), temperature offset N(0, 0.7 °C); v2: log multiplier ~ N(-0.076 + 0.30 frac_snow, 0.116), fitted on dev (calib_pbias.py); v3: decadal drift, TRUE target-decade P = SEEN / exp(delta), delta ~ N(0.029, 0.038), fitted on dev twins (calib_drift.py); v4: year-to-year error TRUE P × exp(e_y), e_y ~ N(0, 0.10) (calib_annual.py)"
    - "Gauge model: v1 WaterSim default (AR(1) rho 0.9, cv 0.08, rating revisions, gaps); v2+ fitted on dev twins: AR(1) rho 0.999, cv 0.02, 3 significant figures in cfs (dynamics-feature gap score 5.84 → 4.63, calib_gauge.json)"
    - "Labels: six signature changes computed with an exact port of WaterData's signature code; slow-store constant, groundwater share and soil capacity from each model's parameters; true / seen precipitation; reservoir storage / natural annual flow"
  checks:
    - "WaterSim Phase 1 (shared/water/checks): GR4J vs airGR (independent Fortran in R) 1.0e-7 mm on 4,017 days; HBV snow and soil states vs TUWmodel ≤ 1e-12 mm on 12,053 days (runoff routing differs by design: NSE 0.999); water-balance closure 1.4e-15 relative on 121 runs"
    - "Signature port features.sigs vs waterdata.signatures: max relative difference 1.3e-6 on 52 dev basins (as shipped; needs the Caravan data to re-run)"
    - "Twin test on 52 dev basins × 5 dev-calibrated setups (260 twins, training/twin_final.json): change rho on twins 0.33-0.85 vs on real 0.25-0.61; the twins' own change ranks the real change at rho 0.27-0.69 (simulator skill); p_regulated median 0.06 on twins vs 0.21 on real (0.18 on unregulated real basins)"
    - "Reproduction (18 Nov 2026, training/rescore.py, seen): the released weights through the shipped exam path (realfeats.py, exam.py) on the Caravan time series reproduce every number in exam.json to 1e-9 relative, except the two Budyko-Fu R2 values (1e-7); the NWIS peak-code row, re-scored after the NWIS fetch, reproduces too; WaterData's GR4J daily simulations were re-made from the shipped parameters as run_gr4j.py writes them"
    - "Import check (18 Nov 2026, training/import_check.py): every GR4J-vs-own-record and no-change number in exam.json, the level baselines and the four examples' truth re-derive exactly from WaterData's shipped signatures.parquet"
    - "numpy == torch (float32) < 6e-6 and the shipped page's JS == Python to 2e-7 sigma (as shipped, not re-run). The site instrument re-computes the 150 features and the ensemble in TypeScript: equal to the Python package to 3.5e-15 on 36 cases (4 basins × 9 what-ifs, float16 weights); float16 weights move the outputs by ≤ 3.7e-4 relative"
noise: "Not real recordings: the gauge noise is a model fitted to real dev records. Dev twins showed real USGS daily values are smoother than WaterSim's default gauge noise (more flat days, fewer rising days); v2 fits an AR(1) multiplicative error (rho 0.999, cv 0.02) plus rounding to 3 significant figures in cfs (0.01 cfs floor) to the dev records' day-to-day features. Forcing error (precipitation multiplier, daily, annual and decadal error, snow undercatch, temperature offset) is laid between the TRUE forcing the simulator runs on and the SEEN forcing the network reads."
network: "Five MLPs (seeds), each 150 inputs → 2 × 256 GELU (dropout 0.1) → 23 outputs (means and log sigmas of 11 Gaussian targets, one logit for regulation); 110,359 weights each, 551,795 in all. Inputs: 150 engineered features of both decades' climate and their differences, gauged signatures, flow-duration curve, monthly regime, recession, baseflow filters, rain-flow lag correlations, autocorrelation and seasonal damping; robust-standardised (median / IQR of the bank), clipped to ±6. Gaussian NLL + binary cross-entropy, AdamW, one-cycle schedule, 60 epochs on 20,000 basins (banks v3 + v4). Ensemble: mean of means; variance = mean member variance + spread of means; × dev widen factor."

approach:
  real_backdrop: "Real ERA5-Land daily forcing of CAMELS basins from the free window 1951-1988 drives 75 % of the simulated basins"
  physics_inputs: "Classical hydrological signatures and filters of the gauged record (Lyne-Hollick and Eckhardt baseflow, recession constants, flow-duration curve, half-flow date) and the climate shift between decades (precipitation, PET, aridity, snow fraction)"
  physics_anchor: false
  real_data_roles: [backdrop, calibration, gate, error_bars, exam]

data:
  - name: Caravan v1.6 (Kratzert et al. 2023, Sci. Data 10, 61) with CAMELS-US streamflow (Newman et al. 2015; Addor et al. 2017) and ERA5-Land forcing (Muñoz-Sabater et al. 2021)
    url: https://doi.org/10.5281/zenodo.15529786
    licence: "CC BY 4.0 (Caravan); ERA5-Land under the Copernicus licence (free use with attribution; contains modified Copernicus Climate Change Service information). Examples in examples/ are Caravan excerpts"
    role: "physics (non-exam forcing 1951-1988 for the bank), dev (52 basins: calibration, gate, widening, twins), exam (619 basins: inputs and truth)"
  - name: HydroATLAS / BasinATLAS (Linke et al. 2019) with GRanD reservoir volumes (Lehner et al. 2011), via Caravan attributes (dor_frac)
    url: https://www.hydrosheds.org/hydroatlas
    licence: "CC BY 4.0"
    role: "truth (regulation: storage / annual flow), dev, exam"
  - name: USGS NWIS annual peak flows (peak codes 5 and 6), by WaterData
    url: https://nwis.waterdata.usgs.gov/usa/nwis/peak
    licence: "Public domain (U.S. Government)"
    role: "truth (independent regulation flag), exam"
  - name: WaterData Phase 1 baselines (GR4J+snow calibrated per basin on 1999-2008, Budyko-Fu, kNN on attributes, signatures.parquet)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water
    licence: "MIT (code); derived from the sources above"
    role: "exam (classical baselines)"
  - name: WaterSim dev-calibrated parameter sets (shared/water/checks/dev_calibrated_params.json)
    url: https://github.com/dogum/ML-Ratchet/tree/main/shared/water/checks
    licence: "MIT"
    role: "dev (twin test, physics calibration v2-v4)"

split:
  dev: "WaterData's frozen split (shared/water/data/proc/splits.json, seed 20261118): 52 CAMELS-US dev basins, read 1999-2008 → predict the non-exam window 1980-89. 51 have a usable 1980s record, so the dev gate scores 51 basins (5 regulated). Dev is used for physics calibration (gauge model, precipitation prior, decadal drift, annual error), the ratchet gate, the widen-only factors and the regulation temperature, and 260 dev twins"
  exam: "All 619 CAMELS-US exam basins: read 1999-10..2008-09 forcing and Caravan Q and 1989-10..1999-09 forcing; truth = the signatures of each basin's own observed 1989-99 flow minus those of 1999-2008, HydroATLAS storage / annual flow, and USGS peak codes 5/6 in water years 1990-2008. Run once with the released model"

exam:
  short: "619 real CAMELS-US basins, 1989-99 from 1999-2008"
  summary: >-
    619 CAMELS-US exam basins, gauged protocol: the network reads 1999-2008 forcing and flow and 1989-99 forcing and
    predicts the change of six signatures; truth is each basin's own 1989-99 record. Run once (training/exam.json). The
    fairest classical baseline is GR4J+snow calibrated per basin on the same 1999-2008 flow (WaterData), scored as its
    model-implied change; also GR4J's simulated 1989-99 minus the observed 1999-2008 value, Budyko-Fu with w fitted
    on 1999-2008, and no change. No NWM, regionalisation or dev-tuned baseline exists for the change task (NWM was
    not fetched). Intervals: seen re-score of 18 Nov 2026 (training/rescore.py), which reproduces exam.json; paired
    bootstrap over the 619 basins (10,000 resamples, seed 20261118) of the model minus each baseline, per-basin
    values in training/exam_per_basin.csv, summary in training/exam_rescore.json. Verdict: loss if any baseline is
    better with an interval excluding 0, win only if every baseline is beaten that way, else tie. The unpaired
    Fisher-z / Zou intervals of the import stay in each note as a cross-check. Result: on the six changes, a loss on
    mean flow (to GR4J model-implied, -0.036 [-0.063, -0.008]) and five ties; all six median-error rows tie; levels:
    wins on mean flow, runoff ratio, Q5 and Q95, ties on BFI and half-flow date; regulation at chance on all three
    HydroATLAS truths; against USGS peak codes 5/6 (11 positives) above chance, AUC 0.711 [0.543, 0.863], but level with the
    classical scores.
  results:
    - metric: "Change of mean flow (log ratio), 619 basins, Spearman rho"
      better: higher
      model: 0.757
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.793 }
        - { name: "Budyko-Fu, w fitted on 1999-2008", kind: classical, value: 0.768 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.698 }
      verdict: loss
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied -0.036 [-0.063, -0.008] loss; vs GR4J vs own record +0.058 [+0.012, +0.107] win; vs Budyko-Fu -0.011 [-0.037, +0.015] tie. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.721, 0.789] (Fisher z). Difference to GR4J model-implied -0.036, 95 % CI [-0.081, +0.009] (Zou, independent correlations: conservative). No change has no rank correlation (constant); its median |error| is 0.184."
    - metric: "Change of runoff ratio, 619 basins, Spearman rho"
      better: higher
      model: 0.453
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.499 }
        - { name: "Budyko-Fu, w fitted on 1999-2008", kind: classical, value: 0.465 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.325 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied -0.046 [-0.101, +0.008] tie; vs GR4J vs own record +0.127 [+0.054, +0.198] win; vs Budyko-Fu -0.013 [-0.062, +0.037] tie. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.388, 0.513]. Difference to GR4J model-implied -0.046, 95 % CI [-0.133, +0.040] (Zou, conservative). Beats GR4J-vs-own-record (+0.127 [+0.033, +0.222]) but not the fairest baseline."
    - metric: "Change of baseflow index (Lyne-Hollick), 619 basins, Spearman rho"
      better: higher
      model: 0.203
      baselines:
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.251 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.232 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied -0.029 [-0.111, +0.052] tie; vs GR4J vs own record -0.048 [-0.136, +0.038] tie. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.126, 0.277]. Difference to GR4J-vs-own-record -0.048, 95 % CI [-0.154, +0.058]; to GR4J model-implied -0.029 [-0.135, +0.077] (Zou, conservative). Every method is weak here."
    - metric: "Change of low flow Q5 (log ratio), 619 basins, Spearman rho"
      better: higher
      model: 0.440
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.421 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: -0.044 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied +0.019 [-0.047, +0.087] tie; vs GR4J vs own record +0.484 [+0.382, +0.582] win. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.374, 0.502]. Difference to GR4J model-implied +0.019, 95 % CI [-0.072, +0.110] (Zou, conservative). The handoff's 0.44 vs 0.42 is right; it is not a win."
    - metric: "Change of high flow Q95 (log ratio), 619 basins, Spearman rho"
      better: higher
      model: 0.709
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.722 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.674 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied -0.013 [-0.045, +0.019] tie; vs GR4J vs own record +0.036 [-0.021, +0.095] tie. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.668, 0.746]. Difference to GR4J model-implied -0.013, 95 % CI [-0.068, +0.042] (Zou, conservative)."
    - metric: "Change of half-flow date (days), 619 basins, Spearman rho"
      better: higher
      model: 0.630
      baselines:
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.679 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.565 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). rho difference, model minus baseline: vs GR4J model-implied +0.065 [+0.005, +0.127] win; vs GR4J vs own record -0.049 [-0.106, +0.007] tie. Cross-check at import (unpaired, conservative): Model rho 95 % CI [0.580, 0.676]. Difference to GR4J-vs-own-record -0.049, 95 % CI [-0.113, +0.015]; to GR4J model-implied +0.065 [-0.006, +0.138] (Zou, conservative). The handoff's 0.63 vs 0.57 compares with the model-implied GR4J only."
    - metric: "Change of mean flow (log ratio), median absolute error"
      better: lower
      model: 0.083
      baselines:
        - { name: "Budyko-Fu, w fitted on 1999-2008", kind: classical, value: 0.077 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.086 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.111 }
        - { name: "No change", kind: dumb, value: 0.184 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied -0.003 [-0.012, +0.007] tie; vs GR4J vs own record -0.029 [-0.039, -0.017] win; vs no change -0.102 [-0.117, -0.085] win; vs Budyko-Fu +0.005 [-0.003, +0.013] tie. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). The shipped 'MAE' is a median (exam.py: np.median of |error|). Budyko-Fu is 0.006 lower: too small to call without an interval. Far better than no change."
    - metric: "Change of runoff ratio, median absolute error"
      better: lower
      model: 0.0296
      baselines:
        - { name: "Budyko-Fu, w fitted on 1999-2008", kind: classical, value: 0.0313 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.0331 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.0431 }
        - { name: "No change", kind: dumb, value: 0.0381 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied -0.0035 [-0.0078, +0.0002] tie; vs GR4J vs own record -0.0134 [-0.0183, -0.0097] win; vs no change -0.0085 [-0.0120, -0.0041] win; vs Budyko-Fu -0.0017 [-0.0053, +0.0017] tie. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). Lowest median error, but 5 % below Budyko-Fu: too small to call from medians."
    - metric: "Change of baseflow index, median absolute error"
      better: lower
      model: 0.0185
      baselines:
        - { name: "No change", kind: dumb, value: 0.0181 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.0207 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.0654 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied -0.0022 [-0.0047, +0.0006] tie; vs GR4J vs own record -0.0469 [-0.0523, -0.0409] win; vs no change +0.0004 [-0.0015, +0.0020] tie. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). No change is 0.0004 lower: the network does not beat 'no change' on BFI."
    - metric: "Change of low flow Q5 (log ratio), median absolute error"
      better: lower
      model: 0.126
      baselines:
        - { name: "No change", kind: dumb, value: 0.129 }
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.163 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.634 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied -0.037 [-0.068, -0.015] win; vs GR4J vs own record -0.508 [-0.598, -0.450] win; vs no change -0.003 [-0.020, +0.022] tie. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). 2 % below no change: too small to call. Clearly below GR4J's 0.163, which the status doc lists as a better MAE."
    - metric: "Change of high flow Q95 (log ratio), median absolute error"
      better: lower
      model: 0.108
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 0.111 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 0.120 }
        - { name: "No change", kind: dumb, value: 0.204 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied -0.002 [-0.012, +0.009] tie; vs GR4J vs own record -0.012 [-0.022, +0.004] tie; vs no change -0.095 [-0.118, -0.073] win. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). 2 % below GR4J: too small to call. Far better than no change."
    - metric: "Change of half-flow date, median absolute error"
      better: lower
      model: 5.97
      unit: days
      baselines:
        - { name: "GR4J+snow calibrated per basin on 1999-2008, model-implied change", kind: classical, value: 5.77 }
        - { name: "GR4J simulated 1989-99 minus observed 1999-2008", kind: classical, value: 6.90 }
        - { name: "No change", kind: dumb, value: 8.28 }
      verdict: tie
      note: "Seen re-score (18 Nov 2026; the released weights through the shipped exam path reproduce exam.json): paired bootstrap over the 619 basins, 10,000 resamples, seed 20261118 (training/exam_rescore.json). Difference in median |error|, model minus baseline (negative = model better): vs GR4J model-implied +0.20 [-0.42, +0.94] tie; vs GR4J vs own record -0.93 [-1.56, +0.10] tie; vs no change -2.31 [-2.87, -1.53] win. Cross-check at import (unpaired, conservative): No interval: per-unit scores not shipped; needs the data rebuild (`mlratchet data water`). GR4J is 0.2 days lower: too small to call."
    - metric: "Level of 1989-99 mean flow (gauged value + predicted change), Spearman rho"
      better: higher
      model: 0.982
      baselines:
        - { name: "GR4J sim (gauged)", kind: classical, value: 0.978 }
        - { name: "kNN on attributes (ungauged, WaterData)", kind: classical, value: 0.803 }
