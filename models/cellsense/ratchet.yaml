# The ratchet ladder, normalised. Raw log: training/ratchet.json.
model: cellsense
ladders:
  - name: CellSense
    objective: Health half (with reference, without it, and as partial discharges; skill floored at 0) plus lifetime skill, on the frozen simulated sets
    rule: Keep if the objective rises by more than 0.01 AND the six calibration cells' capacity error does not get worse AND their lifetime error (read every 50 cycles) is no more than 2 points worse.
    margin: 0.01
    dev_gate: Calibration-cell capacity error, and lifetime error within +2 points
    frozen_sets: [val, life_v2, life_v3]
    scored_on: life_v3
    note: The frozen lifetime set was regenerated twice; all rungs were re-scored.
    rungs:
      - { id: c1, change: "Baseline 1-D residual CNN along the voltage axis, 100,000 simulated new/aged pairs", sim: 0.037, decision: kept, why: First rung. }
      - { id: c2, change: "Transport aging: slow polarisation grows several-fold with age", sim: 0.170, decision: rejected, why: "Dev gate: calibration cells 13.3 vs 11.4 mAh." }
      - { id: c3, change: "Slow graphite: a growing share sits out the 4C discharge", sim: 0.211, decision: rejected, why: "Dev gate: calibration cells 21.6 vs 11.4 mAh." }
      - { id: c4, change: "Lifetime network on whole simulated aging trajectories", sim: -0.124, decision: rejected, why: "Score fell." }
      - { id: c5, change: "Lifetime with aging priors refitted to the six calibration cells", sim: 0.190, decision: kept, why: "0.190 vs 0.037." }
      - { id: c6, change: "Early-life physics: slow graphite from the first cycles, SEI linear in cycles", sim: 0.316, decision: rejected, why: "New lifetime gate: dev lifetime error 45% vs 31%." }
      - { id: c7, change: "Early life plus a whole-life check against real curves at 50, 80 and 100% of life", sim: 0.375, decision: kept, why: "0.375 vs 0.190; dev lifetime 22%." }
      - { id: c8, change: "Partial discharges in one network (half the readings cut short)", sim: 0.625, decision: rejected, why: "Dev gate: calibration cells 16.6 vs 11.4 mAh." }
      - { id: c9, change: "Partial-discharge specialist reading curves smoothed over 24 mV", sim: 0.466, decision: released, why: "0.466 vs 0.375; full curves stay with the health network." }
  - name: v2 — NMC811 (LG M50T)
    objective: "Mean skill (1 - MAE / MAE of guessing the median, floored at 0) over capacity, lithium lost, negative lost and NMC lost (and fade with a reference) on a frozen set of 3,000 simulated new/aged C/20 pairs, averaged over four readings: full curve with and without the reference, and cut short at a random depth with and without it"
    rule: Keep if the objective beats the incumbent by more than 0.01 AND the three dev cells' capacity error on tests cut at 1.5, 2.5 and 3.5 Ah is no more than 5% worse AND their full-curve error is no more than 2 mAh worse.
    margin: 0.01
    dev_gate: "Dev cells W3, W4, W8 (26 tests): partial-discharge capacity error within +5%, full-curve error within +2 mAh"
    frozen_sets: [val_textbook, val_cal, val_ocp, val_ocpj, val_ocpd]
    scored_on: val_ocpd
    note: "Raw log: training/nmc_ratchet.json. The frozen set was rebuilt with each physics version (textbook, dev-calibrated, OCP-corrected, OCP-jittered by guess, OCP-jittered as measured on the dev cells); every rung was re-scored on each and every decision re-taken. Flips: n7 rejected on val_ocp (+0.006), kept on val_ocpj (+0.061); n2 kept until val_ocpj, rejected on val_ocpd (-0.011 vs n1), after which n3 is judged against n1 and still kept. n4-n6 were first rejected by the dev gate on val_ocp. n8 judged as a bare network failed the full-curve gate against n7's rule (39 vs 0 mAh); every rung after n7 includes the rule, and n8 was judged again with it."
    columns_source: Real exam (7 cells, 75 tests), reported after the fact; never used to choose
    columns: ["Exam partial (mAh)", "Exam full (mAh)"]
    rungs:
      - { id: n1, change: "Textbook Chen2020 cell, wide degradation-mode priors, 1-D CNN on C/20 Q(V), 60,000 simulated pairs", sim: 0.163, dev: { partial_mAh: 606.7, full_mAh: 256.9 }, decision: kept, why: First rung., metrics: [585.5, 252.6] }
      - { id: n2, change: "Simulator calibrated on the dev cells: new cells drawn around their fits, mode ranges from their voltage fits", sim: 0.152, dev: { partial_mAh: 254.6, full_mAh: 231.3 }, decision: rejected, why: "-0.011 vs n1 on val_ocpd (kept on val_cal to val_ocpj: +0.043 on val_ocpj; dev 255 vs 607 mAh).", metrics: [245.0, 211.3] }
      - { id: n3, change: "Open-circuit-curve correction fitted on the dev cells (one spline per electrode); new cells and mode ranges refitted on it; resistance may fall", sim: 0.276, dev: { partial_mAh: 124.4, full_mAh: 58.6 }, decision: kept, why: "+0.113 vs n1; dev 124 vs 607 mAh partial, 59 vs 257 full.", metrics: [182.7, 111.9] }
      - { id: n4, change: "Capacity head predicts the charge still to come below where the curve stops, not the capacity", sim: 0.319, dev: { partial_mAh: 180.9, full_mAh: 80.0 }, decision: rejected, why: "+0.043, but dev 181 vs 124 mAh partial and 80 vs 59 full.", metrics: [251.1, 143.6] }
      - { id: n5, change: "n3 reading curves smoothed over 26 mV (the dQ/dV peaks are where the simulator is least right)", sim: 0.290, dev: { partial_mAh: 167.3, full_mAh: 95.3 }, decision: rejected, why: "+0.015, but dev 167 vs 124 mAh partial and 95 vs 59 full.", metrics: [209.7, 132.3] }
      - { id: n6, change: "n3 reading curves smoothed over 53 mV", sim: 0.306, dev: { partial_mAh: 201.7, full_mAh: 136.3 }, decision: rejected, why: "+0.031, but dev 202 vs 124 mAh partial and 136 vs 59 full.", metrics: [227.2, 130.2] }
      - { id: n7, change: "n3, and a curve that reaches 2.5 V takes its capacity and fade from its own end (coulomb counting, no network)", sim: 0.366, dev: { partial_mAh: 124.4, full_mAh: 0.0 }, decision: kept, why: "+0.091; dev full 0 vs 59 mAh. (Rejected on val_ocp: +0.006.)", metrics: [182.7, 0.0] }
      - { id: n8, change: "OCP jitter by guess: each simulated cell's correction scaled 0.5-1.5 plus 4 mV spline wiggles per electrode; with n7's rule", sim: 0.713, dev: { partial_mAh: 126.1, full_mAh: 0.0 }, decision: released, why: "+0.347; dev 126.1 vs 124.4 mAh partial (inside 5%), full 0 vs 0.", metrics: [135.4, 0.0] }
      - { id: n9, change: "Training cells jittered twice as wide (scale 0-2, 8 mV per coefficient); with the rule", sim: 0.714, dev: { partial_mAh: 84.3, full_mAh: 0.0 }, decision: rejected, why: "+0.001 on val_ocpd (-0.031 on val_ocpj), although dev fell to 84 mAh.", metrics: [91.4, 0.0] }
      - { id: n10, change: "OCP jitter as measured on the dev cells (nmc_ocpjit.py): correction scaled by N(1.15, 0.09), 7.0 mV per coefficient; with the rule", sim: 0.718, dev: { partial_mAh: 114.4, full_mAh: 0.0 }, decision: rejected, why: "+0.005 on its own frozen set, needs more than +0.01 (dev 114 vs 126 mAh).", metrics: [140.8, 0.0] }
      - { id: n11, change: "Half the measured-jitter bank, half the wide-jitter bank (ocpd + ocpj2); with the rule", sim: 0.717, dev: { partial_mAh: 91.4, full_mAh: 0.0 }, decision: rejected, why: "+0.004, needs more than +0.01 (dev 91 vs 126 mAh).", metrics: [115.1, 0.0] }
