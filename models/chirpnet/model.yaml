id: chirpnet
name: ChirpNet
version: "2.0"
status: partial
released: 2026-10-30
order: 1
domain: Astrophysics
tags: [gravitational waves, detection, posterior estimation, normalizing flow, time series]
accent: "#7c5cff"
tagline: Neural networks that never saw a real gravitational wave, then found five.
question: Is there a black-hole or neutron-star merger in this LIGO data, and how heavy was it?
summary: >-
  Four small networks trained only on simulated mergers from general relativity. Pointed at real recordings
  from the two LIGO observatories they find the black-hole and neutron-star mergers, weigh them, and give
  calibrated posterior ranges. Everything runs on plain numpy.

reads: Whitened strain from LIGO Hanford and Livingston (GWOSC HDF5, 4 kHz).
returns:
  - Detection statistic and false-alarm rate (upper limit from time slides)
  - Chirp mass ± 68%, mass ratio, merger time
  - Posterior samples of masses, effective spin, distance and inclination (DINGO-style flow)
  - A separate neutron-star detector and chirp-mass estimate

physics:
  summary: >-
    Aligned-spin waveforms from general relativity (IMRPhenomD for black holes, IMRPhenomD_NRTidalv2 for
    neutron stars via LALSuite), projected onto the two detectors with the real light-travel delay and
    whitened with O1/O2 and design noise spectra.
  simulator:
    - 8,000 binary black holes, chirp mass 5.5–45 M☉ (detector frame), q 0.2–1, spins ±0.85
    - 3,000 binary neutron stars with tides, chirp mass 0.85–2.0 M☉
    - Loud sine-Gaussian glitches in one detector in 30–35% of windows
    - From rung 6, negatives that hold a chirp in one detector only
  checks:
    - Posterior P-P test on 400 held-out injections — largest gaps 0.025–0.06 (chance allows about 0.07)
noise: Simulated Gaussian noise coloured by O1/O2 and design spectra; the exam background is time-slid real LIGO data.
network: 1-D residual CNN finder + two-stream coincidence checker (882k weights), an 8-layer RealNVP posterior flow, and a 2-D time-frequency CNN for neutron stars

data:
  - name: Gravitational Wave Open Science Center (LIGO/Virgo strain)
    url: https://gwosc.org
    licence: CC BY 4.0
    role: exam
  - name: GW170817 data products (LIGO-P1700349, LIGO-P1700337)
    url: https://dcc.ligo.org/LIGO-P1700349/public
    licence: CC BY 4.0
    role: exam
  - name: GWTC-1 published parameters
    url: https://arxiv.org/abs/1811.12907
    licence: Citation
    role: truth
  - name: LALSuite waveforms (IMRPhenomD, IMRPhenomD_NRTidalv2)
    url: https://git.ligo.org/lscsoft/lalsuite
    licence: GPL-2.0 (used for training only; not a runtime dependency)
    role: physics

split:
  dev: None — real events never chose anything; rules were set on simulations and time-slid noise.
  exam: GW150914, GW151012, GW151226, GW170104 (32 s each) and GW170817 (2,048 s)

exam:
  summary: Five real O1/O2 events, plus hours of time-slid real background to bound false alarms.
  results:
    - metric: Black-hole events found (O1/O2)
      better: higher
      model: "4 / 4"
      baselines: []
      verdict: win
      note: Faintest scores 9.6; the loudest of 57,760 time-slid background windows scores 6.2.
    - metric: Chirp mass within 10% of LIGO
      better: higher
      model: "4 / 4"
      baselines:
        - { name: "LIGO GWTC-1", kind: published, value: "reference" }
      verdict: win
    - metric: LIGO posterior medians inside ChirpNet's 90% range
      better: higher
      model: "all"
      baselines: []
      verdict: win
    - metric: GW170817 statistic vs loudest background (6.2 h)
      better: higher
      model: 14.4
      baselines:
        - { name: "Loudest time-slid background", kind: dumb, value: 5.0 }
      verdict: win
    - metric: GW170817 chirp mass (detector frame, M☉)
      better: closer
      model: 1.136
      baselines:
        - { name: "LIGO", kind: published, value: 1.1975 }
      verdict: loss
      note: 5% low with an over-confident interval; rung 2 had been within 1.3%.
    - metric: Loud one-detector fakes passed
      better: lower
      model: 17
      unit: "%"
      baselines:
        - { name: "Finder alone (rung 4)", kind: classical, value: 99.6 }
      verdict: win
  coverage: []

wins:
  - Finds all four O1/O2 black-hole events with a clear gap above real background.
  - Posteriors are calibrated (P-P within chance) and contain every GWTC-1 median.
  - The cascade cuts loud single-detector fakes from 99.6% to 17%.
losses:
  - GW170817 chirp mass 5% low with too narrow an interval.
  - GW151226's Hanford signal alone still scores above threshold.
limits:
  - Aligned spins only; no precession or higher modes.
  - False-alarm rates rest on hours of time slides, so they are upper limits.
  - The neutron-star model has no coincidence check yet.
  - Every real event tested is from O1/O2 (2015–2017).
help_wanted:
  - "O3 exam: H1 + L1 32 s / 4 kHz HDF5 files for GW190412, GW190408_181802, GW190828_063405, GW191204_171526, GW200129_065458, GW200224_222234, GW200311_115853 and GW190521 (GWOSC)."
next:
  - A coincidence checker for the neutron-star model.
  - Longer neutron-star windows to fix the chirp-mass bias.
  - Live posterior sampling in the browser.

usage:
  install: pip install numpy scipy h5py
  demo: python demo.py
  python: |
    import chirpnet
    net = chirpnet.ChirpNet("chirpnet_weights.npz")        # loads the coincidence checker too
    h1, t0 = chirpnet.load_gwosc("examples/H-H1_LOSC_4_V2-1126259446-32.hdf5")
    l1, _  = chirpnet.load_gwosc("examples/L-L1_LOSC_4_V2-1126259446-32.hdf5")
    hits = net.scan(h1, l1, gps_start=t0)
    post = chirpnet.ChirpPE("chirpnet_pe_weights.npz").weigh(h1, l1, t0, hits[0]["gps"])

files:
  inference: [chirpnet.py]
  weights: [chirpnet_weights.npz, chirpnet_coinc_weights.npz, chirpnet_pe_weights.npz, chirpnet_bns_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 70
