# The ratchet ladder, normalised. Raw log: training/ratchet.json (written by training/ratchet.py; every rung re-scored on v1-v4, decisions re-taken in order on v4).
model: faultfinder
ladders:
  - name: "FaultFinder v1.0 (BuildingSim, 16-17 Nov 2026)"
    objective: "Skill on the frozen simulated validation set = 0.5 × detection AUC + 0.5 × diagnosis accuracy (faulted days with a visible effect)"
    rule: "Keep if the skill on the newest frozen simulated set beats the incumbent by more than 0.01 AND the dev AUC on the 20 real dev days is at least max(0.60, incumbent dev AUC − 0.05)."
    margin: 0.01
    dev_gate: "Dev AUC (20 real dev days) >= max(0.60, incumbent dev AUC - 0.05)"
    frozen_sets: [v1, v2, v3, v4]
    scored_on: v4
    note: "Each change of the simulated bank or the noise model got a new frozen validation set (v1 generic bank, v2 real noise, v3 calibrated bank, v4 damper characteristic and larger offsets). Every rung was re-scored on every set, and the keep/reject decisions were re-taken in order on the newest (v4); the earlier decisions on older sets are not in the log. r6's description in ratchet.json says 179k weights; the exported network has 160,871 parameters (160,103 after BatchNorm folding). No exam result was used to choose anything. 17 Nov 2026 integrity pass (NOTEBOOK.md): no new rung; the released numpy weights reproduce the exam to 6e-8; the r1-r6 torch checkpoints are not in the repository, so older rungs cannot be re-scored on a new frozen set without retraining (r6 can, from the numpy weights). A smoke run on Windows rebuilt the pipeline: 0.7 s per simulated 12-day window (about 35 min per 38,987-day bank on one process) and about 2 min per training epoch on one thread."
    columns_source: "Skill on the frozen sets v1-v3 (v4 is the score), detection AUC and diagnosis accuracy on v4, then the dev gate: dev AUC and dev false-alarm rate at P = 0.5 (20 real dev days)"
    columns: ["Skill v1", "Skill v2", "Skill v3", "Sim AUC v4", "Sim diag v4", "Dev AUC", "Dev FPR @0.5"]
    rungs:
      - { id: r1_gauss, change: "BuildingSim bank v1 (20 fault types, generic controls) + Gaussian sensor noise + source channel patterns; CNN 48 channels, 8 epochs", sim: 0.415, decision: kept, why: "First rung (incumbent by definition).", metrics: [0.585, 0.499, 0.448, 0.60, 0.23, 0.60, 0.91] }
      - { id: r2_realnoise, change: "+ real-noise and quirk model from the dev fault-free days (residual library, static offsets, fan-off drift)", sim: 0.454, decision: kept, why: "Skill 0.454 > 0.415 + 0.01 and dev AUC 0.74 passes the gate (>= 0.60).", metrics: [0.575, 0.550, 0.476, 0.66, 0.25, 0.74, 0.45] }
      - { id: r3_calib, change: "+ dev-calibrated bank v3: the BMS logs commands, not positions (twin test), operator start/stop jitter and off-blocks, schedule-shift faults, 24×7 units, wider VAV-minimum and supply-air setpoint priors", sim: 0.500, decision: kept, why: "Skill 0.500 > 0.454 + 0.01 and dev AUC 0.71 passes the gate (>= 0.69).", metrics: [0.528, 0.510, 0.536, 0.68, 0.31, 0.71, 0.45] }
      - { id: r4_damper, change: "+ noise v4: installed outdoor-air damper characteristic (logged command vs actual outdoor-air fraction) and larger static sensor disagreement (mixed-air stratification, zone vs return)", sim: 0.511, decision: kept, why: "Skill 0.511 > 0.500 + 0.01 and dev AUC 0.73 passes the gate (>= 0.66).", metrics: [0.505, 0.502, 0.518, 0.71, 0.32, 0.73, 0.36] }
      - { id: r5_bothbanks, change: "Train on bank v1 (generic controls) + bank v3 (calibrated) together, noise v4, 50k days, 6 epochs", sim: 0.519, decision: rejected, why: "Skill 0.519 not > 0.511 + 0.01 (dev AUC 0.74).", metrics: [0.557, 0.542, 0.528, 0.70, 0.33, 0.74, 0.45] }
      - { id: r6_wide, change: "Wider network (64/128 channels) and 10 epochs, bank v3 + noise v4", sim: 0.543, decision: released, why: "Skill 0.543 > 0.511 + 0.01 and dev AUC 0.71 passes the gate (>= 0.68). Released as v1.0.", metrics: [0.539, 0.535, 0.556, 0.73, 0.36, 0.71, 0.36] }
      - { id: calib_T, change: "Calibration: one temperature T >= 1 on the detection log-odds (the same T on the diagnosis logits), fitted by log loss on the 20 dev days (widen-only)", decision: kept, why: "T = 4.3. No effect on ranking (AUC) or the top class; it moves P(fault) toward 0.5. On the exam it over-shrank: Brier 0.216 calibrated vs 0.204 uncalibrated.", metrics: ["–", "–", "–", "–", "–", "–", "–"] }
  - name: "r7 attempt: multi-day context and Platt calibration (17 Nov 2026, not released)"
    objective: "As v1.0: skill on the frozen simulated validation set = 0.5 × detection AUC + 0.5 × diagnosis accuracy (faulted days with a visible effect)"
    rule: "Unchanged: keep if the skill on frozen v5 beats the incumbent by more than 0.01 AND the dev AUC is at least max(0.60, incumbent dev AUC − 0.05) = 0.657. Incumbent: r6 from the released numpy weights. A rung with several seeds is judged on the seed mean; seed 3 runs if the 2-seed margin is under twice the seed spread."
    margin: 0.01
    dev_gate: "Dev AUC (20 real dev days) >= max(0.60, incumbent dev AUC - 0.05) = 0.657"
    frozen_sets: [v5]
    scored_on: v5
    note: "Plan fixed in NOTEBOOK.md before bank v5 was built. Bank v5: BuildingSim 1.0.1 with its phase2 wrappers (operator jitter, log_commands once per window), window and day ids, 20 % of faults from day 1; noise v5 keeps static offsets (phase2.static_offsets), the damper characteristic (phase2.damper_command), residual day, channel pattern and fan-off blend fixed per window. Train bank 2,998 windows (56,144 rows), validation bank 920 windows; frozen v5 seed 505, 9,145 samples, 63 % with reference days. Checked against the shipped v3 code: same-seed healthy days identical (1,452 days, max difference 0). r1-r5 cannot be re-scored (no checkpoints). Nothing was released; v1.0 stays. The fresh exam was not scored. Log: training/ratchet_r7.json (training/r7.py)."
    columns_source: "Frozen v5 (training/ratchet_r7.json): skill, detection AUC, diagnosis accuracy, skill on the 5,771 samples with reference days and on the 3,374 without; dev AUC and dev false alarms at P = 0.5 (11 healthy dev days)"
    columns: ["AUC v5", "Diag v5", "Skill with ref", "Skill without ref", "Dev AUC", "Dev false alarms"]
    rungs:
      - { id: r6_wide, change: "v1.0 as released (numpy weights), re-scored on frozen v5", sim: 0.561, decision: kept, why: "Incumbent. 0.543 on v4.", metrics: [0.743, 0.378, 0.560, 0.561, 0.71, "4/11"] }
      - { id: r7b_platt, change: "r6 with a two-parameter (Platt) map of the detection log-odds fitted on the 20 dev days, instead of T = 4.3", sim: 0.561, decision: rejected, why: "A monotone map: skill and dev AUC equal r6's by construction (written in the plan before it ran). On dev, false alarms 4 → 1 of 11 (in-sample and leave-one-out), detections 6 → 4 of 9; leave-one-out Brier 0.258 vs 0.246 for the temperature.", metrics: [0.743, 0.378, 0.560, 0.561, 0.71, "1/11"] }
      - { id: r6v5_control, change: "Information only: r6's 35-row network retrained on bank v5 with noise v5 (seed 1)", sim: 0.554, decision: rejected, why: "Not a candidate; separates the new bank from the reference days. 0.007 below r6.", metrics: [0.740, 0.369, 0.556, 0.550, 0.68, "6/11"] }
      - { id: r7_context, change: "82 input rows: today's 35, the per-bin median of the unit's last 1-3 days within 7 days, today minus that median for the 11 temperature and physics rows, and a reference count (single-day mode when none); bank v5, noise v5, r6's training config; 3 seeds", sim: 0.558, decision: rejected, why: "3-seed mean 0.558 (seeds 0.564, 0.558, 0.552) not > 0.561 + 0.01; dev AUC mean 0.660 passes the gate only just. References help within the rung (0.563 vs 0.537 with them zeroed), but single-day accuracy is below r6's.", metrics: [0.753, 0.363, 0.563, 0.539, 0.66, "4.3/11"] }
  - name: "v1.1: r6 + reference rows, zero-initialised (17 Nov 2026, released)"
    objective: "As v1.0: skill on the frozen simulated validation set = 0.5 × detection AUC + 0.5 × diagnosis accuracy (faulted days with a visible effect)"
    rule: "Unchanged: keep if the seed-mean skill on frozen v5 beats the incumbent (r6) by more than 0.01 AND the seed-mean dev AUC is at least max(0.60, r6 dev AUC − 0.05) = 0.657; seed 3 only if the margin is under twice the seed spread."
    margin: 0.01
    dev_gate: "Dev AUC (20 real dev days, with their reference days) >= 0.657"
    frozen_sets: [v5]
    scored_on: v5
    note: "Plan fixed in NOTEBOOK.md before training. r8 starts from the released v1.0 numpy weights (no torch checkpoint exists): the first convolution widened from 35 to 82 input rows, the 15,040 new weights zero, every v1.0 weight frozen, so single-day mode is v1.0 exactly (checked: 1.9e-6). AdamW lr 1e-3 cosine to 0, 3 epochs (345 steps) on bank v5. Seeds 1 and 2; the spread (0.0006) was far below the margin, so seed 3 did not run. Released seed 1 as v1.1 with T = 4.2 refitted on dev. The dev gate cannot test the new rows: only 2 of 20 dev days have a reference, so the release rests on simulation. The seen exam, re-scored after the decision, shows a sim-to-real offset: AHU false alarms 33 → 56 % (MODEL_CARD.md, NOTEBOOK.md). Log: training/ratchet_r7.json (r8 rows added) and training/train8.py."
    columns_source: "Frozen v5 (training/ratchet_r7.json): skill, detection AUC, diagnosis accuracy, skill on the 5,771 samples with reference days and on the 3,374 without; dev AUC and dev false alarms at P = 0.5 (11 healthy dev days)"
    columns: ["AUC v5", "Diag v5", "Skill with ref", "Skill without ref", "Dev AUC", "Dev false alarms"]
    rungs:
      - { id: r6_wide, change: "v1.0 as released (numpy weights)", sim: 0.561, decision: kept, why: "Incumbent.", metrics: [0.743, 0.378, 0.560, 0.561, 0.71, "4/11"] }
      - { id: r8_ref_rows, change: "v1.0 frozen + 47 reference input rows (median of the unit's last 1-3 days within 7 days, today minus median for 11 rows, count), new first-layer weights zero-initialised and the only ones trained; 2 seeds", sim: 0.572, decision: released, why: "2-seed mean 0.5724 (0.5721, 0.5727) > 0.5605 + 0.01 (margin +0.0118); dev AUC 0.707 passes 0.657. Released as v1.1 (seed 1, T = 4.2).", metrics: [0.759, 0.385, 0.573, 0.561, 0.71, "4/11"] }
