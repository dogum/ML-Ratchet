    licence: CC BY 4.0
    role: "dev and noise (among the 7 Iowa ERS dev unit-days; residual library), exam (92 days, dataset ers_rp1312)"
  - name: "Drexel University Nesbitt Hall AHU-1 fault data (Y. Chen, PhD thesis, Drexel, 2019), as packaged by N. Ghalamsiah (2025)"
    url: https://doi.org/10.6084/m9.figshare.29297999.v3
    licence: CC BY 4.0
    role: "dev (8 unit-days), noise, exam (76 days); examples/nesbitt_NES_20180711_AHU-1.csv"
  - name: "LBNL fault detection data synthesis: FLEXLAB SZCAV/SZVAV, ORNL Flexible Research Platform RTU, MZVAV-2 at Iowa ERS (J. Granderson, G. Lin et al.)"
    url: https://doi.org/10.6084/m9.figshare.11752740
    licence: CC0 1.0
    role: "dev (3 FLEXLAB, 2 ORNL unit-days), noise, exam (23 FLEXLAB, 17 ORNL, 9 MZVAV-2 ERS days); examples/flexlab_*.csv, iowa_ers_*.csv, ornl_rtu_*.csv"
  - name: "Korean office AHU BMS data (S. Wang, 2024), unlabelled"
    url: https://doi.org/10.6084/m9.figshare.25932409.v2
    licence: CC BY 4.0
    role: "noise (start/stop irregularity, supply-air tracking-error tail); never labelled, never graded"
  - name: TMYx typical-year weather for 17 US cities
    url: https://climate.onebuilding.org
    licence: "Cite Lawrie and Crawley, TMYx; the site says All Rights Reserved and states no reuse licence: used for simulation only, not redistributed"
    role: physics (weather for the simulated fault bank)
  - name: "BuildingSim building generator priors (NREL ComStock, EIA CBECS) and DOE reference equipment curves, via the shared building platform"
    url: https://comstock.nrel.gov
    licence: "ComStock CC BY 4.0; CBECS and DOE data public domain (U.S. Government)"
    role: physics (random buildings and HVAC plant for the fault bank)

split:
  dev: "BuildingData's frozen fault-run split (data/proc/splits.json, seed 20261116): 20 unit-days, seven at Iowa ERS, three FLEXLAB, two ORNL RTU, eight Nesbitt Hall. They were the only real labelled data used for anything: the noise library, the twin tests, the dev gate and the calibration temperature."
  exam: "Every other gradable run: 217 real or experimental unit-days, 200 AHU days (91 faulty) and 17 RTU days (12 faulty), from Iowa ERS (101), LBNL FLEXLAB (23), ORNL RTU (17) and Nesbitt Hall (76). Run once, after the ladder was closed."

exam:
  short: "217 real lab and building days (Iowa ERS, FLEXLAB, ORNL, Nesbitt Hall), seen"
  summary: >-
    Detection (P(fault)) and diagnosis on 217 real days. v1.0 took the exam once; the 17 Nov 2026 integrity pass
    re-scored it from the released weights (FaultFinder's numbers reproduce to 6e-8), so every row is labelled seen
    and nothing was chosen from it. Baselines: the APAR rule set (12 rules, after Schein et al., 2006) for AHUs and a
    one-line rule (fan on while unoccupied) for the RTU, with textbook tolerances and a dev threshold as in v1.0, the
    same rules with tolerances tuned on the 20 dev days (a 54-setting grid), and a mixing-box residual detector fitted on
    the dev days. Every graded row gives FaultFinder minus the best baseline on that row with a 95 % bootstrap interval
    (2,000 resamples, seed 20261117) over unit-days, and over facility-days as a check; win or loss only when the
    unit-day interval excludes zero, and a row the majority guess wins is a loss. The recall-at-fixed-false-alarm rows
    set thresholds on the exam's own healthy days and are report-only. The rows below are v1.1, re-scored after its
    release decision (seen): each exam day gets as references the same unit's exam days from the previous 7 days (most
    recent 3, chosen by date; labels not read); 153 of 217 days have one. v1.0's values are in each note and in
    MODEL_CARD.md. Nothing in the release was chosen from these rows.
  results:
    - metric: "All units detection AUC (217 days, 103 faulty)"
      better: higher
      model: 0.76
      baselines:
        - { name: "APAR rules (AHU) + fan rule (RTU), textbook tolerances, dev threshold", kind: classical, value: 0.69 }
        - { name: "APAR rules (AHU) + fan rule (RTU), dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)", kind: classical, value: 0.69 }
        - { name: "Mixing-box residual, dev-fitted", kind: classical, value: 0.61 }
      verdict: tie
      note: "Seen. v1.1 (reference days where the unit has an earlier exam day within 7 days; re-scored 17 Nov 2026). Model minus the best baseline (APAR rules, dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)): +0.07, 95 % CI [−0.01, +0.14] over 217 unit-days; [−0.01, +0.14] over 133 facility-days. v1.0: 0.77, tie."
    - metric: "All units balanced accuracy at P = 0.5"
      better: higher
      model: 0.64
      baselines:
        - { name: "APAR rules (AHU) + fan rule (RTU), textbook tolerances, dev threshold", kind: classical, value: 0.65 }
        - { name: "APAR rules (AHU) + fan rule (RTU), dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)", kind: classical, value: 0.69 }
        - { name: "Mixing-box residual, dev-fitted", kind: classical, value: 0.63 }
        - { name: "Majority guess (no fault for AHUs, fault for the RTU)", kind: dumb, value: 0.54 }
      verdict: tie
      note: "Seen. v1.1 (reference days where the unit has an earlier exam day within 7 days; re-scored 17 Nov 2026). Model minus the best baseline (APAR rules, dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)): −0.05, 95 % CI [−0.13, +0.03] over 217 unit-days; [−0.13, +0.02] over 133 facility-days. v1.0: 0.69, tie."
    - metric: "All units false-alarm rate at P = 0.5 (114 healthy days)"
      better: lower
      model: 56
      unit: "%"
      baselines:
        - { name: "APAR rules (AHU) + fan rule (RTU), textbook tolerances, dev threshold", kind: classical, value: 3 }
        - { name: "APAR rules (AHU) + fan rule (RTU), dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)", kind: classical, value: 18 }
        - { name: "Mixing-box residual, dev-fitted", kind: classical, value: 14 }
        - { name: "Majority guess (no fault for AHUs, fault for the RTU)", kind: dumb, value: 4 }
      verdict: loss
      note: "Seen. v1.1 (reference days where the unit has an earlier exam day within 7 days; re-scored 17 Nov 2026). Model minus the best baseline (APAR rules, textbook tolerances, dev threshold): +54 points, 95 % CI [+44, +63] over 217 unit-days; [+44, +63] over 133 facility-days. v1.0: 35 %, loss."
    - metric: "All units recall at P = 0.5"
      better: higher
      model: 83
      unit: "%"
      baselines:
        - { name: "APAR rules (AHU) + fan rule (RTU), textbook tolerances, dev threshold", kind: classical, value: 32 }
        - { name: "APAR rules (AHU) + fan rule (RTU), dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)", kind: classical, value: 55 }
        - { name: "Mixing-box residual, dev-fitted", kind: classical, value: 41 }
      verdict: win
      note: "Seen. v1.1 (reference days where the unit has an earlier exam day within 7 days; re-scored 17 Nov 2026). Model minus the best baseline (APAR rules, dev-tuned tolerances (1.5 K, fan heat 0.5 K, 15 min)): +28 points, 95 % CI [+17, +39] over 217 unit-days; [+17, +40] over 133 facility-days. v1.0: 73 %, win."
