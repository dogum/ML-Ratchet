id: beatnet
name: BeatNet
version: "1.0"
status: released
released: 2026-11-06
order: 8
domain: Physiology
tags: [ECG, arrhythmia, cardiac electrophysiology, classification, research only]
accent: "#e5484d"
tagline: Heartbeat classes from a simulated voxel heart. Research and teaching only.
question: Is each heartbeat in this ECG normal, supraventricular, ventricular or a fusion beat?
summary: >-
  For every heartbeat in a single-lead ECG, BeatNet gives the AAMI class (normal, supraventricular ectopic,
  ventricular ectopic, fusion), a QRS width with an error bar, and the chance the beat sits inside atrial
  fibrillation. It was trained only on a simulated heart; no real labelled beat was ever a training sample.
  It is not a medical device.
disclaimer: Research and teaching only. Not a medical device. Do not use it to make any clinical decision.

reads: A single-lead ECG (modified lead II), any sampling rate; beat positions optional (a QRS detector is included).
returns:
  - AAMI class per beat (N, S, V, F) with probabilities
  - QRS width (ms) ± error bar
  - Probability that the beat is inside atrial fibrillation

physics:
  summary: >-
    A 2 mm voxel heart with eikonal activation through a Purkinje-lined endocardium; membrane potentials with
    action-potential gradients and restitution; the heart dipole projected through Dower lead vectors; and a
    rhythm model with ectopy patterns, pauses, AF and flutter.
  simulator:
    - Beat type set by where activation starts — sinus, ectopic atrial focus, ventricular focus, bundle-branch block, fusion
    - Dipole from −∇Vm, Dower lead vectors with random orientation, electrode placement and breathing
    - ECGSYN RR spectrum, compensatory pauses, bigeminy/trigeminy/couplets/runs, AF and flutter
  checks:
    - "Dipole volume vs surface form r = 0.993; RR LF/HF asked 0.5/1/2 → 0.50/1.05/1.98"
    - "QRS medians: normal 72 ms, LBBB 158, RBBB 115, PVC 142"
noise: Real MIT-BIH Noise Stress Test recordings plus quiet real background cut from the dev records, mains, amplifier noise and 11-bit quantisation
network: 1-D residual CNN, 172k weights, 2.5 s window at 180 Hz plus 6 RR features

data:
  - name: MIT-BIH Arrhythmia Database (PhysioNet)
    url: https://physionet.org/content/mitdb/
    licence: ODC-By 1.0
    role: dev, exam
  - name: MIT-BIH Noise Stress Test Database
    url: https://physionet.org/content/nstdb/
    licence: ODC-By 1.0
    role: noise
  - name: MIT-BIH Supraventricular Arrhythmia Database
    url: https://physionet.org/content/svdb/
    licence: ODC-By 1.0
    role: exam
  - name: QT Database
    url: https://physionet.org/content/qtdb/
    licence: ODC-By 1.0
    role: exam

split:
  dev: 6 DS1 records (101, 112, 119, 201, 203, 220; seed 2026, stratified)
  exam: DS2 — 22 records, 49,705 beats (de Chazal 2004 inter-patient split); also SVDB and QT DB

exam:
  summary: The standard inter-patient DS2 exam, 49,705 beats.
  results:
    - metric: Macro-F1 over N/S/V/F
      better: higher
      model: 0.547
      baselines:
        - { name: "Textbook rules (prematurity, QRS width, shape)", kind: classical, value: 0.431 }
        - { name: "Linear discriminant on sims (de Chazal features)", kind: classical, value: 0.447 }
        - { name: "Always N", kind: dumb, value: 0.236 }
      verdict: win
    - metric: V beats found (sensitivity)
      better: higher
      model: 97.3
      unit: "%"
      baselines:
        - { name: "Textbook rules", kind: classical, value: 78.8 }
      verdict: win
    - metric: Atrial fibrillation, AUC
      better: higher
      model: 0.971
      baselines:
        - { name: "RR-irregularity rule", kind: classical, value: 0.844 }
      verdict: win
    - metric: Fusion beats found
      better: higher
      model: "3 / 388"
      baselines: []
      verdict: loss
    - metric: QRS width error (QT DB)
      better: lower
      model: 18
      unit: ms
      baselines:
        - { name: "Classical delineation", kind: classical, value: 15 }
        - { name: "Median guess", kind: dumb, value: 20 }
      verdict: loss
  coverage:
    - { output: QRS width, actual: 72.5 }

wins:
  - Beats textbook rules and a linear discriminant on the inter-patient exam, with no real labelled beats.
  - Atrial fibrillation AUC 0.971 against 0.844 for the RR-irregularity rule.
  - Class probabilities are calibrated (ECE 1.0% on DS2).
losses:
  - LBBB beats read as V (record 214 — about half of all false V calls).
  - Fusion almost never found (3 of 388).
  - Classical delineation measures QRS width better (15 vs 18 ms).
limits:
  - Not a medical device. Research and teaching only.
  - Models trained on real DS1 (de Chazal 2004, Zhang 2014) still do better on S and F beats.
  - Non-premature S beats are missed; aberrated APCs are called V.
next:
  - Wider bundle-branch-block morphology in the simulator, calibrated on a DS1 LBBB record kept out of the exam.
  - A twin test per dev record — calibration so far is population-level only.
  - Refit the fusion visibility window to how annotators used F.

usage:
  install: pip install numpy scipy
  demo: python demo.py
  python: |
    import numpy as np, json
    from beatnet import BeatNet
    net = BeatNet(); z = np.load("examples/221.npz"); m = json.loads(str(z["meta"]))
    out = net.classify(z["ecg"], m["fs"])           # runs its own QRS detector
    print(out["label"][:20], out["heart_rate_bpm"])

files:
  inference: [beatnet.py, pipeline.py]
  weights: [beatnet_weights.npz]
  demo: demo.py
  examples: examples/
  card: MODEL_CARD.md
  lab: lab/index.html
  notebook: NOTEBOOK.md
demo_seconds: 3
