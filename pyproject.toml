[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-ratchet"
version = "0.1.0"
description = "Physics-first machine learning: models trained only on simulations, kept only when they ratchet up, and graded on real data they never saw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML Ratchet contributors" }]
keywords = ["physics", "simulation", "machine learning", "simulation-based inference", "model cards", "numpy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6"]

[project.optional-dependencies]
models = ["pandas>=2", "h5py>=3"]        # SunDoctor reads CSV with pandas; ChirpNet reads GWOSC HDF5
vehicle = ["pandas>=2", "pyarrow>=14"]   # RoadData (realdata) reads parquet; RoadSim itself is numpy/scipy
vehicle-data = ["pandas>=2", "pyarrow>=14", "py7zr>=0.21", "rasterio>=1.3", "openpyxl>=3"]   # `mlratchet data vehicle` (rebuild from raw)
train = ["torch>=2.6", "pandas>=2", "pyarrow>=14", "fastsim==3.1.0"]   # training only (GPU: install torch from download.pytorch.org/whl/cu128 first); inference stays numpy
dev = ["pytest>=8", "jsonschema>=4", "pandas>=2", "h5py>=3", "pyarrow>=14"]

[project.scripts]
mlratchet = "mlratchet.cli:main"

[project.urls]
Homepage = "https://github.com/dogum/ML-Ratchet"
Documentation = "https://github.com/dogum/ML-Ratchet/tree/main/docs"

[tool.setuptools]
# mlratchet, plus the shared vehicle platform's two packages (RoadSim and RoadData), which live in shared/vehicle
packages = ["mlratchet", "roadsim", "realdata"]

[tool.setuptools.package-dir]
mlratchet = "mlratchet"
roadsim = "shared/vehicle/roadsim/roadsim"
realdata = "shared/vehicle/realdata"

[tool.setuptools.package-data]
mlratchet = ["schema/*.json", "templates/model/**/*"]
roadsim = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: demos that take more than a few seconds (ChirpNet)"]
