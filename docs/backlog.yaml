# The idea backlog: physics -> data -> real exam. docs/backlog.md and the site's /backlog page are generated
# from this file (mlratchet readme --write). Data reachability was checked in Nov 2026, from a shared cloud build
# machine and from the repository's own machine.
# status: candidate | checked (data endpoints answered) | blocked | in-progress | done (a first run finished; the note
#         says what it found and what is next). Built models and platforms leave the backlog.
# kind: model (a new model; the default when absent) | platform (a shared simulator or its calibration)
#       | data (data for existing models) | method (a change to how models are built)
ideas:
  - id: dispatchnet
    name: DispatchNet
    domain: Power grids
    question: "Can a network dispatch a power system's fleet hour by hour as well as the optimiser, in a fraction of the time? The fifth GridSim model, planned but not built (14 Nov 2026)."
    physics: GridSim unit commitment and economic dispatch (MILP) on the real ERCOT fleet as the teacher; network constraints from ACTIVSg2000
    data: EIA-930 generation by fuel and ERCOT prices (GridData's frozen splits)
    data_url: https://www.eia.gov/electricity/gridmonitor/
    exam: "No real 'optimal dispatch' exists: grade on EIA-930 generation by fuel and real prices in 2023-2025, and on speed against the MILP"
    status: candidate
    note: "Wait for GridSim's coal/gas commitment fix (coal -43 % to +28 % by year today); otherwise the exam grades the simulator's gap, not the dispatcher."
  - id: gridsim-v2
    name: GridSim v2 calibration
    kind: platform
    domain: Power grids
    question: "Close GridSim's measured gaps, then re-train and re-score all four grid models on the new physics version."
    physics: "Coal must-run and self-commitment (PlantDetective's DP), coal delivered prices from EIA-923 receipts, ORDC scarcity and unforecast outages in the core, synchronous commitment at low net load, era-aware frequency response (Dynamic Containment, batteries), soft history constraints across days, a reduced real-topology ERCOT network"
    data: "Dev years 2019 and 2021 only (EIA-930, CAMPD, ERCOT prices and inertia reports, GB and ERCOT dev events); pre-2023 NERC GADS outage rates"
    data_url: https://www.nerc.com/pa/RAPA/gads/Pages/default.aspx
    exam: "Each gap's 'done when' in shared/grid/HANDOFF.md (e.g. coal and gas within 10 % on held-out years, hours above $1,000 within 25 %, minimum inertia within 15 %); then every model's frozen set rebuilt and every rung re-scored"
    status: in-progress
    note: "First, the possible exam leak: the default outage rates cite Texas RE 2024/2025 aggregates; replace them with pre-2023 values and re-run the checks. Then PJM or CAISO dispatched and calibrated like ERCOT."
  - id: forecastwx
    name: Forecast-weather archive
    kind: data
    domain: Power grids
    question: "A day-ahead forecast-weather archive for 2022-2025 so DemandCast can be graded as it would be used (today its headline uses actual weather, an upper bound) and trained on real forecast errors."
    physics: Unchanged (DemandCast's building-stock and farm physics)
    data: Open-Meteo Previous-Runs API (CC BY 4.0)
    data_url: https://open-meteo.com/en/docs/previous-runs-api
    exam: DemandCast 2023-2025 with forecast weather against each balancing authority's own day-ahead forecast
    status: checked
    note: "Fetched 14 Nov 2026 from the build machine (`mlratchet data grid --only forecastwx`): 220 year-requests, 92 MB, no refusals. The released 2024 forecast-weather row reproduces exactly; a second look over 2024-2025 (run once) gives 3.05% vs the grids' 3.59%, but 2.92% vs 2.70% without CAISO and SPP. The archive has humidity, radiation and wind forecasts only from 2024, so 2023 and the dev years stay without real forecast weather. Left: a rung that trains on the 2022 temperature-error library (built), judged on dev."
  - id: subsecond
    name: Sub-second grid frequency
    kind: data
    domain: Power grids
    question: "PMU-grade frequency (10-100 samples a second) so GridPulse can read inertia from the first 500 ms instead of from demand."
    physics: GridSim's swing equation already runs at 10 ms
    data: "FNET/GridEye (University of Tennessee) or another PMU archive; NESO publishes 1 s only"
    data_url: https://fnetpublic.utk.edu/
    exam: GB or US events with known inertia
    status: blocked
    note: "Checked 14 Nov 2026 from the repository's machine: fnetpublic.utk.edu offers live displays and three 2011 US sample events (plots and videos) only, no data files and no terms page; event data go to FNET/GridEye Industry Consortium members. Nothing fetched. Needs a PMU archive with a public licence, or a data agreement."
  - id: buildingsim-v2
    name: BuildingSim v2 calibration
    kind: platform
    domain: Buildings
    question: "Close BuildingSim's measured gaps (campus district energy, the heat-pump signature, generator intensity by use type, multi-zone), then re-train and re-score all four building models on the new physics version."
    physics: "A district plant model (distribution losses, summer reheat, shared plants, seasonal shutdowns, process loads); unconditioned and process base loads; heat pumps with backup strips, defrost and weather-compensated controls; perimeter/core zones; return fan, exhaust damper and duct faults; official ASHRAE 140 cases"
    data: "Dev splits only (BDG2 52 dev buildings 2016, RECS/CBECS dev respondents, 20 dev fault runs, WPuQ/HUE dev homes); ResStock/ComStock twins for simulator-vs-simulator checks"
    data_url: https://github.com/buds-lab/building-data-genome-project-2
    exam: "Each gap's 'done when' in the platform HANDOFF (e.g. generic dev twins within ±30 % annual and daily r >= 0.7 on thermal meters; heat pump vs resistance AUC > 0.7 on RECS dev); then every model's frozen set rebuilt and every rung re-scored"
    status: candidate
    note: "BuildingSim v1 and its four models came in on 17 Nov 2026 (docs/building-platform.md). First add the platform release to shared/building and upstream the models' wrappers behind flags."
  - id: water-forcing
    name: Independent forcing for the water exams
    kind: data
    domain: Hydrology
    question: "How much of each water model's exam gap is the method, and how much is ERA5-Land? Re-run every water exam (models and baselines) with Daymet or NLDAS forcing in place of ERA5-Land."
    physics: "Unchanged WaterSim; the same frozen splits and windows, only the weather input changes"
    data: "Daymet v4 daily basin means (ORNL DAAC) or the original CAMELS Daymet/Maurer/NLDAS forcing (NCAR GDEX); both timed out from the build sandbox on 18 Nov 2026, not yet tried from the repository's machine"
    data_url: https://daymet.ornl.gov/
    exam: "Every FlowCast, SnowSense and BasinDetective exam row re-scored with the new forcing next to the ERA5-Land numbers; literature comparisons become possible only after this"
    status: candidate
    note: "ERA5-Land under-catches mountain and Pacific Northwest precipitation (50 of 671 basins have runoff ratio > 1) and drifts about 6 % between decades, which caps every method (docs/water-platform.md)."
  - id: watersim-v11
    name: WaterSim v1.1
    kind: platform
    domain: Hydrology
    question: "Fold the physics the four water models found into WaterSim, version the frozen sets, and re-score every rung."
    physics: "One documented ERA5-Land water-yield prior (FlowCast and BasinDetective fits reconciled); a gauge-noise model fitted on dev (AR(1) rho 0.999, cv 0.02, 3 significant figures in cfs); decadal and year-to-year forcing drift; point-snow defaults (energy-balance TURB and ALB_DECAY from the dev calibrations: prior means 0.17 and 2.4 d, per-station medians 0.20 and 1.4 d; degree-day TT +1 C) and a perennial-snow guard; both flashiness priors; ReservoirPilot's reservoir-task generator; the realdata.random_forcing window fix"
    data: "Dev splits only (52 CAMELS-US dev basins, 39 SNOTEL dev stations, 15 ResOpsUS dev dams, aux dams for single processes)"
    data_url: https://zenodo.org/records/15529786
    exam: "checks/run_all.sh still passes; each upstreamed piece reproduces the model wrapper it replaces; then every water model's frozen set rebuilt and every rung re-scored"
    status: candidate
    note: "WaterSim v1 and its four models came in on 18 Nov 2026 (docs/water-platform.md). The list is section 4 of shared/water/HANDOFF.md."
  - id: firesim-p2
    name: FireSim physics p2
    kind: platform
    domain: Wildfire
    question: "Fix the diagonal line leak (U1), add fire persistence, fold the physics the four fire models found into FireSim, then rebuild the frozen sets and re-score every rung."
    physics: "The U1 corner rule (a side cell already blocked by a timed line also blocks the diagonal step); one persistence module (burnout, stalls, night fine-fuel recovery, FireCast's fire-age ROS factor, FireDetective's wind-sensitive WAF); agriculture fuel (LANDFIRE 93 burns, e.g. as GR1 by season) and ignition relocation to the nearest burnable cell within 180 m; a sub-cell analytic ellipse under 0.81 ha; FireSize's containment race; one FEDS perimeter emulator in firesim.observe; memory-bounded replay ensembles; larger replay windows (U2)"
    data: "Dev splits only (40 dev fires, 2,859 prescribed fires for calibration, 8,913 dev ignitions)"
    data_url: https://zenodo.org/records/20187963
    exam: "The shipped checks still pass (436/436 published values, ellipse, fuel break); a closed 4-connected line ring leaks 0 cells (today 3,551 of 3,972); dev twins grow on about half of half-days (today 91 % against 50 % real); then every fire model's frozen set rebuilt and every rung re-scored"
    status: candidate
    note: "FireSim v1 and its four models came in on 21 Nov 2026 (docs/fire-platform.md). The list is section 4 of shared/fire/HANDOFF.md; U1 and persistence first, since they touch all four models."
  - id: fire-data
    name: Fire data the models are missing
    kind: data
    domain: Wildfire
    question: "Real dead-fuel moisture, suppression records and per-fire burn severity, so FireSim's moisture, suppression and severity can be checked against real data instead of proxies."
    physics: "Unchanged FireSim"
    data: "FEMS dead-fuel stick moisture (the National Fuel Moisture Database moved there), ICS-209 incident reports, MTBS per-fire severity mosaics, larger LANDFIRE and HRRR windows for the 48 replay fires"
    data_url: https://fems.fs2c.usda.gov/
    exam: "Nelson dead moisture against real 10-h sticks at dev sites (today only against gridMET NFDRS: 2.4 points drier); FireSize's containment race against ICS-209 on dev fires; FireDetective's severity truth from the per-fire mosaics; replays no longer cut at the window edge (45 of 48 today)"
    status: candidate
    note: "No documented public FEMS download was found on 18 Nov 2026 (wfas.net/nfmd returns 404); the MTBS mosaics go through an e-mail queue. Record refusals in help_wanted; don't route around them."
  - id: spaceweather-chain
    name: Sun-to-grid space weather
    kind: platform
    domain: Space physics
    question: "From the solar wind at L1 to currents induced in power lines: how strong will the ground magnetic disturbance be, where, and what will it do to the grid?"
    physics: "Solar-wind propagation L1 to bow shock, Burton/O'Brien-McPherron ring current, empirical magnetosphere-ionosphere coupling, ground dB/dt from a layered-Earth impedance (plane-wave method), geomagnetically induced currents on a GridSim network"
    data: "OMNI / CDAWeb solar wind, Kyoto Dst, INTERMAGNET / BGS ground magnetometers"
    data_url: https://cdaweb.gsfc.nasa.gov/
    exam: "Held-out storms: Dst, local dB/dt and, where public, measured GIC"
    status: checked
    note: "Brainstorm 18 Nov 2026. It would make StormNet (0 wins, 3 losses, 6 ties) part of a platform, and is the first link between two platforms (to GridSim)."
  - id: coast-ocean
    name: Coast & Ocean
    kind: platform
    domain: Earth science
    question: "How high will the water get at this tide gauge, from tides, surge and waves?"
    physics: "Harmonic tides, 2-D shallow-water storm surge (wind stress and inverse barometer), wave transformation and setup at the shore"
    data: "NOAA CO-OPS tide gauges, NDBC buoys (SwellCast's source), storm tracks"
    data_url: https://api.tidesandcurrents.noaa.gov/api/prod/
    exam: "Held-out storms and gauges: surge peak and timing beside a harmonic-plus-inverse-barometer baseline"
    status: checked
    note: "Brainstorm 18 Nov 2026; builds on SwellCast."
