  - id: tsunaminet
    name: TsunamiNet
    domain: Geophysics
    question: How big is the tsunami coming, from the first deep-ocean pressure readings?
    physics: Shallow-water propagation from Okada seafloor sources
    data: NOAA NCTR / DART buoys
    data_url: https://nctr.pmel.noaa.gov/Dart/
    exam: Real tsunamis against USGS finite-fault sources
    status: checked
    note: "Landing page answered; file path still to confirm. A learner-family project: a neural operator stands in for the shallow-water solver to grow the bank, and a normalizing flow reads the Okada source with its uncertainty. NOAA NGDC tsunami event search answered on 18 Nov 2026."
  - id: gpsquake
    name: GPSQuake
    domain: Geophysics
    question: How far did the ground move, and was it an earthquake, slow slip or the seasons?
    physics: Okada dislocations, slow-slip transients, seasonal loading
    data: Nevada Geodetic Laboratory GNSS time series
    data_url: https://geodesy.unr.edu/
    exam: Known earthquakes' offsets; Cascadia slow-slip events
    status: checked
    note: "Use https: on 14 Nov http://geodesy.unr.edu/ redirected to a host that does not answer, while https://geodesy.unr.edu/ answered (again on 18 Nov 2026). tenv3 path to confirm. A learner-family project: a Gaussian process with periodic and step kernels, or a sparse library of seasonal, step and transient terms."
