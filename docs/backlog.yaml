# The idea backlog: physics -> data -> real exam. docs/backlog.md and the site's /backlog page are generated
# from this file (mlratchet readme --write). Data reachability was checked from a cloud sandbox in Nov 2026.
# status: candidate | checked (data endpoints answered) | blocked | in-progress
ideas:
  - id: dispatchnet
    name: DispatchNet
    domain: Power grids
    question: "Can a network dispatch a power system's fleet hour by hour as well as the optimiser, in a fraction of the time? The fifth GridSim model, planned but not built (14 Nov 2026)."
    physics: GridSim unit commitment and economic dispatch (MILP) on the real ERCOT fleet as the teacher; network constraints from ACTIVSg2000
    data: EIA-930 generation by fuel and ERCOT prices (GridData's frozen splits)
    data_url: https://www.eia.gov/electricity/gridmonitor/
    exam: "No real 'optimal dispatch' exists: grade on EIA-930 generation by fuel and real prices in 2023-2025, and on speed against the MILP"
    status: candidate
    note: "Wait for GridSim's coal/gas commitment fix (coal -43 % to +28 % by year today); otherwise the exam grades the simulator's gap, not the dispatcher."
  - id: gridsim-v2
    name: GridSim v2 calibration
    domain: Power grids
    question: "Close GridSim's measured gaps, then re-train and re-score all four grid models on the new physics version."
    physics: "Coal must-run and self-commitment (PlantDetective's DP), coal delivered prices from EIA-923 receipts, ORDC scarcity and unforecast outages in the core, synchronous commitment at low net load, era-aware frequency response (Dynamic Containment, batteries), soft history constraints across days, a reduced real-topology ERCOT network"
    data: "Dev years 2019 and 2021 only (EIA-930, CAMPD, ERCOT prices and inertia reports, GB and ERCOT dev events); pre-2023 NERC GADS outage rates"
    data_url: https://www.nerc.com/pa/RAPA/gads/Pages/default.aspx
    exam: "Each gap's 'done when' in shared/grid/HANDOFF.md (e.g. coal and gas within 10 % on held-out years, hours above $1,000 within 25 %, minimum inertia within 15 %); then every model's frozen set rebuilt and every rung re-scored"
    status: in-progress
    note: "First, the possible exam leak: the default outage rates cite Texas RE 2024/2025 aggregates; replace them with pre-2023 values and re-run the checks. Then PJM or CAISO dispatched and calibrated like ERCOT."
  - id: forecastwx
    name: Forecast-weather archive
    domain: Power grids
    question: "A day-ahead forecast-weather archive for 2022-2025 so DemandCast can be graded as it would be used (today its headline uses actual weather, an upper bound) and trained on real forecast errors."
    physics: Unchanged (DemandCast's building-stock and farm physics)
    data: Open-Meteo Previous-Runs API (CC BY 4.0)
    data_url: https://open-meteo.com/en/docs/previous-runs-api
    exam: DemandCast 2023-2025 with forecast weather against each balancing authority's own day-ahead forecast
    status: checked
    note: "The cloud sandbox's shared IP got HTTP 429 after a few requests, so only 2024 population points were fetched. A single request from the repository's own machine answered 200 on 14 Nov; fetch it slowly from there (src/fetch_openmeteo.py is resumable)."
  - id: subsecond
    name: Sub-second grid frequency
    domain: Power grids
    question: "PMU-grade frequency (10-100 samples a second) so GridPulse can read inertia from the first 500 ms instead of from demand."
    physics: GridSim's swing equation already runs at 10 ms
    data: "FNET/GridEye (University of Tennessee) or another PMU archive; NESO publishes 1 s only"
    data_url: https://fnetpublic.utk.edu/
    exam: GB or US events with known inertia
    status: candidate
    note: "The FNET site timed out from the cloud sandbox; it answered from the repository's own machine on 14 Nov (the public pages, not yet a data download)."
  - id: buildingsim
    name: BuildingSim
    domain: Energy
    question: A shared building-energy simulator for load, HVAC fault and retrofit models.
    physics: Building thermal networks and HVAC; EnergyPlus as the reference
    data: NREL ResStock/ComStock (OEDI S3), Building Data Genome 2 (~1,600 real meters), LBNL HVAC fault-detection data
    data_url: https://data.openei.org/
    exam: Real meters and labelled HVAC faults
    status: checked
    note: "DemandCast's building-stock demand model (models/demandcast/training/buildings.py: UA x setpoint hinge, RC envelope lag, solar and latent gains, heat-pump COPs) is a head start."
  - id: watershed
    name: Watershed
    domain: Earth science
    question: How much water will this river carry, from rain, snow and the basin's shape?
    physics: Rainfall-runoff and snowmelt models
    data: USGS NWIS streamflow, SNOTEL snowpack
    data_url: https://waterdata.usgs.gov/nwis
    exam: Real gauged basins held out
    status: checked
    note: The CAMELS download server (gdex) timed out on 13 Nov.
  - id: roomsense
    name: RoomSense
    domain: Acoustics
    question: How big is this room and how long does it ring, from one recorded clap?
    physics: Image-source and ray-tracing room acoustics (pyroomacoustics)
    data: Measured room impulse responses on Zenodo
    data_url: https://zenodo.org
    exam: Rooms with measured geometry and RT60
    status: candidate
    note: Impulse-response sets not yet checked.
  - id: stormnet
    name: StormNet
    domain: Space weather
    question: How strong will this geomagnetic storm get, from the solar wind arriving now?
    physics: Burton-type ring-current response to the solar wind
    data: OMNIWeb solar wind; Kyoto Dst; INTERMAGNET / BGS magnetometers
    data_url: https://omniweb.gsfc.nasa.gov/
    exam: Real Dst and storm onsets
    status: checked
  - id: tsunaminet
    name: TsunamiNet
    domain: Geophysics
    question: How big is the tsunami coming, from the first deep-ocean pressure readings?
    physics: Shallow-water propagation from Okada seafloor sources
    data: NOAA NCTR / DART buoys
    data_url: https://nctr.pmel.noaa.gov/Dart/
    exam: Real tsunamis against USGS finite-fault sources
    status: checked
    note: Landing page answered; file path still to confirm.
  - id: gpsquake
    name: GPSQuake
    domain: Geophysics
    question: How far did the ground move, and was it an earthquake, slow slip or the seasons?
    physics: Okada dislocations, slow-slip transients, seasonal loading
    data: Nevada Geodetic Laboratory GNSS time series
    data_url: http://geodesy.unr.edu/
    exam: Known earthquakes' offsets; Cascadia slow-slip events
    status: checked
    note: Landing page answered; tenv3 path to confirm.
  - id: xrdnet
    name: XRDNet
    domain: Materials
    question: Which crystal phases are in this powder, from its X-ray diffraction pattern?
    physics: Kinematic powder diffraction from crystal structures
    data: Crystallography Open Database (500k+ structures)
    data_url: https://www.crystallography.net/cod/
    exam: Measured diffraction patterns
    status: blocked
    note: RRUFF (measured patterns) returned 403; another source of measured patterns is needed.
  - id: frbnet
    name: FRBNet
    domain: Astrophysics
    question: How much plasma did this fast radio burst cross, and how much was it scattered?
    physics: Cold-plasma dispersion and multipath scattering
    data: CHIME/FRB catalogue
    data_url: https://www.chime-frb.ca/catalog
    exam: Catalogue DM and scattering times
    status: checked
  - id: spinnet
    name: SpinNet
    domain: Sports physics
    question: How fast and which way is this pitch spinning, from its flight alone?
    physics: Drag, Magnus force and seam-shifted wake
    data: Baseball Savant pitch tracking
    data_url: https://baseballsavant.mlb.com/
    exam: Measured Hawk-Eye spin
    status: checked
    note: Check the terms of use before redistributing anything.
  - id: spinrock
    name: SpinRock
    domain: Planetary science
    question: How fast is this asteroid spinning, and what shape is it, from sparse survey photometry?
    physics: Asteroid light-curve inversion (shape, spin axis, phase effects)
    data: ZTF via IRSA TAP; JPL Small-Body Database
    data_url: https://irsa.ipac.caltech.edu/
    exam: Known spin periods
    status: checked
  - id: spectranet
    name: SpectraNet
    domain: Chemistry
    question: Which gases, and how much of each, are in this infrared spectrum?
    physics: HITRAN line-by-line absorption
    data: HITRAN; NIST Chemistry WebBook
    data_url: https://hitran.org/
    exam: Measured gas spectra
    status: checked
  - id: wakenet
    name: WakeNet
    domain: Energy
    question: How much power is each wind turbine losing to its neighbours' wakes?
    physics: FLORIS wake models
    data: Kelmarsh and Penmanshiel SCADA (Zenodo)
    data_url: https://zenodo.org
    exam: Real farm SCADA with wake-steering periods
    status: checked
    note: Kelmarsh and Penmanshiel SCADA on Zenodo answered on 13 Nov (as the WindFarm idea).
  - id: jetnet
    name: JetNet
    domain: Particle physics
    question: Which particle started this jet?
    physics: Parton showers and hadronisation (Pythia-style)
    data: CERN Open Data
    data_url: https://opendata.cern.ch/
    exam: Real-data control regions
    status: candidate
    note: Harder to grade on real data than the others.
  - id: realtrain
    name: Real-train ladder
    domain: Method
    question: "How much does real labelled data add on top of physics? A possible direction, not planned work: a second ladder per model that may also train on a third real split, published beside the simulation-only ladder."
    physics: Unchanged. The simulation-only model stays its own ladder and keeps the zero-real-labels claim.
    data: "A frozen real-train split by vehicle or family (as splits.json is frozen); dev and exam untouched. First candidates: Argonne D3 dynamometer traces (measured fuel), EPA test-car lists."
    data_url: https://dogum.github.io/ML-Ratchet/mental-models/#real-data
    exam: "The same exam rows, with the simulation-only model, the simulation-plus-real model and the real-trained regression side by side; the second must beat the regression to count as a win"
    status: candidate
    note: "Move in dial order: unlabelled real inputs, then a learned discrepancy term, then fine-tuning on labels. Signals and guardrails are on the Mental models page, section 07."
