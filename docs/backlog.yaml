    status: candidate
    note: "Found by LawFinder v1.0 (22 Nov 2026), recorded here, not fixed. FireSim's own law, G = (0.32 P)^1.6 km2 a day, scores 1.80 mean |log10| on 38,599 real exam fire-days against 1.40 for no growth at all. The same gap shows in FireDetective's dev twins (growth on 91 % of half-days against 50 %) and FirePilot's uncalibrated replays (3.9x). Measured on physics p1; not re-measured under p2, which did not add persistence."
