  - id: realtrain
    name: Real-train ladder
    kind: method
    domain: Method
    question: "How much does real labelled data add on top of physics? A possible direction, not planned work: a second ladder per model that may also train on a third real split, published beside the simulation-only ladder."
    physics: Unchanged. The simulation-only model stays its own ladder and keeps the zero-real-labels claim.
    data: "A frozen real-train split by vehicle or family (as splits.json is frozen); dev and exam untouched. First candidates: Argonne D3 dynamometer traces (measured fuel), EPA test-car lists."
    data_url: https://dogum.github.io/ML-Ratchet/mental-models/#real-data
    exam: "The same exam rows, with the simulation-only model, the simulation-plus-real model and the real-trained regression side by side; the second must beat the regression to count as a win"
    status: candidate
    note: "Move in dial order: unlabelled real inputs, then a learned discrepancy term, then fine-tuning on labels. Signals and guardrails are on the Mental models page, section 07. Watershed / CAMELS is the strongest testbed: the real-data LSTM benchmark is well known (Kratzert et al. 2019) and FlowCast lost to regionalisation (0.341 vs 0.372). Compare three arms on the same exam rows: simulation-only, simulation pre-training plus real fine-tuning, and real-only."
  - id: priorwars
    name: Prior Wars (TabPFN vs the physics prior)
    kind: method
    domain: Method
    question: "Does a domain simulator beat a generic synthetic prior (TabPFN) on the collection's real exams, and how many real labels does the generic prior need to catch up?"
    physics: "Unchanged: each model's own simulator and training bank, delivered to TabPFN-v2 as in-context rows (G-sim)."
    data: "Each model's existing dev and exam splits; TabPFN-v2 open weights (Prior Labs License 1.1). Six tabular exams: GridPulse, BasinDetective, BuildingDetective RECS and BDG2, PlantDetective, EnergyNet."
    data_url: https://github.com/PriorLabs/TabPFN
    exam: "Each model's own exam, scored once after a per-model hashed pre-registration; 95 % paired bootstrap over exam units"
    status: done
    note: "Run 18-19 Nov 2026 (docs/experiments/prior-wars.md). Given the dev labels, TabPFN beat the released model on 3 of 6 exams (RECS, BDG2, PlantDetective), tied on 2 (GridPulse, EnergyNet) and lost on 1 (BasinDetective). With 0 real labels, P was the best arm on 5 of 6. Labels needed to reach P: ~20-40, or 1,152 on EnergyNet. Simulated rows added to dev helped only BasinDetective. Next: TabPFN-2.5+ if its licence allows, GPU-sized contexts, and the 8 skipped tabular models."
  - id: bakeoff-river
    name: River Bake-off (learner families on streamflow)
    kind: method
    domain: Method
    question: "On one real problem (FlowCast's ungauged CAMELS-US streamflow plus a gauged nowcast), with the same simulated bank and compute for every arm, which learner family wins, and why?"
    physics: "Unchanged: FlowCast's released bank recipe (WaterSim physics p1), shared by all 21 arms (9 families plus conformal wrappers)"
    data: "WaterData (Caravan, NWIS, NWM, ERA5-Land): FlowCast's dev and exam splits"
    data_url: https://dogum.github.io/ML-Ratchet/experiments/river-bakeoff/
    exam: "FlowCast's exam (main WY1990-99, 619 basins; recent WY2016-23, 603), run once for all arms; paired bootstrap over basins"
    status: done
    note: "Run 22-23 Nov 2026 in the cloud, imported 24 Nov 2026 (docs/experiments/bakeoff-river.md, experiments/bakeoff-river). Ungauged: five families tie within 0.01 NSE of FlowCast's 0.341 (trees 0.345, LSTM 0.340, TCN 0.338, S4D 0.336); attention, the GP and both HBV arms lose by 0.02-0.04; every learner loses to U-dev (0.372) and NWM (0.550). Gauged: an EnKF on WaterSim beats FlowCast's nowcast at 1 day (0.599 vs 0.569) and falls behind at 7. Round 2 (24-25 Nov 2026, experiments/bakeoff-river/round2): of three bank changes only a refit water-yield prior passed dev (+0.012); retrained on it, every tied family gained 0.016-0.024 NSE on main (wins) but not on recent (ties). The ensemble of the four retrained learners plus FlowCast ties U-dev on main (0.376 vs 0.372), the first learner row to do so; every row still loses to GR4J and NWM. The label-free gap detector failed (Spearman 0.21, -0.10..0.48)."
  - id: bakeoff-vehicle
    name: Vehicle Bake-off (learner families on trip energy)
    kind: method
    domain: Method
    question: "Does River's finding (families converge; the simulator is the lever) hold for a problem with strong physics: EnergyNet's trip energy, from EnergyNet's 151 features or the 1 Hz trace?"
    physics: "Unchanged: EnergyNet v2.1's bank recipe on RoadSim physics v2 (one of its three train banks), shared by all 23 arms"
    data: "RoadData (VED, EPA test cars, Mersin, ICCT, ZTBus v1 legs): EnergyNet's dev and exam splits"
    data_url: https://dogum.github.io/ML-Ratchet/experiments/vehicle-bakeoff/
    exam: "EnergyNet's exam, run once for 21 arms (TabPFN excluded before the exam, for compute); E16 = mean MdAPE over the 16 dev-score sets; paired cluster bootstrap"
    status: done
    note: "Run 23-24 Nov 2026 in the cloud, imported 24 Nov 2026 (docs/experiments/bakeoff-vehicle.md, experiments/bakeoff-vehicle). Networks and trees span 11.7-13.0 % E16 (transformer best, 11.7 %); EnergyNet v2.1 (3x the data, 5-net ensemble) 11.0 %; E_phys alone 22.9 %. Per-trip errors correlate at 0.92 across families, and all miss the same sets (Mersin buses, cold Leafs, plug-ins, ICCT trucks). Supplementary exams run in the repository (24-25 Nov 2026): TabPFN 13.3 % E16, a loss to every table learner; full ZTBus (5,847 legs; EnergyNet's published exam reproduced exactly): GRU, MLP and transformer tie EnergyNet v2.1 on legs (7.0-7.3 %), every learner loses to it on missions. Next: the bank fixes and data/ensemble rungs (round 2). Round 2 (24-25 Nov 2026): the transformer and GRU as 5-member ensembles on EnergyNet's 3 banks beat their v1.0 arms (wins); the transformer ensemble ties EnergyNet v2.1 (11.10 vs 10.96 % E16) and has the lowest CRPS; no physics fix passed; a cross-family ensemble did not help; errors still correlate at 0.95 across families."
