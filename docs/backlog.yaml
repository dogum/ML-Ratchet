    physics: "FireSim spread with the dev-calibrated ROS factors (LawFinder's f2 bank); the missing piece is persistence (stalls, burnout, night recovery), listed under firesim-p2"
    data: "Dev splits only (40 dev fires, 791 dev fire-days)"
    data_url: https://zenodo.org/records/20187963
